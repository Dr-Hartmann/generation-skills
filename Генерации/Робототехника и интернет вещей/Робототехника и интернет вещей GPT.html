<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      user-scalable="no"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0F0F13" />
    <title>Робототехника и интернет вещей (IoT)</title>
    <style>
      /* Generated by short-video-ui-kit. Edit config/palette.json, not this file. */
      :root {
        --ui-bg: #0f0f13;
        --ui-bg-gradient: #111118;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #cfcfcf;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-shadow-strong: rgba(46, 172, 101, 0.35);
        --ui-accent-ambient-1: rgba(46, 172, 101, 0.34);
        --ui-accent-ambient-2: rgba(30, 122, 71, 0.3);
        --ui-accent-ambient-3: rgba(20, 80, 45, 0.38);
        --ui-accent-halo: rgba(46, 172, 101, 0.14);
        --ui-danger: #e5484d;
        --ui-danger-hover-border: rgba(229, 72, 77, 0.6);
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-border-faint: rgba(255, 255, 255, 0.08);
        --ui-scrim-strong: rgba(0, 0, 0, 0.65);
        --ui-surface-inset: rgba(0, 0, 0, 0.35);
        --ui-shadow-text: rgba(0, 0, 0, 0.8);
        --ui-ambient-blur: 90px;
      }

      /* Requires theme.css generated from config/palette.json. */
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--ui-text);
        background: var(--ui-bg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }

      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }

      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }

      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }

      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }

      body.v916 #ambient {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #ambient .b1,
        #ambient .b2,
        #ambient .b3 {
          animation: none;
        }
      }

      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --mobile-right-safe: 80px;
        --mobile-bottom-safe: 25vh;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: var(--ui-bg);
      }

      #appShell {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 14px;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: max(16px, env(safe-area-inset-top, 0px)) 26px 24px;
        overflow: hidden;
      }

      #titlebar {
        display: flex;
        align-items: center;
        min-width: 0;
        min-height: 34px;
      }

      #titlebar h1 {
        margin: 0;
        color: var(--ui-text);
        font-size: clamp(21px, 2.2vw, 30px);
        line-height: 1.12;
        letter-spacing: -0.035em;
        font-weight: 800;
      }

      #titlebar h1 span {
        color: var(--ui-accent);
      }

      #workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
        grid-template-rows: minmax(0, 1fr) 56px;
        column-gap: 26px;
        row-gap: 14px;
        min-width: 0;
        min-height: 0;
      }

      #stagePanel {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        min-width: 0;
        min-height: 0;
        align-items: stretch;
        justify-content: stretch;
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--ui-border-faint);
        border-radius: 24px;
        background:
          radial-gradient(
            ellipse at 50% 42%,
            rgba(46, 172, 101, 0.075),
            transparent 58%
          ),
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.018),
            rgba(0, 0, 0, 0.08)
          );
        box-shadow: inset 0 0 48px rgba(0, 0, 0, 0.14);
      }

      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }

      .subtitle-panel {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        width: 100%;
        padding: 0 4px 0 4px;
        min-width: 0;
      }

      .subtitle-step {
        margin: 0 0 16px;
        color: var(--ui-accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #subtitleText {
        margin: 0;
        color: var(--ui-text);
        font-size: clamp(21px, 1.55vw, 29px);
        line-height: 1.36;
        font-weight: 700;
        text-wrap: pretty;
      }

      .subtitle__keyword {
        color: var(--ui-accent);
      }

      .control-panel {
        grid-column: 1;
        grid-row: 2;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        min-width: 0;
        min-height: 48px;
      }

      .control-panel button {
        display: grid;
        place-items: center;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 1px solid var(--ui-border-soft);
        border-radius: 15px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        cursor: pointer;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease,
          box-shadow 0.18s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .control-panel button:hover {
        background: var(--ui-accent-soft);
        border-color: var(--ui-accent-border);
        box-shadow: 0 0 18px var(--ui-accent-shadow);
      }

      .control-panel button:active {
        transform: scale(0.96);
      }
      .control-panel button:focus-visible {
        outline: 2px solid var(--ui-accent);
        outline-offset: 3px;
      }
      .control-panel svg {
        width: 21px;
        height: 21px;
      }
      .control-panel .play-toggle {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
      }
      .control-panel .play-toggle:hover {
        background: var(--ui-accent);
      }
      .control-panel .play-toggle svg {
        width: 20px;
        height: 20px;
      }

      .frame-overlay {
        display: none;
      }

      #appShell.controls-hidden .control-panel {
        opacity: 0;
        pointer-events: none;
      }

      /* The vertical-frame mode moves the subtitle and controls into the 9:16 stage. */
      #workspace.video-mode {
        display: flex;
        align-items: stretch;
        justify-content: center;
        min-height: 0;
      }

      #workspace.video-mode #stagePanel {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
      }

      #workspace.video-mode #stage {
        position: relative;
        width: auto;
        height: 100%;
        max-width: 100%;
        aspect-ratio: 9 / 16;
        border-color: var(--ui-border-soft);
        border-radius: 24px;
        box-shadow:
          0 0 42px var(--ui-accent-shadow),
          inset 0 0 45px rgba(0, 0, 0, 0.3);
      }

      #workspace.video-mode .frame-overlay {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 12px;
        padding: clamp(10px, 2.5vw, 18px);
        pointer-events: none;
      }

      #workspace.video-mode .subtitle-panel {
        width: 100%;
        margin: 0;
        padding: 12px 13px;
        border: 1px solid var(--ui-border-soft);
        border-radius: 15px;
        background: rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      #workspace.video-mode .subtitle-step {
        margin-bottom: 7px;
        font-size: 10px;
      }
      #workspace.video-mode #subtitleText {
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.3;
      }

      #workspace.video-mode .control-panel {
        width: 100%;
        min-height: 48px;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-between;
        pointer-events: auto;
      }

      #workspace.video-mode .control-panel button {
        background: rgba(15, 15, 19, 0.82);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #workspace.video-mode .control-panel .play-toggle {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
      }
      #workspace.video-mode .control-panel button:focus-visible {
        outline-offset: 1px;
      }

      /* Generated settings modal adjustments to the parameter registry. */
      #modal {
        max-height: 90dvh;
      }
      #modal .modal-close {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }
      #modal .seg button {
        min-height: 48px;
      }
      #modal #mReset {
        min-height: 48px;
      }
      #modal .sw {
        height: 48px;
      }
      #modal .sw span {
        top: 9px;
        bottom: auto;
        height: 30px;
      }

      @media (max-width: 767px) {
        #ambient {
          inset: 0 auto 0 0;
          width: calc(
            100vw - var(--mobile-right-safe) - env(safe-area-inset-right, 0px)
          );
          overflow: hidden;
        }

        #appShell {
          width: calc(
            100vw - var(--mobile-right-safe) - env(safe-area-inset-right, 0px)
          );
          padding: max(16px, env(safe-area-inset-top, 0px)) 0
            calc(var(--mobile-bottom-safe) + env(safe-area-inset-bottom, 0px))
            max(16px, env(safe-area-inset-left, 0px));
          gap: 10px;
        }

        #titlebar {
          min-height: 31px;
        }
        #titlebar h1 {
          font-size: clamp(20px, 5.2vw, 25px);
          letter-spacing: -0.04em;
        }

        #workspace {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto 48px;
          row-gap: 0;
          min-height: 0;
        }

        #stagePanel {
          grid-column: 1;
          grid-row: 1;
        }
        #stage {
          border-radius: 19px;
        }

        .subtitle-panel {
          grid-column: 1;
          grid-row: 2;
          align-self: stretch;
          margin: 0 0 24px;
          padding: 11px 13px 12px;
          border: 1px solid var(--ui-border-faint);
          border-radius: 15px;
          background: var(--ui-panel-glass);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
        }

        .subtitle-step {
          margin-bottom: 5px;
          font-size: 10px;
        }
        #subtitleText {
          font-size: clamp(16px, 4.5vw, 22px);
          line-height: 1.3;
        }

        .control-panel {
          grid-column: 1;
          grid-row: 3;
          justify-content: flex-end;
          min-height: 48px;
        }

        #workspace.video-mode #stage {
          max-height: 100%;
          height: 100%;
          width: auto;
          max-width: 100%;
        }

        #workspace.video-mode .subtitle-panel {
          margin: 0;
          padding: 10px 11px;
          border-radius: 13px;
        }

        #workspace.video-mode .subtitle-step {
          margin-bottom: 5px;
        }

        #modalWrap {
          right: calc(
            var(--mobile-right-safe) + env(safe-area-inset-right, 0px)
          );
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Requires theme.css generated from config/palette.json. */
      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--ui-modal-scrim);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      #modalWrap.open {
        display: flex;
      }

      #modal {
        width: min(92vw, 380px);
        max-height: 82vh;
        max-height: 82dvh;
        overflow: auto;
        color: var(--ui-text);
        background: var(--ui-modal-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        outline: none;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }

      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }

      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }

      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      .seg button {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }

      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }

      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }

      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }

      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }

      #mSpeed {
        flex: 1.4;
        accent-color: var(--ui-accent);
        min-width: 80px;
      }

      #mSpeedVal {
        min-width: 34px;
        color: var(--ui-text);
        text-align: right;
        font-size: 14px;
        font-weight: 800;
      }

      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 30px;
      }

      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .sw span {
        position: absolute;
        inset: 0;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }

      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }

      .sw input:checked + span {
        background: var(--ui-accent);
      }

      .sw input:checked + span::before {
        transform: translateX(22px);
      }

      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }

      #mReset {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;
      }

      #mReset:hover {
        border-color: var(--ui-danger-hover-border);
      }

      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }

      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }

      .keys i {
        font-style: normal;
      }

      body.modal-open {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        #modal {
          animation: none;
        }
      }

      .subtitle-panel {
        min-height: 160px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      @keyframes subtitleEnter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .subtitle-enter {
        animation: subtitleEnter 0.26s ease both;
      }
      #modalWrap.open {
        animation: modalScrimIn 0.25s ease both;
      }
      #modalWrap.closing {
        animation: modalScrimOut 0.22s ease both;
      }
      #modal.closing {
        animation: modalDialogOut 0.22s ease both;
      }
      @keyframes modalScrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes modalScrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes modalDialogOut {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      #modal {
        max-height: 90dvh;
      }
      #modal .modal-close {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }
      #modal .seg button {
        min-height: 48px;
      }
      #modal #mReset {
        min-height: 48px;
      }
      #modal .sw {
        height: 48px;
      }
      #modal .sw span {
        top: 9px;
        bottom: auto;
        height: 30px;
      }
      @media (max-width: 767px) {
        .subtitle-panel {
          min-height: 112px;
        }
        #modalWrap {
          right: calc(80px + env(safe-area-inset-right, 0px));
        }
        #modal {
          width: min(
            92vw,
            calc(100vw - 80px - 32px - env(safe-area-inset-right, 0px))
          );
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .subtitle-enter,
        #modalWrap.open,
        #modalWrap.closing,
        #modal.closing {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Ambient background component -->
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i>
      <i class="b2"></i>
      <i class="b3"></i>
    </div>

    <div id="appShell">
      <header id="titlebar">
        <h1>Робототехника <span>и IoT</span></h1>

    <script>
      /*
       * Small interaction controller for the generated settings modal.
       * Emits document events so application-specific behavior stays outside this template.
       * Events: settings:mode, settings:next-step, settings:speed,
       *         settings:video-mode, settings:reset.
       */
      (function (global) {
        "use strict";

        function initSettingsModal(options) {
          const config = Object.assign(
            {
              overlaySelector: "#modalWrap",
              dialogSelector: "#modal",
              openSelector: ".js-gear",
              closeSelector: "[data-modal-close]",
            },
            options || {},
          );

          const overlay = document.querySelector(config.overlaySelector);
          if (!overlay)
            throw new Error(
              "Settings modal overlay not found: " + config.overlaySelector,
            );

          const dialog =
            overlay.querySelector(config.dialogSelector) ||
            overlay.querySelector('[role="dialog"]');
          if (!dialog) throw new Error("Settings modal dialog not found.");

          const openers = Array.from(
            document.querySelectorAll(config.openSelector),
          );
          const closers = Array.from(
            overlay.querySelectorAll(config.closeSelector),
          );
          let previouslyFocused = null;
          let closeTimer = null;

          function open() {
            if (closeTimer) {
              global.clearTimeout(closeTimer);
              closeTimer = null;
              overlay.classList.remove("closing");
              dialog.classList.remove("closing");
              return;
            }
            if (overlay.classList.contains("open")) return;
            previouslyFocused = document.activeElement;
            overlay.classList.add("open");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            dialog.focus();
          }

          function close() {
            if (!overlay.classList.contains("open") || closeTimer) return;
            overlay.classList.add("closing");
            dialog.classList.add("closing");
            closeTimer = global.setTimeout(() => {
              overlay.classList.remove("open", "closing");
              dialog.classList.remove("closing");
              overlay.setAttribute("aria-hidden", "true");
              document.body.classList.remove("modal-open");
              if (
                previouslyFocused &&
                typeof previouslyFocused.focus === "function"
              )
                previouslyFocused.focus();
              closeTimer = null;
            }, 220);
          }

          function toggle() {
            if (overlay.classList.contains("closing")) open();
            else overlay.classList.contains("open") ? close() : open();
          }

          openers.forEach((button) => button.addEventListener("click", toggle));
          closers.forEach((button) => button.addEventListener("click", close));

          overlay.addEventListener("click", (event) => {
            if (event.target === overlay) close();
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && overlay.classList.contains("open")) {
              close();
            }
          });

          overlay.querySelectorAll("[data-mode]").forEach((button) => {
            button.addEventListener("click", () => {
              const mode = button.dataset.mode;
              overlay.querySelectorAll("[data-mode]").forEach((item) => {
                const active = item === button;
                item.classList.toggle("active", active);
                item.setAttribute("aria-pressed", String(active));
              });
              const next = overlay.querySelector(
                '[data-modal-action="next-step"]',
              );
              if (next) next.disabled = mode !== "step";
              overlay.dispatchEvent(
                new CustomEvent("settings:mode", { detail: { mode } }),
              );
            });
          });

          overlay
            .querySelectorAll('[data-modal-action="next-step"]')
            .forEach((button) => {
              button.addEventListener("click", () => {
                overlay.dispatchEvent(new CustomEvent("settings:next-step"));
              });
            });

          const speed = overlay.querySelector("#mSpeed");
          const speedValue = overlay.querySelector("#mSpeedVal");
          const speedOptions = [0.5, 1, 2];
          if (speed) {
            speed.addEventListener("input", () => {
              const selectedSpeed = speedOptions[Number(speed.value)] ?? 1;
              if (speedValue) speedValue.textContent = selectedSpeed + "×";
              overlay.dispatchEvent(
                new CustomEvent("settings:speed", {
                  detail: { value: selectedSpeed },
                }),
              );
            });
          }

          const videoMode = overlay.querySelector(
            '[data-modal-toggle="video-mode"]',
          );
          if (videoMode) {
            videoMode.addEventListener("change", () => {
              overlay.dispatchEvent(
                new CustomEvent("settings:video-mode", {
                  detail: { enabled: videoMode.checked },
                }),
              );
            });
          }

          overlay
            .querySelectorAll('[data-modal-action="reset"]')
            .forEach((button) => {
              button.addEventListener("click", () => {
                overlay.dispatchEvent(new CustomEvent("settings:reset"));
              });
            });

          return {
            open,
            close,
            toggle,
            setStepText(text) {
              const target = overlay.querySelector("#mStepTxt");
              if (target) target.textContent = text;
            },
            setMode(mode) {
              const target = overlay.querySelector(
                '[data-mode="' + mode + '"]',
              );
              if (target) target.click();
            },
            setSpeed(value) {
              if (!speed) return;
              const index = speedOptions.indexOf(Number(value));
              if (index < 0) return;
              speed.value = String(index);
              speed.dispatchEvent(new Event("input", { bubbles: true }));
            },
            setVideoMode(enabled) {
              if (!videoMode) return;
              videoMode.checked = Boolean(enabled);
              videoMode.dispatchEvent(new Event("change", { bubbles: true }));
            },
          };
        }

        global.SettingsModal = { init: initSettingsModal };
      })(window);
    </script>
    <script>
      (() => {
        "use strict";

        const PARAMS = Object.freeze({
          /* ANI-05 добавлен для этой реализации: базовая длительность одного шага. */
          ANI_05_STEP_DURATION_MS: 4200,
          TARGET_DPR_LIMIT: 2.2,
          CANVAS_LOGICAL_WIDTH: 600,
        });

        const steps = [
          {
            subtitle: [
              { text: "Робот воспринимает среду, " },
              { text: "принимает решение", emphasis: true },
              { text: " и выполняет действие." },
            ],
            caption: "АВТОМАТИЧЕСКОЕ • АВТОМАТИЗИРОВАННОЕ • ДИСТАНЦИОННОЕ",
          },
          {
            subtitle: [
              { text: "Контроллер объединяет вычисления, " },
              { text: "память", emphasis: true },
              { text: ", питание и интерфейсы." },
            ],
            caption: "ARDUINO • ESP32 • RASPBERRY PI • GPIO / UART / I²C / SPI",
          },
          {
            subtitle: [
              { text: "Датчики преобразуют физические параметры в " },
              { text: "цифровые данные", emphasis: true },
              { text: "." },
            ],
            caption: "ТЕМПЕРАТУРА • ВЛАЖНОСТЬ • СВЕТ • ДВИЖЕНИЕ • РАССТОЯНИЕ",
          },
          {
            subtitle: [
              { text: "Исполнительные механизмы превращают команды в " },
              { text: "движение", emphasis: true },
              { text: " и действия." },
            ],
            caption: "ДВИГАТЕЛЬ • СЕРВО • ШАГОВЫЙ ПРИВОД • РЕЛЕ • LED • PWM",
          },
          {
            subtitle: [
              { text: "Обратная связь помогает алгоритму " },
              { text: "корректировать", emphasis: true },
              { text: " работу системы." },
            ],
            caption:
              "ПОРОГИ • КОНЕЧНЫЕ АВТОМАТЫ • PID • ARDUINO IDE • PLATFORMIO • MICROPYTHON",
          },
          {
            subtitle: [
              { text: "IoT соединяет устройства, шлюзы и сервисы " },
              { text: "сетевыми протоколами", emphasis: true },
              { text: "." },
            ],
            caption:
              "WI‑FI • BLE • ZIGBEE • THREAD • LORAWAN • MQTT / HTTP / COAP",
          },
          {
            subtitle: [
              { text: "Edge, облако и ИИ анализируют телеметрию и помогают " },
              { text: "принимать решения", emphasis: true },
              { text: "." },
            ],
            caption:
              "ФИЛЬТРАЦИЯ • АНОМАЛИИ • ВИЗУАЛИЗАЦИЯ • МАШИННОЕ ЗРЕНИЕ • SLAM",
          },
          {
            subtitle: [
              {
                text: "Надёжность, кибербезопасность и человек необходимы для ",
              },
              { text: "безопасной автоматизации", emphasis: true },
              { text: "." },
            ],
            caption:
              "ПРОМЫШЛЕННОСТЬ • МЕДИЦИНА • ТРАНСПОРТ • АГРО • ДОМ • ОБРАЗОВАНИЕ",
          },
        ];

        const palette = {
          bg: "#0F0F13",
          panel: "#1A1A20",
          accent: "#2EAC65",
          accentDark: "#1E7A47",
          text: "#FFFFFF",
          muted: "#A0A0A0",
          soft: "#CFCFCF",
          border: "rgba(255,255,255,.14)",
          faint: "rgba(255,255,255,.07)",
          greenSoft: "rgba(46,172,101,.14)",
          greenLine: "rgba(46,172,101,.55)",
          warning: "#FFC94D",
          red: "#E5484D",
          metal: "#26262E",
          metal2: "#15151B",
          metalLine: "#3A3A44",
          whiteSoft: "#E6E6EC",
        };

        const state = {
          mode: "auto",
          isPlaying: false,
          currentStep: 0,
          speed: 1,
          videoMode: false,
          controlsHidden: false,
          elapsed: 0,
          isAnimating: false,
          lastFrame: 0,
        };

        let canvas;
        let ctx;
        let stage;
        let stagePanel;
        let workspace;
        let appShell;
        let subtitlePanel;
        let controlPanel;
        let frameOverlay;
        let settingsModal;
        let resizeObserver;
        let cssWidth = 0;
        let cssHeight = 0;
        let dpr = 1;
        let animationFrame = 0;

        function requiredElement(id) {
          const element = document.getElementById(id);
          if (!element)
            throw new Error(
              `Не найден обязательный элемент интерфейса: #${id}`,
            );
          return element;
        }

        function updateSubtitles(stepIndex) {
          const step = steps[stepIndex];
          if (!step) return;
          const target = requiredElement("subtitleText");
          target.classList.remove("subtitle-enter");
          void target.offsetWidth;
          target.classList.add("subtitle-enter");
          target.replaceChildren();
          for (const segment of step.subtitle) {
            if (segment.emphasis) {
              const span = document.createElement("span");
              span.className = "subtitle__keyword";
              span.textContent = segment.text;
              target.appendChild(span);
            } else {
              target.appendChild(document.createTextNode(segment.text));
            }
          }
          requiredElement("subtitleStep").textContent =
            `ШАГ ${stepIndex + 1} / ${steps.length}`;
          target.setAttribute(
            "aria-label",
            step.subtitle.map((part) => part.text).join(""),
          );
        }

        function updateModalState() {
          if (!settingsModal) return;
          settingsModal.setStepText(
            `Шаг ${state.currentStep + 1} / ${steps.length}`,
          );
          const next = document.getElementById("mNext");
          if (next) {
            next.disabled =
              state.mode !== "step" ||
              state.isAnimating ||
              state.currentStep >= steps.length - 1;
          }
          document
            .querySelectorAll("#modalWrap [data-mode]")
            .forEach((button) => {
              const active = button.dataset.mode === state.mode;
              button.classList.toggle("active", active);
              button.setAttribute("aria-pressed", String(active));
            });
          const speed = document.getElementById("mSpeed");
          const speedValue = document.getElementById("mSpeedVal");
          if (speed && speedValue) {
            const values = [0.5, 1, 2];
            speed.value = String(values.indexOf(state.speed));
            speedValue.textContent = `${state.speed}×`;
          }
          const video = document.getElementById("mNine");
          if (video) video.checked = state.videoMode;
        }

        function renderControls() {
          const play = requiredElement("playToggle");
          const pauseIcon = requiredElement("pauseIcon");
          const playIcon = requiredElement("playIcon");
          pauseIcon.hidden = !state.isPlaying;
          playIcon.hidden = state.isPlaying;
          play.setAttribute(
            "aria-label",
            state.isPlaying
              ? "Приостановить воспроизведение"
              : "Продолжить воспроизведение",
          );
          play.setAttribute("title", state.isPlaying ? "Пауза" : "Продолжить");
          appShell.classList.toggle("controls-hidden", state.controlsHidden);
          updateModalState();
        }

        function setMode(mode) {
          if (mode !== "auto" && mode !== "step") return;
          if (mode === state.mode) return;
          state.mode = mode;
          state.elapsed = 0;
          state.isAnimating = false;
          if (mode === "auto") state.isPlaying = true;
          renderControls();
        }

        function setSpeed(value) {
          const allowed = [0.5, 1, 2];
          if (allowed.includes(value)) state.speed = value;
          renderControls();
        }

        function toggleVideoMode(enabled = !state.videoMode) {
          state.videoMode = Boolean(enabled);
          workspace.classList.toggle("video-mode", state.videoMode);
          document.body.classList.toggle("v916", state.videoMode);
          frameOverlay.setAttribute("aria-hidden", String(!state.videoMode));
          if (state.videoMode) {
            frameOverlay.appendChild(subtitlePanel);
            frameOverlay.appendChild(controlPanel);
          } else {
            workspace.appendChild(subtitlePanel);
            workspace.appendChild(controlPanel);
          }
          updateModalState();
          requestResize();
        }

        function reset() {
          state.mode = "auto";
          state.currentStep = 0;
          state.elapsed = 0;
          state.isAnimating = false;
          state.isPlaying = true;
          updateSubtitles(state.currentStep);
          renderControls();
          draw();
        }

        function onStep() {
          if (
            state.mode !== "step" ||
            state.isAnimating ||
            state.currentStep >= steps.length - 1
          )
            return;
          state.currentStep += 1;
          state.elapsed = 0;
          state.isAnimating = true;
          state.isPlaying = true;
          updateSubtitles(state.currentStep);
          renderControls();
          draw();
        }

        function update(dt) {
          if (!state.isPlaying) return;
          const stepDuration = PARAMS.ANI_05_STEP_DURATION_MS;
          if (state.mode === "auto") {
            state.elapsed += dt * state.speed;
            let changed = false;
            while (state.elapsed >= stepDuration) {
              state.elapsed -= stepDuration;
              state.currentStep = (state.currentStep + 1) % steps.length;
              changed = true;
            }
            if (changed) {
              updateSubtitles(state.currentStep);
              updateModalState();
            }
          } else if (state.isAnimating) {
            state.elapsed += dt * state.speed;
            if (state.elapsed >= stepDuration) {
              state.elapsed = 0;
              state.isAnimating = false;
              state.isPlaying = false;
              renderControls();
            }
          }
        }

        function roundRect(x, y, w, h, r, fill, stroke = null, lineWidth = 1) {
          ctx.beginPath();
          const rr = Math.min(r, w / 2, h / 2);
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function text(
          value,
          x,
          y,
          size = 18,
          color = palette.text,
          align = "center",
          weight = 700,
        ) {
          ctx.save();
          ctx.fillStyle = color;
          ctx.font = `${weight} ${size}px system-ui, -apple-system, sans-serif`;
          ctx.textAlign = align;
          ctx.textBaseline = "middle";
          ctx.fillText(value, x, y);
          ctx.restore();
        }

        function line(
          x1,
          y1,
          x2,
          y2,
          color = palette.greenLine,
          width = 3,
          dash = [],
        ) {
          ctx.save();
          ctx.beginPath();
          ctx.setLineDash(dash);
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.lineCap = "round";
          ctx.stroke();
          ctx.restore();
        }

        function arrow(
          x1,
          y1,
          x2,
          y2,
          color = palette.greenLine,
          width = 3,
          pulse = null,
        ) {
          line(x1, y1, x2, y2, color, width);
          const angle = Math.atan2(y2 - y1, x2 - x1);
          const size = 9;
          ctx.save();
          ctx.translate(x2, y2);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-size, -size * 0.62);
          ctx.lineTo(-size, size * 0.62);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
          if (pulse !== null) {
            const px = x1 + (x2 - x1) * pulse;
            const py = y1 + (y2 - y1) * pulse;
            ctx.beginPath();
            ctx.arc(px - x2, py - y2, 5, 0, Math.PI * 2);
            ctx.fillStyle = palette.warning;
            ctx.shadowColor = palette.warning;
            ctx.shadowBlur = 12;
            ctx.fill();
          }
          ctx.restore();
        }

        function node(
          x,
          y,
          w,
          h,
          title,
          sub = "",
          active = false,
          accent = palette.accent,
        ) {
          roundRect(
            x - w / 2,
            y - h / 2,
            w,
            h,
            17,
            active ? "rgba(46,172,101,.16)" : "rgba(26,26,32,.9)",
            active ? accent : palette.border,
            active ? 2.2 : 1.2,
          );
          ctx.save();
          ctx.shadowColor = active ? "rgba(46,172,101,.35)" : "transparent";
          ctx.shadowBlur = active ? 18 : 0;
          ctx.beginPath();
          ctx.arc(x - w / 2 + 22, y, 5, 0, Math.PI * 2);
          ctx.fillStyle = active ? accent : palette.muted;
          ctx.fill();
          ctx.restore();
          text(
            title,
            x + 8,
            y - (sub ? 8 : 0),
            19,
            active ? palette.text : palette.soft,
            "center",
            800,
          );
          if (sub) text(sub, x, y + 17, 13, palette.muted, "center", 600);

        function draw() {
          if (!ctx || !cssWidth || !cssHeight) return;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, cssWidth, cssHeight);

          const logicalW = PARAMS.CANVAS_LOGICAL_WIDTH;
          const scale = Math.min(cssWidth / logicalW, cssHeight / logicalW);
          const logicalH = cssHeight / scale;
          const offsetX = (cssWidth - logicalW * scale) / 2;

          ctx.save();
          ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, 0);
          ctx.fillStyle = "rgba(255,255,255,.018)";
          for (let x = 28; x < logicalW; x += 48) {
            for (let y = 88; y < logicalH - 16; y += 48) {
              ctx.beginPath();
              ctx.arc(x, y, 1.1, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          headerTag(logicalH);
          const rawPhase = (state.elapsed / PARAMS.ANI_05_STEP_DURATION_MS) % 1;
          const phase =
            rawPhase < 0.5
              ? 4 * rawPhase * rawPhase * rawPhase
              : 1 - Math.pow(-2 * rawPhase + 2, 3) / 2;
          if (logicalH >= 650) portraitStep(state.currentStep, logicalH, phase);
          else landscapeStep(state.currentStep, logicalH, phase);
          footerCaption(logicalH);
          ctx.restore();
        }

        function resize() {
          if (!canvas || !stage) return;
          if (state.videoMode && stagePanel) {
            const area = stagePanel.getBoundingClientRect();
            const frameHeight = Math.min(area.height, (area.width * 16) / 9);
            const frameWidth = (frameHeight * 9) / 16;
            stage.style.width = `${frameWidth}px`;
            stage.style.height = `${frameHeight}px`;
          } else {
            stage.style.width = "100%";
            stage.style.height = "100%";
          }
          const rect = stage.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;
          cssWidth = rect.width;
          cssHeight = rect.height;
          dpr = Math.min(window.devicePixelRatio || 1, PARAMS.TARGET_DPR_LIMIT);
          canvas.width = Math.max(1, Math.round(cssWidth * dpr));
          canvas.height = Math.max(1, Math.round(cssHeight * dpr));
          draw();
        }

        function requestResize() {
          requestAnimationFrame(resize);
        }

        function handleInput(event) {
          const target = event.target;
          const isEditable =
            target instanceof HTMLElement &&
            (target.isContentEditable ||
              /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
          if (isEditable) return;
          if (target instanceof HTMLElement && target.closest("button")) return;

          const key = event.key;
          if (key === " " || key === "Spacebar") {
            event.preventDefault();
            state.controlsHidden = !state.controlsHidden;
            renderControls();
          } else if (key === "ArrowRight") {
            if (
              state.mode === "step" &&
              !state.isAnimating &&
              state.currentStep < steps.length - 1
            ) {
              event.preventDefault();
              onStep();
            }
          } else if (key.toLowerCase() === "r") {
            reset();
          } else if (key.toLowerCase() === "s") {
            setMode(state.mode === "auto" ? "step" : "auto");
          } else if (key.toLowerCase() === "v") {
            toggleVideoMode();
          }
        }

        function animationLoop(timestamp) {
          if (!state.lastFrame) state.lastFrame = timestamp;
          const dt = Math.min(timestamp - state.lastFrame, 100);
          state.lastFrame = timestamp;
          update(dt);
          draw();
          animationFrame = requestAnimationFrame(animationLoop);
        }

        function init() {
          try {
            appShell = requiredElement("appShell");
            workspace = requiredElement("workspace");
            stage = requiredElement("stage");
            stagePanel = requiredElement("stagePanel");
            canvas = requiredElement("scene");
            subtitlePanel = requiredElement("subtitlePanel");
            controlPanel = requiredElement("controlPanel");
            frameOverlay = requiredElement("frameOverlay");
            ctx = canvas.getContext("2d", { alpha: true });
            if (!ctx) throw new Error("Canvas 2D context недоступен.");

            updateSubtitles(0);
            settingsModal = window.SettingsModal.init();
            const modalElement = requiredElement("modalWrap");
            modalElement.addEventListener("settings:mode", (event) =>
              setMode(event.detail.mode),
            );
            modalElement.addEventListener("settings:next-step", onStep);
            modalElement.addEventListener("settings:speed", (event) => {
              const value = Number(event.detail.value);
              setSpeed(value);
            });
            modalElement.addEventListener("settings:video-mode", (event) =>
              toggleVideoMode(event.detail.enabled),
            );
            modalElement.addEventListener("settings:reset", reset);

            requiredElement("playToggle").addEventListener("click", () => {
              state.isPlaying = !state.isPlaying;
              renderControls();
            });
            document.addEventListener("keydown", handleInput);
            window.addEventListener("resize", requestResize, { passive: true });
            if ("ResizeObserver" in window) {
              resizeObserver = new ResizeObserver(requestResize);
              resizeObserver.observe(stage);
            }
            document.addEventListener("visibilitychange", () => {
              state.lastFrame = 0;
            });

            resize();
            renderControls();
            state.lastFrame = 0;
            window.setTimeout(() => {
              state.isPlaying = true;
              renderControls();
              state.lastFrame = 0;
              animationFrame = requestAnimationFrame(animationLoop);
            }, 500);
          } catch (error) {
            console.error("Не удалось инициализировать интерактив:", error);
            const target = document.getElementById("subtitleText");
            if (target)
              target.textContent =
                "Не удалось запустить визуализацию. Обновите страницу.";
          }
        }

        document.addEventListener("DOMContentLoaded", init, { once: true });
      })();
    </script>
  </body>
</html>
