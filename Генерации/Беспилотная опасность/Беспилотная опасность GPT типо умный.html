<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0F0F13">
  <meta name="ani-05-step-duration-seconds" content="5.2">
  <title>Беспилотная опасность — правила безопасности</title>
  <style>
:root {
  --ui-bg: #0F0F13;
  --ui-bg-gradient: #111118;
  --ui-panel: #1A1A20;
  --ui-panel-glass: rgba(26,26,32,.55);
  --ui-modal-bg: rgba(26,26,32,.94);
  --ui-modal-scrim: rgba(0,0,0,.55);
  --ui-text: #FFFFFF;
  --ui-muted: #A0A0A0;
  --ui-label: #CFCFCF;
  --ui-accent: #2EAC65;
  --ui-accent-dark: #1E7A47;
  --ui-accent-soft: rgba(46,172,101,.14);
  --ui-accent-soft-hover: rgba(46,172,101,.26);
  --ui-accent-border: rgba(46,172,101,.5);
  --ui-accent-shadow: rgba(46,172,101,.3);
  --ui-accent-shadow-strong: rgba(46,172,101,.35);
  --ui-accent-ambient-1: rgba(46,172,101,.34);
  --ui-accent-ambient-2: rgba(30,122,71,.30);
  --ui-accent-ambient-3: rgba(20,80,45,.38);
  --ui-accent-halo: rgba(46,172,101,.14);
  --ui-danger: #E5484D;
  --ui-danger-hover-border: rgba(229,72,77,.6);
  --ui-white-06: rgba(255,255,255,.06);
  --ui-white-08: rgba(255,255,255,.08);
  --ui-white-10: rgba(255,255,255,.1);
  --ui-white-12: rgba(255,255,255,.12);
  --ui-white-14: rgba(255,255,255,.14);
  --ui-border-soft: rgba(255,255,255,.12);
  --ui-border-faint: rgba(255,255,255,.08);
  --ui-scrim-strong: rgba(0,0,0,.65);
  --ui-surface-inset: rgba(0,0,0,.35);
  --ui-shadow-text: rgba(0,0,0,.8);
  --ui-ambient-blur: 90px;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  color: var(--ui-text);
  background: var(--ui-bg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}

#ambient {
  position: fixed;
  inset: -10%;
  z-index: 0;
  opacity: 0;
  transition: opacity .5s;
  pointer-events: none;
}

#ambient i {
  position: absolute;
  border-radius: 50%;
  filter: blur(var(--ui-ambient-blur));
}

#ambient .b1 {
  width: 46vmin;
  height: 46vmin;
  left: -6%;
  top: 8%;
  background: var(--ui-accent-ambient-1);
  animation: drift 9s ease-in-out infinite alternate;
}

#ambient .b2 {
  width: 40vmin;
  height: 40vmin;
  right: -4%;
  top: 38%;
  background: var(--ui-accent-ambient-2);
  animation: drift 11s ease-in-out infinite alternate-reverse;
}

#ambient .b3 {
  width: 52vmin;
  height: 52vmin;
  left: 16%;
  bottom: -8%;
  background: var(--ui-accent-ambient-3);
  animation: drift 13s ease-in-out infinite alternate;
}

@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(4vmin, -5vmin) scale(1.12); }
}

body.v916 #ambient {
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  #ambient .b1,
  #ambient .b2,
  #ambient .b3 {
    animation: none;
  }
}

#modalWrap {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  background: var(--ui-modal-scrim);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

#modalWrap.open {
  display: flex;
}

#modal {
  width: min(92vw, 380px);
  max-height: 90vh;
  max-height: 90dvh;
  overflow: auto;
  color: var(--ui-text);
  background: var(--ui-modal-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--ui-border-soft);
  border-radius: 20px;
  padding: 20px;
  animation: pop .25s cubic-bezier(.2, .7, .3, 1) both;
  outline: none;
}

@keyframes pop {
  from { opacity: 0; transform: scale(.95); }
  to { opacity: 1; transform: scale(1); }
}

#modal button {
  font-family: inherit;
  color: var(--ui-text);
  cursor: pointer;
}

.modal-close {
  display: grid;
  place-items: center;
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--ui-white-06);
  border: 1px solid var(--ui-border-soft);
}

.mhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.mhead h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
}

.mstep {
  color: var(--ui-muted);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 12px;
}

.seg {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.seg button {
  flex: 1;
  min-height: 48px;
  border-radius: 12px;
  color: var(--ui-text);
  background: var(--ui-white-06);
  border: 1px solid var(--ui-border-soft);
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  transition: background .2s, box-shadow .2s;
}

.seg button.active {
  background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-dark));
  border-color: transparent;
  box-shadow: 0 4px 14px var(--ui-accent-shadow);
}

#mNext {
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  color: var(--ui-text);
  background: var(--ui-accent-soft);
  border: 1px solid var(--ui-accent-border);
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
  transition: background .2s, opacity .2s;
}

#mNext:disabled {
  opacity: .35;
  cursor: not-allowed;
}

#mNext:not(:disabled):hover {
  background: var(--ui-accent-soft-hover);
}

.mrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.mlabel {
  flex: 1;
  color: var(--ui-label);
  font-size: 14px;
  font-weight: 700;
}

#mSpeed {
  flex: 1.4;
  accent-color: var(--ui-accent);
  min-width: 80px;
}

#mSpeedVal {
  min-width: 34px;
  color: var(--ui-text);
  text-align: right;
  font-size: 14px;
  font-weight: 800;
}

.sw {
  position: relative;
  display: inline-block;
  flex: 0 0 52px;
  width: 52px;
  height: 30px;
}

.sw input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.sw span {
  position: absolute;
  inset: 0;
  background: var(--ui-white-12);
  border-radius: 999px;
  transition: background .25s;
  pointer-events: none;
}

.sw span::before {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  left: 3px;
  top: 3px;
  background: var(--ui-text);
  border-radius: 50%;
  transition: transform .25s;
}

.sw input:checked + span {
  background: var(--ui-accent);
}

.sw input:checked + span::before {
  transform: translateX(22px);
}

.sw input:focus-visible + span {
  outline: 2px solid var(--ui-text);
  outline-offset: 3px;
}

#mReset {
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  color: var(--ui-text);
  background: var(--ui-white-06);
  border: 1px solid var(--ui-white-14);
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 14px;
  transition: border-color .2s;
}

#mReset:hover {
  border-color: var(--ui-danger-hover-border);
}

.keys {
  display: grid;
  grid-template-columns: auto 1fr auto 1fr;
  gap: 6px 10px;
  align-items: center;
  color: var(--ui-muted);
  font-size: 12px;
}

.keys span {
  justify-self: start;
  padding: 2px 7px;
  color: var(--ui-text);
  background: var(--ui-white-08);
  border: 1px solid var(--ui-border-soft);
  border-radius: 6px;
  font-weight: 800;
}

.keys i {
  font-style: normal;
}

body.modal-open {
  overflow: hidden;
}

@media (prefers-reduced-motion: reduce) {
  #modal { animation: none; }
}


:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { margin: 0; }
#app {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: stretch;
  gap: 24px;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: clamp(20px, 3vh, 34px) clamp(20px, 3vw, 44px);
  overflow: hidden;
}
.visual-column {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  gap: clamp(12px, 1.8vh, 20px);
}
.heading {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  min-height: 48px;
  width: 100%;
}
.heading h1 {
  margin: 0;
  color: var(--ui-text);
  font-size: clamp(19px, 2vw, 27px);
  line-height: 1.12;
  font-weight: 800;
  letter-spacing: -.035em;
}
.stage-viewport {
  position: relative;
  display: block;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid var(--ui-border-soft);
  border-radius: 26px;
  background: var(--ui-bg-gradient);
  box-shadow: inset 0 1px 0 var(--ui-white-06), 0 20px 60px rgba(0,0,0,.18);
}
#sceneCanvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.sidebar {
  display: flex;
  flex: 0 0 clamp(320px, 30vw, 380px);
  align-items: center;
  justify-content: center;
  min-width: 0;
  padding-left: clamp(16px, 2vw, 28px);
  border-left: 1px solid var(--ui-border-faint);
}
.subtitle-box {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 122px;
  padding: 22px 22px;
  border: 1px solid var(--ui-border-soft);
  border-radius: 20px;
  background: #00000080;
  box-shadow: 0 16px 38px rgba(0,0,0,.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.subtitle-text {
  margin: 0;
  color: var(--ui-text);
  font-size: clamp(16px, 4.5vw, 22px);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -.02em;
}
.subtitle__keyword { color: var(--ui-accent); }
.subtitle-text.animate { animation: subtitle-in .36s cubic-bezier(.2,.7,.3,1) both; }
@keyframes subtitle-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
.controlbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  min-height: 48px;
}
.main-control {
  display: grid;
  place-items: center;
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  min-width: 48px;
  min-height: 48px;
  padding: 0;
  color: var(--ui-text);
  border: 1px solid var(--ui-border-soft);
  border-radius: 16px;
  background: var(--ui-panel-glass);
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
  cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, background .18s ease;
  touch-action: manipulation;
}
.main-control.primary {
  color: var(--ui-text);
  border-color: var(--ui-accent-border);
  background: linear-gradient(145deg, var(--ui-accent), var(--ui-accent-dark));
  box-shadow: 0 8px 24px var(--ui-accent-shadow);
}
.main-control svg { width: 21px; height: 21px; }
.main-control:hover { border-color: var(--ui-accent-border); transform: translateY(-1px); }
.main-control:active { transform: translateY(0) scale(.97); }
.main-control:focus-visible, #modal button:focus-visible, #modal input:focus-visible, #modal select:focus-visible {
  outline: 2px solid var(--ui-accent);
  outline-offset: 3px;
}
.controls-hidden .controlbar { opacity: 0; pointer-events: none; }
.controlbar { transition: opacity .18s ease; }
#app.v916 .visual-column { align-items: center; }
#app.v916 .stage-viewport {
  flex: 1 1 auto;
  width: auto;
  max-width: 100%;
  min-height: 0;
  aspect-ratio: 9 / 16;
  align-self: center;
  border-color: var(--ui-accent-border);
  box-shadow: 0 0 42px var(--ui-accent-halo), inset 0 1px 0 var(--ui-white-08);
}
#stageViewport .subtitle-box { display: none; }
#stageViewport .controlbar { display: none; }
#app.v916 #stageViewport .subtitle-box {
  position: absolute;
  z-index: 3;
  left: 12px;
  right: 12px;
  bottom: 82px;
  display: flex;
  width: auto;
  min-height: 72px;
  padding: 13px 14px;
  border-radius: 16px;
  border-color: rgba(255,255,255,.14);
  background: #00000080;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#app.v916 #stageViewport .subtitle-text { font-size: clamp(16px, 4.5vw, 22px); line-height: 1.28; }
#app.v916 #stageViewport .controlbar {
  position: absolute;
  z-index: 4;
  left: 0;
  right: 0;
  bottom: 12px;
  display: flex;
  justify-content: center;
  min-height: 48px;
}
#app.v916 #stageViewport .main-control { background: rgba(15,15,19,.78); backdrop-filter: blur(8px); }
#app.v916 #stageViewport .main-control.primary { background: linear-gradient(145deg, var(--ui-accent), var(--ui-accent-dark)); }
#modalWrap { z-index: 20; }
#modal { max-height: 90dvh; }
#modal .keys { margin-top: 2px; }
#modal .sw { height: 48px; }
#modal .sw span { inset: 9px 0; }
#modal #mSpeed { cursor: pointer; }
#modal #mSpeed::-webkit-slider-thumb { cursor: pointer; }
body.modal-open #app { filter: saturate(.82); }
@media (max-width: 767px) {
  #app {
    width: calc(100vw - 80px - env(safe-area-inset-right, 0px));
    height: 100vh;
    height: 100dvh;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(25vh + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    gap: 0;
  }
  .visual-column { width: 100%; gap: 12px; }
  .heading { min-height: 42px; }
  .heading h1 { font-size: clamp(18px, 5.2vw, 21px); }
  .stage-viewport { width: 100%; border-radius: 20px; }
  .sidebar { display: none; }
  .subtitle-box {
    flex: 0 0 auto;
    min-height: 80px;
    margin-bottom: 24px;
    padding: 12px 14px;
    border-radius: 15px;
  }
  .subtitle-text { font-size: clamp(16px, 4.5vw, 22px); line-height: 1.3; }
  .controlbar { justify-content: center; min-height: 48px; }
  #ambient { right: calc(80px + env(safe-area-inset-right, 0px)); }
  #modalWrap {
    right: calc(80px + env(safe-area-inset-right, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: 12px;
  }
  #modal { width: 100%; max-width: 380px; padding: 18px; }
  #app.v916 .visual-column { gap: 12px; }
  #app.v916 .stage-viewport {
    width: auto;
    max-width: 100%;
    min-width: 0;
    flex: 1 1 auto;
    align-self: center;
    border-radius: 18px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .subtitle-text.animate { animation: none; }
  .main-control { transition: none; }
}

  </style>
</head>
<body>
<div id="ambient" aria-hidden="true">
  <i class="b1"></i>
  <i class="b2"></i>
  <i class="b3"></i>
</div>

<div id="app">
  <main class="visual-column" id="visualColumn">
    <header class="heading" id="heading">
      <h1>Беспилотная опасность</h1>
    </header>
    <section class="stage-viewport" id="stageViewport" aria-label="Учебная визуализация правил безопасности">
      <canvas id="sceneCanvas" aria-label="Иллюстрированная последовательность безопасных действий"></canvas>
    </section>
    <div class="controlbar" id="controls" aria-label="Управление воспроизведением">
      <button class="main-control primary" id="playBtn" type="button" aria-label="Продолжить" title="Продолжить">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l9.1 5.2c.7.4.7 1.4 0 1.8l-9.1 5.2c-.7.4-1.6-.1-1.6-.9V5.8Z" fill="currentColor"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>
      </button>
      <button class="main-control js-gear" id="gearBtn" type="button" aria-label="Открыть настройки" title="Настройки">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z" stroke="currentColor" stroke-width="1.8"/><path d="m19.2 13.6 1.1.9-1.4 2.5-1.4-.5a7.8 7.8 0 0 1-1.7 1l-.2 1.5h-2.9l-.3-1.5a7.8 7.8 0 0 1-1.7-1l-1.4.5-1.4-2.5 1.1-.9a7 7 0 0 1 0-2l-1.1-.9 1.4-2.5 1.4.5a7.8 7.8 0 0 1 1.7-1l.3-1.5h2.9l.2 1.5a7.8 7.8 0 0 1 1.7 1l1.4-.5 1.4 2.5-1.1.9a7 7 0 0 1 0 2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </main>
  <aside class="sidebar" id="sidebar">
    <section class="subtitle-box" id="subtitleBox" aria-live="polite" aria-atomic="true">
      <p class="subtitle-text" id="subtitleText"></p>
    </section>
  </aside>
</div>
<div id="modalWrap" aria-hidden="true">
  <section id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <header class="mhead">
      <h2 id="modalTitle">Настройки</h2>
      <button class="modal-close" id="mClose" type="button" data-modal-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div class="mstep" id="mStepTxt">Шаг 1 / 8</div>

    <div class="seg" role="group" aria-label="Режим воспроизведения">
      <button id="mAuto" class="active" type="button" data-mode="auto" aria-pressed="true">AUTO</button>
      <button id="mStepBtn" type="button" data-mode="step" aria-pressed="false">STEP</button>
    </div>

    <button id="mNext" type="button" data-modal-action="next-step" disabled>Следующий шаг ▶</button>

    <div class="mrow">
      <label class="mlabel" for="mSpeed">Скорость</label>
      <input type="range" id="mSpeed" min="0" max="2" step="1" value="1" aria-label="Скорость воспроизведения">
      <output id="mSpeedVal" for="mSpeed">1×</output>
    </div>

    <div class="mrow">
      <span class="mlabel" id="mNineLabel">Режим 9:16</span>
      <label class="sw" aria-labelledby="mNineLabel">
        <input type="checkbox" id="mNine" data-modal-toggle="video-mode">
        <span aria-hidden="true"></span>
      </label>
    </div>

    <button id="mReset" type="button" data-modal-action="reset">Reset</button>

    <div class="keys" aria-label="Горячие клавиши">
      <span>Space</span><i>скрыть панель</i>
      <span>→</span><i>следующий шаг</i>
      <span>R</span><i>reset</i>
      <span>S</span><i>AUTO/STEP</i>
      <span>V</span><i>режим 9:16</i>
      <span>Esc</span><i>закрыть</i>
    </div>
  </section>
</div>

<script>
(function (global) {
  'use strict';

  function initSettingsModal(options) {
    const config = Object.assign({
      overlaySelector: '#modalWrap',
      dialogSelector: '#modal',
      openSelector: '.js-gear',
      closeSelector: '[data-modal-close]'
    }, options || {});

    const overlay = document.querySelector(config.overlaySelector);
    if (!overlay) throw new Error('Settings modal overlay not found: ' + config.overlaySelector);

    const dialog = overlay.querySelector(config.dialogSelector) || overlay.querySelector('[role="dialog"]');
    if (!dialog) throw new Error('Settings modal dialog not found.');

    const openers = Array.from(document.querySelectorAll(config.openSelector));
    const closers = Array.from(overlay.querySelectorAll(config.closeSelector));
    let previouslyFocused = null;

    function open() {
      if (overlay.classList.contains('open')) return;
      previouslyFocused = document.activeElement;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      dialog.focus();

      drawArrow(context, w * .3, h * .32, w * .72, h * .32, s);
      text(context, 'СПОКОЙНО И ОРГАНИЗОВАННО', cx, h * .13, s * .05, I.textSoft, 800);
    } else if (index === 5) {
      roundedRect(context, w * .09, h * .2, w * .82, h * .59, s * .03, '#1A2028', '#6C7683', 4);
      roundedRect(context, w * .16, h * .28, w * .2, h * .24, s * .015, '#233B45', '#68808B', 2);
      line(context, w * .26, h * .28, w * .26, h * .52, '#68808B', 2);
      line(context, w * .16, h * .4, w * .36, h * .4, '#68808B', 2);
      line(context, w * .4, h * .23, w * .4, h * .76, '#89929E', 3);
      drawPerson(context, w * .67, groundY, s * (portrait ? .36 : .55), '#477C76', 'sit');
      drawPerson(context, w * .8, groundY, s * (portrait ? .33 : .47), '#567F91', 'sit');
      drawShield(context, w * .68, h * .34, s * (portrait ? .12 : .14), I.successGlow);
      text(context, 'ВНУТРЕННЯЯ ЗОНА', w * .69, h * .19, s * .05, I.successGlow, 800);
      line(context, w * .4, h * .21, w * .4, h * .78, I.warning, 4);
    } else if (index === 6) {
      const objX = cx, objY = portrait ? h * .44 : h * .65;
      drawBarrier(context, objX, objY, s * ((portrait ? .43 : .55) + .025 * Math.sin(progress * Math.PI * 2)));
      roundedRect(context, objX - s * .13, objY - s * .11, s * .25, s * .16, s * .04, I.metalRaised, I.metalStroke, 2);
      context.beginPath(); context.moveTo(objX - s * .13, objY - s * .11); context.lineTo(objX - s * .02, objY - s * .23); context.lineTo(objX + s * .1, objY - s * .1); context.lineTo(objX + s * .12, objY + s * .05); context.closePath(); context.fillStyle = '#33333D'; context.fill(); context.strokeStyle = I.metalStroke; context.stroke();
      circle(context, objX, h * .25, s * .13, 'rgba(229,72,77,.12)', I.danger, 3);
      line(context, objX - s * .07, h * .25 - s * .07, objX + s * .07, h * .25 + s * .07, I.danger, s * .04);
      line(context, objX + s * .07, h * .25 - s * .07, objX - s * .07, h * .25 + s * .07, I.danger, s * .04);
      text(context, 'НЕ ПРИБЛИЖАТЬСЯ', cx, h * .13, s * .06, I.danger, 800);
    } else if (index === 7) {
      drawPhone(context, cx - s * (portrait ? .22 : .2), portrait ? h * .14 : h * .23, s * (portrait ? .44 : .4), s * (portrait ? .47 : .53), '112', portrait ? 'МЕСТО • ВРЕМЯ' : 'ЭКСТРЕННЫЙ ВЫЗОВ');
      const info = portrait ? [ ['МЕСТО', w * .18, h * .49], ['ВРЕМЯ', w * .82, h * .49], ['ЧТО ВИДЕЛ', w * .5, h * .49] ] : [ ['МЕСТО', w * .18, h * .36], ['ВРЕМЯ', w * .82, h * .36], ['НАБЛЮДЕНИЕ', w * .5, h * .84] ];
      info.forEach(([label, x, y]) => {
        roundedRect(context, x - s * .15, y - s * .065, s * .3, s * .13, s * .035, 'rgba(255,255,255,.06)', 'rgba(255,255,255,.16)', 1);
        text(context, label, x, y, s * .045, I.textSoft, 800);
      });
      drawPin(context, w * .18, h * .24, s * .16, I.warning);
      drawClock(context, w * .82, h * .24, s * .17);
      if (!portrait) drawShield(context, w * .5, h * .88, s * .09, I.successGlow);
    } else if (index === 8) {
      drawPhone(context, cx - s * (portrait ? .2 : .17), portrait ? h * .17 : h * .25, s * (portrait ? .4 : .34), s * (portrait ? .42 : .46), 'ПОСТ', '');
      drawCameraOff(context, cx, portrait ? h * .38 : h * .46, s * (portrait ? .23 : .27));
      for (let i = 0; i < 3; i++) {
        const y = portrait ? h * (.2 + i * .15) : h * (.24 + i * .19);
        roundedRect(context, w * .13, y, s * .2, s * .1, s * .03, 'rgba(255,255,255,.05)', 'rgba(255,255,255,.13)', 1);
        text(context, i === 0 ? 'СЛУХИ' : i === 1 ? 'АДРЕСА' : 'СЪЁМКА', w * .23, y + s * .05, s * .04, I.textSoft, 700);
      }
      drawShield(context, portrait ? w * .72 : w * .82, portrait ? h * .45 : h * .5, s * (portrait ? .14 : .19), I.successGlow);
      text(context, 'БЕРЕГИ ДАННЫЕ', portrait ? w * .72 : w * .82, portrait ? h * .54 : h * .66, s * .045, I.successGlow, 800);
    } else if (index === 9) {
      roundedRect(context, w * .12, portrait ? h * .18 : h * .22, w * .76, portrait ? h * .5 : h * .55, s * .04, '#1A2028', '#5C6877', 3);
      drawPerson(context, w * .37, groundY - (portrait ? s * .01 : 0), s * (portrait ? .35 : .52), '#477C76', 'sit');
      drawPerson(context, w * .55, groundY - (portrait ? s * .01 : 0), s * (portrait ? .32 : .45), '#567F91', 'sit');
      drawClock(context, w * .73, portrait ? h * .39 : h * .42, s * (portrait ? .2 : .26));
      roundedRect(context, w * .26, portrait ? h * .1 : h * .14, w * .48, s * .11, s * .035, 'rgba(46,172,101,.15)', 'rgba(127,224,168,.4)', 2);
      text(context, 'ЖДИТЕ ОФИЦИАЛЬНОГО ОТБОЯ', cx, portrait ? h * .155 : h * .195, s * .048, I.successGlow, 800);
      line(context, w * .2, h * .78, w * .8, h * .78, '#6E7885', 4);
    }

    const vignette = context.createRadialGradient(cx, cy, s * .2, cx, cy, Math.max(w, h) * .73);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.35)');
    context.fillStyle = vignette; context.fillRect(0, 0, w, h);
  }

  function updateSubtitles(stepNumber) {
    const item = steps[stepNumber];
    if (!item) return;
    const fragment = document.createDocumentFragment();
    item.segments.forEach((segment) => {
      const span = document.createElement('span');
      if (segment.emphasis) span.className = 'subtitle__keyword';
      span.textContent = segment.text;
      fragment.appendChild(span);
    });
    dom.subtitleText.replaceChildren(fragment);
    dom.subtitleText.classList.remove('animate');
    requestAnimationFrame(() => dom.subtitleText.classList.add('animate'));
    if (settingsModal) settingsModal.setStepText(`Шаг ${stepNumber + 1} / ${steps.length}`);
  }

  function canNext() {
    return state.mode === 'step' && !state.transitionActive && state.currentStep < steps.length - 1;
  }

  function renderControls() {
    const playing = state.isPlaying;
    dom.playBtn.setAttribute('aria-label', playing ? 'Пауза' : 'Продолжить');
    dom.playBtn.setAttribute('title', playing ? 'Пауза' : 'Продолжить');
    dom.playIcon.style.display = playing ? 'none' : 'block';
    dom.pauseIcon.style.display = playing ? 'block' : 'none';
    dom.nextBtn.disabled = !canNext();
    dom.nextBtn.setAttribute('aria-disabled', String(dom.nextBtn.disabled));
    if (settingsModal) settingsModal.setStepText(`Шаг ${state.currentStep + 1} / ${steps.length}`);
  }

  function setMode(mode) {
    if (mode !== 'auto' && mode !== 'step') return;
    if (mode === state.mode) return;
    state.mode = mode;
    if (mode === 'step') {
      state.elapsed = STEP_DURATION;
      state.transitionActive = false;
      state.isPlaying = false;
    } else {
      state.elapsed = 0;
      state.transitionActive = true;
      state.isPlaying = true;
    }
    renderControls();
  }

  function nextStep() {
    if (!canNext()) return;
    state.currentStep += 1;
    state.elapsed = 0;
    state.transitionActive = true;
    state.isPlaying = true;
    updateSubtitles(state.currentStep);
    renderControls();
    draw();
  }

  function setPlaying(value) {
    state.isPlaying = Boolean(value);
    lastFrame = 0;
    renderControls();
  }

  function reset() {
    state.mode = 'auto';
    state.currentStep = 0;
    state.elapsed = 0;
    state.transitionActive = true;
    state.isPlaying = true;
    updateSubtitles(0);
    if (settingsModal) settingsModal.setMode('auto');
    renderControls();
    draw();
  }

  function setSpeed(value) {
    const number = Number(value);
    if (SPEEDS.includes(number)) state.speed = number;
    if (settingsModal) settingsModal.setSpeed(state.speed);
  }

  function fitVideoFrame() {
    if (!state.videoMode) return;
    const columnRect = dom.visualColumn.getBoundingClientRect();
    const headingRect = dom.heading.getBoundingClientRect();
    const styles = window.getComputedStyle(dom.visualColumn);
    const gap = parseFloat(styles.rowGap || styles.gap) || 12;
    const maxHeight = Math.max(1, columnRect.height - headingRect.height - gap);
    const maxWidth = columnRect.width;
    const width = Math.min(maxWidth, maxHeight * 9 / 16);
    const height = width * 16 / 9;
    dom.stageViewport.style.width = `${width}px`;
    dom.stageViewport.style.height = `${height}px`;
    dom.stageViewport.style.flex = '0 0 auto';
    dom.stageViewport.style.aspectRatio = '9 / 16';
    dom.stageViewport.style.alignSelf = 'center';
  }

  function reflowUI() {
    const desktop = desktopQuery.matches;
    if (state.videoMode) {
      dom.stageViewport.append(dom.subtitleBox, dom.controls);
    } else if (desktop) {
      dom.sidebar.appendChild(dom.subtitleBox);
      dom.visualColumn.appendChild(dom.controls);
    } else {
      dom.visualColumn.append(dom.subtitleBox, dom.controls);
    }
    dom.app.classList.toggle('v916', state.videoMode);
    document.body.classList.toggle('v916', state.videoMode);
    dom.sidebar.hidden = state.videoMode || !desktop;
    if (state.videoMode) fitVideoFrame();
    else {
      dom.stageViewport.style.width = '';
      dom.stageViewport.style.height = '';
      dom.stageViewport.style.flex = '';
      dom.stageViewport.style.aspectRatio = '';
      dom.stageViewport.style.alignSelf = '';
    }
    resize();
  }

  function toggleVideoMode(enabled) {
    state.videoMode = typeof enabled === 'boolean' ? enabled : !state.videoMode;
    const toggle = byId('mNine');
    if (toggle) toggle.checked = state.videoMode;
    reflowUI();
    draw();
  }

  function resize() {
    if (!dom.stageViewport || !ctx) return;
    const rect = dom.stageViewport.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.round(rect.width * dpr));
    const height = Math.max(1, Math.round(rect.height * dpr));
    if (dom.canvas.width !== width || dom.canvas.height !== height) {
      dom.canvas.width = width;
      dom.canvas.height = height;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function update(dt) {
    if (!state.isPlaying) return;
    state.elapsed += dt * state.speed;
    if (state.elapsed >= STEP_DURATION) {
      state.elapsed = STEP_DURATION;
      state.transitionActive = false;
      if (state.mode === 'auto') {
        state.currentStep = (state.currentStep + 1) % steps.length;
        state.elapsed = 0;
        state.transitionActive = true;
        updateSubtitles(state.currentStep);
      } else {
        state.isPlaying = false;
      }
      renderControls();
    }
  }

  function draw() {
    if (!ctx || !dom.canvas) return;
    const rect = dom.canvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    if (!w || !h) return;
    ctx.save();
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const progress = STEP_DURATION > 0 ? clamp(state.elapsed / STEP_DURATION, 0, 1) : 1;
    drawScene(ctx, w, h, state.currentStep, progress);
    ctx.restore();
  }

  function startAuto() {
    window.setTimeout(() => {
      if (!state.initialized) return;
      state.mode = 'auto';
      state.isPlaying = true;
      state.elapsed = 0;
      state.transitionActive = true;
      lastFrame = 0;
      renderControls();
    }, 500);
  }

  function animationFrame(timestamp) {
    if (!lastFrame) lastFrame = timestamp;
    const dt = Math.min((timestamp - lastFrame) / 1000, .1);
    lastFrame = timestamp;
    update(dt);
    draw();
    rafId = window.requestAnimationFrame(animationFrame);
  }

  function isEditable(target) {
    return target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
  }

  function handleInput(event) {
    if (isEditable(event.target)) return;
    if (!desktopQuery.matches) return;
    const key = event.key;
    if (key === ' ' || key === 'Spacebar') {
      event.preventDefault();
      state.controlsVisible = !state.controlsVisible;
      dom.app.classList.toggle('controls-hidden', !state.controlsVisible);
    } else if (key === 'ArrowRight' && canNext()) {
      event.preventDefault();
      nextStep();
    } else if (key.toLowerCase() === 'r') {
      reset();
    } else if (key.toLowerCase() === 's') {
      setMode(state.mode === 'auto' ? 'step' : 'auto');
      settingsModal.setMode(state.mode);
    } else if (key.toLowerCase() === 'v') {
      toggleVideoMode();
    }
  }

  function openSettings() { settingsModal.open(); }
  function closeSettings() { settingsModal.close(); }

  function init() {
    const ids = ['app', 'visualColumn', 'heading', 'stageViewport', 'sceneCanvas', 'sidebar', 'subtitleBox', 'subtitleText', 'controls', 'playBtn', 'playIcon', 'pauseIcon', 'gearBtn', 'mNext', 'modalWrap'];
    ids.forEach((id) => { dom[id] = byId(id); });
    dom.canvas = dom.sceneCanvas;
    dom.nextBtn = dom.mNext;
    if (ids.some((id) => !dom[id])) throw new Error('Не удалось инициализировать интерфейс: отсутствует обязательный элемент.');
    ctx = dom.canvas.getContext('2d', { alpha: false });
    if (!ctx) throw new Error('Canvas 2D недоступен в этом браузере.');
    settingsModal = window.SettingsModal.init();
    desktopQuery = window.matchMedia('(min-width: 768px)');
    desktopQuery.addEventListener ? desktopQuery.addEventListener('change', reflowUI) : desktopQuery.addListener(reflowUI);
    dom.playBtn.addEventListener('click', () => setPlaying(!state.isPlaying));
    dom.modalWrap.addEventListener('settings:mode', (event) => setMode(event.detail.mode));
    dom.modalWrap.addEventListener('settings:next-step', nextStep);
    dom.modalWrap.addEventListener('settings:speed', (event) => { state.speed = Number(event.detail.value); });
    dom.modalWrap.addEventListener('settings:video-mode', (event) => toggleVideoMode(event.detail.enabled));
    dom.modalWrap.addEventListener('settings:reset', reset);
    document.addEventListener('keydown', handleInput);
    resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(dom.stageViewport);
    window.addEventListener('resize', () => { if (state.videoMode) fitVideoFrame(); resize(); }, { passive: true });
    reflowUI();
    updateSubtitles(0);
    state.initialized = true;
    state.isPlaying = false;
    renderControls();
    resize();
    rafId = window.requestAnimationFrame(animationFrame);
    startAuto();
  }

  try { init(); }
  catch (error) {
    console.error(error);
    const fallback = document.createElement('div');
    fallback.textContent = 'Не удалось запустить визуализацию. Обновите страницу или откройте файл в современном браузере.';
    fallback.style.cssText = 'position:fixed;inset:20px;display:grid;place-items:center;color:#FFFFFF;text-align:center;font:600 16px system-ui;background:#0F0F13;z-index:100;';
    document.body.appendChild(fallback);
  }
})();
</script>
</body>
</html>
