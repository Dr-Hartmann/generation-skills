    const config = Object.assign({
      overlaySelector: '#modalWrap',
      dialogSelector: '#modal',
      openSelector: '.js-gear',
      closeSelector: '[data-modal-close]'

    const overlay = document.querySelector(config.overlaySelector);
    if (!overlay) throw new Error('Settings modal overlay not found: ' + config.overlaySelector);

    const dialog = overlay.querySelector(config.dialogSelector) || overlay.querySelector('[role="dialog"]');

    const openers = Array.from(document.querySelectorAll(config.openSelector));
    const closers = Array.from(overlay.querySelectorAll(config.closeSelector));

      if (event.target === overlay) close();

      if (event.key === 'Escape' && overlay.classList.contains('open')) {

    context.fillStyle = '#FFC94D'; context.shadowColor = '#FFC94D'; context.shadowBlur = 18;
    context.font = `900 ${Math.min(W * .08, H * .12)}px system-ui`; context.textAlign = 'center'; context.fillText('⚡', W * .72, H * .25); context.shadowBlur = 0;
    drawPill(context, 'КОНТАКТНАЯ СЕТЬ', W * .48, H * .27, W * .43, '#FFC94D');
  }

  function drawProhibited(context, W, H, x, y, radius, label) {
    context.save(); context.strokeStyle = '#E5484D'; context.lineWidth = Math.max(7, radius * .12);
    context.beginPath(); context.arc(x, y, radius, 0, Math.PI * 2); context.stroke();
    context.beginPath(); context.moveTo(x - radius * .7, y + radius * .7); context.lineTo(x + radius * .7, y - radius * .7); context.stroke();
    if (label) drawText(context, label, x, y + radius + H * .05, H * .032, '#FF8d8f', 800, 'center');
    context.restore();
  }

  function drawScene() {
    if (!ctx || !canvas || !cssWidth || !cssHeight) return;
    const portrait = state.videoMode;
    logicalWidth = portrait ? 900 : 1600;
    logicalHeight = portrait ? 1600 : 900;
    const W = logicalWidth; const H = logicalHeight;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const targetW = Math.max(1, Math.round(cssWidth * dpr));
    const targetH = Math.max(1, Math.round(cssHeight * dpr));
    if (canvas.width !== targetW || canvas.height !== targetH) { canvas.width = targetW; canvas.height = targetH; }
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    const step = state.currentStep;
    const stepProgress = state.mode === 'auto'
      ? clamp(state.elapsed / STEP_DURATION, 0, 1)
      : clamp(state.elapsed / TRANSITION_DURATION, 0, 1);
    const eased = easeInOut(stepProgress);
    drawBackground(ctx, W, H, state.elapsed);

    if (step === 5 || step === 6) drawOverheadWires(ctx, W, H);

    const trackCount = step === 3 ? 2 : step === 5 ? 3 : 1;
    drawTracks(ctx, W, H, trackCount);
    drawRoadAndCrossing(ctx, W, H, step >= 1 && step <= 6);
    drawWarningSign(ctx, W, H, W * .16, H * .40, portrait ? .75 : 1);

    const redSignal = step !== 7;
    drawSignal(ctx, W, H, redSignal);
    drawBarrier(ctx, W, H, step !== 0 && step !== 7, step === 7 ? eased : step === 0 ? 1 : 1);

    if (step === 0) {
      drawPill(ctx, 'ОБОРУДОВАННЫЙ ПЕРЕХОД', W * .30, H * .20, W * .43, '#7FE0A8');
      drawPill(ctx, 'НАСТИЛ  •  МОСТ  •  ТОННЕЛЬ', W * .28, H * .29, W * .48, '#FFFFFF');
      const px = lerp(W * .38, W * .51, eased);
      drawPerson(ctx, W, H, px, (portrait ? H * .61 : H * .91), portrait ? 1.15 : 1.0, { safe: true });
    }

    if (step === 1) {
      const trainW = W * (portrait ? .88 : .42);
      const trainX = lerp(W * 1.05, W * .53, eased);
      drawTrain(ctx, W, H, trainX, H * .39, trainW, H * (portrait ? .115 : .17), false);
      drawPill(ctx, 'СТОП • КРАСНЫЙ СИГНАЛ', W * .25, H * .20, W * .48, '#FF8d8f');
      drawPerson(ctx, W, H, W * .35, (portrait ? H * .61 : H * .91), portrait ? 1.0 : .95, {});
      drawProhibited(ctx, W, H, W * .35, portrait ? H * .55 : H * .74, portrait ? H * .052 : H * .075, portrait ? '' : 'НЕ ПЕРЕХОДИ');
    }

    if (step === 2) {
      drawPill(ctx, 'СНАЧАЛА ОСТАНОВИСЬ', W * .28, H * .18, W * .44, '#FFC94D');
      drawPerson(ctx, W, H, W * .40, (portrait ? H * .61 : H * .91), portrait ? 1.02 : .95, { headphones: true, phone: true });
      drawProhibited(ctx, W, H, W * .65, portrait ? H * .55 : H * .77, portrait ? H * .052 : H * .075, portrait ? '' : 'БЕЗ ОТВЛЕЧЕНИЙ');
      drawPill(ctx, 'ТЕЛЕФОН', W * .56, portrait ? H * .58 : H * .84, W * .24, '#FFC94D');
    }

    if (step === 3) {
      const trainW = W * (portrait ? .74 : .38);
      drawTrain(ctx, W, H, W * .52, H * .39, trainW, H * .14, false);
      contextMist(ctx, W, H);
      drawPill(ctx, 'ПРОВЕРЬ ОБЕ СТОРОНЫ', W * .25, H * .20, W * .50, '#FFC94D');
      drawPerson(ctx, W, H, W * .35, (portrait ? H * .61 : H * .91), portrait ? 1.0 : .9, {});
    }

    if (step === 4) {
      drawTrain(ctx, W, H, W * .12, H * .47, W * .74, H * .16, true);
      drawPill(ctx, 'ВАГОНЫ НЕ ПРОХОД', W * .30, H * .19, W * .40, '#FF8d8f');
      drawPill(ctx, 'НЕ СОКРАЩАЙ ПУТЬ', W * .30, H * (portrait ? .27 : .29), W * .40, '#FF8d8f');
      drawProhibited(ctx, W, H, W * .28, portrait ? H * .53 : H * .79, portrait ? H * .05 : H * .085, portrait ? '' : 'НЕ ПРОЛЕЗАЙ');
      drawProhibited(ctx, W, H, W * .70, portrait ? H * .53 : H * .79, portrait ? H * .05 : H * .085, portrait ? '' : 'НЕ ПЕРЕЛЕЗАЙ');
      drawPill(ctx, 'СЦЕПКИ', W * .59, portrait ? H * .60 : H * .87, W * .26, '#FF8d8f');
    }

    if (step === 5) {
      drawPill(ctx, 'ПО НАЗНАЧЕНИЮ: ГЛАВНЫЕ • СТАНЦИОННЫЕ • ПОДЪЕЗДНЫЕ', W * .07, H * (portrait ? .34 : .25), W * .86, '#7FE0A8');
      drawPill(ctx, 'ПО ЭЛЕКТРИФИКАЦИИ: ЭЛЕКТРИФИЦИРОВАННЫЕ / НЕТ', W * .07, H * (portrait ? .405 : .33), W * .86, '#FFC94D');
    }

    if (step === 6) {
      drawPill(ctx, 'НЕ ПРИБЛИЖАЙСЯ К ПРОВОДАМ', W * .20, H * .38, W * .60, '#FFC94D');
      contextWarningObject(ctx, W, H);
      drawProhibited(ctx, W, H, W * .66, portrait ? H * .59 : H * .78, portrait ? H * .05 : H * .075, portrait ? '' : 'НЕ ТРОГАЙ');
      drawPill(ctx, 'ПОСТОРОННИЕ ПРЕДМЕТЫ НА ПУТЯХ', W * .20, portrait ? H * .34 : H * .92, W * .60, '#FF8d8f');
    }

    if (step === 7) {
      const trainW = W * (portrait ? .82 : .40);
      const trainX = lerp(W * .55, W * 1.05, eased);
      drawTrain(ctx, W, H, trainX, H * .39, trainW, H * (portrait ? .12 : .16), false);
      drawPill(ctx, 'ДОЖДИСЬ ОТКРЫТИЯ', W * .29, H * .19, W * .43, '#7FE0A8');
      const px = lerp(W * .32, W * .51, eased);
      drawPerson(ctx, W, H, px, (portrait ? H * .61 : H * .91), portrait ? 1.03 : .96, { safe: true });
      drawPill(ctx, 'ПРОВЕРЬ ОБА НАПРАВЛЕНИЯ', W * .20, portrait ? H * .29 : H * .84, W * .60, '#7FE0A8');
    }

    drawSceneFrameDecor(ctx, W, H, step);
  }

  function contextMist(context, W, H) {
    const fog = context.createLinearGradient(0, H * .36, 0, H * .55);
    fog.addColorStop(0, 'rgba(200,210,220,0)'); fog.addColorStop(1, 'rgba(200,210,220,.42)');
    context.fillStyle = fog; context.fillRect(0, H * .34, W, H * .23);
    drawPill(context, 'НЕСКОЛЬКО ПУТЕЙ', W * .32, H * .20, W * .36, '#FFC94D');
  }

  function contextWarningObject(context, W, H) {
    context.fillStyle = '#c5a36b';
    context.save(); context.translate(W * .52, H * (W < H ? .58 : .73)); context.rotate(-.22);
    roundRect(context, -W * .06, -H * .025, W * .12, H * .05, 5, '#b08c50', '#e2c17e');
    context.restore();
    context.strokeStyle = '#E5484D'; context.lineWidth = Math.max(5, H * .012);
    context.beginPath(); context.moveTo(W * .46, H * (W < H ? .52 : .66)); context.lineTo(W * .58, H * (W < H ? .64 : .80)); context.moveTo(W * .58, H * (W < H ? .52 : .66)); context.lineTo(W * .46, H * (W < H ? .64 : .80)); context.stroke();
  }

  function drawSceneFrameDecor(context, W, H, step) {
    const titles = ['ПЕРЕХОД', 'ЗАПРЕЩАЮЩИЙ СИГНАЛ', 'ВНИМАНИЕ', 'ОБЗОР', 'ОПАСНО', 'ВИДЫ ПУТЕЙ', 'КОНТАКТНАЯ СЕТЬ', 'БЕЗОПАСНЫЙ ПЕРЕХОД'];
    roundRect(context, W * .035, H * .035, W * .38, H * .055, 14, 'rgba(15,15,19,.72)', 'rgba(255,255,255,.1)');
    drawText(context, titles[step], W * .055, H * .062, Math.min(W * .032, H * .05), '#FFFFFF', 800, 'left');
    context.fillStyle = 'rgba(255,255,255,.2)';
    roundRect(context, W * .035, H * .105, W * .24, H * .009, 4, 'rgba(255,255,255,.12)');
    roundRect(context, W * .035, H * .105, W * .24 * ((step + 1) / STEPS.length), H * .009, 4, '#2EAC65');
  }

  function draw() {
    drawScene();
  }

  function resize() {
    if (!stage || !frame) return;
    const rect = stage.getBoundingClientRect();
    const availableWidth = Math.max(0, rect.width);
    const availableHeight = Math.max(0, rect.height);
    if (availableWidth < 2 || availableHeight < 2) return;
    const ratio = state.videoMode ? 9 / 16 : 16 / 9;
    let width = Math.min(availableWidth, availableHeight * ratio);
    let height = width / ratio;
    if (height > availableHeight) { height = availableHeight; width = height * ratio; }
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    cssWidth = width; cssHeight = height;
    draw();
  }

  function handleInput(event) {
    if (event.defaultPrevented || event.repeat) return;
    const target = event.target;
    const editable = target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
    const interactive = target && target.closest && target.closest('button, a, input, textarea, select, [contenteditable="true"]');
    if (editable || interactive) return;
    const key = event.key;
    if (key === ' ' || key === 'Spacebar') {
      event.preventDefault();
      document.body.classList.toggle('controls-hidden');
    } else if (key === 'ArrowRight' && state.mode === 'step') {
      event.preventDefault(); nextStep();
    } else if (key.toLowerCase() === 'r') {
      event.preventDefault(); reset();
    } else if (key.toLowerCase() === 's') {
      event.preventDefault(); setMode(state.mode === 'auto' ? 'step' : 'auto');
    } else if (key.toLowerCase() === 'v') {
      event.preventDefault(); toggleVideoMode();
    } else if (key === 'Escape' && modalWrap && modalWrap.classList.contains('open')) {
      closeSettings();
    }
  }

  function onSettingsEvents() {
    modalWrap.addEventListener('settings:mode', (event) => setMode(event.detail.mode));
    modalWrap.addEventListener('settings:next-step', nextStep);
    modalWrap.addEventListener('settings:speed', (event) => setSpeed(event.detail.value));
    modalWrap.addEventListener('settings:video-mode', (event) => toggleVideoMode(event.detail.enabled));
    modalWrap.addEventListener('settings:reset', reset);
  }

  function animationLoop(timestamp) {
    if (!state.initialized) return;
    if (!state.lastFrame) state.lastFrame = timestamp;
    const dt = (timestamp - state.lastFrame) / 1000;
    state.lastFrame = timestamp;
    update(dt);
    draw();
    state.frameId = window.requestAnimationFrame(animationLoop);
  }

  function init() {
    const required = [canvas, ctx, frame, stage, $('#playButton'), $('#mobileSubtitleHost'), $('#desktopSubtitleHost'), $('#frameUI'), $('#modalWrap')];
    if (required.some((element) => !element)) {
      console.error('Не удалось инициализировать визуализацию: отсутствует обязательный элемент интерфейса.');
      return;
    }
    try {
      settingsModal = window.SettingsModal.init();
      onSettingsEvents();
      playButton.addEventListener('click', togglePlay);
      document.addEventListener('keydown', handleInput);
      moveLayout();
      updateSubtitles(0);
      renderPlayButton();
      renderModalState();
      if ('ResizeObserver' in window) {
        resizeObserver = new ResizeObserver(resize);
        resizeObserver.observe(stage);
      }
      window.addEventListener('resize', () => {
        state.viewportWidth = window.innerWidth;
        if (!state.videoMode) moveLayout();
        resize();
      }, { passive: true });
      document.addEventListener('visibilitychange', () => { state.lastFrame = 0; });
      resize();
      state.initialized = true;
      state.frameId = window.requestAnimationFrame(animationLoop);
      window.setTimeout(() => {
        if (state.mode === 'auto') setPlaying(true);
      }, 500);
    } catch (error) {
      console.error('Ошибка инициализации приложения:', error);
      const shell = $('#appShell');
      if (shell) shell.setAttribute('aria-label', 'Не удалось запустить визуализацию. Обновите страницу.');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
})();
</script>
</body>
</html>
