<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      user-scalable="no"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0F0F13" />
    <title>Пересечение железнодорожных путей</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #0f0f13;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      button {
        font-family: inherit;
        color: #fff;
        background: none;
        border: none;
        cursor: pointer;
        touch-action: manipulation;
        padding: 0;
      }
      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: rgba(46, 172, 101, 0.34);
        animation: drift 9s ease-in-out infinite alternate;
      }
      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: rgba(30, 122, 71, 0.3);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: rgba(20, 80, 45, 0.38);
        animation: drift 13s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }
      body.v916 #ambient {
        opacity: 1;
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
      }
      #stage {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      #frame {
        position: absolute;
        inset: 0;
      }
      body.v916 #frame {
        width: min(100%, calc(100vh * 9 / 16));
        height: min(100%, calc(100vw * 16 / 9));
        width: min(100%, calc(100dvh * 9 / 16));
        height: min(100%, calc(100vw * 16 / 9));
        margin: auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 70px rgba(46, 172, 101, 0.14);
      }
      #cv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      #overlay > * {
        position: absolute;
      }
      #title {
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: 16px;
        right: 88px;
        font-size: clamp(17px, 4.8vw, 26px);
        font-weight: 800;
        letter-spacing: 0.2px;
        line-height: 1.25;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
        pointer-events: none;
      }
      #subtitle {
        left: 16px;
        right: 88px;
        bottom: calc(18vh + 88px + env(safe-area-inset-bottom, 0px));
        min-height: 58px;
        display: flex;
        align-items: center;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        pointer-events: none;
      }
      #subtitle .txt,
      #subSide .txt {
        width: 100%;
        font-size: clamp(16px, 4.5vw, 22px);
        font-weight: 700;
        line-height: 1.32;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }
      #subSide .txt {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.45;
        text-shadow: none;
      }
      .kw {
        color: #2eac65;
        font-weight: 800;
      }
      #subtitle .kw {
        text-shadow: 0 0 14px rgba(46, 172, 101, 0.5);
      }
      .anim {
        animation: subIn 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #panel {
        left: 16px;
        right: 88px;
        bottom: calc(18vh + env(safe-area-inset-bottom, 0px));
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px;
        background: rgba(26, 26, 32, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
      }
      .play,
      .gearb {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
      }
      .play {
        background: linear-gradient(135deg, #2eac65, #1e7a47);
        box-shadow: 0 4px 18px rgba(46, 172, 101, 0.35);
      }
      .gearb {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      #side {
        display: none;
      }
      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #modalWrap.open {
        display: flex;
      }
      #modal {
        width: min(92vw, 380px);
        max-height: 82vh;
        max-height: 82dvh;
        overflow: auto;
        background: rgba(26, 26, 32, 0.94);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 20px;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }
      .mstep {
        color: #a0a0a0;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        height: 44px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 800;
        font-size: 14px;
        transition: 0.2s;
      }
      .seg button.active {
        background: linear-gradient(135deg, #2eac65, #1e7a47);
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(46, 172, 101, 0.3);
      }
      #mNext {
        width: 100%;
        height: 48px;
        border-radius: 12px;
        background: rgba(46, 172, 101, 0.14);
        border: 1px solid rgba(46, 172, 101, 0.5);
        font-weight: 800;
        font-size: 15px;
        margin-bottom: 14px;
        transition: 0.2s;
      }
      #mNext:disabled {
        opacity: 0.35;
      }
      #mNext:not(:disabled):hover {
        background: rgba(46, 172, 101, 0.26);
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mlabel {
        font-size: 14px;
        font-weight: 700;
        color: #cfcfcf;
        flex: 1;
      }
      #mSpeed {
        flex: 1.4;
        accent-color: #2eac65;
      }
      #mSpeedVal {
        font-weight: 800;
        font-size: 14px;
        min-width: 34px;
        text-align: right;
      }
      .sw {
        position: relative;
        display: inline-block;
        width: 52px;
        height: 30px;
      }
      .sw input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        transition: 0.25s;
      }
      .sw span:before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.25s;
      }
      .sw input:checked + span {
        background: #2eac65;
      }
      .sw input:checked + span:before {
        transform: translateX(22px);
      }
      #mReset {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-weight: 800;
        font-size: 14px;
        margin-bottom: 14px;
        transition: 0.2s;
      }
      #mReset:hover {
        border-color: rgba(229, 72, 77, 0.6);
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        font-size: 12px;
        color: #a0a0a0;
        align-items: center;
      }
      .keys span {
        font-weight: 800;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 2px 7px;
        justify-self: start;
      }
      @media (min-width: 768px) {
        #overlay {
          display: none;
        }
        body.v916 #overlay {
          display: block;
        }
        #side {
          display: flex;
          flex-direction: column;
          gap: 14px;
          width: 360px;
          padding: 26px 24px calc(24px + env(safe-area-inset-bottom, 0px));
          background: #1a1a20;
          border-left: 1px solid rgba(255, 255, 255, 0.08);
        }
        body.v916 #side {
          display: none;
        }
        #side h1 {
          margin: 0;
          font-size: clamp(20px, 1.7vw, 24px);
          font-weight: 800;
          line-height: 1.25;
        }
        .chips {
          display: flex;
          gap: 8px;
        }
        .chip {
          font-size: 12px;
          font-weight: 800;
          padding: 6px 12px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #cfcfcf;
        }
        .chip.acc {
          background: rgba(46, 172, 101, 0.16);
          border-color: rgba(46, 172, 101, 0.4);
          color: #2eac65;
        }
        #subSide {
          flex: 1;
          min-height: 120px;
          background: rgba(0, 0, 0, 0.35);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 16px;
          padding: 16px;
          display: flex;
          align-items: center;
        }
        .controls {
          display: flex;
          gap: 10px;
        }
        .controls .play,
        .controls .gearb {
          width: 56px;
          height: 56px;
          border-radius: 16px;
        }
        .play:hover {
          box-shadow: 0 6px 24px rgba(46, 172, 101, 0.5);
        }
        .gearb:hover {
          background: rgba(255, 255, 255, 0.12);
        }
        .hint {
          font-size: 12px;
          color: #a0a0a0;
          font-weight: 600;
        }
      }
      #panel,
      .controls,
      .chips,
      .hint {
        transition: opacity 0.3s;
      }
      body.ui-hidden #panel,
      body.ui-hidden .controls,
      body.ui-hidden .chips,
      body.ui-hidden .hint {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="ambient">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i>
    </div>
    <div id="app">
      <div id="stage">
        <div id="frame">
          <canvas id="cv"></canvas>
          <div id="overlay">
            <div id="title">Пересечение железнодорожных путей</div>
            <div id="subtitle"><div class="txt"></div></div>
            <div id="panel">
              <button class="play js-play" aria-label="Пуск"></button>
              <button class="gearb js-gear" aria-label="Настройки">
                <svg viewBox="0 0 24 24" width="22" height="22">
                  <path
                    fill="currentColor"
                    d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 13.92 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.63.26-1.2.6-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.43 11a7.9 7.9 0 0 0 0 2l-2.1 1.63a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.61.22l2.49-1c.53.4 1.1.74 1.73 1l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65a7.3 7.3 0 0 0 1.73-1l2.49 1c.22.09.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13Zm-7.47 2.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <aside id="side">
        <h1>Пересечение железнодорожных путей</h1>
        <div class="chips">
          <span id="chipStep" class="chip">Шаг 1 / 8</span
          ><span id="chipMode" class="chip acc">AUTO</span>
        </div>
        <div id="subSide"><div class="txt"></div></div>
        <div class="controls">
          <button class="play js-play" aria-label="Пуск"></button>
          <button class="gearb js-gear" aria-label="Настройки">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path
                fill="currentColor"
                d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 13.92 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.63.26-1.2.6-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.43 11a7.9 7.9 0 0 0 0 2l-2.1 1.63a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.61.22l2.49-1c.53.4 1.1.74 1.73 1l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65a7.3 7.3 0 0 0 1.73-1l2.49 1c.22.09.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13Zm-7.47 2.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
              />
            </svg>
          </button>
        </div>
        <div class="hint">Горячие клавиши — в настройках</div>
      </aside>
    </div>
    <div id="modalWrap">
      <div id="modal">
        <div class="mhead">
          <h2>Настройки</h2>
          <button class="gearb" id="mClose" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div class="mstep" id="mStepTxt">Шаг 1 / 8</div>
        <div class="seg">
          <button id="mAuto" class="active">AUTO</button
          ><button id="mStepBtn">STEP</button>
        </div>
        <button id="mNext" disabled>Следующий шаг ▶</button>
        <div class="mrow">
          <span class="mlabel">Скорость</span
          ><input
            type="range"
            id="mSpeed"
            min="0.5"
            max="2"
            step="0.5"
            value="1"
          /><span id="mSpeedVal">1x</span>
        </div>
        <div class="mrow">
          <span class="mlabel">Режим 9:16</span
          ><label class="sw"
            ><input type="checkbox" id="mNine" /><span></span
          ></label>
        </div>
        <button id="mReset">Reset</button>
        <div class="keys">
          <span>Space</span><i>скрыть панель</i><span>→</span
          ><i>следующий шаг</i><span>R</span><i>reset</i><span>S</span
          ><i>AUTO/STEP</i><span>V</span><i>режим 9:16</i><span>Esc</span
          ><i>закрыть</i>
        </div>
      </div>
    </div>
    <script>
      "use strict";
      const $ = (s) => document.querySelector(s),
        $$ = (s) => document.querySelectorAll(s);
      const clamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const easeIO = (t) =>
        t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const easeOutC = (t) => 1 - Math.pow(1 - t, 3);
      const easeOutB = (t) => {
        const c = 1.70158;
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
      };
      const pop01 = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : easeOutB(t));
      const rand = (a, b) => a + Math.random() * (b - a);
      const ICON_PLAY =
        '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
      const ICON_PAUSE =
        '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 5h4v14H7zm6 0h4v14h-4z" fill="currentColor"/></svg>';
      const N = 8;
      const STEPS = [
        {
          dur: 7,
          html: 'Железная дорога — зона <span class="kw">повышенной опасности</span>!',
        },
        {
          dur: 8,
          html: 'Переходи только по <span class="kw">настилам, мостам и тоннелям</span>',
        },
        {
          dur: 8,
          html: '<span class="kw">Светофор, шлагбаум</span> и знак предупредят о поезде',
        },
        {
          dur: 8,
          html: 'Поезд не успеет затормозить: путь — <span class="kw">почти километр</span>',
        },
        {
          dur: 8,
          html: 'Прошёл один поезд? По соседнему пути — <span class="kw">второй</span>!',
        },
        {
          dur: 7,
          html: 'Контактная сеть под напряжением <span class="kw">27 000 вольт</span>!',
        },
        {
          dur: 8,
          html: '<span class="kw">Не лезь под вагоны</span>, не ходи по путям, <span class="kw">сними наушники</span>',
        },
        {
          dur: 9,
          html: 'Остановись, посмотри, слушай — <span class="kw">переходи быстро</span>!',
        },
      ];
      const CARDS = [
        { l: "Не ходи по путям", ic: "rails" },
        { l: "Не лезь под вагоны", ic: "wagon" },
        { l: "Наушники и телефон", ic: "headph" },
      ];
      const cv = $("#cv"),
        ctx = cv.getContext("2d"),
        frame = $("#frame");
      let W = 0,
        H = 0,
        DPR = 1,
        clock = 0,
        last = 0;
      let mode = "auto",
        playing = false,
        speed = 1,
        stepIndex = 0,
        stepT = 0,
        settingsOpen = false,
        v916 = false;
      let stars = [];
      const S = {
        t1: { on: false, x: 0 },
        t2: { on: false, x: 0 },
        cross: 0,
        sign: 0,
        light: 0,
        bar: 0,
        barQ: 0,
        lamp: "off",
        glow: 0,
        pulse: 0,
        volt: 0,
        gaugeA: 0,
        gaugeV: 0,
        distA: 0,
        distV: 0,
        cards: [0, 0, 0],
        dim: 0,
        danger: 0,
        check: 0,
        look: 0,
        lookA: 0,
        stop: 0,
        horn: 0,
        px: 0,
        py: 0,
        ps: 1,
        walk: 0,
        moving: false,
        dust: [],
        sparks: [],
        glints: [],
        dustAcc: 0,
        sparkAcc: 0,
        glintAcc: 0,
      };
      const L = {};
      function layout() {
        L.hz = H * 0.18;
        L.tF = H * 0.34;
        L.gF = H * 0.026;
        L.tN = H * 0.5;
        L.gN = H * 0.038;
        L.cx = W * 0.4;
        L.cw = Math.max(56, W * 0.17);
        L.top = H * 0.2;
        L.bot = H * 0.66;
        L.signX = L.cx + L.cw * 0.5 + W * 0.075;
        L.signY = H * 0.265;
        L.signB = H * 0.31;
        L.lightX = L.cx - L.cw * 0.5 - W * 0.055;
        L.lightB = H * 0.575;

        const s = clamp(S.light);

        ctx.save();
        ctx.translate(L.lightX, L.lightY);
        ctx.scale(s, s);
        ctx.strokeStyle = "#3A3A44";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, L.lightB - L.lightY);
        ctx.lineTo(0, 20);
        ctx.stroke();
        const w = Math.max(16, Math.min(W * 0.052, 26)),
          h = w * 1.9;
        rr(-w / 2, -h / 2, w, h, 5);
        ctx.fillStyle = "#1A1A20";
        ctx.fill();
        ctx.strokeStyle = "#33333D";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const blink = 0.45 + 0.55 * Math.abs(Math.sin(clock * 3.4));
        ctx.globalAlpha = s * (S.lamp === "red" ? blink : 1);
        ctx.beginPath();
        ctx.arc(0, -h * 0.22, w * 0.26, 0, 7);
        ctx.fillStyle = S.lamp === "red" ? "#E5484D" : "#3A2026";
        ctx.shadowColor = "#E5484D";
        ctx.shadowBlur = S.lamp === "red" ? 14 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = s;
        ctx.beginPath();
        ctx.arc(0, h * 0.22, w * 0.26, 0, 7);
        ctx.fillStyle = S.lamp === "green" ? "#2EAC65" : "#16321F";
        ctx.shadowColor = "#2EAC65";
        ctx.shadowBlur = S.lamp === "green" ? 14 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
      function drawBarrier() {
        const s = clamp(S.bar);
        if (s <= 0) return;
        ctx.save();
        ctx.globalAlpha = s;
        ctx.strokeStyle = "#3A3A44";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(L.barX, L.barB);
        ctx.lineTo(L.barX, L.barP);
        ctx.stroke();
        rr(L.barX - 8, L.barB - 3, 16, 6, 2);
        ctx.fillStyle = "#2A2A34";
        ctx.fill();
        ctx.save();
        ctx.translate(L.barX, L.barP);
        ctx.rotate((-70 * (1 - S.barQ) * Math.PI) / 180);
        const Lg = L.barL,
          segs = Math.ceil(Lg / 14);
        for (let i = 0; i < segs; i++) {
          ctx.fillStyle = i % 2 ? "#EFEFEF" : "#E5484D";
          ctx.fillRect(-14 * (i + 1), -3.5, Math.min(14, Lg - 14 * i), 7);
        }
        const closed = S.barQ > 0.5;
        ctx.beginPath();
        ctx.arc(-Lg, 0, 5, 0, 7);
        ctx.globalAlpha =
          s * (closed ? 0.45 + 0.55 * Math.abs(Math.sin(clock * 4)) : 1);
        ctx.fillStyle = closed ? "#FF5A5F" : "#7A2E32";
        ctx.shadowColor = "#E5484D";
        ctx.shadowBlur = closed ? 12 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
        ctx.restore();
      }
      function drawPerson() {
        const x = S.px,
          y = S.py,
          u = H * 0.082 * S.ps;
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.beginPath();
        ctx.ellipse(x, y + 2, u * 0.3, u * 0.075, 0, 0, 7);
        ctx.fill();
        const sw = S.moving ? Math.sin(S.walk * 9) : 0;
        ctx.strokeStyle = "#E6E6EC";
        ctx.lineCap = "round";
        ctx.lineWidth = u * 0.11;
        ctx.beginPath();
        ctx.moveTo(x, y - u * 0.4);
        ctx.lineTo(x + u * 0.18 * sw, y);
        ctx.moveTo(x, y - u * 0.4);
        ctx.lineTo(x - u * 0.18 * sw, y - u * 0.04 * Math.abs(sw));
        ctx.stroke();
        ctx.lineWidth = u * 0.09;
        ctx.beginPath();
        ctx.moveTo(x - u * 0.19, y - u * 0.76);
        ctx.lineTo(x - u * 0.26, y - u * 0.52 - u * 0.06 * sw);
        ctx.moveTo(x + u * 0.19, y - u * 0.76);
        ctx.lineTo(x + u * 0.26, y - u * 0.52 + u * 0.06 * sw);
        ctx.stroke();
        rr(x - u * 0.19, y - u * 0.86, u * 0.38, u * 0.48, u * 0.1);
        ctx.fillStyle = "#2EAC65";
        ctx.fill();
        ctx.strokeStyle = "#1E7A47";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y - u * 0.97, u * 0.13, 0, 7);
        ctx.fillStyle = "#E6E6EC";
        ctx.fill();
        ctx.restore();
      }
      function drawGauge() {
        const a = S.gaugeA;
        if (a <= 0) return;
        const x = L.gx,
          y = L.gy,
          r = L.r1;
        ctx.save();
        ctx.globalAlpha = clamp(a);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 7);
        ctx.fillStyle = "rgba(20,20,26,.88)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.1)";
        ctx.lineWidth = 1;
        ctx.stroke();
        const a0 = Math.PI * 0.75,
          a1 = Math.PI * 2.25;
        ctx.beginPath();
        ctx.arc(x, y, r * 0.78, a0, a1);
        ctx.strokeStyle = "#26262E";
        ctx.lineWidth = r * 0.16;
        ctx.lineCap = "round";
        ctx.stroke();
        const v = clamp(S.gaugeV / 100),
          av = a0 + (a1 - a0) * v;
        ctx.beginPath();
        ctx.arc(x, y, r * 0.78, a0, av);
        ctx.strokeStyle = v > 0.7 ? "#E5484D" : "#2EAC65";
        ctx.lineWidth = r * 0.16;
        ctx.shadowColor = "#2EAC65";
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(av) * r * 0.62, y + Math.sin(av) * r * 0.62);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, 7);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff";
        ctx.font = "800 " + Math.round(r * 0.42) + "px system-ui,sans-serif";
        ctx.fillText(Math.round(S.gaugeV), x, y + r * 0.55);
        ctx.fillStyle = "#A0A0A0";
        ctx.font = "700 " + Math.round(r * 0.2) + "px system-ui,sans-serif";
        ctx.fillText("км/ч", x, y + r * 0.8);
        ctx.restore();
      }
      function drawDist() {
        const a = S.distA;
        if (a <= 0) return;
        const x0 = L.distX0,
          x1 = L.distX1,
          y = L.distY,
          h = Math.max(10, H * 0.014);
        ctx.save();
        ctx.globalAlpha = clamp(a);
        ctx.fillStyle = "#A0A0A0";
        ctx.font = "700 " + Math.max(11, W * 0.03) + "px system-ui,sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("Тормозной путь", x0, y - h - 8);
        rr(x0, y - h / 2, x1 - x0, h, h / 2);
        ctx.fillStyle = "#1A1A20";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.12)";
        ctx.lineWidth = 1;
        ctx.stroke();
        const w = (x1 - x0 - 4) * S.distV;
        if (w > 2) {
          rr(x0 + 2, y - h / 2 + 2, w, h - 4, (h - 4) / 2);
          const g = ctx.createLinearGradient(x0, 0, x1, 0);
          g.addColorStop(0, "#E5484D");
          g.addColorStop(1, "#FF9A62");
          ctx.fillStyle = g;
          ctx.shadowColor = "#E5484D";
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = "#fff";
        ctx.font = "800 " + Math.max(12, W * 0.034) + "px system-ui,sans-serif";
        ctx.fillText("≈ " + Math.round(S.distV * 1000) + " м", x0, y + h + 18);
        ctx.restore();
      }
      function drawCards() {
        for (let i = 0; i < 3; i++) {
          const s = S.cards[i];
          if (s <= 0) continue;
          const cw = L.cardW,
            ch = cw * 0.3,
            cx = L.cardX,
            cy = L.cardY[i] * H;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(Math.max(0.01, s), Math.max(0.01, s));
          ctx.translate(-cx, -cy);
          ctx.globalAlpha = clamp(s);
          rr(cx - cw / 2, cy - ch / 2, cw, ch, 12);
          ctx.fillStyle = "rgba(20,20,26,.94)";
          ctx.fill();
          ctx.strokeStyle = "rgba(229,72,77,.55)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          const icr = ch * 0.3,
            ix = cx - cw / 2 + ch * 0.42,
            iy = cy;
          ctx.beginPath();
          ctx.arc(ix, iy, icr, 0, 7);
          ctx.strokeStyle = "#E5484D";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.strokeStyle = "#EFEFEF";
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          if (CARDS[i].ic === "rails") {
            ctx.beginPath();
            ctx.moveTo(ix - 5, iy - 7);
            ctx.lineTo(ix - 5, iy + 7);
            ctx.moveTo(ix + 5, iy - 7);
            ctx.lineTo(ix + 5, iy + 7);
            ctx.stroke();
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(ix - 8, iy - 2);
            ctx.lineTo(ix + 8, iy - 2);
            ctx.moveTo(ix - 8, iy + 3);
            ctx.lineTo(ix + 8, iy + 3);
            ctx.stroke();
          } else if (CARDS[i].ic === "wagon") {
            rr(ix - 8, iy - 6, 16, 8, 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(ix - 4, iy + 5, 2, 0, 7);
            ctx.fill();
            ctx.fillStyle = "#EFEFEF";
            ctx.beginPath();
            ctx.arc(ix + 4, iy + 5, 2, 0, 7);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(ix, iy - 1, 6, Math.PI, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ix - 6, iy - 1);
            ctx.lineTo(ix - 6, iy + 4);
            ctx.moveTo(ix + 6, iy - 1);
            ctx.lineTo(ix + 6, iy + 4);
            ctx.stroke();
          }
          ctx.strokeStyle = "#E5484D";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(ix - icr * 0.72, iy + icr * 0.72);
          ctx.lineTo(ix + icr * 0.72, iy - icr * 0.72);
          ctx.stroke();
          ctx.fillStyle = "#fff";
          ctx.font =
            "800 " + Math.max(12, ch * 0.24) + "px system-ui,sans-serif";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(CARDS[i].l, ix + icr + 10, cy);
          ctx.restore();
        }
      }
      function drawVolt() {
        const v = S.volt;
        if (v <= 0) return;
        ctx.save();
        ctx.globalAlpha = clamp(v);
        const x = L.voltX,
          y = L.voltY,
          fs = Math.max(14, Math.min(W * 0.052, 20));
        ctx.fillStyle = "#FFC94D";
        ctx.shadowColor = "#FFC94D";
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(x + 6, y - 14);
        ctx.lineTo(x - 2, y + 2);
        ctx.lineTo(x + 3, y + 2);
        ctx.lineTo(x - 1, y + 14);
        ctx.lineTo(x + 8, y - 2);
        ctx.lineTo(x + 3, y - 2);
        ctx.closePath();
        ctx.fill();
        ctx.font = "800 " + fs + "px system-ui,sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("27 000 В", x + 16, y + 6);
        ctx.restore();
      }
      function drawRings() {
        if (stepIndex !== 2) return;
        const p = Math.min(stepT / STEPS[2].dur, 1);
        const rings = [
          [L.lightX, L.lightY, W * 0.065, 0.1, 0.42],
          [L.barX, L.barP, W * 0.09, 0.44, 0.72],
          [L.signX, L.signY, W * 0.08, 0.72, 0.97],
        ];
        for (const rg of rings) {
          const t = (p - rg[3]) / (rg[4] - rg[3]);
          if (t <= 0 || t >= 1) continue;
          ctx.save();
          ctx.globalAlpha = Math.sin(Math.PI * t) * 0.85;
          ctx.strokeStyle = "#2EAC65";
          ctx.lineWidth = 2;
          ctx.shadowColor = "#2EAC65";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(rg[0], rg[1], rg[2] * (1 + 0.45 * t), 0, 7);
          ctx.stroke();
          ctx.restore();
        }
      }
      function drawLook() {
        if (stepIndex !== 7 || S.lookA <= 0 || !S.look) return;
        const u = H * 0.082 * S.ps,
          hy = S.py - u * 1.0;
        ctx.save();
        ctx.globalAlpha = clamp(S.lookA);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 8;
        for (let k = 0; k < 2; k++) {
          const off = u * (0.34 + k * 0.2);
          if (S.look === 1) {
            const x = S.px - off;
            ctx.beginPath();
            ctx.moveTo(x + 6, hy - 7);
            ctx.lineTo(x, hy);
            ctx.lineTo(x + 6, hy + 7);
            ctx.stroke();
          } else {
            const x = S.px + off;
            ctx.beginPath();
            ctx.moveTo(x - 6, hy - 7);
            ctx.lineTo(x, hy);
            ctx.lineTo(x - 6, hy + 7);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
      function drawStop() {
        if (S.stop <= 0) return;
        const u = H * 0.082 * S.ps,
          x = S.px,
          y = S.py - u * 1.1 - 12;
        ctx.save();
        ctx.globalAlpha = clamp(S.stop);
        ctx.shadowColor = "#E5484D";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#E5484D";
        ctx.beginPath();
        ctx.moveTo(x, y - 11);
        ctx.lineTo(x + 11, y + 8);
        ctx.lineTo(x - 11, y + 8);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff";
        ctx.font = "800 13px system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("!", x, y + 5);
        ctx.restore();
      }
      function drawHorn() {
        if (S.horn <= 0 || !S.t2.on) return;
        const fx = S.t2.x,
          hy = L.tN - H * 0.045;
        ctx.save();
        ctx.globalAlpha = clamp(S.horn) * 0.8;
        ctx.strokeStyle = "#FFD98A";
        ctx.lineWidth = 2;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(fx - 6, hy, i * 9, Math.PI - 0.9, Math.PI + 0.9);
          ctx.stroke();
        }
        ctx.restore();
      }
      function drawCheck() {
        const s = S.check;
        if (s <= 0) return;
        const x = L.cx,
          y = L.checkY,
          r = Math.min(W, H) * 0.06;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(Math.max(0.01, s), Math.max(0.01, s));
        ctx.globalAlpha = clamp(s);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, 7);
        ctx.fillStyle = "rgba(46,172,101,.16)";
        ctx.fill();
        ctx.strokeStyle = "#2EAC65";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#2EAC65";
        ctx.shadowBlur = 22;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-r * 0.38, 0);
        ctx.lineTo(-r * 0.1, r * 0.3);
        ctx.lineTo(r * 0.42, -r * 0.28);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = r * 0.16;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.font =
          "800 " +
          Math.max(15, Math.min(W * 0.058, 22)) +
          "px system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#2EAC65";
        ctx.shadowColor = "#2EAC65";
        ctx.shadowBlur = 14;
        ctx.fillText("Безопасно!", 0, r + 24);
        ctx.restore();
      }
      function drawPulse() {
        if (S.pulse <= 0) return;
        const a = 0.05 + 0.07 * S.pulse;
        for (const ty of [L.tF, L.tN]) {
          const g = ty === L.tF ? L.gF : L.gN;
          const gr = ctx.createLinearGradient(0, ty - g * 1.5, 0, ty + g * 1.5);
          gr.addColorStop(0, "rgba(229,72,77,0)");
          gr.addColorStop(0.5, "rgba(229,72,77," + a + ")");
          gr.addColorStop(1, "rgba(229,72,77,0)");
          ctx.fillStyle = gr;
          ctx.fillRect(0, ty - g * 1.5, W, g * 3);
        }
      }
      function drawDangerV() {
        if (S.danger <= 0) return;
        const a = 0.14 * S.danger;
        const g = ctx.createRadialGradient(
          W / 2,
          H / 2,
          Math.min(W, H) * 0.35,
          W / 2,
          H / 2,
          Math.max(W, H) * 0.75,
        );
        g.addColorStop(0, "rgba(229,72,77,0)");
        g.addColorStop(1, "rgba(229,72,77," + a + ")");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      function drawParticles() {
        for (const d of S.dust) {
          ctx.globalAlpha = Math.min(0.38, d.life * 0.45);
          ctx.fillStyle = "#9C948A";
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, 7);
          ctx.fill();
        }
        for (const s of S.sparks) {
          ctx.save();
          ctx.globalAlpha = clamp(s.life / s.max);
          ctx.strokeStyle = "#FFE28A";
          ctx.lineWidth = 1.8;
          ctx.shadowColor = "#FFC94D";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          let px = s.x,
            py = s.y;
          ctx.moveTo(px, py);
          for (let k = 0; k < 3; k++) {
            px += rand(-4, 4);
            py += rand(4, 8);
            ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.restore();
        }
        for (const g of S.glints) {
          ctx.save();
          ctx.globalAlpha = clamp(g.life / g.max);
          ctx.strokeStyle = "#7FE0A8";
          ctx.lineWidth = 1.6;
          ctx.shadowColor = "#2EAC65";
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(g.x - g.size, g.y);
          ctx.lineTo(g.x + g.size, g.y);
          ctx.moveTo(g.x, g.y - g.size);
          ctx.lineTo(g.x, g.y + g.size);
          ctx.stroke();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }
      function drawVignette() {
        const g = ctx.createRadialGradient(
          W / 2,
          H / 2,
          Math.min(W, H) * 0.42,
          W / 2,
          H / 2,
          Math.max(W, H) * 0.78,
        );
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(1, "rgba(0,0,0,.42)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        drawSky();
        ctx.fillStyle = "#0E0E12";
        ctx.fillRect(0, L.hz, W, H - L.hz);
        drawPoles();
        drawTrack(L.tF, L.gF);
        drawTrack(L.tN, L.gN);
        drawCrossing();
        if (S.t1.on) drawTrain(S.t1.x, L.tF, L.gF, H * 0.065, W * 0.6, 1);
        if (S.t2.on) drawTrain(S.t2.x, L.tN, L.gN, H * 0.075, W * 0.52, -1);
        drawPulse();
        drawSign();
        drawLight();
        drawBarrier();
        drawPerson();
        drawGauge();
        drawDist();
        drawCards();
        drawVolt();
        drawRings();
        drawLook();
        drawStop();
        drawHorn();
        drawCheck();
        drawParticles();
        drawDangerV();
        if (S.dim > 0) {
          ctx.fillStyle = "rgba(0,0,0," + S.dim + ")";
          ctx.fillRect(0, 0, W, H);
        }
        drawVignette();
      }
      function loop(ts) {
        const dt = Math.min((ts - last) / 1000 || 0, 0.05);
        last = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      function bind() {
        const ro = new ResizeObserver(resize);
        ro.observe(frame);
        window.addEventListener("resize", resize);
        $$(".js-play").forEach((b) =>
          b.addEventListener("click", () => {
            setPlaying(!playing);
            b.blur();
          }),
        );
        $$(".js-gear").forEach((b) =>
          b.addEventListener("click", () => {
            settingsOpen ? closeSettings() : openSettings();
            b.blur();
          }),
        );
        $("#mClose").addEventListener("click", closeSettings);
        $("#modalWrap").addEventListener("click", (e) => {
          if (e.target.id === "modalWrap") closeSettings();
        });
        $("#mAuto").addEventListener("click", () => setMode("auto"));
        $("#mStepBtn").addEventListener("click", () => setMode("step"));
        $("#mNext").addEventListener("click", () =>
          onStep((stepIndex + 1) % N),
        );
        $("#mSpeed").addEventListener("input", (e) => {
          speed = +e.target.value;
          $("#mSpeedVal").textContent = speed + "x";
        });
        $("#mSpeed").addEventListener("change", (e) => e.target.blur());
        $("#mNine").addEventListener("change", (e) => {
          if (e.target.checked !== v916) toggleVideoMode();
        });
        $("#mReset").addEventListener("click", reset);
        document.addEventListener("keydown", handleInput);
      }
      function init() {
        buildStars();
        bind();
        resize();
        onStep(0);
        setMode("auto");
        setPlaying(false);
        requestAnimationFrame(loop);
        setTimeout(startAuto, 500);
      }
      init();
    </script>
  </body>
