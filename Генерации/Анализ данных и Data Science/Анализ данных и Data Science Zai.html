<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      user-scalable="no"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Анализ данных и Data Science</title>
    <style>
      :root {
        --bg: #0f0f13;
        --panel: #1a1a20;
        --accent: #2eac65;
        --accent-dark: #1e7a47;
        --text: #ffffff;
        --muted: #a0a0a0;
        --accent-soft: rgba(46, 172, 101, 0.14);
        --accent-hover: rgba(46, 172, 101, 0.26);
        --accent-border: rgba(46, 172, 101, 0.5);
        --white-06: rgba(255, 255, 255, 0.06);
        --white-08: rgba(255, 255, 255, 0.08);
        --white-10: rgba(255, 255, 255, 0.1);
        --white-12: rgba(255, 255, 255, 0.12);
        --white-14: rgba(255, 255, 255, 0.14);
        --sub-bg: #00000080;
        --sub-blur: 8px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      .app {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding-top: calc(16px + env(safe-area-inset-top));
        padding-right: calc(80px + env(safe-area-inset-right));
        padding-bottom: calc(25vh + env(safe-area-inset-bottom));
        padding-left: calc(16px + env(safe-area-inset-left));
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      .title {
        margin: 0 0 12px 0;
        min-width: 0;
      }
      .title h1 {
        margin: 0;
        font-size: clamp(21px, 3.4vw, 34px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--text);
      }
      .title-bar {
        display: block;
        width: 56px;
        height: 3px;
        border-radius: 2px;
        margin-top: 8px;
        background: linear-gradient(90deg, var(--accent), var(--accent-dark));
        box-shadow: 0 0 12px rgba(46, 172, 101, 0.55);
      }
      .stage {
        position: relative;
        flex: 1;
        min-height: 110px;
        overflow: hidden;
        border-radius: 18px;
        margin-bottom: 16px;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .sidebar {
        display: none;
      }
      .subtitle {
        background: var(--sub-bg);
        -webkit-backdrop-filter: blur(var(--sub-blur));
        backdrop-filter: blur(var(--sub-blur));
        border: 1px solid var(--white-12);
        border-radius: 14px;
        padding: 12px 16px;
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.35;
        font-weight: 500;
        min-height: 3.4em;
        display: flex;
        align-items: center;
        margin: 0 0 24px 0;
        color: var(--text);
      }
      .subtitle__keyword {
        color: var(--accent);
        font-weight: 800;
      }
      .subtitle-text {
        display: block;
      }
      .subtitle.in {
        animation: subIn 0.45s ease both;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .panel {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: rgba(26, 26, 32, 0.72);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid var(--white-12);
        border-radius: 16px;
        padding: 8px 10px;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }
      .panel-spacer {
        flex: 1;
      }
      body.controls-hidden .panel {
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
      }
      .btn {
        appearance: none;
        border: none;
        background: none;
        color: var(--text);
        font: inherit;
        cursor: pointer;
        padding: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 10px;
      }
      .icon-btn {
        width: 48px;
        height: 48px;
        min-width: 48px;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: var(--white-06);
        border: 1px solid var(--white-12);
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.1s ease;
      }
      .icon-btn:hover {
        background: var(--white-10);
        border-color: rgba(255, 255, 255, 0.22);
      }
      .icon-btn:active {
        transform: scale(0.95);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
        pointer-events: none;
      }
      .icon-btn svg {
        width: 22px;
        height: 22px;
        fill: var(--text);
        pointer-events: none;
      }
      .accent-btn {
        background: var(--accent-soft);
        border-color: var(--accent-border);
      }
      .accent-btn:hover {
        background: var(--accent-hover);
        border-color: var(--accent);
      }
      .accent-btn svg {
        fill: var(--accent);
      }
      .vframe {
        position: absolute;
        z-index: 3;
        border: 1.5px solid rgba(46, 172, 101, 0.45);
        border-radius: 22px;
        box-shadow:
          0 0 0 1px rgba(46, 172, 101, 0.16),
          0 0 34px rgba(46, 172, 101, 0.16),
          inset 0 0 30px rgba(15, 15, 19, 0.35);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 14px;
      }
      .vframe .subtitle {
        font-size: clamp(16px, 4.5vw, 22px);
      }
      .vframe .panel {
        width: 100%;
      }
      body.video-mode .sidebar {
        display: none;
      }
      @media (min-width: 768px) {
        .app {
          display: grid;
          grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
          grid-template-rows: auto minmax(0, 1fr) auto;
          grid-template-areas: "title side" "stage side" "panel side";
          column-gap: 20px;
          padding-top: calc(20px + env(safe-area-inset-top));
          padding-right: calc(24px + env(safe-area-inset-right));
          padding-bottom: calc(24px + env(safe-area-inset-bottom));
          padding-left: calc(24px + env(safe-area-inset-left));
        }
        .title {
          grid-area: title;
        }
        .stage {
          grid-area: stage;
          margin-bottom: 16px;
        }
        .panel {
          grid-area: panel;
          width: auto;
          justify-self: start;
          min-width: 150px;
        }
        .sidebar {
          display: block;
          grid-area: side;
          border-left: 1px solid var(--white-08);
          padding: 6px 4px 8px 20px;
          min-height: 0;
        }
        .subtitle {
          grid-area: side;
          align-self: start;
          justify-self: stretch;
          font-size: clamp(15px, 1.3vw, 18px);
          margin: 14px 6px 0 20px;
        }
        body.video-mode .app {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
          grid-template-areas: "title" "stage";
        }
        body.video-mode .panel {
          width: 100%;
        }
      }
      .modal-wrap {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        transition: opacity 0.22s ease;
      }
      .modal {
        position: relative;
        width: min(420px, 94vw);
        max-height: 90vh;
        max-height: 90dvh;
        display: flex;
        flex-direction: column;
        background: rgba(26, 26, 32, 0.94);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid var(--white-12);
        border-radius: 20px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(46, 172, 101, 0.12),
          0 0 40px rgba(46, 172, 101, 0.08);
        opacity: 0;
        transform: scale(0.95);
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }
      .modal-wrap.open .modal {
        opacity: 1;
        transform: scale(1);
      }
      .modal-wrap.open .modal-scrim {
        opacity: 1;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--white-08);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
      }
      .modal-body {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 16px 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .step-indicator {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--white-10);
        border-radius: 12px;
        padding: 10px 14px;
      }
      .step-indicator-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .step-indicator-value {
        font-weight: 800;
        color: var(--accent);
        font-size: 15px;
        white-space: nowrap;
      }
      .set-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .set-row-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .set-label {
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }
      .segmented {
        display: flex;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--white-10);
        border-radius: 12px;
        padding: 3px;
        gap: 3px;
      }
      .seg-btn {
        min-width: 64px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 9px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .seg-btn:hover {
        color: var(--text);
      }
      .seg-btn[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent-border);
      }
      .next-btn {
        width: 100%;
        min-height: 48px;
        border-radius: 14px;
        border: 1px solid var(--accent-border);
        background: var(--accent-soft);
        color: var(--accent);
        font-family: inherit;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          opacity 0.2s ease;
      }
      .next-btn:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .next-btn:active:not(:disabled) {
        transform: scale(0.99);
      }
      .next-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .reset-btn {
        width: 100%;
        min-height: 44px;
        border-radius: 14px;
        border: 1px solid var(--white-14);
        background: var(--white-06);
        color: var(--text);
        font-family: inherit;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .reset-btn:hover {
        background: var(--white-10);
        border-color: rgba(255, 255, 255, 0.28);
      }
      .switch {
        width: 52px;
        height: 30px;
        min-width: 52px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--white-14);
        position: relative;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }
      .switch .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          left 0.2s ease,
          background 0.2s ease;
      }
      .switch[aria-checked="true"] {
        background: var(--accent-soft);
        border-color: var(--accent-border);
      }
      .switch[aria-checked="true"] .knob {
        left: 25px;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(46, 172, 101, 0.5);
      }
      .hotkeys h3 {
        margin: 4px 0 8px;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .hk-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 0;
        font-size: 13px;
        color: var(--muted);
      }
      .hk-row kbd {
        background: var(--white-08);
        border: 1px solid var(--white-14);
        border-bottom-width: 2px;
        border-radius: 6px;
        padding: 2px 8px;
        font:
          600 12px system-ui,
          sans-serif;
        color: var(--text);
        min-width: 34px;
        text-align: center;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="title" id="title">
        <h1>Анализ данных и Data Science</h1>
        <span class="title-bar"></span>
      </header>
      <div class="stage" id="stage">
        <canvas id="scene"></canvas>
        <div class="vframe" id="vframe" hidden></div>
      </div>
      <div class="sidebar" id="sidebar"></div>
      <div class="subtitle" id="subtitle" aria-live="polite"></div>
      <div class="panel" id="panel">
        <button
          class="btn icon-btn accent-btn"
          id="playBtn"
          aria-label="Воспроизвести"
        >
          <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
          </svg>
        </button>
        <div class="panel-spacer"></div>
        <button
          class="btn icon-btn"
          id="gearBtn"
          aria-label="Настройки"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
            />
          </svg>
        </button>
      </div>
      <div class="modal-wrap" id="modalWrap" hidden>
        <div class="modal-scrim" id="modalScrim"></div>
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >
          <div class="modal-head">
            <h2 id="modalTitle">Настройки</h2>
            <button
              class="btn icon-btn"
              id="closeBtn"
              aria-label="Закрыть настройки"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M6 6l12 12M18 6L6 18"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="step-indicator">
              <span class="step-indicator-label"
                >Прогресс последовательности</span
              >
              <span class="step-indicator-value" id="stepIndicator"
                >Шаг 1 / 8</span
              >
            </div>
            <div class="set-row">
              <span class="set-label">Режим</span>
              <div class="segmented" id="modeSeg">
                <button class="seg-btn" id="modeBtnAuto" aria-pressed="true">
                  AUTO
                </button>
                <button class="seg-btn" id="modeBtnStep" aria-pressed="false">
                  STEP
                </button>
              </div>
            </div>
            <button class="next-btn" id="nextBtn" disabled>
              Следующий шаг ▶
            </button>
            <div class="set-row">
              <span class="set-label">Скорость</span>
              <div class="segmented" id="speedSeg">
                <button class="seg-btn" data-speed="0.5" aria-pressed="false">
                  0.5×
                </button>
                <button class="seg-btn" data-speed="1" aria-pressed="true">
                  1×
                </button>
                <button class="seg-btn" data-speed="2" aria-pressed="false">
                  2×
                </button>
              </div>
            </div>
            <div class="set-row">
              <span class="set-label">Вертикальная рамка 9:16</span>
              <button
                class="switch"
                id="videoSwitch"
                role="switch"
                aria-checked="false"
                aria-label="Режим вертикальной рамки 9:16"
              >
                <span class="knob"></span>
              </button>
            </div>
            <button class="reset-btn" id="resetBtn">Reset</button>
            <div class="hotkeys">
              <h3>Горячие клавиши</h3>
              <div class="hk-row">
                <kbd>Space</kbd><span>скрыть или показать управление</span>
              </div>
              <div class="hk-row">
                <kbd>→</kbd><span>следующий шаг в режиме STEP</span>
              </div>
              <div class="hk-row">
                <kbd>S</kbd><span>переключить AUTO и STEP</span>
              </div>
              <div class="hk-row">
                <kbd>V</kbd><span>вертикальная рамка 9:16</span>
              </div>
              <div class="hk-row">
                <kbd>R</kbd><span>сброс воспроизведения</span>
              </div>
              <div class="hk-row">
                <kbd>Esc</kbd><span>закрыть настройки</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var TAU = Math.PI * 2;
        var TOTAL_STEPS = 8;
        var STEP_NAMES = [
          "Данные",
          "Очистка",
          "Распределение",
          "Меры центра",
          "Корреляция",
          "Модель",
          "Оценка",
          "Вывод",
        ];
        var PIPE_NAMES = ["Данные", "Очистка", "Анализ", "Модель", "Вывод"];
        var DWELL = 4.4;
        var TRANS = 1.1;
        var START_DELAY = 500;
        var SUBTITLES = [
          {
            step: 1,
            segments: [
              { text: "Наблюдения и " },
              { text: "признаки", emphasis: true },
              { text: " образуют набор данных" },
            ],
          },
          {
            step: 2,
            segments: [
              { text: "Очистка", emphasis: true },
              { text: " удаляет пропуски, дубликаты и выбросы" },
            ],
          },
          {
            step: 3,
            segments: [
              { text: "Распределение", emphasis: true },
              { text: " показывает, как часто встречаются значения" },
            ],
          },
          {
            step: 4,
            segments: [
              { text: "Среднее, медиана и дисперсия", emphasis: true },
              { text: " описывают данные" },
            ],
          },
          {
            step: 5,
            segments: [
              { text: "Корреляция", emphasis: true },
              { text: " измеряет силу связи между признаками" },
            ],
          },
          {
            step: 6,
            segments: [
              { text: "Модель", emphasis: true },
              { text: " обучается находить " },
              { text: "закономерность", emphasis: true },
              { text: " по обучающей выборке" },
            ],
          },
          {
            step: 7,
            segments: [
              { text: "Метрики проверяют качество на " },
              { text: "тестовых данных", emphasis: true },
            ],
          },
          {
            step: 8,
            segments: [
              { text: "Корреляция не равна " },
              { text: "причинности", emphasis: true },
              { text: ": выводы требуют проверок" },
            ],
          },
        ];
        function clamp(v, a, b) {
          return Math.min(b, Math.max(a, v));
        }
        function clamp01(v) {
          return clamp(v, 0, 1);
        }

          els.subtitle.textContent = "";
          var inner = document.createElement("div");
          inner.className = "subtitle-text";
          for (var i = 0; i < sub.segments.length; i++) {
            var seg = sub.segments[i];
            var span = document.createElement("span");
            if (seg.emphasis) span.className = "subtitle__keyword";
            span.textContent = seg.text;
            inner.appendChild(span);
          }
          els.subtitle.appendChild(inner);
          els.subtitle.classList.remove("in");
          void els.subtitle.offsetWidth;
          els.subtitle.classList.add("in");
          if (state.videoMode)
            requestAnimationFrame(function () {
              resize();
            });
        }
        function setHidden(el, v) {
          if (v) el.setAttribute("hidden", "");
          else el.removeAttribute("hidden");
        }
        function renderControls() {
          setHidden(els.iconPlay, state.playing);
          setHidden(els.iconPause, !state.playing);
          els.playBtn.setAttribute(
            "aria-label",
            state.playing ? "Пауза" : "Воспроизвести",
          );
          els.modeBtnAuto.setAttribute(
            "aria-pressed",
            state.mode === "auto" ? "true" : "false",
          );
          els.modeBtnStep.setAttribute(
            "aria-pressed",
            state.mode === "step" ? "true" : "false",
          );
          els.nextBtn.disabled = !(
            state.mode === "step" &&
            !state.transitioning &&
            state.currentStep < TOTAL_STEPS
          );
          var speedBtns = els.speedSeg.querySelectorAll("[data-speed]");
          for (var i = 0; i < speedBtns.length; i++) {
            speedBtns[i].setAttribute(
              "aria-pressed",
              parseFloat(speedBtns[i].getAttribute("data-speed")) ===
                state.speed
                ? "true"
                : "false",
            );
          }
          els.videoSwitch.setAttribute(
            "aria-checked",
            state.videoMode ? "true" : "false",
          );
          els.stepIndicator.textContent =
            "Шаг " + state.currentStep + " / " + TOTAL_STEPS;
        }
        function openSettings() {
          if (state.settingsOpen) return;
          state.settingsOpen = true;
          els.modalWrap.hidden = false;
          requestAnimationFrame(function () {
            els.modalWrap.classList.add("open");
          });
          els.gearBtn.setAttribute("aria-expanded", "true");
          renderControls();
          els.closeBtn.focus();
        }
        function closeSettings() {
          if (!state.settingsOpen) return;
          state.settingsOpen = false;
          els.modalWrap.classList.remove("open");
          els.gearBtn.setAttribute("aria-expanded", "false");
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(function () {
            els.modalWrap.hidden = true;
          }, 240);
          els.gearBtn.focus();
        }
        function handleInput(e) {
          var t = e.target;
          if (
            t &&
            (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))
          )
            return;
          if (e.key === "Escape") {
            if (state.settingsOpen) {
              closeSettings();
              e.preventDefault();
            }
            return;
          }
          if (state.settingsOpen) return;
          switch (e.key) {
            case " ":
            case "Spacebar":
              toggleControls();
              e.preventDefault();
              break;
            case "ArrowRight":
              if (state.mode === "step") onStep();
              e.preventDefault();
              break;
            case "r":
            case "R":
            case "к":
            case "К":
              reset();
              break;
            case "s":
            case "S":
            case "ы":
            case "Ы":
              setMode(state.mode === "auto" ? "step" : "auto");
              break;
            case "v":
            case "V":
            case "м":
            case "М":
              toggleVideoMode();
              break;
          }
        }
        function init() {
          els.app = q("app");
          els.stage = q("stage");
          els.sidebar = q("sidebar");
          els.vframe = q("vframe");
          els.subtitle = q("subtitle");
          els.panel = q("panel");
          els.playBtn = q("playBtn");
          els.gearBtn = q("gearBtn");
          els.iconPlay = q("iconPlay");
          els.iconPause = q("iconPause");
          els.modalWrap = q("modalWrap");
          els.modalScrim = q("modalScrim");
          els.closeBtn = q("closeBtn");
          els.stepIndicator = q("stepIndicator");
          els.modeBtnAuto = q("modeBtnAuto");
          els.modeBtnStep = q("modeBtnStep");
          els.nextBtn = q("nextBtn");
          els.speedSeg = q("speedSeg");
          els.videoSwitch = q("videoSwitch");
          els.resetBtn = q("resetBtn");
          canvas = q("scene");
          ctx = canvas.getContext("2d");
          if (!ctx) throw new Error("canvas context unavailable");
          els.playBtn.addEventListener("click", function () {
            setPlaying(!state.playing);
          });
          els.gearBtn.addEventListener("click", function () {
            if (state.settingsOpen) closeSettings();
            else openSettings();
          });
          els.closeBtn.addEventListener("click", closeSettings);
          els.modalScrim.addEventListener("click", closeSettings);
          els.modeBtnAuto.addEventListener("click", function () {
            setMode("auto");
          });
          els.modeBtnStep.addEventListener("click", function () {
            setMode("step");
          });
          els.nextBtn.addEventListener("click", onStep);
          els.videoSwitch.addEventListener("click", toggleVideoMode);
          els.resetBtn.addEventListener("click", reset);
          var speedBtns = els.speedSeg.querySelectorAll("[data-speed]");
          for (var i = 0; i < speedBtns.length; i++) {
            (function (btn) {
              btn.addEventListener("click", function () {
                setSpeed(parseFloat(btn.getAttribute("data-speed")));
              });
            })(speedBtns[i]);
          }
          window.addEventListener("keydown", handleInput);
          var resizeScheduled = false;
          var scheduleResize = function () {
            if (resizeScheduled) return;
            resizeScheduled = true;
            requestAnimationFrame(function () {
              resizeScheduled = false;
              resize();
            });
          };
          if (typeof ResizeObserver !== "undefined") {
            new ResizeObserver(scheduleResize).observe(els.stage);
          }
          window.addEventListener("resize", scheduleResize);
          resize();
          captureTargets();
          updateSubtitles(1);
          renderControls();
          requestAnimationFrame(loop);
          setTimeout(function () {
            state.playing = true;
            renderControls();
          }, START_DELAY);
        }
        var lastT = 0;
        function loop(now) {
          var dt = lastT ? (now - lastT) / 1000 : 0;
          lastT = now;
          if (dt > 0.1) dt = 0.1;
          update(dt);
          draw(now / 1000);
          requestAnimationFrame(loop);
        }
        try {
          init();
        } catch (err) {
          if (window.console && console.error)
            console.error("Init failed:", err);
          var subEl = document.getElementById("subtitle");
          if (subEl) {
            subEl.textContent =
              "Не удалось инициализировать визуализацию. Обновите страницу.";
          }
        }
      })();
    </script>
  </body>
</html>
