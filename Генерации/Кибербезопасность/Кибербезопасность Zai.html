<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      user-scalable="no"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Кибербезопасность</title>
    <style>
      :root {
        --ui-bg: #0f0f13;
        --ui-bg-gradient: #111118;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #cfcfcf;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-halo: rgba(46, 172, 101, 0.14);
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-ambient-blur: 90px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--ui-bg);
        color: var(--ui-text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      button {
        font-family: inherit;
        color: var(--ui-text);
      }
      :focus-visible {
        outline: 2px solid var(--ui-accent);
        outline-offset: 2px;
      }
      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
        overflow: hidden;
      }
      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }
      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: rgba(46, 172, 101, 0.34);
        animation: drift 9s ease-in-out infinite alternate;
      }
      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: rgba(30, 122, 71, 0.3);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: rgba(20, 80, 45, 0.38);
        animation: drift 13s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }
      body.v916 #ambient {
        opacity: 1;
      }
      @media (max-width: 767.98px) {
        #ambient {
          right: calc(80px + env(safe-area-inset-right, 0px));
        }
      }
      #app {
        position: relative;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-columns: 100%;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        grid-template-areas: "title" "stage" "sub" "panel";
        gap: 12px 0;
        padding-top: calc(16px + env(safe-area-inset-top, 0px));
        padding-right: calc(80px + env(safe-area-inset-right, 0px));
        padding-bottom: calc(25vh + env(safe-area-inset-bottom, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
      }
      #title {
        grid-area: title;
        min-width: 0;
      }
      #title h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 30px);
        font-weight: 800;
        letter-spacing: 0.3px;
        text-shadow: 0 0 24px var(--ui-accent-halo);
      }
      #stage {
        grid-area: stage;
        position: relative;
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: center;
      }
      #vframe {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 16px;
        background: var(--ui-bg-gradient);
        border: 1px solid var(--ui-white-08);
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }
      body.v916 #vframe {
        position: relative;
        inset: auto;
        border-radius: 24px;
        border: 1px solid var(--ui-accent-border);
        box-shadow:
          0 0 60px var(--ui-accent-halo),
          0 24px 80px rgba(0, 0, 0, 0.5);
        background: var(--ui-bg);
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #frameDock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 0 14px 14px;
        pointer-events: none;
      }
      body.v916 #frameDock {
        display: flex;
      }
      #frameDock > * {
        pointer-events: auto;
      }
      #subSlotA {
        grid-area: sub;
        display: block;
        margin-bottom: 12px;
        min-width: 0;
      }
      #subSlotB {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      #sidebar {
        grid-area: side;
        display: none;
        flex-direction: column;
        justify-content: center;
        border-left: 1px solid var(--ui-white-08);
        background: var(--ui-panel);
        border-radius: 16px;
        padding: 20px;
        min-width: 0;
        overflow: hidden;
      }
      .subtitle {
        width: 100%;
        max-width: 560px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: calc(2.7em + 22px);
        padding: 11px 16px;
        background: rgba(0, 0, 0, 0.5);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--ui-white-10);
        border-radius: 16px;
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.35;
        font-weight: 700;
        color: var(--ui-text);
      }
      #subtitleText {
        overflow-wrap: break-word;
      }
      .subtitle__keyword {
        color: var(--ui-accent);
        font-weight: 800;
      }
      .subtitle.show {
        animation: subIn 0.3s ease-out both;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #panel {
        grid-area: panel;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 56px;
        padding: 4px;
        transition:
          opacity 0.25s,
          visibility 0.25s;
      }
      #gearBtn {
        position: relative;
        z-index: 25;
      }
      body.v916 #panel {
        background: var(--ui-panel-glass);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--ui-white-08);
        border-radius: 999px;
        padding: 6px 12px;
      }
      body.controls-hidden #panel {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .ctlbtn {
        width: 52px;
        height: 52px;
        min-width: 48px;
        min-height: 48px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s;
      }
      .ctlbtn:hover {
        background: var(--ui-accent-soft);
        border-color: var(--ui-accent-border);
      }
      .ctlbtn:active {
        transform: scale(0.95);
      }
      .ctlbtn svg {
        width: 22px;
        height: 22px;
      }
      #playBtn .ic-play {
        display: none;
      }
      #playBtn:not(.playing) .ic-pause {
        display: none;
      }
      #playBtn:not(.playing) .ic-play {
        display: block;
      }
      #scrim {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        background: var(--ui-modal-scrim);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }
      body.modal-open #scrim {
        display: block;
      }
      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 32;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      #modalWrap.open {
        display: flex;
      }
      @media (max-width: 767.98px) {
        #modalWrap {
          padding-right: calc(80px + env(safe-area-inset-right, 0px));
        }
      }
      @media (max-width: 767.98px) and (min-height: 820px) {
        #modalWrap {
          padding-bottom: calc(25vh + env(safe-area-inset-bottom, 0px) + 76px);
        }
      }
      #modal {
        width: min(92vw, 380px);
        max-height: 90vh;
        max-height: 90dvh;
        overflow: auto;
        pointer-events: auto;
        background: var(--ui-modal-bg);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        outline: none;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      #modalWrap.closing #modal {
        animation: popOut 0.2s ease-in both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes popOut {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      #modal button {
        cursor: pointer;
      }
      .modal-close {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .mhead h2 {
        margin: 0;
        font-size: clamp(18px, 4.6vw, 19px);
        font-weight: 800;
      }
      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        min-height: 48px;
        border-radius: 12px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }
      .speedseg {
        display: flex;
        flex: 1.4;
        gap: 6px;
      }
      .speedseg button {
        flex: 1;
        min-height: 48px;
        border-radius: 12px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font-size: 13px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .speedseg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 48px;
      }
      .sw input {
        position: absolute;
        inset: 0;
        width: 52px;
        height: 48px;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .sw span {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 30px;
        transform: translateY(-50%);
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }
      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }
      .sw input:checked + span {
        background: var(--ui-accent);
      }
      .sw input:checked + span::before {
        transform: translateX(22px);
      }
      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      #mReset {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;
      }
      #mReset:hover {
        border-color: rgba(229, 72, 77, 0.6);
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }
      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }
      .keys i {
        font-style: normal;
      }
      body.modal-open {
        overflow: hidden;
      }
      #fatal {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--ui-muted);
        font-size: 15px;
        font-weight: 700;
        padding: 20px;
      }
      @media (min-width: 768px) {
        #app {
          grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
          grid-template-rows: auto minmax(0, 1fr) auto;
          grid-template-areas: "title side" "stage side" "panel side";
          gap: 16px;
          padding-top: calc(20px + env(safe-area-inset-top, 0px));
          padding-right: calc(20px + env(safe-area-inset-right, 0px));
          padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
          padding-left: calc(20px + env(safe-area-inset-left, 0px));
        }
        #subSlotA {
          display: none;
        }
        #sidebar {
          display: flex;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #ambient i {
          animation: none;
        }
        #modal {
          animation: none;
        }
        #modalWrap.closing #modal {
          animation: none;
        }
        .subtitle.show {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i>
    </div>
    <main id="app">
      <header id="title"><h1>Кибербезопасность</h1></header>
      <div id="stage">
        <div id="vframe">
          <canvas
            id="scene"
            role="img"
            aria-label="Визуализация темы кибербезопасности"
          ></canvas>
          <div id="frameDock"></div>
        </div>
      </div>
      <div id="subSlotA"></div>
      <div id="panel">
        <button id="playBtn" class="ctlbtn" type="button" aria-label="Пауза">
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor" />
          </svg>
          <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5l11 7-11 7z" fill="currentColor" />
          </svg>
        </button>
        <button
          id="gearBtn"
          class="ctlbtn"
          type="button"
          aria-label="Настройки"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6zm8.9 3.8c0-.62-.06-1.22-.17-1.8l2.13-1.66-2.1-3.64-2.52 1.02a8.9 8.9 0 0 0-3.12-1.8L14.66 1.2h-4.2l-.45 3.4a8.9 8.9 0 0 0-3.12 1.8L4.37 5.38l-2.1 3.64 2.13 1.66a9.1 9.1 0 0 0 0 3.6l-2.13 1.66 2.1 3.64 2.52-1.02a8.9 8.9 0 0 0 3.12 1.8l.45 3.4h4.2l.45-3.4a8.9 8.9 0 0 0 3.12-1.8l2.52 1.02 2.1-3.64-2.13-1.66c.11-.58.17-1.18.17-1.8z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
      <aside id="sidebar"><div id="subSlotB"></div></aside>
    </main>

    <div id="subtitle" class="subtitle" aria-live="polite">
      <div id="subtitleText"></div>
    </div>

    <div id="scrim" aria-hidden="true"></div>

    <div id="modalWrap" aria-hidden="true">
      <section
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <header class="mhead">
          <h2 id="modalTitle">Настройки</h2>
          <button
            class="modal-close"
            id="mClose"
            type="button"
            data-modal-close
            aria-label="Закрыть"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="mstep" id="mStepTxt">Шаг 1 / 8</div>
        <div class="seg" role="group" aria-label="Режим воспроизведения">
          <button
            id="mAuto"
            class="active"
            type="button"
            data-mode="auto"
            aria-pressed="true"
          >
            AUTO
          </button>
          <button
            id="mStepBtn"
            type="button"
            data-mode="step"
            aria-pressed="false"
          >
            STEP
          </button>
        </div>
        <button id="mNext" type="button" disabled>Следующий шаг ▶</button>
        <div class="mrow">
          <span class="mlabel" id="mSpeedLabel">Скорость</span>
          <div class="speedseg" role="group" aria-labelledby="mSpeedLabel">
            <button type="button" data-speed="0.5" aria-pressed="false">
              0.5×
            </button>
            <button
              type="button"
              data-speed="1"
              aria-pressed="true"
              class="active"
            >
              1×
            </button>
            <button type="button" data-speed="2" aria-pressed="false">
              2×
            </button>
          </div>
        </div>
        <div class="mrow">
          <span class="mlabel" id="mNineLabel">Режим 9:16</span>
          <label class="sw" aria-labelledby="mNineLabel">
            <input type="checkbox" id="mNine" />
            <span aria-hidden="true"></span>
          </label>
        </div>
        <button id="mReset" type="button">Reset</button>
        <div class="keys" aria-label="Горячие клавиши">
          <span>Space</span><i>скрыть контролы</i> <span>→</span
          ><i>следующий шаг</i> <span>R</span><i>reset</i> <span>S</span
          ><i>AUTO / STEP</i> <span>V</span><i>режим 9:16</i> <span>Esc</span
          ><i>закрыть</i>
        </div>
      </section>
    </div>

    <script>
      (function () {
        "use strict";
        const TAU = Math.PI * 2;
        const LOGIC_H = 720,
          GROUND_Y = 612,
          PHONE_CY = 415,
          RING_R = 205;
        const STEP_DUR = 6000,
          TRANS_DUR = 900;
        const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
        const SUBTITLES = [
          {
            step: 1,
            segments: [
              { text: "Цифровой мир полон " },
              { text: "угроз", emphasis: true },
              { text: ", но " },
              { text: "защиту", emphasis: true },
              { text: " можно выстроить заранее" },
            ],
          },

          const br = 11 + Math.sin(t * 5) * 1.5;
          circle(ex + ew / 2 + 2, ey + 2, br);
          ctx.fillStyle = C.danger;
          ctx.fill();
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "800 15px " + FONT;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("!", ex + ew / 2 + 2, ey + 3);
          ctx.fillStyle = rgba(C.muted, 0.45 + 0.3 * Math.sin(t * 1.7));
          ctx.font = "800 26px " + FONT;
          ctx.fillText("?", scx - RING_R - 34, 250);
          ctx.fillText("?", scx + RING_R + 26, 320);
          ctx.restore();
        }
        function drawMalware(a, t) {
          ctx.save();
          ctx.globalAlpha = a;
          for (let i = 0; i < 3; i++) {
            const ph = t * 1.1 + i * 1.05;
            const ap = (Math.sin(ph) + 1) / 2;
            const x0 = scx + Math.min(RING_R + 150, W / 2 - 40) + i * 34;
            const x1 = scx + 94;
            const x = lerp(x0, x1, ap);
            const y = GROUND_Y - 14;
            ctx.strokeStyle = rgba(C.danger, 0.85);
            ctx.lineWidth = 2.2;
            ctx.lineCap = "round";
            for (let j = 0; j < 3; j++) {
              const wig = Math.sin(t * 14 + i * 2 + j * 1.3) * 4;
              ctx.beginPath();
              ctx.moveTo(x - 4 + j * 7, y + 7);
              ctx.lineTo(x - 6 + j * 7 + wig, y + 15);
              ctx.stroke();
            }
            ctx.fillStyle = C.danger;
            ctx.beginPath();
            ctx.ellipse(x, y, 15, 10, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = rgba(C.metalDark, 0.4);
            ctx.beginPath();
            ctx.ellipse(x + 3, y - 2, 7, 4, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = rgba(C.danger, 0.9);
            circle(x - 16, y - 3, 6);
            ctx.fill();
            ctx.strokeStyle = rgba(C.danger, 0.9);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 19, y - 8);
            ctx.lineTo(x - 24, y - 15);
            ctx.moveTo(x - 14, y - 9);
            ctx.lineTo(x - 15, y - 17);
            ctx.stroke();
            ctx.fillStyle = "#FFFFFF";
            circle(x - 18, y - 4, 1.6);
            ctx.fill();
            if (ap > 0.9) {
              const k = (ap - 0.9) * 10;
              ctx.strokeStyle = rgba(C.okGlow, Math.min(1, k) * 0.9);
              ctx.lineWidth = 2;
              for (let j = 0; j < 4; j++) {
                const an = (j * TAU) / 4 + t * 6;
                ctx.beginPath();
                ctx.moveTo(x - 22 + Math.cos(an) * 6, y - 8 + Math.sin(an) * 6);
                ctx.lineTo(
                  x - 22 + Math.cos(an) * (8 + k * 6),
                  y - 8 + Math.sin(an) * (8 + k * 6),
                );
                ctx.stroke();
              }
            }
          }
          ctx.restore();
        }
        function drawDefense(a, t) {
          ctx.save();
          ctx.globalAlpha = a;
          const segs = [45, 135, 225, 315];
          ctx.lineCap = "round";
          for (let i = 0; i < segs.length; i++) {
            const k = clamp((t - 0.2 - i * 0.18) / 0.5, 0, 1);
            if (k <= 0) continue;
            const ang = ((segs[i] - 90) * Math.PI) / 180;
            const spread = 0.3 * eob(k);
            ctx.strokeStyle = rgba(C.accent, 0.95 * k);
            ctx.lineWidth = 13;
            ctx.beginPath();
            ctx.arc(scx, PHONE_CY, RING_R, ang - spread, ang + spread);
            ctx.stroke();
            const mx = scx + Math.cos(ang) * (RING_R + 17);
            const my = PHONE_CY + Math.sin(ang) * (RING_R + 17);
            checkMark(mx, my, 8 * k, rgba(C.okGlow, k), 3);
          }
          const ang2 = (t * 1.1) % TAU;
          ctx.save();
          ctx.translate(scx, PHONE_CY);
          ctx.rotate(ang2);
          ctx.fillStyle = rgba(C.accent, 0.13);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, RING_R + 26, -0.42, 0);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = rgba(C.okGlow, 0.5);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(
            Math.cos(-0.42) * (RING_R + 26),
            Math.sin(-0.42) * (RING_R + 26),
          );
          ctx.stroke();
          ctx.restore();
          const wx = scx + Math.min(RING_R + 120, W / 2 - 46),
            wy = 150;
          ctx.strokeStyle = rgba(C.okGlow, 0.95);
          ctx.lineWidth = 3.2;
          for (let j = 0; j < 3; j++) {
            const r = 6 + j * 7;
            ctx.beginPath();
            ctx.arc(wx, wy + 14, r, -Math.PI * 0.78, -Math.PI * 0.22);
            ctx.stroke();
          }
          ctx.fillStyle = C.okGlow;
          circle(wx, wy + 14, 3.2);
          ctx.fill();
          rr(wx + 16, wy + 14, 13, 10, 3);
          ctx.fillStyle = C.accent;
          ctx.fill();
          ctx.strokeStyle = C.accent;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(wx + 22.5, wy + 14, 4.5, Math.PI, TAU);
          ctx.stroke();
          ctx.restore();
        }
        function drawCheck(a, t) {
          const bw = Math.min(320, W - 140),
            bx = scx - bw / 2,
            by = 176,
            bh = 46;
          ctx.save();
          ctx.globalAlpha = a;
          rr(bx, by, bw, bh, 12);
          ctx.fillStyle = C.panelM;
          ctx.fill();
          ctx.strokeStyle = C.stroke;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.strokeStyle = rgba(C.okGlow, 0.95);
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(bx + 21, by + 25, 5, Math.PI, TAU);
          ctx.stroke();
          rr(bx + 14, by + 25, 14, 11, 3);
          ctx.fillStyle = C.okGlow;
          ctx.fill();
          ctx.fillStyle = rgba(C.muted, 0.75);
          rr(bx + 42, by + 13, bw - 118, 8, 3);
          ctx.fill();
          ctx.fillStyle = rgba(C.muted, 0.4);
          rr(bx + 42, by + 26, bw - 158, 8, 3);
          ctx.fill();
          circle(bx + bw - 27, by + bh / 2, 11);
          ctx.fillStyle = C.accent;
          ctx.fill();
          checkMark(bx + bw - 27, by + bh / 2 + 1, 5.5, "#FFFFFF", 2.6);
          const mx = bx + 30 + pp(t * 0.5) * (bw - 60),
            my = by + bh / 2;
          ctx.fillStyle = rgba(C.accent, 0.08);
          circle(mx, my, 26);
          ctx.fill();
          ctx.strokeStyle = rgba(C.accent, 0.95);
          ctx.lineWidth = 3.5;
          circle(mx, my, 26);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(mx + 18, my + 18);
          ctx.lineTo(mx + 31, my + 31);
          ctx.stroke();
          const fx = scx - bw / 2 - 64,
            fy = 296,
            k = clamp((t - 1.7) / 1, 0, 1);
          ctx.save();
          ctx.translate(fx, fy);
          ctx.rotate(-0.12 + k * 0.4);
          ctx.globalAlpha = a * (1 - k);
          rr(-27, -36, 54, 72, 8);
          ctx.fillStyle = C.panelM;
          ctx.fill();
          ctx.strokeStyle = rgba(C.warning, 0.85);
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = rgba(C.muted, 0.5);
          rr(-18, -26, 36, 6, 3);
          ctx.fill();
          rr(-18, -14, 28, 6, 3);
          ctx.fill();
          rr(-18, -2, 32, 6, 3);
          ctx.fill();
          ctx.strokeStyle = C.danger;
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-14, 14);
          ctx.lineTo(14, 40);
          ctx.moveTo(14, 14);
          ctx.lineTo(-14, 40);
          ctx.stroke();
          ctx.restore();
          ctx.restore();
        }
        function icoPhoto(al) {
          ctx.globalAlpha = al;
          rr(-20, -16, 40, 32, 5);
          ctx.fillStyle = C.panelM;
          ctx.fill();
          ctx.strokeStyle = C.stroke;
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = rgba(C.okGlow, 0.75);
          ctx.beginPath();
          ctx.moveTo(-13, 8);
          ctx.lineTo(-3, -6);
          ctx.lineTo(3, 2);
          ctx.lineTo(9, -4);
          ctx.lineTo(13, 8);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = C.warnGlow;
          circle(8, -9, 3);
          ctx.fill();
        }
        function icoPin(al) {
          ctx.globalAlpha = al;
          ctx.fillStyle = rgba(C.soft, 0.92);
          ctx.beginPath();
          ctx.arc(0, -4, 10, Math.PI * 0.62, Math.PI * 0.38);
          ctx.lineTo(0, 14);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = C.bg;
          circle(0, -5, 4);
          ctx.fill();
        }
        function icoCard(al) {
          ctx.globalAlpha = al;
          rr(-22, -15, 44, 30, 6);
          ctx.fillStyle = C.panelM;
          ctx.fill();
          ctx.strokeStyle = C.stroke;
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = rgba(C.danger, 0.75);
          ctx.fillRect(-22, -7, 44, 7);
          ctx.fillStyle = rgba(C.warnGlow, 0.8);
          rr(-16, 5, 14, 5, 2);
          ctx.fill();
        }
        function drawPrivacy(a, t) {
          const rE = Math.min(330, W / 2 - 40);
          const k = clamp((t - 1.2) / 2.2, 0, 1);
          ctx.save();
          ctx.globalAlpha = a;
          ctx.strokeStyle = rgba(C.danger, 0.4 * (1 - k * 0.5));
          ctx.lineWidth = 1.6;
          ctx.setLineDash([5, 9]);
          ctx.lineDashOffset = t * 10;
          circle(scx, PHONE_CY, rE + 14);
          ctx.stroke();
          ctx.setLineDash([]);
          const angles = [-2.35, -1.5708, -0.785];
          const icons = [icoPhoto, icoPin, icoCard];
          for (let i = 0; i < 3; i++) {
            const ki = clamp((k - i * 0.14) / 0.65, 0, 1);
            const sx = scx + Math.cos(angles[i]) * rE;
            const sy = PHONE_CY + Math.sin(angles[i]) * rE;
            const ke = eio(ki);
            const x = lerp(sx, scx, ke);
            const y = lerp(sy, 470, ke) - Math.sin(ke * Math.PI) * 30;
            for (let j = 0; j < 7; j++) {
              const fj = j / 7;
              const tx = lerp(sx, x, fj);
              const ty = lerp(sy, y, fj);
              ctx.fillStyle = rgba(C.muted, 0.32 * (1 - ki * 0.55));
              circle(tx, ty, 2);
              ctx.fill();
            }
            if (ki < 1) {
              ctx.save();
              ctx.translate(x, y);
              const sc = lerp(1, 0.45, ke);
              ctx.scale(sc, sc);
              icons[i](a * (1 - ki * 0.85));
              ctx.restore();
            }
          }
          ctx.restore();
        }
        function drawKey(x, y, rot, col, al) {
          ctx.save();
          ctx.globalAlpha = al;
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.strokeStyle = col;
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          circle(-14, 0, 8);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-6, 0);
          ctx.lineTo(16, 0);
          ctx.moveTo(10, 0);
          ctx.lineTo(10, 7);
          ctx.moveTo(15, 0);
          ctx.lineTo(15, 6);
          ctx.stroke();
          ctx.restore();
        }
        function drawDevice(x, y, style) {
          ctx.strokeStyle = style;
          ctx.fillStyle = style;
          ctx.lineWidth = 2;
          rr(x - 14, y - 9, 28, 16, 3);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x - 18, y + 10);
          ctx.lineTo(x + 18, y + 10);
          ctx.stroke();
        }
        function drawIncident(a, t) {
          ctx.save();
          ctx.globalAlpha = a;
          const alertK =
            clamp(t / 0.4, 0, 1) *
            (t < 1.6 ? 1 : clamp(1 - (t - 1.6) / 0.3, 0, 1));
          if (alertK > 0) {
            ctx.strokeStyle = rgba(C.danger, 0.55 * alertK);
            ctx.lineWidth = 3;
            circle(scx, PHONE_CY, RING_R + 16 + Math.sin(t * 6) * 5);
            ctx.stroke();
            ctx.fillStyle = rgba(C.danger, 0.14 * alertK);
            rr(scx - 63, 292, 126, 256, 14);
            ctx.fill();
            const by = PHONE_CY - RING_R - 34;
            ctx.save();
            ctx.translate(scx, by);
            ctx.globalAlpha = a * alertK;
            ctx.fillStyle = C.danger;
            ctx.beginPath();
            ctx.moveTo(-16, 14);
            ctx.lineTo(0, -14);
            ctx.lineTo(16, 14);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "800 15px " + FONT;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("!", 0, 4);
            ctx.restore();
          }
          const kk = clamp((t - 1.6) / 1.2, 0, 1);
          if (kk > 0) {
            const rot = kk * TAU;
            const col = kk < 0.5 ? C.muted : C.accent;
            drawKey(scx + 150, 330, rot, col, a);
            for (let i = 0; i < 3; i++) {
              const sa = 1 - clamp((t - 1.7 - i * 0.35) / 0.4, 0, 1);
              if (sa <= 0) continue;
              drawDevice(
                scx - 170 + i * 170,
                GROUND_Y + 20,
                rgba(C.muted, a * sa),
              );
            }
          }
          const fk = clamp((t - 2.9) / 0.5, 0, 1);
          if (fk > 0 && fk < 1) {
            ctx.strokeStyle = rgba(C.okGlow, (1 - fk) * 0.85);
            ctx.lineWidth = 6;
            circle(scx, PHONE_CY, RING_R + 8);
            ctx.stroke();
            ctx.strokeStyle = rgba(C.okGlow, 1 - fk);
            ctx.lineWidth = 2;
            for (let j = 0; j < 8; j++) {
              const an = (j * TAU) / 8 + 0.4;
              const r1 = RING_R + 20,
                r2 = RING_R + 34 + (1 - fk) * 12;
              ctx.beginPath();
              ctx.moveTo(scx + Math.cos(an) * r1, PHONE_CY + Math.sin(an) * r1);
              ctx.lineTo(scx + Math.cos(an) * r2, PHONE_CY + Math.sin(an) * r2);
              ctx.stroke();
            }
            const by = PHONE_CY - RING_R - 34;
            circle(scx, by, 22);
            ctx.fillStyle = C.accent;
            ctx.fill();
            checkMark(scx, by + 2, 11, "#FFFFFF", 4);
          }
          ctx.restore();
        }
        function drawStepActors(step, a, t) {
          if (a <= 0.01 || step < 1) return;
          switch (step) {
            case 1:
              drawIntro(a, t);
              break;
            case 2:
              drawPhishing(a, t);
              break;
            case 3:
              drawMalware(a, t);
              break;
            case 4:
              drawAuth(a, t);
              break;
            case 5:
              drawDefense(a, t);
              break;
            case 6:
              drawCheck(a, t);
              break;
            case 7:
              drawPrivacy(a, t);
              break;
            case 8:
              drawIncident(a, t);
              break;
          }
        }
        function drawAuth(a, t) {
          ctx.save();
          ctx.globalAlpha = a;
          for (let i = 0; i < 3; i++) {
            const k = clamp((t - 0.3 - i * 0.35) / 1.1, 0, 1);
            if (k <= 0 || k >= 1) continue;
            const x = lerp(scx - RING_R - 50, scx - 42, eio(k));
            const y = lerp(380 + i * 36, 440, eio(k));
            drawKey(x, y, k * TAU * 0.5, C.accent, (1 - k) * a);
          }
          ctx.restore();
        }
        function draw() {
          if (!ctx) return;
          const cw = els.vframe.clientWidth,
            ch = els.vframe.clientHeight;
          if (!cw || !ch) return;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const g = ctx.createLinearGradient(0, 0, 0, ch);
          g.addColorStop(0, C.bgGrad);
          g.addColorStop(1, C.bg);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, cw, ch);
          ctx.save();
          ctx.translate(ox, oy);
          ctx.scale(scale, scale);
          const t = state.animTime,
            st = state.stepTime;
          const p = state.transActive
            ? clamp(state.trans / TRANS_DUR, 0, 1)
            : 1;
          const e = eio(p);
          const prev = STEP_CFG[state.prevStep] || STEP_CFG[state.currentStep];
          const cur = STEP_CFG[state.currentStep];
          const sSh = lerp(prev.shield, cur.shield, e);
          const sLock = lerp(prev.lock, cur.lock, e);
          drawStars(t);
          drawMotes(t);
          drawGlow(sSh);
          drawGround();
          drawStepActors(
            state.prevStep,
            state.transActive ? 1 - e : 0,
            state.prevTime,
          );
          drawStepActors(state.currentStep, state.transActive ? e : 1, st);
          drawOrbit(t);
          drawPhone(sLock, 1);
          drawShield(sSh, t, 1, sLock);
          ctx.restore();
        }
        function frame(ts) {
          requestAnimationFrame(frame);
          let dt = lastTs ? (ts - lastTs) / 1000 : 0;
          lastTs = ts;
          if (dt > 0.05) dt = 0.05;
          update(dt);
          draw();
        }
        function bind() {
          els.play.addEventListener("click", (e) => {
            setPlaying(!state.playing);
            if (e.detail > 0) els.play.blur();
          });
          els.gear.addEventListener("click", (e) => {
            if (e.detail > 0) els.gear.blur();
            isModalOpen() ? closeSettings() : openSettings();
          });
          els.mClose.addEventListener("click", closeSettings);
          els.scrim.addEventListener("click", closeSettings);
          document.querySelectorAll("[data-mode]").forEach((btn) => {
            btn.addEventListener("click", () =>
              setMode(btn.getAttribute("data-mode")),
            );
          });
          els.speedBtns.forEach((btn) => {
            btn.addEventListener("click", () =>
              setSpeed(parseFloat(btn.getAttribute("data-speed"))),
            );
          });
          els.mNext.addEventListener("click", onStep);
          els.mNine.addEventListener("change", () =>
            setVideoMode(els.mNine.checked),
          );
          els.mReset.addEventListener("click", resetApp);
          document.addEventListener("keydown", handleInput);
          window.addEventListener("resize", resize);
          mq = window.matchMedia("(min-width: 768px)");
          if (mq.addEventListener) mq.addEventListener("change", placeNodes);
          else if (mq.addListener) mq.addListener(placeNodes);
          ro = new ResizeObserver(resize);
          ro.observe(els.vframe);
        }
        function init() {
          if (inited) return;
          inited = true;
          els = {
            scene: byId("scene"),
            vframe: byId("vframe"),
            dock: byId("frameDock"),
            subtitle: byId("subtitle"),
            subText: byId("subtitleText"),
            slotA: byId("subSlotA"),
            slotB: byId("subSlotB"),
            sidebar: byId("sidebar"),
            app: byId("app"),
            stage: byId("stage"),
            panel: byId("panel"),
            play: byId("playBtn"),
            gear: byId("gearBtn"),
            wrap: byId("modalWrap"),
            scrim: byId("scrim"),
            modal: byId("modal"),
            mClose: byId("mClose"),
            mStep: byId("mStepTxt"),
            mAuto: byId("mAuto"),
            mStepBtn: byId("mStepBtn"),
            mNext: byId("mNext"),
            mNine: byId("mNine"),
            mReset: byId("mReset"),
          };
          els.speedBtns = Array.prototype.slice.call(
            document.querySelectorAll("[data-speed]"),
          );
          for (const k in els) {
            if (!els[k]) throw new Error("Элемент не найден: " + k);
          }
          if (els.speedBtns.length !== 3)
            throw new Error("Неверное число кнопок скорости");
          ctx = els.scene.getContext("2d");
          if (!ctx) throw new Error("Canvas 2D недоступен");
          readColors();
          buildAmbient();
          bind();
          placeNodes();
          resize();
          updateSubtitles(1);
          renderControls();
          requestAnimationFrame(frame);
          setTimeout(() => {
            if (state.mode === "auto" && !state.playing) startAuto();
          }, 500);
        }
        try {
          init();
        } catch (err) {
          if (window.console && console.error) console.error(err);
          const stage = document.getElementById("stage");
          if (stage) {
            stage.replaceChildren();
            const d = document.createElement("div");
            d.id = "fatal";
            d.textContent =
              "Не удалось запустить визуализацию. Откройте файл в актуальном браузере.";
            stage.appendChild(d);
          }
        }
      })();
    </script>
  </body>
