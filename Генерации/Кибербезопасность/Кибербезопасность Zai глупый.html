<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Кибербезопасность</title>
<style>
:root{
  --bg:#0F0F13;
  --panel:#1A1A20;
  --accent:#2EAC65;
  --accent-shadow:#1E7A47;
  --text:#FFFFFF;
  --text-2:#A0A0A0;
  --right-safe:80px;
  --left-min:16px;
  --top-min:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#app .app-inner{display:flex;flex-direction:column;height:100%;
  padding-right:calc(var(--right-safe) + env(safe-area-inset-right));
  padding-left:calc(var(--left-min) + env(safe-area-inset-left));
  padding-top:calc(var(--top-min) + env(safe-area-inset-top));
  padding-bottom:calc(25vh + env(safe-area-inset-bottom));}
#title{font-weight:800;font-size:clamp(18px,4.5vw,26px);letter-spacing:.02em;padding:2px 4px 8px;flex:0 0 auto}
#title .dot{color:var(--accent)}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:14px;background:var(--panel)}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#frame{position:absolute;display:none;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:9/16;max-width:100%;max-height:100%;border:2px solid var(--accent);border-radius:18px;box-shadow:0 0 40px rgba(46,172,101,.25), inset 0 0 60px rgba(30,122,71,.12);overflow:hidden}
.videomode #frame{display:block}
#subs{flex:0 0 auto;margin:16px 4px 0;min-height:64px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:10px 14px;font-size:clamp(16px,4.5vw,22px);line-height:1.35;font-weight:700;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
#subs.show{opacity:1;transform:translateY(0)}
.subtitle__keyword{color:var(--accent)}
#controls{flex:0 0 auto;display:flex;gap:12px;margin-top:24px;padding:0 4px}
.btn{min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.08);font-size:20px;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease}
.btn:hover{background:#232329;border-color:rgba(46,172,101,.5)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{background:#26262d}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);color:#06220F;box-shadow:0 0 14px rgba(46,172,101,.35)}
.btn.primary:hover{background:#35bd72}
.controlsHidden #controls,.controlsHidden #subs{visibility:hidden}
#sidebar{display:none}
#app.desk .app-inner{flex-direction:row;padding-right:0;padding-bottom:0}
#leftcol{display:contents}
#app.desk #leftcol{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;height:100%;padding:calc(var(--top-min) + env(safe-area-inset-top)) 0 calc(var(--top-min) + env(safe-area-inset-top)) calc(var(--left-min) + env(safe-area-inset-left))}
#app.desk #bottomstack{display:contents}
#app.desk #sidebar{display:flex;flex-direction:column;justify-content:center;width:clamp(320px,30vw,380px);flex:0 0 auto;padding:0 20px;margin:0 env(safe-area-inset-right) 0 16px}
#app.desk #stage{margin-right:16px}
#app.desk #controls{position:absolute;left:calc(var(--left-min) + env(safe-area-inset-left) + 16px);bottom:calc(var(--top-min) + env(safe-area-inset-top));margin:0;z-index:5}
#app.desk #subs{margin:0;font-size:clamp(16px,1.6vw,22px)}
#app.desk #desklabel{display:none}
#desklabel{display:none}
#frameHost{position:absolute;inset:0}
#app.videomode #subs{position:absolute;bottom:84px;left:0;right:0;margin:0 10px;min-height:56px;z-index:6}
#app.videomode #controls{position:absolute;bottom:16px;left:0;right:0;margin:0;justify-content:center;z-index:6}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;opacity:0;transition:opacity .2s ease}
.modal-backdrop.open{display:flex}
.modal-backdrop.visible{opacity:1}
.modal{width:min(440px,calc(100vw - 32px));max-height:90dvh;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;display:flex;flex-direction:column;transform:scale(.95);opacity:0;transition:transform .2s ease,opacity .2s ease}
.modal-backdrop.visible .modal{transform:scale(1);opacity:1}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{font-size:20px;font-weight:800}
.modal-body{overflow-y:auto;padding-right:4px}
.set-row{margin-bottom:16px}
.set-label{font-size:13px;color:var(--text-2);margin-bottom:8px;font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{min-height:44px;padding:0 14px;font-size:15px;font-weight:700}
.seg .btn.active{background:var(--accent);color:#06220F;box-shadow:0 0 12px rgba(46,172,101,.3);border-color:var(--accent)}
.step-ind{font-size:16px;font-weight:800;background:rgba(46,172,101,.12);border:1px solid rgba(46,172,101,.3);border-radius:10px;padding:10px 14px}
.hotkeys{list-style:none;font-size:13px;color:var(--text-2);line-height:1.8}
.hotkeys b{color:var(--text);background:rgba(255,255,255,.08);border-radius:6px;padding:1px 7px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="app-inner">
    <div id="leftcol">
      <h1 id="title">Кибербезопасность<span class="dot">.</span></h1>
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="frameHost"><div id="frame"></div></div>
        <div id="controls">
          <button class="btn primary" id="btnPlay" aria-label="Пауза">⏸</button>
          <button class="btn" id="btnSettings" aria-label="Настройки">⚙</button>
        </div>
      </div>
      <p id="desklabel" hidden></p>
      <div id="bottomstack">
        <div id="subs" aria-live="polite"></div>
      </div>
    </div>
    <aside id="sidebar"></aside>
  </div>
</div>
<div class="modal-backdrop" id="settingsBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Настройки">
    <div class="modal-head">
      <h2>Настройки</h2>
      <button class="btn" id="btnClose" aria-label="Закрыть настройки">✕</button>
    </div>
    <div class="modal-body">
      <div class="set-row"><div class="step-ind" id="stepIndicator">Шаг 1 / 8</div></div>
      <div class="set-row">
        <div class="set-label">Режим воспроизведения</div>
        <div class="seg" id="segMode">
          <button class="btn" data-mode="AUTO">AUTO</button>
          <button class="btn" data-mode="STEP">STEP</button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">Следующий шаг</div>
        <button class="btn" id="btnNext" style="width:100%">Следующий шаг ▶</button>
      </div>
      <div class="set-row">
        <div class="set-label">Скорость</div>
        <div class="seg" id="segSpeed">
          <button class="btn" data-speed="0.5">0.5×</button>
          <button class="btn" data-speed="1">1×</button>
          <button class="btn" data-speed="2">2×</button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">Отображение</div>
        <button class="btn" id="btnFrame" style="width:100%">Вертикальная рамка 9:16</button>
      </div>
      <div class="set-row">
        <div class="set-label">Сброс</div>
        <button class="btn" id="btnReset" style="width:100%">Reset</button>
      </div>
      <div class="set-row">
        <div class="set-label">Горячие клавиши</div>
        <ul class="hotkeys">
          <li><b>Space</b> — скрыть или показать контролы</li>
          <li><b>→</b> — следующий шаг (в режиме STEP)</li>
          <li><b>R</b> — сброс</li>
          <li><b>S</b> — переключить AUTO / STEP</li>
          <li><b>V</b> — вертикальная рамка</li>
          <li><b>Esc</b> — закрыть настройки</li>
        </ul>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var STEPS=8,STEP_DUR=5000,TRANS_DUR=600,AUTO_DELAY=500;
var SUBS=[
 {step:1,segments:[{text:"Персональные данные и устройства нуждаются "},{text:"в ежедневной защите",emphasis:true}]},
 {step:2,segments:[{text:"Фишинг",emphasis:true},{text:": поддельные письма выманивают логины и пароли"}]},
 {step:3,segments:[{text:"Вредоносные программы",emphasis:true},{text:" проникают через заражённые файлы и сайты"}]},
 {step:4,segments:[{text:"Надёжный пароль — "},{text:"длинный, уникальный",emphasis:true},{text:" и хранится в менеджере"}]},
 {step:5,segments:[{text:"Двухфакторная аутентификация",emphasis:true},{text:" защищает аккаунт даже при утечке пароля"}]},
 {step:6,segments:[{text:"Не открывайте "},{text:"подозрительные ссылки",emphasis:true},{text:" и файлы из неизвестных источников"}]},
 {step:7,segments:[{text:"Социальная инженерия: мошенники давят на "},{text:"страх и спешку",emphasis:true}]},
 {step:8,segments:[{text:"При взломе: "},{text:"смените пароль",emphasis:true},{text:", проверьте устройства, предупредите контакты"}]}
];
var state={mode:"AUTO",isPlaying:true,currentStep:1,speed:1,videoMode:false,elapsed:0,transitioning:false,controlsHidden:false};
var els={},ctx=null,dpr=1,lastT=0,autoStarted=false,inited=false;
var particles=[];
function $(id){return document.getElementById(id)}
function collect(){els.app=$("app");els.canvas=$("canvas");els.stage=$("stage");els.frame=$("frame");
 els.frameHost=$("frameHost");els.subs=$("subs");els.controls=$("controls");els.sidebar=$("sidebar");
 els.bottomstack=$("bottomstack");els.leftcol=$("leftcol");els.play=$("btnPlay");els.gear=$("btnSettings");
 els.backdrop=$("settingsBackdrop");els.modal=els.backdrop.querySelector(".modal");
 els.indicator=$("stepIndicator");els.next=$("btnNext");els.btnFrame=$("btnFrame");
 els.segMode=$("segMode");els.segSpeed=$("segSpeed");}
function isDesktop(){return window.matchMedia("(min-width: 768px)").matches}
function placeElements(){
 var desk=isDesktop();
 els.app.classList.toggle("desk",desk);
 els.app.classList.toggle("videomode",state.videoMode);
 var subsTarget,ctrlTarget;
 if(state.videoMode){subsTarget=els.frame;ctrlTarget=els.frame;}
 else if(desk){subsTarget=els.sidebar;ctrlTarget=els.stage;}
 else{subsTarget=els.bottomstack;ctrlTarget=els.bottomstack;}
 if(els.subs.parentElement!==subsTarget)subsTarget.appendChild(els.subs);
 if(els.controls.parentElement!==ctrlTarget)ctrlTarget.appendChild(els.controls);
 resize();
}
function layoutFrame(){
 var r=els.stage.getBoundingClientRect();
 var fh=r.height-8,fw=fh*9/16;
 if(fw>r.width-8){fw=r.width-8;fh=fw*16/9;}
 els.frame.style.width=fw+"px";els.frame.style.height=fh+"px";
}
function resize(){
 if(!els.canvas||!ctx)return;
 if(state.videoMode)layoutFrame();
 var r=els.stage.getBoundingClientRect();
 dpr=window.devicePixelRatio||1;
 els.canvas.width=Math.max(1,Math.round(r.width*dpr));
 els.canvas.height=Math.max(1,Math.round(r.height*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);
 draw();
}
function updateSubtitles(step){
 var s=SUBS[step-1];if(!s)return;
 els.subs.classList.remove("show");
 while(els.subs.firstChild)els.subs.removeChild(els.subs.firstChild);
 s.segments.forEach(function(seg){
  if(seg.emphasis){var sp=document.createElement("span");sp.className="subtitle__keyword";sp.textContent=seg.text;els.subs.appendChild(sp);}
  else{els.subs.appendChild(document.createTextNode(seg.text));}
 });
 requestAnimationFrame(function(){els.subs.classList.add("show")});
}
function renderControls(){
 els.play.textContent=state.isPlaying?"⏸":"▶";
 els.play.setAttribute("aria-label",state.isPlaying?"Пауза":"Продолжить");
 els.next.disabled=!(state.mode==="STEP"&&!state.transitioning&&state.currentStep<STEPS);
 Array.prototype.forEach.call(els.segMode.children,function(b){b.classList.toggle("active",b.dataset.mode===state.mode)});
 Array.prototype.forEach.call(els.segSpeed.children,function(b){b.classList.toggle("active",parseFloat(b.dataset.speed)===state.speed)});
 els.btnFrame.classList.toggle("active",state.videoMode);
 els.indicator.textContent="Шаг "+state.currentStep+" / "+STEPS;
}
function setPlaying(v){state.isPlaying=v;renderControls();}
function setMode(m){state.mode=m;
 if(m==="AUTO"&&state.isPlaying){/* продолжить с текущего шага */}
 if(m==="STEP"){state.transitioning=false;}
 renderControls();}
function setSpeed(v){state.speed=v;renderControls();}
function toggleVideoMode(){state.videoMode=!state.videoMode;placeElements();renderControls();}
function reset(){state.mode="AUTO";state.currentStep=1;state.elapsed=0;state.transitioning=false;setPlaying(true);updateSubtitles(1);renderControls();}
function nextStep(){onStep();}
function onStep(){
 if(state.mode!=="STEP"||state.transitioning||state.currentStep>=STEPS)return;
 state.transitioning=true;state.elapsed=0;state.currentStep++;
 updateSubtitles(state.currentStep);renderControls();
 setTimeout(function(){state.transitioning=false;renderControls();},TRANS_DUR/state.speed);
}
function startAuto(){setMode("AUTO");setPlaying(true);}
function openSettings(){els.backdrop.classList.add("open");requestAnimationFrame(function(){els.backdrop.classList.add("visible")});renderControls();}
function closeSettings(){els.backdrop.classList.remove("visible");
 setTimeout(function(){els.backdrop.classList.remove("open")},200);}
function toggleSettings(){if(els.backdrop.classList.contains("open"))closeSettings();else openSettings();}
function toggleControlsVisibility(){state.controlsHidden=!state.controlsHidden;document.body.classList.toggle("controlsHidden",state.controlsHidden);}
function handleInput(e){
 if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable))return;
 var k=e.key;
 if(els.backdrop.classList.contains("open")&&k==="Escape"){e.preventDefault();closeSettings();return;}
 if(k===" "){e.preventDefault();toggleControlsVisibility();}
 else if(k==="ArrowRight"){if(state.mode==="STEP"){e.preventDefault();onStep();}}
 else if(k==="r"||k==="R"||k==="к"||k==="К"){reset();}
 else if(k==="s"||k==="S"||k==="ы"||k==="Ы"){setMode(state.mode==="AUTO"?"STEP":"AUTO");}
 else if(k==="v"||k==="V"||k==="м"||k==="М"){toggleVideoMode();}
}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function update(dt){
 if(state.isPlaying){state.elapsed+=dt*state.speed;}
 if(state.mode==="AUTO"&&!state.transitioning){
  if(state.elapsed>=STEP_DUR){
   state.elapsed=0;
   state.currentStep=state.currentStep>=STEPS?1:state.currentStep+1;
   updateSubtitles(state.currentStep);renderControls();
  }
 }
}
function hexA(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return"rgba("+r+","+g+","+b+","+a+")"}
function initParticles(w,h){
 particles=[];
 for(var i=0;i<40;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,a:.15+Math.random()*.3});}
}
function viewRect(){
 if(!state.videoMode)return{x:0,y:0,w:els.canvas.width/dpr,h:els.canvas.height/dpr};
 var fr=els.frame.getBoundingClientRect(),st=els.stage.getBoundingClientRect();
 return{x:fr.left-st.left,y:fr.top-st.top,w:fr.width,h:fr.height};
}
function draw(){
 if(!ctx)return;
 var w=els.canvas.width/dpr,h=els.canvas.height/dpr,t=performance.now()/1000;
 var p=Math.min(1,state.elapsed/(TRANS_DUR*1.2));
 var e=easeOutCubic(Math.min(1,p));
 var v=viewRect();
 ctx.clearRect(0,0,w,h);
 var g=ctx.createLinearGradient(0,0,0,h);
 g.addColorStop(0,"#1A1A20");g.addColorStop(1,"#121217");
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 ctx.save();ctx.globalAlpha=e;
 ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
 var gs=44,ox=(t*6)%gs,oy=(t*4)%gs;
 for(var x=-gs+ox;x<w;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
 for(var y=-gs+oy;y<h;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
 ctx.restore();
 for(var i=0;i<particles.length;i++){var pt=particles[i];
  pt.x+=pt.vx*0.016;pt.y+=pt.vy*0.016;
  if(pt.x<0)pt.x=w;if(pt.x>w)pt.x=0;if(pt.y<0)pt.y=h;if(pt.y>h)pt.y=0;
  ctx.globalAlpha=pt.a*e;ctx.fillStyle=hexA("#2EAC65",1);
  ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();}
 ctx.globalAlpha=1;
 var cx=v.x+v.w/2,cy=v.y+v.h/2-8,sc=Math.min(v.w/370,v.h/400)*(0.85+0.15*e);
 ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-160,-160);
 drawScene(state.currentStep,t,e);
 ctx.restore();
 ctx.globalAlpha=e;
 ctx.fillStyle="#A0A0A0";ctx.font="700 13px system-ui";ctx.textAlign="center";
 ctx.fillText("Шаг "+state.currentStep+" / "+STEPS,state.videoMode?v.x+v.w/2:w/2,state.videoMode?v.y+20:22);
 ctx.globalAlpha=1;
}
function glow(c){ctx.shadowColor=c;ctx.shadowBlur=24;}
function noGlow(){ctx.shadowBlur=0;}
function roundRect(x,y,w2,h2,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h2,r);ctx.arcTo(x+w2,y+h2,x,y+h2,r);ctx.arcTo(x,y+h2,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();}
function drawScene(step,t,e){
 var A="#2EAC65",S="#1E7A47",pulse=1+Math.sin(t*2.4)*0.04;
 ctx.lineCap="round";ctx.lineJoin="round";
 if(step===1){
  glow(hexA(A,.8));
  ctx.strokeStyle=A;ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(160,40);ctx.lineTo(255,78);ctx.lineTo(255,150);
  ctx.quadraticCurveTo(255,235,160,282);ctx.quadraticCurveTo(65,235,65,150);ctx.lineTo(65,78);ctx.closePath();ctx.stroke();
  ctx.fillStyle=hexA(A,.12);ctx.fill();noGlow();
  ctx.strokeStyle=A;ctx.lineWidth=11;
  ctx.beginPath();ctx.moveTo(115,158);ctx.lineTo(152,196);ctx.lineTo(212,112);ctx.stroke();
  ctx.fillStyle="#FFFFFF";ctx.font="800 17px system-ui";ctx.textAlign="center";
  ctx.fillText("данные · устройства · аккаунты",160,320);
 }else if(step===2){
  var hx=160+Math.sin(t*1.8)*14;
  glow(hexA(S,.8));ctx.strokeStyle=S;ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(hx+70,40);ctx.quadraticCurveTo(hx+110,120,hx,170);ctx.stroke();noGlow();
  ctx.fillStyle=hexA(A,.9);
  roundRect(hx-90,110,180,110,12);ctx.fill();
  ctx.strokeStyle="#0F0F13";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(hx-90,118);ctx.lineTo(hx,180);ctx.lineTo(hx+90,118);ctx.stroke();
  ctx.strokeStyle=A;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(hx+6,180);ctx.lineTo(hx+42,232);ctx.stroke();
  ctx.beginPath();ctx.arc(hx+48,238,9,Math.PI*1.1,Math.PI*0.4,true);ctx.stroke();
  ctx.fillStyle="#FFFFFF";ctx.font="800 17px system-ui";ctx.textAlign="center";
  ctx.fillText("«Вы выиграли! Введите пароль»",160,330);
 }else if(step===3){
  var wig=Math.sin(t*6)*5;
  glow(hexA(S,.9));ctx.strokeStyle=S;ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(160,160,62,0,Math.PI*2);ctx.stroke();noGlow();
  ctx.fillStyle=hexA("#2EAC65",.15);ctx.fill();
  ctx.strokeStyle=S;ctx.lineWidth=7;
  for(var i2=0;i2<3;i2++){var lx=160+(i2-1)*46;
   ctx.beginPath();ctx.moveTo(lx,98);ctx.quadraticCurveTo(lx+wig,60,lx+12+wig,52);ctx.stroke();
   ctx.beginPath();ctx.moveTo(lx,222);ctx.quadraticCurveTo(lx-wig,260,lx-12-wig,268);ctx.stroke();}
  ctx.fillStyle=A;
  ctx.beginPath();ctx.arc(138,145,11,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(184,145,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#FFFFFF";ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(132,196);ctx.quadraticCurveTo(160,178,188,196);ctx.stroke();
  ctx.strokeStyle=A;ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(258,66);ctx.lineTo(70,258);ctx.stroke();
  ctx.beginPath();ctx.moveTo(70,66);ctx.lineTo(258,258);ctx.stroke();
 }else if(step===4){
  glow(hexA(A,.7));
  ctx.strokeStyle=A;ctx.lineWidth=9;
  roundRect(84,150,152,110,14);ctx.stroke();
  ctx.fillStyle=hexA(A,.14);ctx.fill();noGlow();
  var ka=Math.sin(t*1.5)*0.12;
  ctx.save();ctx.translate(160,150);ctx.rotate(ka);
  ctx.strokeStyle=A;ctx.lineWidth=10;
  ctx.beginPath();ctx.arc(0,-24,26,Math.PI,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-24);ctx.stroke();ctx.restore();
  ctx.fillStyle=A;ctx.beginPath();ctx.arc(160,205,13,0,Math.PI*2);ctx.fill();

  ctx.fillText("16+ символов · уникальный",160,300);
 }else if(step===5){
  ctx.fillStyle="#1A1A20";ctx.strokeStyle="#A0A0A0";ctx.lineWidth=5;
  roundRect(112,50,96,190,14);ctx.fill();ctx.stroke();
  ctx.fillStyle=A;
  roundRect(120,66,80,20,6);ctx.fill();
  ctx.strokeStyle=A;ctx.lineWidth=7;roundRect(64,120,190,92,14);ctx.stroke();
  ctx.fillStyle=hexA(A,.12);ctx.fill();
  var blink=Math.sin(t*4)>0;
  ctx.fillStyle=blink?A:S;
  ctx.beginPath();ctx.arc(100,166,9,0,Math.PI*2);ctx.fill();
  ctx.fillRect(94,166,12,26);
  ctx.strokeStyle=blink?A:S;ctx.lineWidth=6;
  roundRect(140,150,96,52,8);ctx.stroke();
  ctx.fillStyle="#FFFFFF";ctx.font="800 17px system-ui";ctx.textAlign="center";

 }else if(step===6){
  var lx2=160,ly2=150,wig2=Math.sin(t*3)*4;
  ctx.strokeStyle="#A0A0A0";ctx.lineWidth=9;
  ctx.beginPath();ctx.arc(96,182,34,Math.PI*0.6,Math.PI*1.6);ctx.stroke();
  ctx.beginPath();ctx.arc(224,118,34,Math.PI*1.6,Math.PI*0.6,true);ctx.stroke();

  ctx.strokeStyle=A;ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(lx2-58+wig2,ly2+44);ctx.lineTo(lx2-18+wig2,ly2+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lx2-18+wig2,ly2+6);ctx.lineTo(lx2+64+wig2,ly2+64);ctx.stroke();
  ctx.fillStyle="#FFFFFF";ctx.font="800 17px system-ui";ctx.textAlign="center";

 }else if(step===7){

 }
}
function frame(ts){
 if(!lastT)lastT=ts;
 var dt=Math.min(100,ts-lastT);lastT=ts;
 update(dt);draw();
 requestAnimationFrame(frame);
}
function init(){
 collect();
 if(!els.canvas||!els.stage){console.error("Не найдены обязательные DOM-элементы");return false;}
 ctx=els.canvas.getContext("2d");
 if(!ctx){console.error("Canvas 2D недоступен");return false;}
 initParticles(1000,1000);
 placeElements();
 els.play.addEventListener("click",function(){setPlaying(!state.isPlaying)});
 els.gear.addEventListener("click",toggleSettings);
 $("btnClose").addEventListener("click",closeSettings);
 els.backdrop.addEventListener("click",function(e){if(e.target===els.backdrop)closeSettings()});
 els.modal.addEventListener("click",function(e){e.stopPropagation()});
 els.next.addEventListener("click",onStep);
 $("btnReset").addEventListener("click",reset);
 els.btnFrame.addEventListener("click",toggleVideoMode);
 Array.prototype.forEach.call(els.segMode.children,function(b){b.addEventListener("click",function(){setMode(b.dataset.mode)})});
 Array.prototype.forEach.call(els.segSpeed.children,function(b){b.addEventListener("click",function(){setSpeed(parseFloat(b.dataset.speed))})});
 document.addEventListener("keydown",handleInput);
 window.addEventListener("resize",resize);
 if(window.ResizeObserver){var ro=new ResizeObserver(function(){resize()});ro.observe(els.stage);ro.observe(els.frame);}
 var mq=window.matchMedia("(min-width: 768px)");
 if(mq.addEventListener)mq.addEventListener("change",placeElements);
 updateSubtitles(1);renderControls();
 inited=true;
 return true;
}
function boot(){
 if(!init())return;
 setTimeout(function(){startAuto();requestAnimationFrame(frame);},AUTO_DELAY);
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
})();
</script>
