<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Базы данных и хранение информации</title>
<style>
:root {
  --ui-bg: #0F0F13;
  --ui-bg-gradient: #111118;
  --ui-panel: #1A1A20;
  --ui-panel-glass: rgba(26,26,32,.55);
  --ui-modal-bg: rgba(26,26,32,.94);
  --ui-modal-scrim: rgba(0,0,0,.55);
  --ui-text: #FFFFFF;
  --ui-muted: #A0A0A0;
  --ui-label: #CFCFCF;
  --ui-accent: #2EAC65;
  --ui-accent-dark: #1E7A47;
  --ui-accent-soft: rgba(46,172,101,.14);
  --ui-accent-soft-hover: rgba(46,172,101,.26);
  --ui-accent-border: rgba(46,172,101,.5);
  --ui-accent-shadow: rgba(46,172,101,.3);
  --ui-accent-shadow-strong: rgba(46,172,101,.35);
  --ui-accent-ambient-1: rgba(46,172,101,.34);
  --ui-accent-ambient-2: rgba(30,122,71,.30);
  --ui-accent-ambient-3: rgba(20,80,45,.38);
  --ui-accent-halo: rgba(46,172,101,.14);
  --ui-danger: #E5484D;
  --ui-danger-hover-border: rgba(229,72,77,.6);
  --ui-white-06: rgba(255,255,255,.06);
  --ui-white-08: rgba(255,255,255,.08);
  --ui-white-10: rgba(255,255,255,.1);
  --ui-white-12: rgba(255,255,255,.12);
  --ui-white-14: rgba(255,255,255,.14);
  --ui-border-soft: rgba(255,255,255,.12);
  --ui-border-faint: rgba(255,255,255,.08);
  --ui-scrim-strong: rgba(0,0,0,.65);
  --ui-surface-inset: rgba(0,0,0,.35);
  --ui-shadow-text: rgba(0,0,0,.8);
  --ui-ambient-blur: 90px;
  --side-w: clamp(320px, 30vw, 380px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  color: var(--ui-text);
  background: var(--ui-bg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
#app {
  position: relative;
  z-index: 1;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(16px + env(safe-area-inset-top, 0px)) calc(80px + env(safe-area-inset-right, 0px)) calc(25vh + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
}
#stageCol { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
#title {
  margin: 0 0 10px;
  font-weight: 800;
  font-size: clamp(17px, 4.6vw, 24px);
  line-height: 1.2;
  text-align: center;
  flex: 0 0 auto;
}
#stageWrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid var(--ui-border-faint);
  background: var(--ui-bg);
}
#ambient {
  position: absolute;
  inset: -8%;
  z-index: 0;
  opacity: 0;
  transition: opacity .5s;
  pointer-events: none;
}
#ambient i { position: absolute; border-radius: 50%; filter: blur(var(--ui-ambient-blur)); }
#ambient .b1 { width: 46vmin; height: 46vmin; left: -6%; top: 8%; background: var(--ui-accent-ambient-1); animation: drift 9s ease-in-out infinite alternate; }
#ambient .b2 { width: 40vmin; height: 40vmin; right: -4%; top: 38%; background: var(--ui-accent-ambient-2); animation: drift 11s ease-in-out infinite alternate-reverse; }
#ambient .b3 { width: 52vmin; height: 52vmin; left: 16%; bottom: -8%; background: var(--ui-accent-ambient-3); animation: drift 13s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(4vmin, -5vmin) scale(1.12); } }
body.v916 #ambient { opacity: 1; }
#canvasBox { position: absolute; inset: 0; z-index: 1; }
#cv { display: block; width: 100%; height: 100%; }
#frameBox {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 1;
  display: none;
  overflow: hidden;
  border-radius: 20px;
  border: 1px solid var(--ui-accent-border);
  background: var(--ui-bg);
  box-shadow: 0 0 44px var(--ui-accent-halo), 0 18px 60px rgba(0,0,0,.5);
}
body.v916 #frameBox { display: block; }
body.v916 #canvasBox { display: none; }
#frameSubsSlot { position: absolute; left: 14px; right: 14px; bottom: 96px; z-index: 2; display: flex; justify-content: center; }
#framePanelSlot { position: absolute; left: 0; right: 0; bottom: 12px; z-index: 2; display: flex; justify-content: center; }
#side { display: none; }
#subtitleBox {
  width: 100%;
  max-width: 640px;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 16px;
  padding: 12px 16px;
  font-size: clamp(16px, 4.5vw, 22px);
  font-weight: 700;
  line-height: 1.35;
  color: var(--ui-text);
  min-height: calc(4.05em + 24px);
  display: flex;
  align-items: center;
}
.subinner { display: block; width: 100%; animation: subIn .32s ease both; }
.subtitle__keyword { color: var(--ui-accent); font-weight: 800; }
@keyframes subIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#bottomBar { display: flex; flex-direction: column; align-items: center; gap: 24px; flex: 0 0 auto; padding-top: 12px; }
#panel {
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 18px;
  background: var(--ui-panel-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--ui-border-soft);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  transition: opacity .25s, visibility .25s;
}
#panel button {
  width: 52px;
  height: 52px;
  min-width: 48px;
  min-height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ui-text);
  cursor: pointer;
  padding: 0;
  transition: background .2s, border-color .2s;
}
#panel button:hover { background: var(--ui-white-08); border-color: var(--ui-border-soft); }
#panel button:active { background: var(--ui-accent-soft); }
#stageWrap > #panel { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3; }
body.controls-hidden #panel { opacity: 0; visibility: hidden; pointer-events: none; }
button:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
@media (min-width: 768px) {
  #app { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); gap: 20px; padding: 20px 24px; }
  #stageCol { min-width: 0; }
  #title { text-align: left; font-size: clamp(20px, 2vw, 26px); margin-bottom: 12px; }
  #bottomBar { display: none; }
  #side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: var(--ui-panel);
    border: 1px solid var(--ui-border-faint);
    border-radius: 18px;
    min-height: 0;
  }
}
body.v916 #app { display: flex; flex-direction: column; }
body.v916 #side { display: none; }
body.v916 #bottomBar { display: none; }
@media (min-width: 768px) {
  body.v916 #app { padding-bottom: 20px; }
}
#modalWrap {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  background: var(--ui-modal-scrim);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#modalWrap.open { display: flex; }
#modal {
  width: min(92vw, 380px);
  max-height: 90vh;
  max-height: 90dvh;
  overflow: auto;
  color: var(--ui-text);
  background: var(--ui-modal-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--ui-border-soft);
  border-radius: 20px;
  padding: 20px;
  animation: pop .25s cubic-bezier(.2, .7, .3, 1) both;
  outline: none;
}
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
#modal button { font-family: inherit; color: var(--ui-text); cursor: pointer; }
.modal-close {
  display: grid;
  place-items: center;
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: var(--ui-white-06);
  border: 1px solid var(--ui-border-soft);
  transition: background .2s;
}
.modal-close:hover { background: var(--ui-white-10); }
.mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mhead h2 { margin: 0; font-size: 19px; font-weight: 800; }
.mstep { color: var(--ui-muted); font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.seg { display: flex; gap: 8px; margin-bottom: 10px; }
.seg button {
  flex: 1;
  min-height: 44px;
  border-radius: 12px;
  color: var(--ui-text);
  background: var(--ui-white-06);
  border: 1px solid var(--ui-border-soft);
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  transition: background .2s, box-shadow .2s;
}
.seg button:not(.active):hover { background: var(--ui-white-10); }
.seg button.active { background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-dark)); border-color: transparent; box-shadow: 0 4px 14px var(--ui-accent-shadow); }
.mrow { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.mrow .seg { margin-bottom: 0; }
.mlabel { flex: 1; color: var(--ui-label); font-size: 14px; font-weight: 700; }
.seg-speed { flex: 1.4; }
.seg-speed button { padding: 0 4px; }
#mNext {
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  color: var(--ui-text);
  background: var(--ui-accent-soft);
  border: 1px solid var(--ui-accent-border);
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
  transition: background .2s, opacity .2s;
}
#mNext:disabled { opacity: .35; cursor: not-allowed; }
#mNext:not(:disabled):hover { background: var(--ui-accent-soft-hover); }
.sw { position: relative; display: inline-block; flex: 0 0 52px; width: 52px; height: 30px; }
.sw input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.sw span { position: absolute; inset: 0; background: var(--ui-white-12); border-radius: 999px; transition: background .25s; pointer-events: none; }
.sw span::before { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: var(--ui-text); border-radius: 50%; transition: transform .25s; }
.sw input:checked + span { background: var(--ui-accent); }
.sw input:checked + span::before { transform: translateX(22px); }
.sw input:focus-visible + span { outline: 2px solid var(--ui-text); outline-offset: 3px; }
#mReset {
  width: 100%;
  min-height: 46px;
  border-radius: 12px;
  color: var(--ui-text);
  background: var(--ui-white-06);
  border: 1px solid var(--ui-white-14);
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 14px;
  transition: border-color .2s;
}
#mReset:hover { border-color: var(--ui-danger-hover-border); }
.keys { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 10px; align-items: center; color: var(--ui-muted); font-size: 12px; }
.keys span {
  justify-self: start;
  padding: 2px 7px;
  color: var(--ui-text);
  background: var(--ui-white-08);
  border: 1px solid var(--ui-border-soft);
  border-radius: 6px;
  font-weight: 800;
}
.keys i { font-style: normal; }
body.modal-open { overflow: hidden; }
#fatal[hidden] { display: none; }
#fatal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  color: var(--ui-text);
  background: var(--ui-bg);
  font-weight: 700;
}
@media (prefers-reduced-motion: reduce) {
  #modal { animation: none; }
  #ambient i { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <section id="stageCol">
    <h1 id="title">Базы данных и хранение информации</h1>
    <div id="stageWrap">
      <div id="ambient" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
      <div id="canvasBox"><canvas id="cv"></canvas></div>
      <div id="frameBox">
        <div id="frameSubsSlot"></div>
        <div id="framePanelSlot"></div>
      </div>
    </div>
  </section>
  <aside id="side"></aside>
  <footer id="bottomBar">
    <div id="subtitleBox" aria-live="polite"></div>
    <div id="panel">
      <button id="btnPlay" type="button" aria-label="Пауза">
        <svg id="icPause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.6z" fill="currentColor"/></svg>
        <svg id="icPlay" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>
      </button>
      <button id="btnGear" type="button" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z" fill="currentColor"/></svg>
      </button>
    </div>
  </footer>
</div>
<div id="modalWrap" aria-hidden="true">
  <section id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <header class="mhead">
      <h2 id="modalTitle">Настройки</h2>
      <button class="modal-close" id="mClose" type="button" data-modal-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </button>
    </header>
    <div class="mstep" id="mStepTxt">Шаг 1 / 6</div>
    <div class="seg" role="group" aria-label="Режим воспроизведения">
      <button id="mAuto" class="active" type="button" data-mode="auto" aria-pressed="true">AUTO</button>
      <button id="mStepBtn" type="button" data-mode="step" aria-pressed="false">STEP</button>
    </div>
    <button id="mNext" type="button" data-modal-action="next-step" disabled>Следующий шаг ▶</button>
    <div class="mrow">
      <span class="mlabel" id="mSpeedLabel">Скорость</span>
      <div class="seg seg-speed" role="group" aria-labelledby="mSpeedLabel">
        <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" data-speed="1" class="active" aria-pressed="true">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
      </div>
    </div>
    <div class="mrow">
      <span class="mlabel" id="mNineLabel">Режим 9:16</span>

    <button id="mReset" type="button" data-modal-action="reset">Reset</button>
    <div class="keys" aria-label="Горячие клавиши">
      <span>Space</span><i>скрыть панель</i>
      <span>→</span><i>следующий шаг</i>
      <span>R</span><i>reset</i>
      <span>S</span><i>AUTO/STEP</i>
      <span>V</span><i>режим 9:16</i>
      <span>Esc</span><i>закрыть</i>

  </section>
</div>
<div id="fatal" hidden>Не удалось запустить приложение. Обновите браузер и откройте файл снова.</div>
<script>
(function (global) {
  'use strict';
  function initSettingsModal(options) {
    const config = Object.assign({
      overlaySelector: '#modalWrap',
      dialogSelector: '#modal',
      openSelector: '.js-gear',
      closeSelector: '[data-modal-close]'
    }, options || {});
    const overlay = document.querySelector(config.overlaySelector);
    if (!overlay) throw new Error('Settings modal overlay not found: ' + config.overlaySelector);
    const dialog = overlay.querySelector(config.dialogSelector) || overlay.querySelector('[role="dialog"]');
    if (!dialog) throw new Error('Settings modal dialog not found.');

    const closers = Array.from(overlay.querySelectorAll(config.closeSelector));
    let previouslyFocused = null;
    function open() {
      if (overlay.classList.contains('open')) return;
      previouslyFocused = document.activeElement;
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      dialog.focus();
    }
    function close() {
      if (!overlay.classList.contains('open')) return;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
        previouslyFocused.focus();
      }

    function toggle() {
      overlay.classList.contains('open') ? close() : open();
    }
    openers.forEach((button) => button.addEventListener('click', toggle));
    closers.forEach((button) => button.addEventListener('click', close));
    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) close();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && overlay.classList.contains('open')) {
        close();
      }
    });
    overlay.querySelectorAll('[data-mode]').forEach((button) => {
      button.addEventListener('click', () => {
        const mode = button.dataset.mode;
        overlay.querySelectorAll('[data-mode]').forEach((item) => {
          const active = item === button;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        const next = overlay.querySelector('[data-modal-action="next-step"]');
        if (next) next.disabled = mode !== 'step';
        overlay.dispatchEvent(new CustomEvent('settings:mode', { detail: { mode } }));
      });
    });
    overlay.querySelectorAll('[data-modal-action="next-step"]').forEach((button) => {
      button.addEventListener('click', () => {
        overlay.dispatchEvent(new CustomEvent('settings:next-step'));
      });
    });
    const speed = overlay.querySelector('#mSpeed');
    if (speed) {
      speed.addEventListener('input', () => {
        overlay.dispatchEvent(new CustomEvent('settings:speed', {
          detail: { value: Number(speed.value) }
        }));
      });
    }
    const videoMode = overlay.querySelector('[data-modal-toggle="video-mode"]');
    if (videoMode) {
      videoMode.addEventListener('change', () => {
        overlay.dispatchEvent(new CustomEvent('settings:video-mode', {
          detail: { enabled: videoMode.checked }
        }));
      });
    }
    overlay.querySelectorAll('[data-modal-action="reset"]').forEach((button) => {
      button.addEventListener('click', () => {
        overlay.dispatchEvent(new CustomEvent('settings:reset'));
      });
    });
    return {
      open,
      close,
      toggle,
      setStepText(text) {
        const target = overlay.querySelector('#mStepTxt');
        if (target) target.textContent = text;
      },
      setMode(mode) {
        const target = overlay.querySelector('[data-mode="' + mode + '"]');
        if (target) target.click();
      },
      setVideoMode(enabled) {
        if (!videoMode) return;
        videoMode.checked = Boolean(enabled);
        videoMode.dispatchEvent(new Event('change', { bubbles: true }));
      }
    };
  }
  global.SettingsModal = { init: initSettingsModal };
})(window);

      const nl = Math.hypot(nx, ny) || 1;
      const bow = 0.16 * Math.hypot(p1.x - p0.x, p1.y - p0.y) * (i % 2 ? 1 : -1);
      const cp = { x: mx + nx / nl * bow, y: my + ny / nl * bow };
      quadDraw(g, p0, cp, p1, ap * 1.15, C.accentBorder, 1.8, [6, 6]);
      if (ap >= 1) {
        for (let d = 0; d < 2; d++) {
          const tt = (pulse * 0.28 + i * 0.5 + d * 0.5) % 1;
          const q = quadPt(p0, cp, p1, 1 - tt);
          g.save();
          glowOn(g, C.glow, 10);
          g.fillStyle = C.accent;
          g.beginPath();
          g.arc(q.x, q.y, Math.max(2.5, 4 * u), 0, Math.PI * 2);
          g.fill();
          g.restore();
        }
      }
      if (ap > 0) {
        const k = bo(ap);
        g.save();
        g.globalAlpha = clamp(ap * 1.6, 0, 1);
        g.translate(s.x, s.y);
        g.scale(k, k);
        g.translate(-s.x, -s.y);
        g.fillStyle = C.panel;
        g.strokeStyle = C.w14;
        g.lineWidth = 1.6;
        g.beginPath();
        g.arc(s.x, s.y, sr, 0, Math.PI * 2);
        g.fill();
        g.stroke();
        s.ic(g, s.x, s.y, sr * 0.9, 1);
        g.restore();
        txtA(g, s.l, s.x, s.y + sr + Math.max(14, 18 * u), Math.max(12, 14 * u), 800, C.text, 'center', 'alphabetic', seg(p, 0.26 + i * 0.12, 0.40 + i * 0.12));
      }
    });
    const hk = bo(seg(p, 0.02, 0.16));
    if (hk > 0) {
      g.save();
      g.globalAlpha = eo(seg(p, 0.02, 0.14));
      g.translate(hub.x, hub.y);
      g.scale(hk, hk);
      g.translate(-hub.x, -hub.y);
      glowOn(g, C.glow, 26 + 10 * Math.sin(pulse * 2));
      cyl(g, hub.x - hw / 2, hub.y - hh / 2, hw, hh);
      glowOff(g);
      g.restore();
      txtA(g, 'База данных', hub.x, hub.y + hh / 2 + Math.max(16, 20 * u), Math.max(12, 14 * u), 800, C.accent, 'center', 'alphabetic', seg(p, 0.16, 0.30));
    }
  }
  function sceneSafety(g, w, h, p, pulse, bl) {
    const H = bl > 0 ? h * (1 - bl) : h;
    const land = bl > 0 || w >= h * 1.05;
    const u = Math.min(1.75, Math.min(w, H) / 430);
    const mw = clamp(Math.min(w, H) * 0.17, 58, 130);
    const mh = mw * 1.2;
    const bw = mw * 0.78, bh = bw * 1.2;
    const main = land ? { x: w * 0.32, y: H * 0.52 } : { x: w * 0.5, y: H * (0.28 - bl * 0.28) };
    const bak = land ? { x: w * 0.74, y: H * 0.52 } : { x: w * 0.5, y: H * (0.72 - bl * 0.36) };
    const mk = bo(seg(p, 0.02, 0.18));
    if (mk > 0) {
      g.save();
      g.globalAlpha = eo(seg(p, 0.02, 0.14));
      g.translate(main.x, main.y);
      g.scale(mk, mk);
      g.translate(-main.x, -main.y);
      glowOn(g, C.glow, 24 + 8 * Math.sin(pulse * 2));
      cyl(g, main.x - mw / 2, main.y - mh / 2, mw, mh);
      glowOff(g);
      g.restore();
    }
    txtA(g, 'База данных', main.x, main.y + mh / 2 + Math.max(14, 18 * u), Math.max(12, 14 * u), 800, C.text, 'center', 'alphabetic', eo(seg(p, 0.10, 0.22)));
    const sh = seg(p, 0.16, 0.30), lk = seg(p, 0.30, 0.42), bp = seg(p, 0.42, 0.60), ar = seg(p, 0.60, 0.76);
    icoShield(g, land ? main.x + mw * 0.85 : main.x + mw * 0.88, land ? main.y - mh * 0.28 : main.y - mh * 0.1, mw * 0.62, bo(sh));
    icoLock(g, land ? main.x - mw * 0.85 : main.x - mw * 0.88, land ? main.y - mh * 0.28 : main.y - mh * 0.1, mw * 0.5, bo(lk));
    if (bp > 0) {
      g.save();
      g.globalAlpha = clamp(bp * 1.4, 0, 1);
      const k = bo(bp);
      g.translate(bak.x, bak.y);
      g.scale(k, k);
      g.translate(-bak.x, -bak.y);
      glowOn(g, C.glow, 14);
      cyl(g, bak.x - bw / 2, bak.y - bh / 2, bw, bh, true);
      glowOff(g);
      g.restore();
      txtA(g, 'Резервная копия', bak.x, bak.y + bh / 2 + Math.max(14, 18 * u), Math.max(12, 14 * u), 800, C.glowHi, 'center', 'alphabetic', seg(p, 0.52, 0.66));
    }
    if (ar > 0) {
      const p0 = land ? { x: main.x + mw / 2 + 6, y: main.y - mh * 0.18 } : { x: main.x + mw * 0.55, y: main.y + mh / 2 + 4 };
      const p1 = land ? { x: bak.x - bw / 2 - 8, y: bak.y - bh * 0.18 } : { x: bak.x + bw * 0.35, y: bak.y - bh / 2 - 8 };
      const cp = land ? { x: (p0.x + p1.x) / 2, y: Math.min(p0.y, p1.y) - H * 0.10 } : { x: p0.x + w * 0.16, y: (p0.y + p1.y) / 2 };
      quadDraw(g, p0, cp, p1, ar, C.accentBorder, 2, [8, 7], -pulse * 30);
      if (ar >= 0.999) {
        const qa = quadPt(p0, cp, p1, 0.985), qb = quadPt(p0, cp, p1, 1);
        arrowHead(g, qb.x, qb.y, Math.atan2(qb.y - qa.y, qb.x - qa.x), 10, C.accent);
      }
      if (ar >= 1) {
        for (let d = 0; d < 3; d++) {
          const tt = (pulse * 0.3 + d / 3) % 1;
          const q = quadPt(p0, cp, p1, tt);
          g.save();
          glowOn(g, C.glow, 10);
          g.fillStyle = C.accent;
          g.beginPath();
          g.arc(q.x, q.y, Math.max(2.5, 4 * u), 0, Math.PI * 2);
          g.fill();
          g.restore();
        }
      }
      txtA(g, 'Копирование', land ? (p0.x + p1.x) / 2 : cp.x + 12, land ? cp.y - 14 : (p0.y + p1.y) / 2, Math.max(11, 13 * u), 700, C.muted, 'center', 'middle', seg(p, 0.64, 0.78));
    }
  }
  const SCENES = [
    { intro: 2.0, draw: scenePurpose },
    { intro: 2.2, draw: sceneModels },
    { intro: 2.6, draw: sceneAnatomy },
    { intro: 2.9, draw: sceneSQL },
    { intro: 2.2, draw: sceneApps },
    { intro: 2.2, draw: sceneSafety }
  ];
  const STEP_TOTAL = 7;
  const TRANS_DUR = 0.65;
  const AUTO_DELAY = 500;
  const state = { mode: 'auto', isPlaying: false, currentStep: 0, speed: 1, videoMode: false, stepTime: 0, transition: null, pulse: 0 };
  const view = { w: 0, h: 0 };
  let g = null, modal = null, lastMobile = null, lastFW = 0, lastFH = 0, lastTs = 0;
  const cv = document.getElementById('cv');
  const stageWrap = document.getElementById('stageWrap');
  const canvasBox = document.getElementById('canvasBox');
  const frameBox = document.getElementById('frameBox');
  const frameSubsSlot = document.getElementById('frameSubsSlot');
  const framePanelSlot = document.getElementById('framePanelSlot');
  const side = document.getElementById('side');
  const bottomBar = document.getElementById('bottomBar');
  const subtitleBox = document.getElementById('subtitleBox');
  const panel = document.getElementById('panel');
  const btnPlay = document.getElementById('btnPlay');
  const btnGear = document.getElementById('btnGear');
  const icPlay = document.getElementById('icPlay');
  const icPause = document.getElementById('icPause');
  const mw = document.getElementById('modalWrap');
  function drawBackdrop(w, h) {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, C.bgGrad);
    gr.addColorStop(1, C.bg);
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);
    g.fillStyle = C.w06;
    for (let x = 13; x < w; x += 26) for (let y = 13; y < h; y += 26) g.fillRect(x, y, 2, 2);
  }
  function drawScene(sc, p) { sc.draw(g, view.w, view.h, p, state.pulse, state.videoMode ? 0.5 : 0); }
  function draw() {
    const w = view.w, h = view.h;
    if (w < 2 || h < 2) return;
    drawBackdrop(w, h);
    const sc = SCENES[state.currentStep];
    if (state.transition) {
      const t = eio(clamp(state.transition.t, 0, 1));
      const prev = SCENES[state.transition.from];
      g.save();
      g.globalAlpha = 1 - t;
      drawScene(prev, 1);
      g.restore();
      if (t > 0.02) {
        g.save();
        g.globalAlpha = t;
        const k = 0.985 + 0.015 * t;
        g.translate(w / 2, h / 2);
        g.scale(k, k);
        g.translate(-w / 2, -h / 2);
        drawScene(sc, Math.min(1, state.stepTime / sc.intro));
        g.restore();
      }
    } else {
      drawScene(sc, Math.min(1, state.stepTime / sc.intro));
    }
  }
  function update(dt) {
    if (!state.isPlaying) return;
    const d = dt * state.speed;
    state.pulse += d;
    if (state.transition) {
      state.transition.t += d / TRANS_DUR;
      if (state.transition.t >= 1) {
        state.transition = null;
        syncSettingsUI();
      }
    }
    state.stepTime += d;
    if (state.mode === 'step') {
      if (!state.transition && state.stepTime >= SCENES[state.currentStep].intro) {
        setPlaying(false);
        syncSettingsUI();
      }
    } else if (!state.transition && state.stepTime >= STEP_TOTAL) {
      beginTransition((state.currentStep + 1) % SCENES.length);
    }
  }
  function beginTransition(target) {
    state.transition = { from: state.currentStep, t: 0 };
    state.currentStep = target;
    state.stepTime = 0;
    updateSubtitles(target);
    syncSettingsUI();
  }
  function startAuto() {
    state.mode = 'auto';
    setPlaying(true);
    syncSettingsUI();
  }
  function onStep() {
    if (state.mode !== 'step' || state.transition || state.currentStep >= SCENES.length - 1) return;
    beginTransition(state.currentStep + 1);
    setPlaying(true);
  }
  function setMode(m) {
    if (state.mode === m) return;
    state.mode = m;
    if (m === 'step') {
      state.transition = null;
      state.stepTime = Math.max(state.stepTime, SCENES[state.currentStep].intro);
      setPlaying(false);
    } else {
      setPlaying(true);
    }
    syncSettingsUI();
  }
  function setSpeed(v) { state.speed = v; syncSettingsUI(); }
  function setPlaying(v) { state.isPlaying = v; renderControls(); }
  function reset() {
    state.mode = 'auto';
    state.currentStep = 0;
    state.stepTime = 0;
    state.transition = null;
    updateSubtitles(0);
    setPlaying(true);
    syncSettingsUI();
  }
  function toggleVideoMode() {
    state.videoMode = !state.videoMode;
    relayout();
    syncSettingsUI();
  }
  function openSettings() { syncSettingsUI(); modal.open(); }
  function closeSettings() { modal.close(); }
  function updateSubtitles(step) {
    const data = SUBS[step];
    if (!data) return;
    subtitleBox.textContent = '';
    const inner = document.createElement('span');
    inner.className = 'subinner';
    data.segments.forEach(s => {
      if (s.emphasis) {
        const el = document.createElement('span');
        el.className = 'subtitle__keyword';
        el.textContent = s.text;
        inner.appendChild(el);
      } else {
        inner.appendChild(document.createTextNode(s.text));
      }
    });
    subtitleBox.appendChild(inner);
  }
  function handleInput(e) {
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.code === 'Escape') return;
    if (e.code === 'Space') {
      if (tag === 'BUTTON' || mw.classList.contains('open')) return;
      e.preventDefault();
      document.body.classList.toggle('controls-hidden');
      return;
    }
    if (e.code === 'ArrowRight') {
      if (state.mode === 'step') { e.preventDefault(); onStep(); }
      return;
    }
    if (e.code === 'KeyR') { e.preventDefault(); reset(); return; }
    if (e.code === 'KeyS') { e.preventDefault(); setMode(state.mode === 'auto' ? 'step' : 'auto'); return; }
    if (e.code === 'KeyV') { e.preventDefault(); toggleVideoMode(); return; }
  }
  function renderControls() {
    icPlay.hidden = state.isPlaying;
    icPause.hidden = !state.isPlaying;
    btnPlay.setAttribute('aria-label', state.isPlaying ? 'Пауза' : 'Воспроизведение');
  }
  function syncSettingsUI() {
    if (!modal) return;
    modal.setStepText('Шаг ' + (state.currentStep + 1) + ' / ' + SCENES.length);
    mw.querySelectorAll('[data-mode]').forEach(b => {
      const a = b.dataset.mode === state.mode;
      b.classList.toggle('active', a);
      b.setAttribute('aria-pressed', String(a));
    });
    const nx = mw.querySelector('[data-modal-action="next-step"]');
    if (nx) nx.disabled = !(state.mode === 'step' && !state.transition && state.currentStep < SCENES.length - 1);
    mw.querySelectorAll('[data-speed]').forEach(b => {
      const a = Math.abs(Number(b.dataset.speed) - state.speed) < 1e-6;
      b.classList.toggle('active', a);
      b.setAttribute('aria-pressed', String(a));
    });
    const nine = mw.querySelector('[data-modal-toggle="video-mode"]');
    if (nine) nine.checked = state.videoMode;
  }
  function relayout() {
    const mobile = window.innerWidth < 768;
    document.body.classList.toggle('v916', state.videoMode);
    if (state.videoMode) {
      frameBox.insertBefore(cv, frameBox.firstChild);
      frameSubsSlot.appendChild(subtitleBox);
      framePanelSlot.appendChild(panel);
    } else {
      canvasBox.appendChild(cv);
      if (mobile) {
        bottomBar.appendChild(subtitleBox);
        bottomBar.appendChild(panel);
      } else {
        side.appendChild(subtitleBox);
        stageWrap.appendChild(panel);
      }
    }
    lastMobile = mobile;
    resize();
  }
  function resize() {
    if (state.videoMode) {
      const r = stageWrap.getBoundingClientRect();
      const pad = 16;
      let fh = r.height - pad * 2, fw = fh * 9 / 16;
      if (fw > r.width - pad * 2) { fw = r.width - pad * 2; fh = fw * 16 / 9; }
      fh = Math.max(120, Math.floor(fh));
      fw = Math.floor(fw);
      if (fh !== lastFH || fw !== lastFW) {
        frameBox.style.width = fw + 'px';
        frameBox.style.height = fh + 'px';
        lastFW = fw;
        lastFH = fh;
      }
    }
    const cr = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(cr.width)), h = Math.max(1, Math.round(cr.height));
    const bw2 = Math.round(w * dpr), bh2 = Math.round(h * dpr);
    if (cv.width !== bw2 || cv.height !== bh2) { cv.width = bw2; cv.height = bh2; }
    view.w = w;
    view.h = h;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  function init() {
    const nodes = [cv, stageWrap, canvasBox, frameBox, frameSubsSlot, framePanelSlot, side, bottomBar, subtitleBox, panel, btnPlay, btnGear, icPlay, icPause, mw];
    for (const el of nodes) if (!el) throw new Error('Missing DOM node');
    g = cv.getContext('2d');
    if (!g) throw new Error('Canvas 2D context unavailable');
    modal = SettingsModal.init();
    mw.addEventListener('settings:mode', e => setMode(e.detail.mode));
    mw.addEventListener('settings:next-step', () => onStep());
    mw.addEventListener('settings:speed', e => setSpeed(e.detail.value));
    mw.addEventListener('settings:video-mode', e => { if (e.detail.enabled !== state.videoMode) toggleVideoMode(); });
    mw.addEventListener('settings:reset', () => reset());
    mw.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
    btnPlay.addEventListener('click', () => setPlaying(!state.isPlaying));
    btnGear.addEventListener('click', () => { mw.classList.contains('open') ? closeSettings() : openSettings(); });
    document.addEventListener('keydown', handleInput);
    const ro = new ResizeObserver(() => resize());
    ro.observe(stageWrap);
    ro.observe(canvasBox);
    ro.observe(frameBox);
    window.addEventListener('resize', () => {
      const m = window.innerWidth < 768;
      if (!state.videoMode && m !== lastMobile) relayout();
      else resize();
    });
    relayout();
    updateSubtitles(0);
    syncSettingsUI();
    renderControls();
    lastTs = performance.now();
    requestAnimationFrame(frame);
    setTimeout(() => { startAuto(); }, AUTO_DELAY);
  }
  function boot() {
    try {
      init();
    } catch (err) {
      console.error(err);
      const f = document.getElementById('fatal');
      if (f) f.hidden = false;
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
