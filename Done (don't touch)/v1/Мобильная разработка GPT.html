<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F0F13" />
    <title>Мобильная разработка — интерактив</title>
    <style>
      :root {
        --ui-bg: #0f0f13;
        --ui-bg-gradient: #111118;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #cfcfcf;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-shadow-strong: rgba(46, 172, 101, 0.35);
        --ui-accent-ambient-1: rgba(46, 172, 101, 0.34);
        --ui-accent-ambient-2: rgba(30, 122, 71, 0.3);
        --ui-accent-ambient-3: rgba(20, 80, 45, 0.38);
        --ui-accent-halo: rgba(46, 172, 101, 0.14);
        --ui-danger: #e5484d;
        --ui-danger-hover-border: rgba(229, 72, 77, 0.6);
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-border-faint: rgba(255, 255, 255, 0.08);
        --ui-scrim-strong: rgba(0, 0, 0, 0.65);
        --ui-surface-inset: rgba(0, 0, 0, 0.35);
        --ui-shadow-text: rgba(0, 0, 0, 0.8);
        --ui-ambient-blur: 90px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--ui-text);
        background: var(--ui-bg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }

      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }

      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }

      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }

      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }

      body.v916 #ambient {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #ambient .b1,
        #ambient .b2,
        #ambient .b3 {
          animation: none;
        }
      }

      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--ui-modal-scrim);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      #modalWrap.open {
        display: flex;
      }

      #modal {
        width: min(92vw, 380px);
        max-height: 82vh;
        max-height: 82dvh;
        overflow: auto;
        color: var(--ui-text);
        background: var(--ui-modal-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        outline: none;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }

      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }

      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }

      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      .seg button {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }

      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }

      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }

      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }

      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }

      #mSpeed {
        flex: 1.4;
        accent-color: var(--ui-accent);
        min-width: 80px;
      }

      #mSpeedVal {
        min-width: 34px;
        color: var(--ui-text);
        text-align: right;
        font-size: 14px;
        font-weight: 800;
      }

      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 30px;
      }

      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .sw span {
        position: absolute;
        inset: 0;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }

      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }

      .sw input:checked + span {
        background: var(--ui-accent);
      }

      .sw input:checked + span::before {
        transform: translateX(22px);
      }

      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }

      #mReset {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;
      }

      #mReset:hover {
        border-color: var(--ui-danger-hover-border);
      }

      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }

      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }

      .keys i {
        font-style: normal;
      }

      body.modal-open {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        #modal {
          animation: none;
        }
      }

      :root {
        color-scheme: dark;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
      }
      #app {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: clamp(18px, 3vh, 34px) clamp(18px, 3vw, 42px);
        display: grid;
        place-items: stretch;
      }
      .frame {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas: "title subtitle" "visual subtitle" "visual controls";
        column-gap: clamp(18px, 2.5vw, 36px);
        row-gap: 0;
      }
      .app-header {
        grid-area: title;
        min-width: 0;
        padding: 0 0 14px;
        align-self: start;
      }
      .app-header h1 {
        margin: 0;
        color: var(--ui-text);
        font:
          800 clamp(21px, 2.35vw, 34px)/1.12 system-ui,
          sans-serif;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .visual {
        grid-area: visual;
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        position: relative;
      }
      #sceneCanvas {
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }
      .subtitle {
        grid-area: subtitle;
        align-self: stretch;
        min-width: 0;
        min-height: 116px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        padding: clamp(20px, 2vw, 30px);
        color: var(--ui-text);
        background: #00000080;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--ui-border-faint);
        border-radius: 22px;
        font:
          700 clamp(16px, 1.45vw, 21px)/1.45 system-ui,
          sans-serif;
        letter-spacing: -0.01em;
        text-wrap: pretty;
        overflow-wrap: anywhere;
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }
      .subtitle__keyword {
        color: var(--ui-accent);
        font-weight: 800;
      }
      .subtitle.is-changing {
        opacity: 0.25;
        transform: translateY(5px);
      }
      .controls {
        grid-area: controls;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 18px;
        transition: opacity 0.2s ease;
      }
      .controls.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .control-button {
        appearance: none;
        -webkit-appearance: none;
        box-sizing: border-box;
        width: 56px;
        height: 56px;
        min-width: 48px;
        min-height: 48px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        border: 1px solid var(--ui-border-soft);
        color: var(--ui-text);
        background: var(--ui-panel);
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 0.16s ease,
          background 0.16s ease,
          box-shadow 0.16s ease,
          border-color 0.16s ease;
      }
      .control-button.primary {
        color: var(--ui-text);
        background: linear-gradient(
          140deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 8px 28px var(--ui-accent-shadow);
      }
      .control-button:disabled {
        opacity: 0.38;
        cursor: not-allowed;
        box-shadow: none;
      }
      .control-button:active:not(:disabled) {
        transform: scale(0.96);
      }
      .control-button:focus-visible,
      #modal button:focus-visible,
      #mSpeed:focus-visible {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      @media (hover: hover) {
        .control-button:hover:not(:disabled) {
          transform: translateY(-2px);
          border-color: var(--ui-accent-border);
        }
        .control-button.primary:hover:not(:disabled) {
          box-shadow: 0 10px 32px var(--ui-accent-shadow-strong);
        }
      }
      .control-button svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .control-button .icon-play,
      .control-button .icon-pause {
        display: none;
      }
      .control-button[data-state="playing"] .icon-pause,
      .control-button[data-state="transition-playing"] .icon-pause {
        display: block;
      }
      .control-button[data-state="paused"] .icon-play,
      .control-button[data-state="transition-paused"] .icon-play {
        display: block;
      }
      .control-button[data-state="idle"] .icon-play {
        display: block;
      }
      #modal {
        max-height: 90dvh;
      }
      .modal-close {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }
      .seg button {
        min-height: 48px;
      }
      #mReset {
        min-height: 48px;
      }
      #mSpeed {
        flex: 1.4;
        min-width: 92px;
        min-height: 42px;
        padding: 0 10px;
        color: var(--ui-text);
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-soft);
        border-radius: 10px;
        font:
          700 14px system-ui,
          sans-serif;
      }
      #ambient {
        pointer-events: none;
      }
      body.v916 #app {
        isolation: isolate;
      }
      body.v916 .frame {
        position: relative;
        box-sizing: border-box;
        overflow: hidden;
        border: 1px solid var(--ui-accent-border);
        border-radius: 26px;
        background: var(--ui-panel-glass);
        box-shadow:
          0 0 38px var(--ui-accent-halo),
          inset 0 0 28px var(--ui-white-06);
        padding: clamp(12px, 2vw, 20px);
      }
      body.v916 .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid var(--ui-white-08);
        pointer-events: none;
      }
      body.v916 .subtitle {
        background: var(--ui-scrim-strong);
        border-color: var(--ui-white-10);
      }
      body.v916 .visual {
        border-radius: 16px;
      }
      @media (max-width: 767px) {
        #ambient {
          display: none !important;
        }
        #app {
          position: absolute;
          top: 0;
          left: 0;
          width: calc(100vw - 80px - env(safe-area-inset-right, 0px));
          height: calc(100vh - 25vh);
          height: calc(100dvh - 25vh - env(safe-area-inset-bottom, 0px));
          padding: max(16px, env(safe-area-inset-top, 0px)) 8px 8px
            max(16px, env(safe-area-inset-left, 0px));
          overflow: hidden;
        }
        .frame {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr) auto auto;
          grid-template-areas: "title" "visual" "subtitle" "controls";
          column-gap: 0;
          row-gap: 0;
        }
        .app-header {
          padding: 0 0 8px;
        }
        .app-header h1 {
          font-size: clamp(20px, 5.5vw, 26px);
        }
        .visual {
          min-height: 0;
        }
        .subtitle {
          min-height: 64px;
          max-height: 104px;
          margin-bottom: 24px;
          padding: 12px 14px;
          border-radius: 16px;
          font-size: clamp(16px, 4.5vw, 22px);
          line-height: 1.3;
        }
        .controls {
          justify-content: center;
          gap: 14px;
          padding: 0;
        }
        .control-button {
          width: 52px;
          height: 52px;
          border-radius: 16px;
        }
        #app.video-mode {
          display: grid;
          place-items: center;
        }
        #app.video-mode .frame {
          width: min(100%, 56.25dvh);
          height: auto;
          max-height: 100%;
          aspect-ratio: 9 / 16;
        }
        body.v916 .frame {
          padding: 12px;
        }
        body.v916 .app-header {
          padding-bottom: 6px;
        }
        body.v916 .subtitle {
          margin-bottom: 12px;
          min-height: 58px;
          padding: 9px 11px;
          font-size: clamp(16px, 4.5vw, 22px);
        }
        body.v916 .controls {
          gap: 10px;
        }
        body.v916 .control-button {
          width: 48px;
          height: 48px;
        }
        #modal {
          width: min(92vw, 380px);
        }
      }
      @media (min-width: 768px) {
        #app.video-mode {
          display: grid;
          place-items: center;
        }
        #app.video-mode .frame {
          width: min(100%, 56.25dvh);
          height: auto;
          max-height: 100%;
          aspect-ratio: 9 / 16;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr) auto auto;
          grid-template-areas: "title" "visual" "subtitle" "controls";
          gap: 0;
        }
        #app.video-mode .app-header {
          padding-bottom: 8px;
        }
        #app.video-mode .app-header h1 {
          font-size: clamp(18px, 2vw, 26px);
        }
        #app.video-mode .subtitle {
          min-height: 68px;
          margin-bottom: 14px;
          font-size: clamp(16px, 4.5vw, 22px);
          padding: 12px;
        }
        #app.video-mode .controls {
          padding: 0;
          justify-content: center;
          gap: 10px;
        }
      }
      .sw {
        height: 48px;
      }
      .sw span {
        inset: 9px 0;
      }
      #app {
        container-type: size;
      }
      #app.video-mode .frame {
        width: min(100cqw, calc(100cqh * 9 / 16));
        height: min(100cqh, calc(100cqw * 16 / 9));
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 9 / 16;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i>
      <i class="b2"></i>
      <i class="b3"></i>
    </div>

    <main id="app">
      <div class="frame" id="frame">
        <header class="app-header"><h1>Мобильная разработка</h1></header>
        <section
          class="visual"
          id="visual"
          aria-label="Анимированная схема этапа мобильной разработки"
        >
          <canvas
            id="sceneCanvas"
            aria-label="Визуализация текущего этапа мобильной разработки"
          ></canvas>
        </section>
        <div
          class="subtitle"
          id="subtitle"
          role="status"
          aria-live="polite"
        ></div>
        <footer
          class="controls"
          id="controls"
          aria-label="Управление воспроизведением"
        >
          <button
            class="control-button primary"
            id="playButton"
            type="button"
            data-state="playing"
            aria-label="Приостановить воспроизведение"
            title="Приостановить воспроизведение"
          >
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.5v13l10-6.5z" fill="currentColor" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5h4v14H7zM14 5h4v14h-4z" fill="currentColor" />
            </svg>
          </button>
          <button
            class="control-button js-gear"
            id="settingsButton"
            type="button"
            aria-label="Открыть настройки"
            title="Настройки"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path

    <script>
      (function (global) {
        "use strict";

        function initSettingsModal(options) {
          const config = Object.assign(
            {
              overlaySelector: "#modalWrap",
              dialogSelector: "#modal",
              openSelector: ".js-gear",
              closeSelector: "[data-modal-close]",
            },
            options || {},
          );

          const overlay = document.querySelector(config.overlaySelector);
          if (!overlay)
            throw new Error(
              "Settings modal overlay not found: " + config.overlaySelector,
            );

          const dialog =
            overlay.querySelector(config.dialogSelector) ||
            overlay.querySelector('[role="dialog"]');
          if (!dialog) throw new Error("Settings modal dialog not found.");

          const openers = Array.from(
            document.querySelectorAll(config.openSelector),
          );
          const closers = Array.from(
            overlay.querySelectorAll(config.closeSelector),
          );
          let previouslyFocused = null;

          function open() {
            if (overlay.classList.contains("open")) return;
            previouslyFocused = document.activeElement;
            overlay.classList.add("open");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            dialog.focus();
          }

          function close() {
            if (!overlay.classList.contains("open")) return;
            overlay.classList.remove("open");
            overlay.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
            if (
              previouslyFocused &&
              typeof previouslyFocused.focus === "function"
            ) {
              previouslyFocused.focus();
            }
          }

          function toggle() {
            overlay.classList.contains("open") ? close() : open();
          }

          openers.forEach((button) => button.addEventListener("click", toggle));
          closers.forEach((button) => button.addEventListener("click", close));

          overlay.addEventListener("click", (event) => {
            if (event.target === overlay) close();
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && overlay.classList.contains("open")) {
              close();
            }
          });

          overlay.querySelectorAll("[data-mode]").forEach((button) => {
            button.addEventListener("click", () => {
              const mode = button.dataset.mode;
              overlay.querySelectorAll("[data-mode]").forEach((item) => {
                const active = item === button;
                item.classList.toggle("active", active);
                item.setAttribute("aria-pressed", String(active));
              });
              const next = overlay.querySelector(
                '[data-modal-action="next-step"]',
              );
              if (next) next.disabled = mode !== "step";
              overlay.dispatchEvent(
                new CustomEvent("settings:mode", { detail: { mode } }),
              );
            });
          });

          overlay
            .querySelectorAll('[data-modal-action="next-step"]')
            .forEach((button) => {
              button.addEventListener("click", () => {
                overlay.dispatchEvent(new CustomEvent("settings:next-step"));
              });
            });

          const speed = overlay.querySelector("#mSpeed");
          const speedValue = overlay.querySelector("#mSpeedVal");
          if (speed) {
            speed.addEventListener("input", () => {
              if (speedValue) speedValue.textContent = speed.value + "x";
              overlay.dispatchEvent(
                new CustomEvent("settings:speed", {
                  detail: { value: Number(speed.value) },
                }),
              );
            });
          }

          const videoMode = overlay.querySelector(
            '[data-modal-toggle="video-mode"]',
          );
          if (videoMode) {
            videoMode.addEventListener("change", () => {
              overlay.dispatchEvent(
                new CustomEvent("settings:video-mode", {
                  detail: { enabled: videoMode.checked },
                }),
              );
            });
          }

          overlay
            .querySelectorAll('[data-modal-action="reset"]')
            .forEach((button) => {
              button.addEventListener("click", () => {
                overlay.dispatchEvent(new CustomEvent("settings:reset"));
              });
            });

          return {
            open,
            close,
            toggle,
            setStepText(text) {
              const target = overlay.querySelector("#mStepTxt");
              if (target) target.textContent = text;
            },
            setMode(mode) {
              const target = overlay.querySelector(
                '[data-mode="' + mode + '"]',
              );
              if (target) target.click();
            },
            setSpeed(value) {
              if (!speed) return;
              speed.value = String(value);
              speed.dispatchEvent(new Event("input", { bubbles: true }));
            },
            setVideoMode(enabled) {
              if (!videoMode) return;
              videoMode.checked = Boolean(enabled);
              videoMode.dispatchEvent(new Event("change", { bubbles: true }));
            },
          };
        }

        global.SettingsModal = { init: initSettingsModal };
      })(window);
    </script>

        function hexRgba(color, alpha) {

        function initPalette() {

            accentDark: getToken("--ui-accent-dark", "#1E7A47"),

            grid: getToken("--ui-white-06", "rgba(255,255,255,.06)"),

        function roundedRect(x, y, w, h, r, fill, stroke, lineWidth = 2) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
        }

        function line(
          x1,
          y1,
          x2,
          y2,
          color = palette.border,
          lineWidth = 3,
          dash = [],
        ) {
          ctx.beginPath();
          ctx.setLineDash(dash);
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = "round";
          ctx.stroke();
          ctx.setLineDash([]);
        }

        function arrow(x1, y1, x2, y2, progress = 1, color = palette.accent) {
          if (progress < 0.12) return;
          const x = x1 + (x2 - x1) * Math.max(0, Math.min(1, progress));
          const y = y1 + (y2 - y1) * Math.max(0, Math.min(1, progress));
          line(x1, y1, x, y, color, 4);
          if (progress > 0.88) {
            const a = Math.atan2(y2 - y1, x2 - x1);

            ctx.rotate(a);
            ctx.beginPath();
            ctx.moveTo(-13, -8);
            ctx.lineTo(0, 0);
            ctx.lineTo(-13, 8);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke();
            ctx.restore();
          }
        }

          text,
          x,
          y,
          size = 20,
          color = palette.text,
          weight = 700,
          align = "center",

          ctx.font = `${weight} ${size}px system-ui, sans-serif`;

        const sceneDrawers = [

        function draw() {
          if (!ctx || !el.canvas) return;
          const rect = el.canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          const portrait = rect.height >= rect.width;
          logicalWidth = portrait ? 600 : 900;
          logicalHeight = portrait ? 900 : 600;
          width = rect.width;
          height = rect.height;
          dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
          const scale = Math.min(width / logicalWidth, height / logicalHeight);
          const offsetX = (width - logicalWidth * scale) / 2;
          const offsetY = (height - logicalHeight * scale) / 2;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, width, height);
          ctx.save();
          ctx.translate(offsetX, offsetY);
          ctx.scale(scale, scale);
          background(logicalWidth, logicalHeight);
          const progress =
            state.mode === "auto"
              ? Math.min(1, state.elapsed / AUTO_STEP_MS)
              : state.isTransitioning
                ? Math.min(1, state.elapsed / STEP_TRANSITION_MS)
                : 1;
          sceneDrawers[state.currentStep](
            ease(progress),
            portrait,
            logicalWidth,
            logicalHeight,
          );
          ctx.restore();
        }

        function ease(value) {
          const t = Math.max(0, Math.min(1, value));
          return t * t * (3 - 2 * t);
        }

        function updateSubtitles(stepIndex) {
          const item = steps[stepIndex];
          if (!item || !el.subtitle) return;
          el.subtitle.classList.add("is-changing");
          requestAnimationFrame(() => {
            el.subtitle.replaceChildren();
            item.segments.forEach((segment) => {
              const span = document.createElement("span");
              if (segment.emphasis) span.className = "subtitle__keyword";
              span.textContent = segment.text;
              el.subtitle.appendChild(span);
            });
            requestAnimationFrame(() =>
              el.subtitle.classList.remove("is-changing"),
            );
          });
          if (modal) modal.setStepText(`Шаг ${item.step} / ${steps.length}`);
        }

        function renderControls() {
          if (modal) {
            modal.setStepText(`Шаг ${state.currentStep + 1} / ${steps.length}`);
            const next = document.getElementById("mNext");
            if (next)
              next.disabled =
                state.mode !== "step" ||
                state.isTransitioning ||
                state.currentStep === steps.length - 1;
            const speed = document.getElementById("mSpeed");
            if (speed && Number(speed.value) !== state.speed)
              speed.value = String(state.speed);
            const video = document.getElementById("mNine");
            if (video) video.checked = state.videoMode;
          }
          const play = el.play;
          if (play) {
            let mode = "idle";
            let labelText =
              "В режиме STEP переход запускается кнопкой «Следующий шаг»";
            if (state.mode === "auto") {
              mode = state.isPlaying ? "playing" : "paused";
              labelText = state.isPlaying
                ? "Приостановить воспроизведение"
                : "Продолжить воспроизведение";
            } else if (state.isTransitioning) {
              mode = state.isPlaying
                ? "transition-playing"
                : "transition-paused";
              labelText = state.isPlaying
                ? "Приостановить переход"
                : "Продолжить переход";
            }
            play.dataset.state = mode;
            play.setAttribute("aria-label", labelText);
            play.title = labelText;
            play.disabled = state.mode === "step" && !state.isTransitioning;
          }
          el.controls.classList.toggle("is-hidden", state.controlsHidden);
          el.frame.classList.toggle("video-mode", state.videoMode);
          el.app.classList.toggle("video-mode", state.videoMode);
          document.body.classList.toggle("v916", state.videoMode);
        }

        function setPlaying(value) {
          if (state.mode === "step" && !state.isTransitioning) return;
          state.isPlaying = Boolean(value);
          renderControls();
        }

        function togglePlaying() {
          if (state.mode === "step" && !state.isTransitioning) return;
          setPlaying(!state.isPlaying);
        }

        function startAuto() {
          state.mode = "auto";
          state.isPlaying = true;
          state.isTransitioning = false;
          state.elapsed = 0;
          renderControls();
        }

        function setMode(mode) {
          if (mode !== "auto" && mode !== "step") return;
          if (state.mode === mode) return;
          state.mode = mode;
          state.elapsed = 0;
          state.isTransitioning = false;
          if (mode === "auto") {
            state.isPlaying = true;
          } else {
            state.isPlaying = false;
          }
          renderControls();
        }

        function onStep() {
          if (state.currentStep < steps.length - 1) state.currentStep += 1;
          else if (state.mode === "auto") state.currentStep = 0;
          state.elapsed = 0;
          state.isTransitioning = true;
          state.isPlaying = true;
          updateSubtitles(state.currentStep);
          renderControls();
        }

        function nextStep() {
          if (
            state.mode !== "step" ||
            state.isTransitioning ||
            state.currentStep >= steps.length - 1
          )
            return;
          onStep();
        }

        function reset() {
          state.mode = "auto";
          state.currentStep = 0;
          state.elapsed = 0;
          state.isTransitioning = false;
          state.isPlaying = true;
          updateSubtitles(0);
          renderControls();
        }

        function setSpeed(value) {
          const allowed = [0.5, 1, 2];
          const nearest = allowed.reduce(
            (best, item) =>
              Math.abs(item - value) < Math.abs(best - value) ? item : best,
            allowed[0],
          );
          state.speed = nearest;
          renderControls();
        }

        function toggleVideoMode() {
          state.videoMode = !state.videoMode;
          renderControls();
          requestAnimationFrame(resize);
        }

        function openSettings() {
          if (modal) modal.open();
        }

        function closeSettings() {
          if (modal) modal.close();
        }

        function resize() {
          const rect = el.visual.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;
          const ratio = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
          const targetWidth = Math.round(rect.width * ratio);
          const targetHeight = Math.round(rect.height * ratio);
          if (
            el.canvas.width !== targetWidth ||
            el.canvas.height !== targetHeight
          ) {
            el.canvas.width = targetWidth;
            el.canvas.height = targetHeight;
          }
          draw();
        }

        function update(dt) {
          if (state.isPlaying && state.autoStarted) {
            const delta = dt * state.speed;
            state.elapsed += delta;
            if (state.mode === "auto") {
              while (state.elapsed >= AUTO_STEP_MS) {
                state.elapsed -= AUTO_STEP_MS;
                state.currentStep = (state.currentStep + 1) % steps.length;
                updateSubtitles(state.currentStep);
              }
            } else if (
              state.isTransitioning &&
              state.elapsed >= STEP_TRANSITION_MS
            ) {
              state.elapsed = STEP_TRANSITION_MS;
              state.isTransitioning = false;
              state.isPlaying = false;
              renderControls();
            }
          }
        }

        function handleInput(event) {
          const target = event.target;
          const editing =
            target &&
            (target.isContentEditable ||
              target.closest(
                'input, textarea, select, [contenteditable="true"]',
              ));
          if (editing) return;
          if (event.key === "Escape") {
            closeSettings();
            return;
          }
          if (window.matchMedia("(max-width: 767px)").matches) return;
          const key = event.key.toLowerCase();
          if (event.code === "Space") {
            event.preventDefault();
            state.controlsHidden = !state.controlsHidden;
            renderControls();
          } else if (event.key === "ArrowRight") {
            if (state.mode === "step") {
              event.preventDefault();
              nextStep();
            }
          } else if (key === "r") {
            reset();
          } else if (key === "s") {
            setMode(state.mode === "auto" ? "step" : "auto");
          } else if (key === "v") {
            toggleVideoMode();
          }
        }

        function animationFrame(timestamp) {
          if (!state.lastFrame) state.lastFrame = timestamp;
          const dt = Math.min(64, Math.max(0, timestamp - state.lastFrame));
          state.lastFrame = timestamp;
          update(dt);
          draw();
          requestAnimationFrame(animationFrame);
        }

        function init() {
          el.app = document.getElementById("app");
          el.frame = document.getElementById("frame");
          el.visual = document.getElementById("visual");
          el.canvas = document.getElementById("sceneCanvas");
          el.subtitle = document.getElementById("subtitle");
          el.controls = document.getElementById("controls");
          el.play = document.getElementById("playButton");
          el.settings = document.getElementById("settingsButton");

          if (
            !el.app ||
            !el.frame ||
            !el.visual ||
            !el.canvas ||
            !el.subtitle ||
            !el.controls ||
            !el.play ||
            !el.settings
          ) {
            console.error(
              "Не удалось инициализировать интерфейс мобильной разработки: отсутствуют обязательные элементы.",
            );
            return;
          }
          ctx = el.canvas.getContext("2d");
          if (!ctx) {
            el.subtitle.textContent =
              "Canvas недоступен в этом браузере. Обновите браузер для просмотра визуализации.";
            console.error("CanvasRenderingContext2D недоступен.");
            return;
          }
          initPalette();
          modal = window.SettingsModal.init();
          const overlay = document.getElementById("modalWrap");
          overlay.addEventListener("settings:mode", (event) =>
            setMode(event.detail.mode),
          );
          overlay.addEventListener("settings:next-step", nextStep);
          overlay.addEventListener("settings:speed", (event) =>
            setSpeed(event.detail.value),
          );
          overlay.addEventListener("settings:video-mode", (event) => {
            if (Boolean(event.detail.enabled) !== state.videoMode)
              toggleVideoMode();
          });
          overlay.addEventListener("settings:reset", reset);

          el.play.addEventListener("click", togglePlaying);
          el.settings.addEventListener("click", openSettings);
          document.addEventListener("keydown", handleInput);
          window.addEventListener("resize", resize, { passive: true });
          if ("ResizeObserver" in window) {
            observer = new ResizeObserver(resize);
            observer.observe(el.visual);
          }

          updateSubtitles(0);
          renderControls();
          resize();
          requestAnimationFrame(animationFrame);
          window.setTimeout(() => {
            state.autoStarted = true;
            state.isPlaying = true;
            renderControls();
          }, 500);
        }

        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", init, { once: true });
        else init();
      })();
    </script>
  </body>
</html>
