<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Веб-разработка</title>
    <style>
      :root {
        --ui-bg: #0f0f13;
        --ui-bg-gradient: #111118;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #cfcfcf;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-shadow-strong: rgba(46, 172, 101, 0.35);
        --ui-accent-ambient-1: rgba(46, 172, 101, 0.34);
        --ui-accent-ambient-2: rgba(30, 122, 71, 0.3);
        --ui-accent-ambient-3: rgba(20, 80, 45, 0.38);
        --ui-accent-halo: rgba(46, 172, 101, 0.14);
        --ui-danger: #e5484d;
        --ui-danger-hover-border: rgba(229, 72, 77, 0.6);
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-border-faint: rgba(255, 255, 255, 0.08);
        --ui-scrim-strong: rgba(0, 0, 0, 0.65);
        --ui-surface-inset: rgba(0, 0, 0, 0.35);
        --ui-shadow-text: rgba(0, 0, 0, 0.8);
        --ui-ambient-blur: 90px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--ui-text);
        background: var(--ui-bg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      button {
        font-family: inherit;
        color: inherit;
      }
      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }
      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }
      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }
      body.v916 #ambient {
        opacity: 1;
      }
      @media (max-width: 767.98px) {
        #ambient {
          inset: -10% calc(80px + env(safe-area-inset-right)) -10% -10%;
          overflow: hidden;
        }
        #ambient .b2 {
          right: 8%;
        }
      }
      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--ui-modal-scrim);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #modalWrap.open {
        display: flex;
      }
      #modalWrap.closing {
        opacity: 0;
        transition: opacity 0.18s;
      }
      #modalWrap.closing #modal {
        animation: unpop 0.18s ease both;
      }
      #modal {
        width: min(92vw, 380px);
        max-height: 90vh;
        max-height: 90dvh;
        overflow: auto;
        color: var(--ui-text);
        background: var(--ui-modal-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        outline: none;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes unpop {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }
      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }
      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      .seg button:not(.active):hover {
        background: var(--ui-white-10);
      }
      .seg.speed-seg {
        margin-bottom: 14px;
      }
      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }
      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 30px;
      }
      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }
      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }
      .sw input:checked + span {
        background: var(--ui-accent);
      }
      .sw input:checked + span::before {
        transform: translateX(22px);
      }
      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      #mReset {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;
      }
      #mReset:hover {
        border-color: var(--ui-danger-hover-border);
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }
      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }
      .keys i {
        font-style: normal;
      }
      body.modal-open {
        overflow: hidden;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--ui-accent);
        outline-offset: 2px;
      }
      #app {
        position: relative;
        z-index: 1;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding-top: calc(16px + env(safe-area-inset-top));
        padding-right: calc(80px + env(safe-area-inset-right));
        padding-bottom: calc(25vh + env(safe-area-inset-bottom));
        padding-left: calc(16px + env(safe-area-inset-left));
        gap: 12px;
      }
      #titleWrap {
        flex: 0 0 auto;
      }
      #titleWrap h1 {
        margin: 0;
        font-size: clamp(22px, 2vw + 12px, 30px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: 0.2px;
      }
      #stage {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
      #canvasWrap {
        position: absolute;
        inset: 0;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #frame {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #frame.on {
        display: flex;
      }
      #frameInner {
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        border: 1px solid var(--ui-border-faint);
        box-shadow: 0 0 70px var(--ui-accent-halo);
        background: var(--ui-bg);
      }
      #frameOverlay {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        z-index: 2;
      }
      #framePanel {
        display: flex;
        justify-content: center;
      }
      .slot {
        min-height: 0;
      }
      .slot:empty {
        display: none;
      }
      #subSlotMobile {
        display: flex;
      }
      #panelSlotMobile {
        display: flex;
        margin-top: 12px;
      }
      .subtitle {
        box-sizing: border-box;
        width: 100%;
        min-height: 3.4em;
        background: rgba(0, 0, 0, 0.5);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--ui-border-faint);
        border-radius: 14px;
        padding: 10px 14px;
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.35;
        font-weight: 700;
        color: var(--ui-text);
        display: flex;
        align-items: center;
      }
      .subtitle__inner {
        display: block;
        width: 100%;
      }
      .subtitle__keyword {
        color: var(--ui-accent);
        font-weight: 800;
      }
      .subtitle.show {
        animation: subIn 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #panel {
        display: flex;
        gap: 10px;
        padding: 8px;
        border-radius: 999px;
        background: var(--ui-panel-glass);
        border: 1px solid var(--ui-border-faint);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        width: max-content;
        transition:
          opacity 0.25s,
          visibility 0.25s;
      }
      .pbtn {
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-faint);
        color: var(--ui-text);
        cursor: pointer;
        padding: 0;
        transition:
          background 0.2s,
          transform 0.1s;
        touch-action: manipulation;
      }
      .pbtn:hover {
        background: var(--ui-accent-soft);
      }
      .pbtn:active {
        transform: scale(0.95);
      }
      .pbtn svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      body.controls-hidden #panel {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #sidebar {
        display: none;
      }
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: var(--ui-bg);
        color: var(--ui-text);
        font-weight: 700;
      }
      #fatal.on {
        display: flex;
      }
      @media (min-width: 768px) {
        #app {
          flex-direction: row;
          padding-top: calc(16px + env(safe-area-inset-top));
          padding-right: calc(16px + env(safe-area-inset-right));
          padding-bottom: calc(16px + env(safe-area-inset-bottom));
          padding-left: calc(16px + env(safe-area-inset-left));
          gap: 16px;
        }
        #sidebar {
          display: flex;
          flex-direction: column;
          gap: 14px;
          min-height: 0;
          width: clamp(320px, 30vw, 380px);
          flex: 0 0 clamp(320px, 30vw, 380px);
        }
        #subSlotMobile,
        #panelSlotMobile {
          display: none;
        }
        #subSlotDesk {
          display: flex;
        }
        #panelSlotDesk {
          display: flex;
          margin-top: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #ambient .b1,
        #ambient .b2,
        #ambient .b3 {
          animation: none;
        }
        #modal {
          animation: none;
        }
        .subtitle.show {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i>
    </div>
    <div id="app">
      <header id="titleWrap"><h1>Веб-разработка</h1></header>
      <div id="stage">
        <div id="canvasWrap">
          <canvas id="scene"></canvas>
          <div id="frame">
            <div id="frameInner">
              <div id="frameOverlay">
                <div id="framePanel" class="slot"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="subSlotMobile" class="slot"></div>
      <div id="panelSlotMobile" class="slot"></div>
      <aside id="sidebar">
        <div id="subSlotDesk" class="slot"></div>
        <div id="panelSlotDesk" class="slot"></div>
      </aside>
    </div>
    <div id="subs" class="subtitle" role="status" aria-live="polite"></div>
    <div id="panel">
      <button id="btnPlay" class="pbtn" type="button" aria-label="Пауза">
        <svg id="icPause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor" />
        </svg>
        <svg
          id="icPlay"
          viewBox="0 0 24 24"
          aria-hidden="true"
          style="display: none"
        >
          <path
            d="M8 5.3v13.4c0 .4.45.65.8.42l10.3-6.7a.5.5 0 0 0 0-.84L8.8 4.88a.5.5 0 0 0-.8.42z"
            fill="currentColor"
          />
        </svg>
      </button>
      <button
        id="btnGear"
        class="pbtn js-gear"
        type="button"
        aria-label="Настройки"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.75 8.84a.5.5 0 0 0 .12.64L4.9 11.06a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>
    <div id="modalWrap" aria-hidden="true">
      <section
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <header class="mhead">
          <h2 id="modalTitle">Настройки</h2>
          <button
            class="modal-close"
            id="mClose"
            type="button"
            data-modal-close
            aria-label="Закрыть"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="mstep" id="mStepTxt">Шаг 1 / 8</div>
        <div class="seg" role="group" aria-label="Режим воспроизведения">
          <button
            id="mAuto"
            class="active"
            type="button"
            data-mode="auto"
            aria-pressed="true"
          >
            AUTO
          </button>
          <button
            id="mStepBtn"
            type="button"
            data-mode="step"
            aria-pressed="false"
          >
            STEP
          </button>
        </div>
        <button id="mNext" type="button" data-modal-action="next-step" disabled>
          Следующий шаг ▶
        </button>
        <div class="seg speed-seg" role="group" aria-label="Скорость">
          <button type="button" data-speed="0.5" aria-pressed="false">
            0.5×
          </button>
          <button
            type="button"
            data-speed="1"
            class="active"
            aria-pressed="true"
          >
            1×
          </button>
          <button type="button" data-speed="2" aria-pressed="false">2×</button>
        </div>
        <div class="mrow">
          <span class="mlabel" id="mNineLabel">Режим 9:16</span>
          <label class="sw" aria-labelledby="mNineLabel">
            <input type="checkbox" id="mNine" data-modal-toggle="video-mode" />
            <span aria-hidden="true"></span>
          </label>
        </div>
        <button id="mReset" type="button" data-modal-action="reset">
          Reset
        </button>
        <div class="keys" aria-label="Горячие клавиши">
          <span>Space</span><i>скрыть панель</i> <span>→</span
          ><i>следующий шаг</i> <span>R</span><i>reset</i> <span>S</span
          ><i>AUTO/STEP</i> <span>V</span><i>режим 9:16</i> <span>Esc</span
          ><i>закрыть</i>
        </div>
      </section>
    </div>
    <div id="fatal">
      Не удалось запустить визуализацию. Откройте файл в современном браузере с
      поддержкой Canvas.
    </div>
    <script>
      (function (global) {
        "use strict";

        function initSettingsModal(options) {
          const config = Object.assign(
            {
              overlaySelector: "#modalWrap",
              dialogSelector: "#modal",
              openSelector: ".js-gear",
              closeSelector: "[data-modal-close]",
            },
            options || {},
          );

          const overlay = document.querySelector(config.overlaySelector);
          if (!overlay)
            throw new Error(
              "Settings modal overlay not found: " + config.overlaySelector,
            );

          const dialog =
            overlay.querySelector(config.dialogSelector) ||
            overlay.querySelector('[role="dialog"]');
          if (!dialog) throw new Error("Settings modal dialog not found.");

          const openers = Array.from(
            document.querySelectorAll(config.openSelector),
          );
          const closers = Array.from(
            overlay.querySelectorAll(config.closeSelector),
          );
          let previouslyFocused = null;
          let closeTimer = null;

          function open() {
            if (
              overlay.classList.contains("open") &&
              !overlay.classList.contains("closing")
            )
              return;
            if (closeTimer) {
              clearTimeout(closeTimer);
              closeTimer = null;
              overlay.classList.remove("closing");
            }
            previouslyFocused = document.activeElement;
            overlay.classList.add("open");
            overlay.classList.remove("closing");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            dialog.focus();
          }

          function close() {
            if (
              !overlay.classList.contains("open") ||
              overlay.classList.contains("closing")
            )
              return;
            overlay.classList.add("closing");
            closeTimer = setTimeout(function () {
              overlay.classList.remove("open", "closing");
              overlay.setAttribute("aria-hidden", "true");
              document.body.classList.remove("modal-open");
              if (
                previouslyFocused &&
                typeof previouslyFocused.focus === "function"
              ) {
                previouslyFocused.focus();
              }
              closeTimer = null;
            }, 180);
          }

          function toggle() {
            if (
              overlay.classList.contains("open") &&
              !overlay.classList.contains("closing")
            )
              close();
            else open();
          }

          openers.forEach(function (button) {
            button.addEventListener("click", toggle);
          });
          closers.forEach(function (button) {
            button.addEventListener("click", close);
          });

          overlay.addEventListener("click", function (event) {
            if (event.target === overlay) close();
          });

          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && overlay.classList.contains("open")) {
              close();
            }
          });

          overlay.querySelectorAll("[data-mode]").forEach(function (button) {
            button.addEventListener("click", function () {
              const mode = button.dataset.mode;
              overlay.querySelectorAll("[data-mode]").forEach(function (item) {
                const active = item === button;
                item.classList.toggle("active", active);
                item.setAttribute("aria-pressed", String(active));
              });
              const next = overlay.querySelector(
                '[data-modal-action="next-step"]',
              );
              if (next) next.disabled = mode !== "step";
              overlay.dispatchEvent(
                new CustomEvent("settings:mode", { detail: { mode: mode } }),
              );
            });
          });

          overlay
            .querySelectorAll('[data-modal-action="next-step"]')
            .forEach(function (button) {
              button.addEventListener("click", function () {
                overlay.dispatchEvent(new CustomEvent("settings:next-step"));
              });
            });

          overlay.querySelectorAll("[data-speed]").forEach(function (button) {
            button.addEventListener("click", function () {
              const value = Number(button.dataset.speed);
              overlay.querySelectorAll("[data-speed]").forEach(function (item) {
                const active = item === button;
                item.classList.toggle("active", active);
                item.setAttribute("aria-pressed", String(active));
              });
              overlay.dispatchEvent(
                new CustomEvent("settings:speed", { detail: { value: value } }),
              );
            });
          });

          const videoMode = overlay.querySelector(
            '[data-modal-toggle="video-mode"]',
          );
          if (videoMode) {
            videoMode.addEventListener("change", function () {
              overlay.dispatchEvent(
                new CustomEvent("settings:video-mode", {
                  detail: { enabled: videoMode.checked },
                }),
              );
            });
          }

          overlay
            .querySelectorAll('[data-modal-action="reset"]')
            .forEach(function (button) {
              button.addEventListener("click", function () {
                overlay.dispatchEvent(new CustomEvent("settings:reset"));
              });
            });

          return {
            open: open,
            close: close,
            toggle: toggle,
            setStepText: function (text) {
              const target = overlay.querySelector("#mStepTxt");
              if (target) target.textContent = text;
            },
          };
        }

        global.SettingsModal = { init: initSettingsModal };
      })(window);

        const clamp = function (v, a, b) {

        const clamp01 = function (v) {

        };
        const lerp = function (a, b, t) {

        };
        const seg = function (t, a, b) {

        };
        const easeOutCubic = function (t) {
          const u = 1 - t;
          return 1 - u * u * u;
        };
        const easeInOut = function (t) {
          return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        };
        const easeOutBack = function (t) {
          const c1 = 1.70158;
          const c3 = c1 + 1;
          return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        };

        function rr(c, x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          c.beginPath();
          c.moveTo(x + r, y);
          c.arcTo(x + w, y, x + w, y + h, r);
          c.arcTo(x + w, y + h, x, y + h, r);
          c.arcTo(x, y + h, x, y, r);
          c.arcTo(x, y, x + w, y, r);
          c.closePath();

        function qbez(p0, p1, p2, t) {
          const u = 1 - t;
          return {
            x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
            y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y,

        function accentA(a) {

        }

        function initParticles() {
          particles = [];
          for (let i = 0; i < 26; i++) {
            particles.push({
              u: Math.random(),
              v: Math.random(),
              r: 0.8 + Math.random() * 1.6,
              a: 0.05 + Math.random() * 0.09,
              ph: Math.random() * TAU,
              sp: 0.4 + Math.random() * 0.8,
              gr: Math.random() < 0.5,
            });
          }
        }

        function computeScene() {
          const W = cssW;
          const H = cssH;
          const portrait = H > W;
          const S = Math.min(W, H);
          const o = { W: W, H: H, S: S, portrait: portrait };
          const reserve = state.video && portrait ? 200 : 0;
          o.reserve = reserve;

          let bw, bh;
          if (!portrait) {
            bw = clamp(W * 0.27, 230, 430);
            bh = bw * 0.66;
          } else {
            bw = clamp(W * 0.6, 150, 380);
            bh = bw * 0.74;
          }

            w: bw,
            h: bh,
            x: portrait ? (W - bw) / 2 : W * 0.055,
            y: portrait ? Math.max(S * 0.06, 14) : (H - bh) / 2,
          };

          const sw = portrait
            ? clamp(W * 0.34, 80, 140)
            : clamp(W * 0.105, 110, 190);
          const sh = sw * 1.28;
          o.server = {
            w: sw,
            h: sh,
            x: portrait ? (W - sw) / 2 : W * 0.94 - sw,
            y: portrait ? H - reserve - sh - S * 0.06 : (H - sh) / 2,
          };

          if (!portrait) {
            o.path = {
              p0: { x: o.client.x + o.client.w, y: H / 2 },
              p2: { x: o.server.x, y: H / 2 },
            };
            o.path.p1 = {
              x: (o.path.p0.x + o.path.p2.x) / 2,
              y: H / 2 - S * 0.05,
            };
          } else {
            o.path = {
              p0: { x: W / 2, y: o.client.y + o.client.h },
              p2: { x: W / 2, y: o.server.y },
            };
            o.path.p1 = {
              x: W / 2 + S * 0.055,
              y: (o.path.p0.y + o.path.p2.y) / 2,
            };
          }

          const tw = portrait
            ? clamp(W * 0.5, 140, 240)
            : clamp(W * 0.22, 240, 330);
          const tfs = portrait
            ? clamp(8.5, tw * 0.058, 12)
            : clamp(8.5, tw * 0.058, 12.5);
          const th = (tfs + 10) * 3 + 42;
          o.tree = {
            w: tw,
            h: th,
            fs: tfs,
            x: portrait ? Math.max(S * 0.04, 8) : o.client.x + S * 0.01,
            y: portrait
              ? (o.path.p0.y + o.path.p2.y) / 2 - th / 2
              : o.client.y + o.client.h + S * 0.055,
          };

          const dw = portrait
            ? clamp(S * 0.19, 46, 74)
            : clamp(S * 0.085, 56, 92);
          o.db = {
            w: dw,
            h: dw * 1.12,
            x: portrait
              ? o.server.x + o.server.w + S * 0.028
              : o.server.x + o.server.w / 2 - dw / 2,
            y: portrait
              ? o.server.y + o.server.h * 0.12
              : o.server.y + o.server.h + S * 0.05,

          const tabW = portrait ? S * 0.12 : S * 0.1;
          const phW = portrait ? S * 0.07 : S * 0.06;
          const maxH = Math.max(lapW * 0.62, tabW * 1.3, phW * 1.85);
          o.dev = {
            lapW: lapW,
            tabW: tabW,
            phW: phW,
            gap: S * 0.032,
            cx: portrait ? W / 2 : (o.path.p0.x + o.path.p2.x) / 2,
            y7: portrait

                  (o.path.p0.y + o.path.p2.y) / 2,
                  o.client.y + o.client.h + maxH / 2 + 6,

            y8: portrait
              ? o.client.y + o.client.h + maxH / 2 + S * 0.02

          };

          const gm = qbez(o.path.p0, o.path.p1, o.path.p2, 0.5);
          o.globe = {
            x: gm.x,
            y: gm.y,
            r: S * 0.055,
            rx: portrait ? S * 0.3 : S * 0.2,

        function features() {

        function drawDB(c, f) {

        function drawLockIcon(c, x, y, s, a) {
          c.save();

          c.fillStyle = accentA(0.95 * a);

        function drawClient(c, f, t) {

          rr(c, b.x, b.y, b.w, b.h, b.w * 0.055);
          c.fillStyle = "#1A1A20";
          c.fill();
          c.shadowBlur = 0;
          c.strokeStyle = whiteA(0.14);
          c.lineWidth = 1;
          c.stroke();

          const dotR = tbH * 0.13;
          for (let i = 0; i < 3; i++) {

            c.arc(

              b.y + tbH / 2,
              dotR,

            );
            c.fillStyle = mutedA(0.5);
            c.fill();
          }

          const ax = b.x + b.w * 0.155;
          const aw = b.x + b.w - b.w * 0.03 - ax;
          const ah = tbH * 0.64;
          const ay = b.y + (tbH - ah) / 2;
          rr(c, ax, ay, aw, ah, ah * 0.45);
          c.fillStyle = "rgba(0,0,0,0.38)";
          c.fill();
          c.strokeStyle = whiteA(0.08);
          c.stroke();

          const pub = f.pub;
          let urlText = "site.ru";
          let urlColor = mutedA(0.95);
          let caret = false;
          if (pub > 0) {
            urlText = "https://site.ru";
            urlColor = accentA(0.95);
          } else if (state.step === 1) {
            const chars = Math.max(
              1,
              Math.round(clamp01(state.stepT / 0.7) * 7),
            );
            urlText = "site.ru".slice(0, chars);
            caret = state.stepT < 1.2;
          }
          const urlFs = clamp(9, ah * 0.52, 13);
          let tx = ax + ah * 0.5;
          if (pub > 0) {
            drawLockIcon(c, ax + ah * 0.55, ay + ah * 0.52, ah * 0.62, pub);
            tx = ax + ah * 1.25;
          }
          c.font = fnt("600", urlFs);
          c.textAlign = "left";
          c.textBaseline = "middle";
          c.fillStyle = urlColor;
          c.fillText(urlText, tx, ay + ah / 2 + 0.5);
          if (caret) {
            const cw = c.measureText(urlText).width;
            const blink = state.stepT % 0.5 < 0.25 ? 0.85 : 0.15;
            c.fillStyle = whiteA(blink);
            c.fillRect(tx + cw + 2, ay + ah * 0.2, 1.3, ah * 0.6);
          }

          const pad = b.w * 0.045;
          const cx0 = b.x + pad;
          const cy0 = b.y + tbH + pad * 0.8;
          const cw = b.w - pad * 2;
          const ch = b.h - tbH - pad * 1.6;
          drawPageContent(c, cx0, cy0, cw, ch, f, t);
          c.restore();

          if (!sc.portrait) {
            drawLabel(
              c,
              "Браузер — клиент",
              b.x + b.w / 2,
              b.y + b.h + sc.S * 0.012,
              sc.labelFs,
            );
          } else {
            drawLabel(
              c,
              "Браузер — клиент",
              b.x + b.w / 2,
              Math.max(2, b.y - sc.labelFs - 4),
              sc.labelFs,
            );
          }
        }

        function blockPop(c, i, htmlP, fn) {
          const pp = seg(htmlP, i * 0.13, i * 0.13 + 0.35);
          if (pp <= 0) return;
          const s = easeOutBack(pp);
          fn(s);
        }

        function drawPageContent(c, cx0, cy0, cw, ch, f, t) {
          const navH = ch * 0.1;
          const heroH = ch * 0.34;
          const cardH = ch * 0.28;
          const footH = ch * 0.09;
          const g = Math.max(4, ch * 0.055);
          const html = f.html;
          const css = f.css;

          let y = cy0;
          blockPop(c, 0, html, function (s) {
            c.save();
            c.translate(cx0 + cw / 2, y + navH / 2);
            c.scale(s, s);
            c.translate(-(cx0 + cw / 2), -(y + navH / 2));
            c.beginPath();
            c.arc(cx0 + navH * 0.45, y + navH / 2, navH * 0.3, 0, TAU);
            c.fillStyle =
              css > 0 ? accentA(0.9 * Math.max(css, 0.25)) : whiteA(0.25);
            c.fill();
            for (let i = 0; i < 3; i++) {
              const lw = cw * 0.09;
              const lx = cx0 + cw - (i + 1) * (lw + cw * 0.025);
              rr(c, lx, y + navH / 2 - navH * 0.1, lw, navH * 0.2, navH * 0.1);
              c.fillStyle = css > 0 ? accentA(0.75 * css) : whiteA(0.28);
              c.fill();
            }
            c.restore();
          });

          y += navH + g;
          const hero = { x: cx0, y: y, w: cw, h: heroH };
          blockPop(c, 1, html, function (s) {
            c.save();
            c.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
            c.scale(s, s);
            c.translate(-(hero.x + hero.w / 2), -(hero.y + hero.h / 2));
            rr(c, hero.x, hero.y, hero.w, hero.h, hero.h * 0.12);
            c.fillStyle = whiteA(0.06);
            c.fill();
            c.strokeStyle = whiteA(0.14);
            c.lineWidth = 1;
            c.stroke();
            if (css > 0) {
              const gr = c.createLinearGradient(
                hero.x,
                hero.y,
                hero.x + hero.w,
                hero.y + hero.h,
              );
              gr.addColorStop(0, accentA(0.32 * css));
              gr.addColorStop(1, darkA(0.12 * css));
              rr(c, hero.x, hero.y, hero.w, hero.h, hero.h * 0.12);
              c.fillStyle = gr;
              c.fill();
            }
            const lineH = Math.max(3, hero.h * 0.1);
            for (let i = 0; i < 2; i++) {
              rr(
                c,
                hero.x + hero.w * 0.055,
                hero.y + hero.h * 0.14 + i * (lineH + hero.h * 0.09),
                hero.w * (i === 0 ? 0.52 : 0.34),
                lineH,
                lineH / 2,
              );
              c.fillStyle = whiteA(0.72);
              c.fill();
            }
            if (f.js > 0) {
              const bw2 = hero.w * 0.3;
              const bh2 = hero.h * 0.24;
              const bx2 = hero.x + hero.w * 0.055;
              const by2 = hero.y + hero.h - bh2 - hero.h * 0.12;
              const pulse = 1 + 0.05 * Math.sin(t * 4) * f.js;
              c.save();
              c.translate(bx2 + bw2 / 2, by2 + bh2 / 2);
              c.scale(pulse, pulse);
              c.translate(-(bx2 + bw2 / 2), -(by2 + bh2 / 2));
              c.shadowColor = accentA(0.55 * f.js);
              c.shadowBlur = Math.max(8, sc.S * 0.012);
              const bg2 = c.createLinearGradient(bx2, by2, bx2, by2 + bh2);
              bg2.addColorStop(0, accentA(0.95 * f.js));
              bg2.addColorStop(1, darkA(0.95 * f.js));
              rr(c, bx2, by2, bw2, bh2, bh2 * 0.5);
              c.fillStyle = bg2;
              c.fill();
              c.shadowBlur = 0;
              if (bw2 > 64) {
                c.font = fnt("700", clamp(8, bh2 * 0.42, 12));
                c.textAlign = "center";
                c.textBaseline = "middle";
                c.fillStyle = "#FFFFFF";
                c.fillText("Подробнее", bx2 + bw2 / 2, by2 + bh2 / 2 + 0.5);
              }
              c.restore();

              if (state.step === 4) {
                const cph = ((((state.stepT - 0.4) % 2.4) + 2.4) % 2.4) / 2.4;
                if (cph < 0.85) {
                  const sx = bx2 + bw2 * 1.9;
                  const sy2 = by2 + bh2 * 2.8;
                  const ex2 = bx2 + bw2 * 0.62;
                  const ey2 = by2 + bh2 * 0.5;
                  const tt = easeInOut(clamp01(cph / 0.35));
                  const px2 = lerp(sx, ex2, tt);
                  const py2 = lerp(sy2, ey2, tt);
                  if (cph > 0.38 && cph < 0.62) {
                    const rp = seg(cph, 0.38, 0.62);
                    c.beginPath();
                    c.arc(
                      bx2 + bw2 / 2,
                      by2 + bh2 / 2,
                      rp * bw2 * 0.85,
                      0,
                      TAU,
                    );
                    c.strokeStyle = accentA((1 - rp) * 0.6);
                    c.lineWidth = 2;
                    c.stroke();
                  }
                  const cs = Math.max(9, bh2 * 0.62);
                  c.save();
                  c.translate(px2, py2);
                  c.beginPath();
                  c.moveTo(0, 0);
                  c.lineTo(cs * 0.85, cs * 0.62);
                  c.lineTo(cs * 0.4, cs * 0.68);
                  c.lineTo(cs * 0.5, cs);
                  c.lineTo(cs * 0.3, cs * 0.94);
                  c.lineTo(cs * 0.24, cs * 0.56);
                  c.closePath();
                  c.fillStyle = whiteA(0.95);
                  c.fill();
                  c.strokeStyle = "rgba(0,0,0,0.55)";
                  c.lineWidth = 1;
                  c.stroke();
                  c.restore();
                }
              }
            }
            c.restore();
          });

          y += heroH + g;
          const cardW = (cw - g) / 2;
          for (let i = 0; i < 2; i++) {
            const card = { x: cx0 + i * (cardW + g), y: y, w: cardW, h: cardH };
            blockPop(c, 2 + i, html, function (s) {
              c.save();
              c.translate(card.x + card.w / 2, card.y + card.h / 2);
              c.scale(s, s);
              c.translate(-(card.x + card.w / 2), -(card.y + card.h / 2));
              rr(c, card.x, card.y, card.w, card.h, card.h * 0.16);
              c.fillStyle = whiteA(0.06 + 0.05 * css);
              c.fill();
              c.strokeStyle = whiteA(0.12);
              c.lineWidth = 1;
              c.stroke();
              if (css > 0) {
                c.save();
                rr(c, card.x, card.y, card.w, card.h, card.h * 0.16);
                c.clip();
                c.fillStyle = accentA(0.75 * css);
                c.fillRect(
                  card.x,
                  card.y,
                  Math.max(2.5, card.w * 0.035),
                  card.h,
                );
                c.restore();
              }
              const avR = card.h * 0.16;
              const avX = card.x + card.w * 0.14;
              const avY = card.y + card.h * 0.34;
              const rowA = f.api;
              if (rowA > 0) {
                c.beginPath();
                c.arc(avX, avY, avR, 0, TAU);
                c.fillStyle = accentA(0.9 * rowA);
                c.fill();
                c.beginPath();
                c.arc(avX, avY - avR * 0.15, avR * 0.38, 0, TAU);
                c.fillStyle = whiteA(0.85);
                c.fill();
                for (let l = 0; l < 2; l++) {
                  rr(
                    c,
                    card.x + card.w * 0.26,
                    card.y + card.h * (0.24 + l * 0.24),
                    card.w * (l === 0 ? 0.58 : 0.4),
                    Math.max(2.5, card.h * 0.1),
                    2,
                  );
                  c.fillStyle = whiteA(0.55 * rowA);
                  c.fill();
                }
              } else {
                for (let l = 0; l < 2; l++) {
                  rr(
                    c,
                    card.x + card.w * 0.1,
                    card.y + card.h * (0.28 + l * 0.26),
                    card.w * (l === 0 ? 0.62 : 0.44),
                    Math.max(2.5, card.h * 0.1),
                    2,
                  );
                  c.fillStyle = whiteA(0.28);
                  c.fill();
                }
              }
              c.restore();
            });
          }

          y += cardH + g;
          blockPop(c, 4, html, function (s) {
            c.save();
            c.translate(cx0 + cw / 2, y + footH / 2);
            c.scale(s, s);
            c.translate(-(cx0 + cw / 2), -(y + footH / 2));
            rr(
              c,
              cx0,
              y,
              cw,
              Math.min(footH, ch + cy0 - y - 1),
              Math.max(2, footH * 0.3),
            );
            c.fillStyle = css > 0 ? accentA(0.16 * css) : whiteA(0.06);
            c.fill();
            c.strokeStyle = whiteA(0.1);
            c.lineWidth = 1;
            c.stroke();
            c.restore();
          });
        }

        function drawTree(c, f) {
          const T = sc.tree;
          const a = f.dom;
          if (a <= 0) return;
          c.save();
          c.globalAlpha = a;
          c.shadowColor = accentA(0.25);
          c.shadowBlur = sc.S * 0.02;
          rr(c, T.x, T.y, T.w, T.h, 12);
          c.fillStyle = "rgba(26,26,32,0.92)";
          c.fill();
          c.shadowBlur = 0;
          c.strokeStyle = whiteA(0.14);
          c.lineWidth = 1;
          c.stroke();

          c.font = fnt("800", T.fs + 1);
          c.textAlign = "left";
          c.textBaseline = "top";
          c.fillStyle = accentA(0.95);
          c.fillText("DOM", T.x + 12, T.y + 9);

          const pillH = T.fs + 10;
          const topY = T.y + 9 + T.fs + 6;
          const rootX = T.x + T.w * 0.52;
          const l2Y = topY + pillH + T.fs * 0.75;
          const headX = T.x + T.w * 0.26;
          const bodyX = T.x + T.w * 0.68;
          const l3Y = l2Y + pillH + T.fs * 0.65;

          const names3 = ["header", "main", "footer"];
          c.font = fnt("700", T.fs);
          const widths = names3.map(function (n) {
            return c.measureText(n).width + T.fs * 1.1;
          });
          const total3 = widths[0] + widths[1] + widths[2] + T.fs * 0.8 * 2;
          let startX = Math.max(T.x + 10, bodyX - total3 / 2);
          const centers3 = [];
          let acc = startX;
          for (let i = 0; i < 3; i++) {
            centers3.push(acc + widths[i] / 2);
            acc += widths[i] + T.fs * 0.8;
          }

          const pRoot = seg(a, 0, 0.3);
          const pL2 = seg(a, 0.22, 0.55);
          const pL3 = seg(a, 0.48, 0.9);

          function elbow(x1, y1, x2, y2, alpha) {
            c.strokeStyle = whiteA(0.18 * alpha);
            c.lineWidth = 1;
            const midY = (y1 + y2) / 2;
            c.beginPath();
            c.moveTo(x1, y1);
            c.lineTo(x1, midY);
            c.lineTo(x2, midY);
            c.lineTo(x2, y2);
            c.stroke();
          }

          if (pL2 > 0) {
            elbow(rootX, topY + pillH / 2, headX, l2Y - pillH / 2, pL2);
            elbow(rootX, topY + pillH / 2, bodyX, l2Y - pillH / 2, pL2);
          }
          if (pL3 > 0) {
            for (let i = 0; i < 3; i++) {
              elbow(bodyX, l2Y + pillH / 2, centers3[i], l3Y - pillH / 2, pL3);
            }
          }

          function node(text, nx, ny, p, hot) {
            if (p <= 0) return;
            const s = easeOutBack(p);
            const w = c.measureText(text).width + T.fs * 1.1;
            c.save();
            c.translate(nx, ny);
            c.scale(s, s);
            rr(c, -w / 2, -pillH / 2, w, pillH, pillH * 0.32);
            c.fillStyle = "rgba(255,255,255,0.07)";
            c.fill();
            c.strokeStyle = hot ? accentA(0.8) : whiteA(0.16);
            c.lineWidth = 1;
            c.stroke();
            c.fillStyle = whiteA(0.92);
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText(text, 0, 0.5);
            c.restore();
            if (hot) {
              const pulse = 0.35 + 0.3 * Math.sin(state.animTime * 2.4);
              c.beginPath();
              c.arc(nx, ny, pillH * 0.85, 0, TAU);
              c.strokeStyle = accentA(pulse);
              c.lineWidth = 1.4;
              c.stroke();
            }
          }

          node("html", rootX, topY + pillH / 2, pRoot, false);
          node("head", headX, l2Y + pillH / 2, pL2, false);
          node("body", bodyX, l2Y + pillH / 2, pL2, true);
          node("header", centers3[0], l3Y + pillH / 2, pL3, false);
          node("main", centers3[1], l3Y + pillH / 2, pL3, true);
          node("footer", centers3[2], l3Y + pillH / 2, pL3, false);
          c.restore();
        }

        function flightPhase(loop) {
          return ((((state.stepT - FLIGHT_START) % loop) + loop) % loop) / loop;
        }

        function drawPacketPill(c, text, pos, alpha, dir) {
          c.save();
          c.globalAlpha = alpha;
          c.font = fnt("700", sc.pillFs);
          const w = c.measureText(text).width + 16;
          const h = sc.pillFs + 12;
          for (let k = 3; k >= 1; k--) {
            const tp = qbez(dir.p0, dir.p1, dir.p2, clamp01(1 - k * 0.055));
            c.beginPath();
            c.arc(tp.x, tp.y, sc.pillFs * 0.16, 0, TAU);
            c.fillStyle = accentA(0.22 / k);
            c.fill();
          }
          c.shadowColor = accentA(0.55);
          c.shadowBlur = Math.max(8, sc.S * 0.012);
          rr(c, pos.x - w / 2, pos.y - h / 2, w, h, h / 2);
          c.fillStyle = "#1A1A20";
          c.fill();
          c.shadowBlur = 0;
          c.strokeStyle = accentA(0.7);
          c.lineWidth = 1.2;
          c.stroke();
          c.fillStyle = whiteA(0.95);
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText(text, pos.x, pos.y + 0.5);
          c.restore();
        }

        function drawJsonCard(c, pos, alpha) {
          c.save();
          c.globalAlpha = alpha;
          const w = clamp(sc.S * 0.11, 86, 122);
          const h = w * 0.52;
          const fs = clamp(8, sc.S * 0.016, 11);
          c.shadowColor = accentA(0.5);
          c.shadowBlur = Math.max(8, sc.S * 0.012);
          rr(c, pos.x - w / 2, pos.y - h / 2, w, h, 8);
          c.fillStyle = "#1A1A20";
          c.fill();
          c.shadowBlur = 0;
          c.strokeStyle = accentA(0.65);
          c.lineWidth = 1.2;
          c.stroke();
          c.textAlign = "left";
          c.textBaseline = "top";
          c.font = fnt("800", fs + 1);
          c.fillStyle = accentA(0.95);
          c.fillText("{ }", pos.x - w / 2 + 8, pos.y - h / 2 + 6);
          c.font = fnt("600", fs);
          c.fillStyle = whiteA(0.85);
          c.fillText(
            '"title": "Сайт"',
            pos.x - w / 2 + 8,
            pos.y - h / 2 + 6 + (fs + 3) * 1.6,
          );
          c.fillStyle = mutedA(0.9);
          c.fillText(
            '"ok": true',
            pos.x - w / 2 + 8,
            pos.y - h / 2 + 6 + (fs + 3) * 2.9,
          );
          c.restore();
        }

        function drawPackets(c, f, t) {
          const st = state.step;
          if (state.stepT < FLIGHT_START * 0.5) return;
          if (st === 1 && f.req > 0) {
            const ph = flightPhase(2);
            const tt = easeInOut(clamp01(ph / 0.82));
            const pos = qbez(sc.path.p0, sc.path.p1, sc.path.p2, tt);
            drawPacketPill(
              c,
              "HTTP-запрос",
              pos,
              f.req * seg(ph, 0, 0.06),
              sc.path,
            );
          } else if (st === 2 || st === 3 || st === 4) {
            const ph = flightPhase(2.2);
            const tt = easeInOut(clamp01(ph / 0.82));
            const back = { p0: sc.path.p2, p1: sc.path.p1, p2: sc.path.p0 };
            const pos = qbez(back.p0, back.p1, back.p2, tt);
            const label = st === 2 ? "HTML" : st === 3 ? "CSS" : "JS";
            drawPacketPill(c, label, pos, seg(ph, 0, 0.06), back);
          } else if (st === 6 && f.api > 0.2) {
            const p0 = sc.portrait
              ? {
                  x: sc.client.x + sc.client.w * 0.5,
                  y: sc.client.y + sc.client.h,
                }
              : {
                  x: sc.client.x + sc.client.w,
                  y: sc.client.y + sc.client.h * 0.5,
                };
            const dbTop = {
              x: sc.db.x + sc.db.w / 2,
              y: sc.db.y + sc.db.h * 0.16,
            };
            const ctrl = {
              x: (p0.x + dbTop.x) / 2 + (sc.portrait ? sc.S * 0.1 : 0),
              y: (p0.y + dbTop.y) / 2 - (sc.portrait ? 0 : sc.S * 0.08),
            };
            const toDb = { p0: p0, p1: ctrl, p2: dbTop };
            const toClient = { p0: dbTop, p1: ctrl, p2: p0 };
            const ph = flightPhase(3.0);
            if (ph < 0.42) {
              const tt = easeInOut(clamp01(ph / 0.4));
              drawPacketPill(
                c,
                "API-запрос",
                qbez(toDb.p0, toDb.p1, toDb.p2, tt),
                f.api * seg(ph, 0, 0.06),
                toDb,
              );
            } else if (ph > 0.55 && ph < 0.97) {
              const tt = easeInOut(clamp01((ph - 0.55) / 0.4));
              drawJsonCard(
                c,
                qbez(toClient.p0, toClient.p1, toClient.p2, tt),
                f.api * seg(ph, 0.55, 0.61),
              );
            }
          }
        }

        function drawPublish(c, f, t) {
          const g = sc.globe;
          const e = f.pub;
          c.save();
          c.globalAlpha = e;
          c.strokeStyle = accentA(0.4);
          c.lineWidth = Math.max(1.2, sc.S * 0.0022);
          c.beginPath();
          c.ellipse(g.x, g.y, g.rx, g.ry, 0, 0, TAU);
          c.stroke();
          c.strokeStyle = darkA(0.3);
          c.beginPath();
          c.ellipse(g.x, g.y, g.rx * 0.88, g.ry * 0.88, 0, 0, TAU);
          c.stroke();

          c.shadowColor = accentA(0.5);
          c.shadowBlur = sc.S * 0.03;
          c.beginPath();
          c.arc(g.x, g.y, g.r, 0, TAU);
          c.fillStyle = "#1A1A20";
          c.fill();
          c.shadowBlur = 0;
          c.strokeStyle = accentA(0.85);
          c.lineWidth = 1.4;
          c.stroke();
          c.strokeStyle = whiteA(0.16);
          c.beginPath();
          c.ellipse(g.x, g.y, g.r * 0.45, g.r, 0, 0, TAU);
          c.stroke();
          c.beginPath();
          c.ellipse(g.x, g.y, g.r, g.r * 0.4, 0, 0, TAU);
          c.stroke();

          const domFs = clamp(11, sc.S * 0.024, 16);
          c.font = fnt("800", domFs);
          c.textAlign = "center";
          c.textBaseline = "top";
          c.shadowColor = accentA(0.6);
          c.shadowBlur = 8;
          c.fillStyle = whiteA(0.95);
          c.fillText("site.ru", g.x, g.y + g.ry + clamp(10, sc.S * 0.03, 20));
          c.shadowBlur = 0;

          for (let i = 0; i < sc.sparks.length; i++) {
            const sp = sc.sparks[i];
            const a = Math.max(0, Math.sin(t * 1.7 + sp.ph)) * e;
            if (a <= 0.02) continue;
            const x = sp.u * sc.W;
            const y = sp.v * sc.H;
            const len = sp.s * clamp(5, sc.S * 0.011, 9);
            c.strokeStyle = accentA(a);
            c.lineWidth = 1.4;
            c.beginPath();
            c.moveTo(x - len, y);
            c.lineTo(x + len, y);
            c.moveTo(x, y - len);
            c.lineTo(x, y + len);
            c.stroke();
          }

          const ang = t * 0.85;
          const s1x = g.x + g.rx * Math.cos(ang);
          const s1y = g.y + g.ry * Math.sin(ang);
          c.font = fnt("700", sc.pillFs - 1);
          const w1 = c.measureText("HTTPS").width + 12;
          const h1 = sc.pillFs + 10;
          c.shadowColor = accentA(0.6);
          c.shadowBlur = 10;
          rr(c, s1x - w1 / 2, s1y - h1 / 2, w1, h1, h1 / 2);
          c.fillStyle = "#1A1A20";
          c.fill();
          c.shadowBlur = 0;
          c.strokeStyle = accentA(0.8);
          c.lineWidth = 1.2;
          c.stroke();
          c.fillStyle = whiteA(0.95);
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText("HTTPS", s1x, s1y + 0.5);

          const ang2 = ang + Math.PI * 0.9;
          const s2x = g.x + g.rx * Math.cos(ang2);
          const s2y = g.y + g.ry * Math.sin(ang2);
          c.shadowColor = accentA(0.6);
          c.shadowBlur = 8;
          c.beginPath();
          c.arc(s2x, s2y, Math.max(2.5, sc.S * 0.005), 0, TAU);
          c.fillStyle = accentA(0.95);
          c.fill();
          c.restore();
        }

        function drawDevices(c, f, t) {
          const d = sc.dev;
          const e = f.dev;
          const pub = f.pub;
          const lapH = d.lapW * 0.62;
          const tabH = d.tabW * 1.3;
          const phH = d.phW * 1.85;
          const maxH = Math.max(lapH, tabH, phH);
          const total = d.lapW + d.tabW + d.phW + d.gap * 2;
          const cy = lerp(d.y7, d.y8, pub);
          const x0 = d.cx - total / 2;
          const bottom = cy + maxH / 2;

          function miniPage(w, h, x, y) {
            const pad = Math.max(3, w * 0.09);
            c.fillStyle = accentA(0.85);
            rr(c, x + pad, y + pad, w - pad * 2, Math.max(2.5, h * 0.09), 2);
            c.fill();
            c.fillStyle = whiteA(0.16);
            rr(c, x + pad, y + pad + h * 0.16, w - pad * 2, h * 0.3, 3);
            c.fill();
            for (let l = 0; l < 2; l++) {
              c.fillStyle = mutedA(0.55);
              rr(
                c,
                x + pad,
                y + pad + h * 0.53 + l * h * 0.16,
                (w - pad * 2) * (l === 0 ? 0.8 : 0.55),
                Math.max(2, h * 0.07),
                2,
              );
              c.fill();
            }
          }

          function dev(shadowA, fn) {
            c.save();
            c.shadowColor = accentA(shadowA);
            c.shadowBlur = Math.max(6, sc.S * 0.012);
            fn();
            c.restore();
          }

          const p0 = easeOutBack(seg(e, 0, 0.55));
          if (p0 > 0) {
            const lx = x0;
            const ly = bottom - lapH - d.lapW * 0.075;
            c.save();
            c.globalAlpha = clamp01(p0);
            c.translate(lx + d.lapW / 2, ly + lapH / 2);
            c.scale(p0, p0);
            c.translate(-(lx + d.lapW / 2), -(ly + lapH / 2));
            dev(0.3 * p0, function () {
              rr(c, lx, ly, d.lapW, lapH, Math.max(3, d.lapW * 0.05));
              c.fillStyle = "#1A1A20";
              c.fill();
              c.strokeStyle = whiteA(0.16);
              c.lineWidth = 1;
              c.stroke();
              miniPage(d.lapW, lapH, lx, ly);
              rr(
                c,
                lx - d.lapW * 0.06,
                ly + lapH,
                d.lapW * 1.12,
                Math.max(3, d.lapW * 0.05),
                3,
              );
              c.fillStyle = whiteA(0.2);
              c.fill();
            });
            c.restore();
          }

          const p1 = easeOutBack(seg(e, 0.16, 0.71));
          if (p1 > 0) {
            const tx = x0 + d.lapW + d.gap;
            const ty = bottom - tabH;
            c.save();
            c.globalAlpha = clamp01(p1);
            c.translate(tx + d.tabW / 2, ty + tabH / 2);
            c.scale(p1, p1);
            c.translate(-(tx + d.tabW / 2), -(ty + tabH / 2));
            dev(0.3 * p1, function () {
              rr(c, tx, ty, d.tabW, tabH, Math.max(3, d.tabW * 0.09));
              c.fillStyle = "#1A1A20";
              c.fill();
              c.strokeStyle = whiteA(0.16);
              c.lineWidth = 1;
              c.stroke();
              miniPage(d.tabW, tabH, tx, ty);
            });
            c.restore();
          }

          const p2 = easeOutBack(seg(e, 0.32, 0.87));
          if (p2 > 0) {
            const px2 = x0 + d.lapW + d.tabW + d.gap * 2;
            const py2 = bottom - phH;
            c.save();
            c.globalAlpha = clamp01(p2);
            c.translate(px2 + d.phW / 2, py2 + phH / 2);
            c.scale(p2, p2);
            c.translate(-(px2 + d.phW / 2), -(py2 + phH / 2));
            dev(0.3 * p2, function () {
              rr(c, px2, py2, d.phW, phH, Math.max(3, d.phW * 0.16));
              c.fillStyle = "#1A1A20";
              c.fill();
              c.strokeStyle = whiteA(0.16);
              c.lineWidth = 1;
              c.stroke();
              c.fillStyle = whiteA(0.25);
              rr(
                c,
                px2 + d.phW * 0.32,
                py2 + phH * 0.045,
                d.phW * 0.36,
                Math.max(1.5, phH * 0.025),
                2,
              );
              c.fill();
              miniPage(d.phW, phH, px2, py2);
            });
            c.restore();
          }
        }

        function draw() {
          const c = ctx;
          if (!c || !sc) return;
          c.save();
          c.fillStyle = "#0F0F13";
          c.fillRect(0, 0, sc.W, sc.H);
          const f = features();
          const t = state.animTime;
          const vg = c.createRadialGradient(
            sc.globe.x,
            sc.globe.y,
            0,
            sc.globe.x,
            sc.globe.y,
            sc.S * 0.55,
          );
          vg.addColorStop(0, accentA(0.1));
          vg.addColorStop(1, accentA(0));
          c.fillStyle = vg;
          c.fillRect(0, 0, sc.W, sc.H);
          drawParticles(c, t);
          drawPath(c, f, t);
          drawServer(c, f, t);
          if (f.api > 0) drawDB(c, f);
          drawClient(c, f, t);
          if (f.dom > 0) drawTree(c, f);
          drawPackets(c, f, t);
          if (f.pub > 0) drawPublish(c, f, t);
          if (f.dev > 0) drawDevices(c, f, t);
          c.restore();
        }

        function update(dt) {
          if (!state.playing) return;
          const d = Math.min(dt, 0.05) * state.speed;
          state.stepT += d;
          state.animTime += d;
          if (state.mode === "auto") {
            if (state.stepT >= STEP_DUR) {
              state.stepT = 0;
              state.step = (state.step % STEP_COUNT) + 1;
              onStepChange();
            }
          } else {
            const limit = FREEZE_AT[state.step] || ENTER_DUR;
            if (state.stepT >= limit) {
              state.stepT = limit;
              state.phase = "idle";
              state.playing = false;
              renderControls();
            }
          }
        }

        function tick(ts) {
          requestAnimationFrame(tick);
          if (lastTs === null) lastTs = ts;
          const dt = (ts - lastTs) / 1000;
          lastTs = ts;
          update(dt);
          draw();
        }

        function updateSubtitles(step) {
          const data = SUBTITLES[step - 1];
          if (!data || !els.subs) return;
          if (!els.subsInner) {
            els.subsInner = document.createElement("div");
            els.subsInner.className = "subtitle__inner";
            els.subs.appendChild(els.subsInner);
          }
          const box = els.subsInner;
          while (box.firstChild) box.removeChild(box.firstChild);
          data.segments.forEach(function (segDef) {
            if (segDef.emphasis) {
              const sp = document.createElement("span");
              sp.className = "subtitle__keyword";
              sp.textContent = segDef.text;
              box.appendChild(sp);
            } else {
              box.appendChild(document.createTextNode(segDef.text));
            }
          });
          els.subs.classList.remove("show");
          void els.subs.offsetWidth;
          els.subs.classList.add("show");
        }

        function onStepChange() {
          updateSubtitles(state.step);
          renderControls();
        }

        function renderControls() {
          const playing = state.playing;
          if (els.icPlay && els.icPause) {
            els.icPlay.style.display = playing ? "none" : "block";
            els.icPause.style.display = playing ? "block" : "none";
            els.btnPlay.setAttribute(
              "aria-label",
              playing ? "Пауза" : "Воспроизвести",
            );
          }
          if (settings)
            settings.setStepText("Шаг " + state.step + " / " + STEP_COUNT);
          if (els.mAuto && els.mStepBtn) {
            els.mAuto.classList.toggle("active", state.mode === "auto");
            els.mAuto.setAttribute(
              "aria-pressed",
              String(state.mode === "auto"),
            );
            els.mStepBtn.classList.toggle("active", state.mode === "step");
            els.mStepBtn.setAttribute(
              "aria-pressed",
              String(state.mode === "step"),
            );
          }
          els.speedBtns.forEach(function (b) {
            const on = Number(b.dataset.speed) === state.speed;
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", String(on));
          });
          if (els.mNine) els.mNine.checked = state.video;
          if (els.mNext) {
            els.mNext.disabled = !(
              state.mode === "step" &&
              state.step < STEP_COUNT &&
              state.phase !== "transition"
            );
          }
        }

        function startAuto() {
          state.started = true;
          state.playing = true;
          renderControls();
        }

        function setMode(mode) {
          if (mode !== "auto" && mode !== "step") return;
          if (state.mode === mode) {
            renderControls();
            return;
          }
          state.mode = mode;
          if (mode === "auto") {
            state.phase = "idle";
            state.playing = true;
            state.stepT = 0;
          }
          renderControls();
        }

        function onStep() {
          if (
            state.mode !== "step" ||
            state.phase === "transition" ||
            state.step >= STEP_COUNT
          )
            return;
          state.phase = "transition";
          state.step += 1;
          state.stepT = 0;
          state.playing = true;
          onStepChange();
        }

        function setPlaying() {
          if (
            state.mode === "step" &&
            (state.phase !== "transition" ||
              state.stepT >= (FREEZE_AT[state.step] || ENTER_DUR))
          )
            return;
          state.playing = !state.playing;
          renderControls();
        }

        function setSpeed(v) {
          if (v !== 0.5 && v !== 1 && v !== 2) return;
          state.speed = v;
        }

        function reset() {
          state.mode = "auto";
          state.step = 1;
          state.stepT = 0;
          state.phase = "idle";
          state.playing = true;
          onStepChange();
        }

        function applyLayout() {
          const desk = mqDesk.matches;
          document.body.classList.toggle("v916", state.video);
          if (state.video) {
            els.frame.classList.add("on");
            els.frameInner.insertBefore(els.canvas, els.frameOverlay);
            els.frameOverlay.insertBefore(els.subs, els.framePanel);
            els.framePanel.appendChild(els.panel);
          } else {
            els.frame.classList.remove("on");
            els.wrap.insertBefore(els.canvas, els.frame);
            if (desk) {
              els.subSlotDesk.appendChild(els.subs);
              els.panelSlotDesk.appendChild(els.panel);
            } else {
              els.subSlotMobile.appendChild(els.subs);
              els.panelSlotMobile.appendChild(els.panel);
            }
          }
          if (desk) {
            els.sidebar.insertBefore(els.titleWrap, els.sidebar.firstChild);
          } else {
            els.app.insertBefore(els.titleWrap, els.stage);
          }
          resize();
        }

        function toggleVideoMode() {
          state.video = !state.video;
          applyLayout();
          renderControls();
        }

        function resize() {
          if (state.video) {
            const r = els.wrap.getBoundingClientRect();
            let fh = r.height;
            let fw = (fh * 9) / 16;
            if (fw > r.width) {
              fw = r.width;
              fh = (fw * 16) / 9;
            }
            els.frameInner.style.width = Math.max(60, Math.floor(fw)) + "px";
            els.frameInner.style.height = Math.max(106, Math.floor(fh)) + "px";
          }
          const host = els.canvas.parentElement;
          if (!host) return;
          const rect = host.getBoundingClientRect();
          cssW = Math.max(1, Math.round(rect.width));
          cssH = Math.max(1, Math.round(rect.height));
          const dpr = clamp(window.devicePixelRatio || 1, 1, 3);
          els.canvas.width = Math.round(cssW * dpr);
          els.canvas.height = Math.round(cssH * dpr);
          if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          computeScene();
        }

        function toggleControls() {
          state.controlsHidden = !state.controlsHidden;
          document.body.classList.toggle(
            "controls-hidden",
            state.controlsHidden,
          );
        }

        function openSettings() {
          if (settings) settings.open();
        }

        function closeSettings() {
          if (settings) settings.close();
        }

        function handleInput(event) {
          if (event.defaultPrevented) return;
          const t = event.target;
          if (
            t &&
            (t.tagName === "INPUT" ||
              t.tagName === "TEXTAREA" ||
              t.tagName === "SELECT" ||
              t.isContentEditable)
          )
            return;
          const key = event.key;
          if (key === " " || event.code === "Space") {
            toggleControls();
            event.preventDefault();
          } else if (key === "ArrowRight") {
            if (
              state.mode === "step" &&
              state.phase !== "transition" &&
              state.step < STEP_COUNT
            ) {
              onStep();
              event.preventDefault();
            }
          } else if (key === "r" || key === "R" || key === "к" || key === "К") {
            reset();
            event.preventDefault();
          } else if (key === "s" || key === "S" || key === "ы" || key === "Ы") {
            setMode(state.mode === "auto" ? "step" : "auto");
            event.preventDefault();
          } else if (key === "v" || key === "V" || key === "м" || key === "М") {
            toggleVideoMode();
            event.preventDefault();
          } else if (key === "Escape") {
            closeSettings();
          }
        }

        function showFatal(err) {
          const f = document.getElementById("fatal");
          if (f) f.classList.add("on");
          if (window.console && console.error)
            console.error("Init failed:", err);
        }

        function init() {
          const ids = [
            "app",
            "stage",
            "canvasWrap",
            "scene",
            "frame",
            "frameInner",
            "frameOverlay",
            "framePanel",
            "subSlotMobile",
            "panelSlotMobile",
            "sidebar",
            "subSlotDesk",
            "panelSlotDesk",
            "titleWrap",
            "subs",
            "panel",
            "btnPlay",
            "btnGear",
            "icPlay",
            "icPause",
            "mAuto",
            "mStepBtn",
            "mNext",
            "mNine",
          ];
          ids.forEach(function (id) {
            els[id] = document.getElementById(id);
          });
          els.wrap = els.canvasWrap;
          els.canvas = els.scene;
          if (!els.canvas || !els.wrap || !els.app)
            throw new Error("DOM elements missing");
          ctx = els.canvas.getContext("2d");
          if (!ctx) throw new Error("Canvas 2D context unavailable");

          settings = SettingsModal.init();

          els.speedBtns = Array.prototype.slice.call(
            document.querySelectorAll("[data-speed]"),
          );

          els.btnPlay.addEventListener("click", function () {
            setPlaying();
          });

          const mw = document.getElementById("modalWrap");
          mw.addEventListener("settings:mode", function (ev) {
            setMode(ev.detail.mode);
          });
          mw.addEventListener("settings:next-step", function () {
            onStep();
          });
          mw.addEventListener("settings:speed", function (ev) {
            setSpeed(Number(ev.detail.value));
          });
          mw.addEventListener("settings:video-mode", function (ev) {
            if (state.video !== ev.detail.enabled) toggleVideoMode();
          });
          mw.addEventListener("settings:reset", function () {
            reset();
          });

          document.addEventListener("keydown", handleInput);

          mqDesk = window.matchMedia("(min-width: 768px)");
          const onMq = function () {
            applyLayout();
          };
          if (mqDesk.addEventListener) mqDesk.addEventListener("change", onMq);
          else if (mqDesk.addListener) mqDesk.addListener(onMq);

          if (window.ResizeObserver) {
            ro = new ResizeObserver(function () {
              resize();
            });
            ro.observe(els.wrap);
          }
          window.addEventListener("resize", function () {
            resize();
          });

          initParticles();
          applyLayout();
          updateSubtitles(state.step);
          renderControls();
          requestAnimationFrame(tick);
          window.setTimeout(function () {
            if (!state.started) startAuto();
          }, 500);
        }

        try {
          init();
        } catch (err) {
          showFatal(err);
        }
      })();
    </script>
  </body>
</html>
