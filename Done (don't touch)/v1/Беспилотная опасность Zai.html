<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Беспилотная опасность</title>
    <style>
      :root {
        --ui-bg: #0f0f13;
        --ui-bg-gradient: #111118;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #cfcfcf;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-shadow-strong: rgba(46, 172, 101, 0.35);
        --ui-accent-ambient-1: rgba(46, 172, 101, 0.34);
        --ui-accent-ambient-2: rgba(30, 122, 71, 0.3);
        --ui-accent-ambient-3: rgba(20, 80, 45, 0.38);
        --ui-accent-halo: rgba(46, 172, 101, 0.14);
        --ui-danger: #e5484d;
        --ui-danger-hover-border: rgba(229, 72, 77, 0.6);
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-border-faint: rgba(255, 255, 255, 0.08);
        --ui-scrim-strong: rgba(0, 0, 0, 0.65);
        --ui-surface-inset: rgba(0, 0, 0, 0.35);
        --ui-shadow-text: rgba(0, 0, 0, 0.8);
        --ui-ambient-blur: 90px;
        --panel-w: clamp(320px, 30vw, 380px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--ui-text);
        background: var(--ui-bg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      .ambient-clip {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      #ambient {
        position: absolute;
        inset: -10%;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }
      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }
      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }
      body.v916 #ambient {
        opacity: 1;
      }
      @media (max-width: 767.98px) {
        .ambient-clip {
          right: calc(80px + env(safe-area-inset-right, 0px));
        }
      }
      .app {
        position: relative;
        z-index: 1;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-right: calc(80px + env(safe-area-inset-right, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
      }
      .topbar {
        position: relative;
        z-index: 3;
        padding-top: calc(16px + env(safe-area-inset-top, 0px));
      }
      .kicker {
        color: var(--ui-muted);
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .topbar h1 {
        margin: 3px 0 0;
        font-size: clamp(20px, 5.2vw, 30px);
        font-weight: 800;
        letter-spacing: 0.01em;
        color: var(--ui-text);
      }
      .stage {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        margin-top: 10px;
      }
      .stage-inner {
        position: absolute;
        inset: 0;
      }
      .stage-inner canvas,
      .vframe-slot canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .stage-dock-slot {
        display: none;
      }
      .frame-layer {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 4;
      }
      body.video-mode .frame-layer {
        display: flex;
      }
      .frame-layer::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
      }
      .frame-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(72%, 560px);
        aspect-ratio: 1/1;
        border-radius: 50%;
        background: var(--ui-accent-halo);
        filter: blur(var(--ui-ambient-blur));
        transform: translate(-50%, -50%);
      }
      .vframe {
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        background: var(--ui-bg);
        border: 1px solid var(--ui-border-soft);
        box-shadow:
          0 0 0 1px var(--ui-white-06),
          0 24px 80px rgba(0, 0, 0, 0.5),
          0 0 60px var(--ui-accent-halo);
      }
      .vframe-slot {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .vframe-bottom {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        z-index: 3;
      }
      .frame-sub-slot,
      .frame-dock-slot {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .bottomstack {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-top: 12px;
        margin-bottom: calc(25vh + env(safe-area-inset-bottom, 0px));
      }
      .sub-mobile-slot,
      .dock-slot {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .panel {
        display: none;
      }
      .subtitle {
        min-height: 112px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        max-width: 560px;
        padding: 12px 16px;
        border-radius: 16px;
        background: #00000080;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.35;
        font-weight: 700;
        color: var(--ui-text);
        opacity: 0;
        transform: translateY(8px);
      }
      .subtitle__inner {
        display: block;
        text-align: center;
      }
      .subtitle.show {
        animation: subIn 0.32s ease-out forwards;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .subtitle__keyword {
        color: var(--ui-accent);
        font-weight: 800;
      }
      .dock {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 999px;
        background: var(--ui-panel-glass);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid var(--ui-border-soft);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .app.controls-hidden .dock {
        opacity: 0;
        pointer-events: none;
        transform: translateY(6px);
      }
      .dock .ctl {
        width: 52px;
        height: 52px;
        border-radius: 999px;
        border: none;
        background: transparent;
        display: grid;
        place-items: center;
        color: var(--ui-text);
        cursor: pointer;
        padding: 0;
        transition:
          background 0.2s,
          transform 0.1s,
          box-shadow 0.2s;
      }
      @media (hover: hover) {
        .dock .ctl:hover {
          background: var(--ui-white-10);
        }
      }
      .dock .ctl:active {
        transform: scale(0.95);
      }
      .dock .ctl:focus-visible {
        outline: 2px solid var(--ui-accent);
        outline-offset: 2px;
      }
      .ctl--play {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        box-shadow: 0 4px 18px var(--ui-accent-shadow);
      }
      @media (hover: hover) {
        .ctl--play:hover {
          background: linear-gradient(
            135deg,
            var(--ui-accent),
            var(--ui-accent-dark)
          );
        }
      }
      #btnPlay .ic-play {
        display: none;
      }
      #btnPlay.paused .ic-play {
        display: block;
      }
      #btnPlay.paused .ic-pause {
        display: none;
      }
      @media (min-width: 768px) {
        .app {
          display: grid;
          grid-template-columns: 1fr var(--panel-w);
          grid-template-rows: auto minmax(0, 1fr);
          padding: 0;
        }
        .topbar {
          grid-column: 1/-1;
          grid-row: 1;
          padding: calc(16px + env(safe-area-inset-top, 0px)) 28px 12px 28px;
        }
        .stage {
          grid-column: 1;
          grid-row: 2;
          margin-top: 0;
        }
        .stage-inner {
          inset: 4px 20px 0 28px;
        }
        .bottomstack {
          display: none;
        }
        .panel {
          display: flex;
          flex-direction: column;
          grid-column: 2;
          grid-row: 2;
          margin: 0 20px 18px 4px;
          padding: 16px;
          border-radius: 20px;
          background: var(--ui-panel-glass);
          border: 1px solid var(--ui-border-faint);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          min-height: 0;
        }
        .panel-sub-slot {
          display: flex;
          width: 100%;
          align-items: flex-start;
        }
        .stage-dock-slot {
          display: flex;
          position: absolute;
          left: 0;
          right: 0;
          bottom: 18px;
          justify-content: center;
          pointer-events: none;
          z-index: 5;
        }
        .stage-dock-slot .dock {
          pointer-events: auto;
        }
        body.video-mode .app {
          grid-template-columns: 1fr;
        }
        body.video-mode .panel {
          display: none;
        }
        body.video-mode .bottomstack {
          display: none;
        }
      }
      @media (max-width: 767.98px) {
        .panel-sub-slot {
          display: none;
        }
      }
      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--ui-modal-scrim);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #modalWrap.open {
        display: flex;
      }
      #modalWrap.closing {
        display: flex;
      }
      #modal {
        width: min(92vw, 380px);
        max-height: 90vh;
        max-height: 90dvh;
        overflow: auto;
        color: var(--ui-text);
        background: var(--ui-modal-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        outline: none;
      }
      #modalWrap.closing #modal {
        animation: popOut 0.18s ease-in both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes popOut {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }
      #modal button:focus-visible {
        outline: 2px solid var(--ui-accent);
        outline-offset: 2px;
      }
      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }
      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      #mSpeedSeg {
        margin-bottom: 14px;
      }
      .mlabel-line {
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }
      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 30px;
      }
      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }
      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }
      .sw input:checked + span {
        background: var(--ui-accent);
      }
      .sw input:checked + span::before {
        transform: translateX(22px);
      }
      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      #mReset {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;
      }
      #mReset:hover {
        border-color: var(--ui-danger-hover-border);
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }
      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }
      .keys i {
        font-style: normal;
      }
      body.modal-open {
        overflow: hidden;
      }
      .boot-error {
        position: fixed;
        left: 16px;
        right: 16px;
        top: 16px;
        z-index: 50;
        background: var(--ui-modal-bg);
        border: 1px solid var(--ui-danger-hover-border);
        border-radius: 14px;
        padding: 14px;
        color: var(--ui-text);
        font-size: 14px;
        font-weight: 700;
      }
      @media (prefers-reduced-motion: reduce) {
        #ambient .b1,
        #ambient .b2,
        #ambient .b3 {
          animation: none;
        }
        #modal,
        #modalWrap.closing #modal {
          animation: none;
        }
        .subtitle.show {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body class="v916">
    <div class="ambient-clip" aria-hidden="true">
      <div id="ambient">
        <i class="b1"></i><i class="b2"></i><i class="b3"></i>
      </div>
    </div>
    <div class="app" id="app">
      <header class="topbar">
        <div class="kicker">Безопасность школьников</div>
        <h1>Беспилотная опасность</h1>
      </header>
      <main class="stage" id="stage">
        <div class="stage-inner" id="canvasNormalSlot">
          <canvas
            id="scene"
            role="img"
            aria-label="Визуализация правил безопасного поведения при обнаружении беспилотного летательного аппарата"
          ></canvas>
        </div>
        <div class="stage-dock-slot" id="dockDesktopSlot"></div>
        <div class="frame-layer" id="frameLayer" aria-hidden="true">
          <div class="frame-glow" aria-hidden="true"></div>
          <div class="vframe" id="vframe">
            <div class="vframe-slot" id="canvasFrameSlot"></div>
            <div class="vframe-bottom">
              <div class="frame-sub-slot" id="frameSubSlot"></div>
              <div class="frame-dock-slot" id="frameDockSlot"></div>
            </div>
          </div>
        </div>
      </main>
      <aside class="panel" id="panel">
        <div class="panel-sub-slot" id="subPanelSlot"></div>
      </aside>
      <div class="bottomstack" id="bottomstack">
        <div class="sub-mobile-slot" id="subMobileSlot">
          <div class="subtitle" id="subtitle" aria-live="polite"></div>
        </div>
        <div class="dock-slot" id="dockMobileSlot">
          <footer class="dock" id="dock">
            <button
              id="btnPlay"
              class="ctl ctl--play"
              type="button"
              aria-label="Пауза"
            >
              <svg
                class="ic ic-pause"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
              >
                <path
                  d="M8 5h3.4v14H8zM12.6 5H16v14h-3.4z"
                  fill="currentColor"
                />
              </svg>
              <svg
                class="ic ic-play"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
              >
                <path d="M8.5 5.5v13l10-6.5z" fill="currentColor" />
              </svg>
            </button>
            <button
              id="btnGear"
              class="ctl js-gear"
              type="button"
              aria-label="Настройки"
            >
              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
              >
                <path
                  d="M10.3 3h3.4l.5 2.6c.7.2 1.3.6 1.9 1l2.5-.9 1.7 2.9-2 1.7c.1.4.1.8.1 1.2s0 .8-.1 1.2l2 1.7-1.7 2.9-2.5-.9c-.6.4-1.2.8-1.9 1l-.5 2.6h-3.4l-.5-2.6c-.7-.2-1.3-.6-1.9-1l-2.5.9-1.7-2.9 2-1.7c-.1-.4-.1-.8-.1-1.2s0-.8.1-1.2l-2-1.7 1.7-2.9 2.5.9c.6-.4 1.2-.8 1.9-1l.5-2.6zm1.7 6.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </footer>
        </div>
      </div>
    </div>
    <div id="modalWrap" aria-hidden="true">
      <section
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <header class="mhead">
          <h2 id="modalTitle">Настройки</h2>
          <button
            class="modal-close"

              c.lineTo(3.5, -13);
              c.stroke();
            } else {
              rr(c, -9, -6, 18, 13, 2.5);
              c.stroke();
              c.beginPath();
              c.arc(0, 0.5, 3.2, 0, 6.283);
              c.stroke();
              c.beginPath();
              c.moveTo(-4, -6);
              c.lineTo(-2.5, -9);
              c.lineTo(2.5, -9);
              c.lineTo(4, -6);
              c.stroke();
            }
            c.beginPath();
            c.moveTo(-r * 0.66, r * 0.66);
            c.lineTo(r * 0.66, -r * 0.66);
            c.strokeStyle = PAL.danger;
            c.lineWidth = 4.6;
            c.stroke();
            c.restore();
          });
        }
        function drawDebris(c, x, y, k, smoke) {
          withAlpha(c, 1, function () {
            c.save();
            c.translate(x, y);
            c.beginPath();
            c.ellipse(0, 4, 46, 10, 0, 0, 6.283);
            c.fillStyle = "rgba(14,14,18,.8)";
            c.fill();
            c.save();
            c.translate(-10, -6);
            c.rotate(0.35);
            rr(c, -20, -7, 40, 14, 7);
            c.fillStyle = PAL.metalRaised;
            c.fill();
            c.strokeStyle = PAL.metalStroke;
            c.lineWidth = 1.5;
            c.stroke();
            c.strokeStyle = PAL.metalStroke;
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(-6, -7);
            c.lineTo(-14, -16);
            c.stroke();
            c.restore();
            c.save();
            c.translate(26, 2);
            c.rotate(-0.5);
            c.strokeStyle = PAL.metalWire;
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(-12, 0);
            c.lineTo(12, 0);
            c.moveTo(0, -12);
            c.lineTo(0, 12);
            c.stroke();
            c.restore();
            c.save();
            c.translate(-34, 4);
            c.rotate(1.2);
            c.strokeStyle = PAL.metalWire;
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(-10, 0);
            c.lineTo(10, 0);
            c.stroke();
            c.restore();
            if (smoke) {
              for (var i = 0; i < 3; i++) {
                var ph = (k * 0.5 + i * 0.33) % 1;
                c.beginPath();
                c.arc(
                  -8 + Math.sin(k + i * 2) * 6,
                  -14 - ph * 36,
                  4 + ph * 7,
                  0,
                  6.283,
                );
                c.fillStyle =
                  "rgba(156,148,138," + (0.22 * (1 - ph)).toFixed(3) + ")";
                c.fill();
              }
            }
            c.restore();
          });
        }
        function drawTape(c, x, y, a) {
          if (a <= 0.01) return;
          withAlpha(c, a, function () {
            var tape = function (dx, ang) {
              c.save();
              c.translate(dx, -4);
              c.rotate(ang);
              rr(c, -36, -8, 72, 16, 5);
              c.fillStyle = PAL.warning;
              c.fill();
              c.save();
              c.clip();
              c.fillStyle = PAL.metalDark;
              for (var i = -3; i <= 3; i++) {
                c.save();
                c.translate(i * 15, 0);
                c.rotate(0.6);
                c.fillRect(-4, -24, 8, 48);
                c.restore();
              }
              c.restore();
              rr(c, -36, -8, 72, 16, 5);
              c.strokeStyle = PAL.metalDark;
              c.lineWidth = 1.6;
              c.stroke();
              c.restore();
            };
            tape(-44, 0.14);
            tape(44, -0.14);
          });
        }
        function drawPhone(c, x, y, w, h, a, k) {
          if (a <= 0.01) return;
          withAlpha(c, a, function () {
            rr(c, x - w / 2, y - h / 2, w, h, 18);
            c.fillStyle = PAL.metalDark;
            c.fill();
            c.strokeStyle = PAL.metalStroke;
            c.lineWidth = 2.5;
            c.stroke();
            rr(c, x - w / 2 + 8, y - h / 2 + 9, w - 16, h - 18, 12);
            c.fillStyle = PAL.metalBase;
            c.fill();
            c.strokeStyle = "rgba(46,172,101,.35)";
            c.lineWidth = 1.5;
            c.stroke();
            c.fillStyle = PAL.textBright;
            c.font = "800 46px system-ui, sans-serif";
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText("112", x, y - 8);
            c.beginPath();
            c.arc(x, y + 58, 3.4, 0, 6.283);
            c.fillStyle = "rgba(46,172,101,.9)";
            c.fill();
            for (var i = 0; i < 2; i++) {
              var r = (k * 55 + i * 32) % 86;
              var al = (1 - r / 86) * 0.5;
              if (al <= 0.02) continue;
              c.beginPath();
              c.arc(x, y - h / 2, r + 6, 0, 6.283);
              c.strokeStyle = "rgba(46,172,101," + al.toFixed(3) + ")";
              c.lineWidth = 2;
              c.stroke();
            }
          });
        }
        function drawChip(c, x, y, txt, a) {
          if (a <= 0.01) return;
          withAlpha(c, a, function () {
            c.font = "700 14px system-ui, sans-serif";
            var w = c.measureText(txt).width + 26;
            rr(c, x - w / 2, y - 15, w, 30, 15);
            c.fillStyle = "rgba(46,172,101,.16)";
            c.fill();
            c.strokeStyle = "rgba(46,172,101,.5)";
            c.lineWidth = 1.5;
            c.stroke();
            c.fillStyle = PAL.textSoft;
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText(txt, x, y + 1);
          });
        }
        function drawBanner(c, x, y, a) {
          if (a <= 0.01) return;
          withAlpha(c, a, function () {
            var w = 236,
              h = 54;
            rr(c, x - w / 2, y - h / 2, w, h, 16);
            c.fillStyle = "rgba(46,172,101,.18)";
            c.strokeStyle = PAL.accent;
            c.lineWidth = 2;
            c.shadowColor = "rgba(46,172,101,.45)";
            c.shadowBlur = 16;
            c.fill();
            c.stroke();
            c.shadowBlur = 0;
            drawShield(c, x - w / 2 + 30, y, 13);
            c.fillStyle = PAL.textBright;
            c.font = "800 23px system-ui, sans-serif";
            c.textAlign = "left";
            c.textBaseline = "middle";
            c.fillText("ОТБОЙ", x - w / 2 + 52, y + 1);
          });
        }
        function drawGlowTop(c, a) {
          withAlpha(c, a, function () {
            var g = c.createRadialGradient(225, 150, 10, 225, 150, 240);
            g.addColorStop(0, "rgba(127,224,168,.16)");
            g.addColorStop(1, "rgba(127,224,168,0)");
            c.fillStyle = g;
            c.fillRect(-40, 0, 530, 420);
          });
        }
        function step1(c, t, k) {
          drawSchool(c, k, 0);
          drawPerson(c, 252, 652, { clock: k, lookUp: true });
          var fx = easeInOut(E(t, 0.1, 1.3));
          var dx = lerp(-70, 225, fx),
            dy = lerp(118, 152, fx);
          var e = E(t, 0.1, 0.7);
          drawBeam(c, dx, dy, e * 0.9);
          drawSoundArcs(c, dx, dy, k, e, false);
          drawDrone(c, dx, dy, { clock: k, alpha: e });
        }
        function step2(c, t, k) {
          drawSchool(c, k, 0);
          drawPerson(c, 252, 652, { clock: k, lookUp: true });
          var e = E(t, 0, 0.6);
          var dy = lerp(152, 242, e);
          drawRings(c, 225, dy, k, "rgba(229,72,77,", e, 120);
          drawWarn(c, 252, 556, 1, E(t, 0.35, 0.5), k);
          drawDrone(c, 225, dy, { clock: k, danger: true, alpha: e });
        }
        function step3(c, t, k) {
          drawSchool(c, k, 0.25);
          var e = E(t, 0, 0.5);
          drawSoundArcs(c, 308, 232, k, e * 0.55, false);
          drawDrone(c, 308, 232, { clock: k, alpha: e });
          drawPathArrow(c, 240, 648, 134, E(t, 0.3, 0.6));
          var wp = easeInOut(E(t, 0.25, 1.7));
          drawPerson(c, lerp(252, 120, wp), 652, {
            clock: k,
            walking: true,
            walkRate: 1.15,
          });
          drawDoorGlow(c, 98, 634, E(t, 0.5, 0.6), k);
        }
        function step4(c, t, k) {
          var eC = easeOut(E(t, 0.05, 0.7));
          withAlpha(c, 1 - eC, function () {
            drawSchool(c, k, 0);
          });
          withAlpha(c, eC, function () {
            drawSchoolCutaway(c, k);
            drawPerson(c, 98, 634, { clock: k, scale: 0.8 });
            drawShield(c, 98, 410, 12);
          });
          drawDrone(c, 352, 206, { clock: k, alpha: 0.5 });
        }
        function step5(c, t, k) {
          drawSchool(c, k, 0.45);
          drawPerson(c, 140, 652, { clock: k });
          drawMast(c, 98, 340, E(t, 0, 0.5), k);
          drawIconChip(c, 312, 296, "radio", E(t, 0.5, 0.45));
          drawIconChip(c, 368, 272, "tv", E(t, 0.9, 0.45));
          drawIconChip(c, 414, 300, "phone", E(t, 1.3, 0.45));
          drawDrone(c, 398, 166, { clock: k, alpha: 0.4, scale: 0.8 });
        }
        function step6(c, t, k) {
          drawSchool(c, k, 0);
          drawPerson(c, 168, 652, { clock: k });
          drawDebris(c, 300, 706, k, true);
          withAlpha(c, 0.7, function () {
            c.setLineDash([9, 7]);
            c.strokeStyle = "rgba(229,72,77,.75)";
            c.lineWidth = 2.5;
            c.beginPath();
            c.ellipse(300, 700, 100, 34, 0, 0, 6.283);
            c.stroke();
            c.setLineDash([]);
          });
          drawForbidden(c, 252, 596, 17, "come", E(t, 0.3, 0.45));
          drawForbidden(c, 300, 578, 17, "hand", E(t, 0.8, 0.45));
          drawForbidden(c, 348, 596, 17, "camera", E(t, 1.3, 0.45));
        }
        function step7(c, t, k, x0, x1) {
          drawSchool(c, k, 0);
          withAlpha(c, 0.5, function () {
            c.fillStyle = "rgba(0,0,0,.55)";
            c.fillRect(x0, 0, x1 - x0, 800);
          });
          var e = E(t, 0.1, 0.6);
          drawPerson(c, 225, 700, { clock: k, phone: true, scale: 1.02 });
          drawPhone(c, 225, 540, 118, 206, e, k);
          drawChip(c, 344, 452, "Место", E(t, 0.7, 0.4));
          drawChip(c, 350, 502, "Время", E(t, 1.05, 0.4));
          drawChip(c, 346, 552, "Ситуация", E(t, 1.4, 0.4));
        }
        function step8(c, t, k) {
          drawSchool(c, k, 0.8);
          drawDebris(c, 300, 706, k, false);
          drawTape(c, 300, 714, E(t, 0.35, 0.5));
          var wp = easeInOut(E(t, 0.3, 1.7));
          drawPerson(c, lerp(122, 268, wp), 652, {
            clock: k,
            walking: true,
            walkRate: 0.85,
          });
          drawBanner(c, 225, 142, E(t, 0.1, 0.6));
          drawGlowTop(c, E(t, 0.1, 0.8));
        }
        function drawStepLayer(c, n, alpha, t, k, x0, x1) {
          if (alpha <= 0) return;
          c.save();
          c.globalAlpha = alpha;
          switch (n) {
            case 1:
              step1(c, t, k);
              break;
            case 2:
              step2(c, t, k);
              break;
            case 3:
              step3(c, t, k);
              break;
            case 4:
              step4(c, t, k);
              break;
            case 5:
              step5(c, t, k);
              break;
            case 6:
              step6(c, t, k);
              break;
            case 7:
              step7(c, t, k, x0, x1);
              break;
            case 8:
              step8(c, t, k);
              break;
          }
          c.restore();
        }
        function draw() {
          var c = els.ctx;
          if (!c || !view.cw) return;
          c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
          c.fillStyle = PAL.bg;
          c.fillRect(0, 0, view.cw, view.ch);
          c.translate(view.ox, view.oy);
          c.scale(view.scale, view.scale);
          var x0 = -view.ox / view.scale - 2,
            x1 = (view.cw - view.ox) / view.scale + 2;
          drawBackdrop(c, x0, x1);
          var t = state.stepElapsed,
            k = state.clock;
          var fade = Math.min(t / TRANS, 1);
          if (
            state.prevStep >= 0 &&
            state.prevStep !== state.currentStep &&
            fade < 1
          ) {
            drawStepLayer(c, state.prevStep + 1, 1 - fade, STEP_DUR, k, x0, x1);
          }
          drawStepLayer(c, state.currentStep + 1, fade, t, k, x0, x1);
          c.setTransform(1, 0, 0, 1, 0, 0);
        }
      })();
    </script>
  </body>
