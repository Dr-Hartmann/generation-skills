<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F13" />
    <title>Кибербезопасность — интерактив</title>
    <style>
      :root {
        --ui-bg: #0f0f13;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #a0a0a0;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-shadow-strong: rgba(46, 172, 101, 0.35);
        --ui-accent-ambient-1: rgba(46, 172, 101, 0.34);
        --ui-accent-ambient-2: rgba(30, 122, 71, 0.3);
        --ui-accent-ambient-3: rgba(30, 122, 71, 0.38);
        --ui-ambient-blur: 90px;
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-border-faint: rgba(255, 255, 255, 0.08);
        --ui-scrim-strong: rgba(0, 0, 0, 0.65);
        --ui-surface-inset: rgba(0, 0, 0, 0.35);
        --ui-shadow-text: rgba(0, 0, 0, 0.8);
        --ui-danger: #a0a0a0;
        --ui-danger-hover-border: rgba(255, 255, 255, 0.3);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ui-bg);
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ui-text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }

      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        overflow: hidden;
        clip-path: inset(0);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }
      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }
      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }
      body.v916 #ambient {
        opacity: 1;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }

      .app-shell {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 28px 36px 28px;
        overflow: hidden;
      }
      .app-header {
        min-width: 0;
        padding-bottom: 20px;
      }
      .app-header h1 {
        margin: 0;
        color: var(--ui-text);
        font-size: clamp(22px, 2.2vw, 30px);
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
        gap: clamp(24px, 3.2vw, 54px);
        min-width: 0;
        min-height: 0;
      }
      .stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--ui-border-faint);
        border-radius: 26px;
        background: var(--ui-bg);
        box-shadow: inset 0 0 48px rgba(46, 172, 101, 0.035);
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        min-width: 0;
        min-height: 0;
        padding: 8px 0 4px;
      }
      .subtitle {
        display: flex;
        align-items: center;
        min-height: 112px;
        padding: 20px 21px;
        color: var(--ui-text);
        background: #00000080;
        border: 1px solid var(--ui-border-faint);
        border-radius: 18px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: clamp(16px, 4.5vw, 22px);
        font-weight: 650;
        line-height: 1.42;
        letter-spacing: -0.015em;
        animation: subtitle-in 0.32s ease both;
      }
      #subtitleText {
        display: block;
        width: 100%;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: normal;
      }
      .subtitle__keyword {
        color: var(--ui-accent);
        font-weight: 800;
      }
      @keyframes subtitle-in {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: auto;
        padding-top: 18px;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .control-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        min-width: 48px;
        min-height: 52px;
        padding: 0 18px;
        color: var(--ui-text);
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-soft);
        border-radius: 15px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 750;
        transition:
          background 0.18s,
          border-color 0.18s,
          transform 0.18s,
          opacity 0.18s;
      }
      .control-button svg {
        flex: 0 0 auto;
      }
      .control-button--main {
        flex: 1;
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 8px 28px var(--ui-accent-shadow);
      }
      .control-button--gear {
        width: 56px;
        padding: 0;
      }
      .control-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      @media (hover: hover) {
        .control-button:not(:disabled):hover {
          border-color: var(--ui-accent-border);
          background-color: var(--ui-accent-soft-hover);
          transform: translateY(-1px);
        }
        .control-button--main:not(:disabled):hover {
          background: linear-gradient(
            135deg,
            var(--ui-accent),
            var(--ui-accent-dark)
          );
          box-shadow: 0 10px 32px var(--ui-accent-shadow-strong);
        }
      }
      .control-button:active:not(:disabled) {
        transform: translateY(1px) scale(0.99);
      }
      .control-button:focus-visible,
      #modal button:focus-visible,
      #mSpeed:focus-visible {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      body.controls-hidden .controls {
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
      }

      .frame-overlay {
        display: none;
      }
      .workspace.video-mode {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
      }
      .workspace.video-mode .sidebar {
        display: none;
      }
      .workspace.video-mode .stage {
        flex: 0 1 auto;
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 9 / 16;
        border-color: var(--ui-accent-border);
        box-shadow:
          0 0 36px var(--ui-accent-shadow),
          inset 0 0 42px rgba(46, 172, 101, 0.08);
      }
      .workspace.video-mode .frame-overlay {
        position: absolute;
        z-index: 2;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 0 14px 16px;
        pointer-events: none;
      }
      .workspace.video-mode .frame-overlay .subtitle,
      .workspace.video-mode .frame-overlay .controls {
        pointer-events: auto;
      }
      .workspace.video-mode .frame-overlay .subtitle {
        min-height: 0;
        padding: 13px 14px;
        border-radius: 14px;
        font-size: clamp(16px, 4.5vw, 22px);
      }
      .workspace.video-mode .frame-overlay .controls {
        gap: 8px;
        margin-top: 0;
        padding-top: 0;
      }
      .workspace.video-mode .frame-overlay .control-button {
        min-height: 48px;
        border-radius: 13px;
      }
      .workspace.video-mode .frame-overlay .control-button--gear {
        width: 50px;
      }

      @media (max-width: 767.98px) {
        #ambient {
          inset: -10% calc(80px + env(safe-area-inset-right, 0px)) -10% -10%;
        }
        .app-shell {
          padding: max(16px, env(safe-area-inset-top, 0px))
            calc(80px + env(safe-area-inset-right, 0px))
            calc(25vh + env(safe-area-inset-bottom, 0px))
            max(16px, env(safe-area-inset-left, 0px));
        }
        .app-header {
          padding-bottom: 10px;
        }
        .app-header h1 {
          font-size: clamp(20px, 6vw, 25px);
        }
        .workspace {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .workspace:not(.video-mode) .stage {
          order: 1;
          flex: 1 1 0;
          width: 100%;
          min-height: 0;
          border-radius: 18px;
        }
        .workspace:not(.video-mode) .sidebar {
          display: contents;
        }
        .workspace:not(.video-mode) .subtitle {
          order: 2;
          flex: 0 0 auto;
          min-height: 72px;
          margin-bottom: 12px;
          padding: 12px 14px;
          border-radius: 14px;
        }
        .workspace:not(.video-mode) .controls {
          order: 3;
          flex: 0 0 auto;
          margin-top: 0;
          padding-top: 0;
          gap: 9px;
        }
        .workspace:not(.video-mode) .control-button {
          min-height: 48px;
        }
        .workspace:not(.video-mode) .control-button--gear {
          width: 52px;
        }
        .workspace.video-mode {
          flex: 1 1 auto;
        }
        .workspace.video-mode .stage {
          width: auto;
          height: 100%;
          max-width: 100%;
          max-height: 100%;
          border-radius: 18px;
        }
      }

      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--ui-modal-scrim);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #modalWrap.open {
        display: flex;
      }
      #modal {
        width: min(92vw, 380px);
        max-height: 90vh;
        max-height: 90dvh;
        overflow: auto;
        color: var(--ui-text);
        background: var(--ui-modal-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        animation: modal-pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        outline: none;
      }
      @keyframes modal-pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      body.modal-open {
        overflow: hidden;
      }
      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }
      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }
      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
      }
      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mlabel {
        flex: 1;
        color: var(--ui-muted);
        font-size: 14px;
        font-weight: 700;
      }
      #mSpeed {
        flex: 1.4;
        min-width: 92px;
        min-height: 48px;
        padding: 0 12px;
        color: var(--ui-text);
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-soft);
        border-radius: 10px;
        accent-color: var(--ui-accent);
      }
      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 48px;
      }
      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .sw span {
        position: absolute;
        top: 9px;
        right: 0;
        bottom: 9px;
        left: 0;
        height: 30px;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }
      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }
      .sw input:checked + span {
        background: var(--ui-accent);
      }
      .sw input:checked + span::before {
        transform: translateX(22px);
      }
      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      #mReset {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }
      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }
      .keys i {
        font-style: normal;
      }

      @media (max-width: 767.98px) {
        #modal {
          padding: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        #ambient .b1,
        #ambient .b2,
        #ambient .b3 {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i>
    </div>

    <main class="app-shell" id="appShell">
      <header class="app-header">
        <h1>Кибербезопасность</h1>
      </header>

      <section class="workspace" id="workspace">
        <div class="stage" id="stage">
          <canvas
            id="scene"
            role="img"
            aria-label="Визуализация принципов информационной безопасности"
          ></canvas>
          <div class="frame-overlay" id="frameOverlay"></div>
        </div>

        <aside class="sidebar" id="sidebar">
          <div
            class="subtitle"
            id="subtitle"
            aria-live="polite"
            aria-atomic="true"
          >
            <span id="subtitleText"></span>
          </div>
          <div class="controls" id="controls">
            <button
              class="control-button control-button--main"
              id="playButton"
              type="button"
              aria-label="Приостановить воспроизведение"
            >
              <svg
                id="playIcon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M8 5v14M16 5v14"
                  stroke="currentColor"
                  stroke-width="2.7"
                  stroke-linecap="round"
                />
              </svg>
              <span id="playLabel">Пауза</span>
            </button>
            <button
              class="control-button control-button--gear js-gear"
              type="button"
              aria-label="Открыть настройки"
            >
              <svg
                viewBox="0 0 24 24"
                width="21"
                height="21"
                aria-hidden="true"
              >
                <path
                  d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="m19.3 13.5 1.1.9-1.6 2.8-1.4-.5a7.8 7.8 0 0 1-1.5.9l-.2 1.5h-3.2l-.3-1.5a7.8 7.8 0 0 1-1.6-.9l-1.4.5-1.6-2.8 1.2-.9a7 7 0 0 1 0-1.8l-1.2-.9 1.6-2.8 1.4.5a7.8 7.8 0 0 1 1.6-.9l.3-1.5h3.2l.2 1.5a7.8 7.8 0 0 1 1.5.9l1.4-.5 1.6 2.8-1.1.9a7 7 0 0 1 0 1.8Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.35"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </aside>
      </section>
    </main>

    <div id="modalWrap" aria-hidden="true">
      <section
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <header class="mhead">
          <h2 id="modalTitle">Настройки</h2>
          <button
            class="modal-close"
            id="mClose"
            type="button"
            data-modal-close
            aria-label="Закрыть"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6 6 18"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="mstep" id="mStepTxt">Шаг 1 / 8</div>
        <div class="seg" role="group" aria-label="Режим воспроизведения">
          <button
            id="mAuto"
            class="active"
            type="button"
            data-mode="auto"
            aria-pressed="true"
          >
            AUTO
          </button>
          <button
            id="mStepBtn"
            type="button"
            data-mode="step"
            aria-pressed="false"
          >
            STEP
          </button>
        </div>
        <button id="mNext" type="button" data-modal-action="next-step" disabled>
          Следующий шаг ▶
        </button>
        <div class="mrow">
          <label class="mlabel" for="mSpeed">Скорость</label>
          <select id="mSpeed" aria-label="Скорость воспроизведения">
            <option value="0.5">0,5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </div>
        <div class="mrow">
          <span class="mlabel" id="mNineLabel">Режим 9:16</span>
          <label class="sw" aria-labelledby="mNineLabel">
            <input type="checkbox" id="mNine" data-modal-toggle="video-mode" />
            <span aria-hidden="true"></span>
          </label>
        </div>
        <button id="mReset" type="button" data-modal-action="reset">
          Reset
        </button>
        <div class="keys" aria-label="Горячие клавиши">
          <span>Space</span><i>скрыть панель</i> <span>→</span
          ><i>следующий шаг</i> <span>R</span><i>сброс</i> <span>S</span
          ><i>AUTO / STEP</i> <span>V</span><i>режим 9:16</i> <span>Esc</span
          ><i>закрыть</i>
        </div>
      </section>
    </div>

    <script>
      (function (global) {
        "use strict";
        function initSettingsModal(options) {
          const config = Object.assign(
            {
              overlaySelector: "#modalWrap",
              dialogSelector: "#modal",
              openSelector: ".js-gear",
              closeSelector: "[data-modal-close]",
            },
            options || {},
          );
          const overlay = document.querySelector(config.overlaySelector);
          if (!overlay) throw new Error("Settings modal overlay not found.");
          const dialog =
            overlay.querySelector(config.dialogSelector) ||
            overlay.querySelector('[role="dialog"]');
          if (!dialog) throw new Error("Settings modal dialog not found.");
          const openers = Array.from(
            document.querySelectorAll(config.openSelector),
          );
          const closers = Array.from(
            overlay.querySelectorAll(config.closeSelector),
          );
          let previouslyFocused = null;

          function open() {
            if (overlay.classList.contains("open")) return;
            previouslyFocused = document.activeElement;
            overlay.classList.add("open");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            dialog.focus();
          }
          function close() {
            if (!overlay.classList.contains("open")) return;
            overlay.classList.remove("open");
            overlay.setAttribute("aria-hidden", "true");
            document.body.classList.remove("modal-open");
            if (
              previouslyFocused &&
              typeof previouslyFocused.focus === "function"
            )
              previouslyFocused.focus();
          }
          function toggle() {
            overlay.classList.contains("open") ? close() : open();
          }
          openers.forEach((button) => button.addEventListener("click", toggle));
          closers.forEach((button) => button.addEventListener("click", close));
          overlay.addEventListener("click", (event) => {
            if (event.target === overlay) close();
          });
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && overlay.classList.contains("open"))
              close();
          });
          overlay.querySelectorAll("[data-mode]").forEach((button) => {
            button.addEventListener("click", () => {
              const mode = button.dataset.mode;
              overlay.querySelectorAll("[data-mode]").forEach((item) => {
                const active = item === button;
                item.classList.toggle("active", active);
                item.setAttribute("aria-pressed", String(active));
              });
              overlay.dispatchEvent(
                new CustomEvent("settings:mode", { detail: { mode } }),
              );
            });
          });
          overlay
            .querySelectorAll('[data-modal-action="next-step"]')
            .forEach((button) => {
              button.addEventListener("click", () =>
                overlay.dispatchEvent(new CustomEvent("settings:next-step")),
              );
            });
          const speed = overlay.querySelector("#mSpeed");
          const speedValue = overlay.querySelector("#mSpeedVal");
          if (speed)
            speed.addEventListener("change", () => {
              if (speedValue)
                speedValue.textContent = speed.value.replace(".", ",") + "×";
              overlay.dispatchEvent(
                new CustomEvent("settings:speed", {
                  detail: { value: Number(speed.value) },
                }),
              );
            });
          const videoMode = overlay.querySelector(
            '[data-modal-toggle="video-mode"]',
          );
          if (videoMode)
            videoMode.addEventListener("change", () => {
              overlay.dispatchEvent(
                new CustomEvent("settings:video-mode", {
                  detail: { enabled: videoMode.checked },
                }),
              );
            });
          overlay
            .querySelectorAll('[data-modal-action="reset"]')
            .forEach((button) => {
              button.addEventListener("click", () =>
                overlay.dispatchEvent(new CustomEvent("settings:reset")),
              );
            });
          return {
            open,
            close,
            toggle,
            setStepText(text) {
              const target = overlay.querySelector("#mStepTxt");
              if (target) target.textContent = text;
            },
            setMode(mode) {
              const target = overlay.querySelector(
                '[data-mode="' + mode + '"]',
              );
              if (target) target.click();
            },
            setSpeed(value) {
              if (!speed) return;
              speed.value = String(value);
              speed.dispatchEvent(new Event("change", { bubbles: true }));
            },
            setVideoMode(enabled) {
              if (!videoMode) return;
              videoMode.checked = Boolean(enabled);
              videoMode.dispatchEvent(new Event("change", { bubbles: true }));
            },
          };
        }
        global.SettingsModal = { init: initSettingsModal };
      })(window);
    </script>

    <script>
      (() => {
        "use strict";

        const PARAMS = Object.freeze({
          autoStartDelay: 500,
          stepDuration: 4400,
        });

        const STEPS = [
          {
            title: "ТРИАДА ЗАЩИТЫ",
            icon: "shield",
            chips: ["Конфиденциальность", "Целостность", "Доступность"],
            subtitle: [
              { text: "Три принципа защиты: " },
              { text: "конфиденциальность", emphasis: true },
              { text: ", целостность и доступность." },
            ],
          },
          {
            title: "ФИШИНГ И ОБМАН",
            icon: "mail",
            chips: ["Отправитель", "Адрес ссылки", "Срочность"],
            subtitle: [
              { text: "Проверяй " },
              { text: "отправителя", emphasis: true },
              { text: ", адрес ссылки и срочные требования." },
            ],
          },
          {
            title: "НЕИЗВЕСТНЫЕ ФАЙЛЫ",
            icon: "file",
            chips: ["Трояны / шпионы", "Вымогатели", "Неизвестные файлы"],
            subtitle: [
              { text: "Не запускай " },
              { text: "неизвестные файлы", emphasis: true },
              { text: " и не доверяй неожиданным вложениям." },
            ],
          },
          {
            title: "ЗАЩИТА АККАУНТА",
            icon: "key",
            chips: ["Уникальный пароль", "Менеджер паролей", "2FA"],
            subtitle: [
              { text: "Используй " },
              { text: "уникальные пароли", emphasis: true },
              { text: " и многофакторную аутентификацию." },
            ],
          },
          {
            title: "ЗАЩИТА УСТРОЙСТВА",
            icon: "device",
            chips: ["Обновления", "Антивирус / экран", "Wi-Fi / VPN"],
            subtitle: [
              { text: "Обновляй систему, проверяй " },
              { text: "разрешения", emphasis: true },
              { text: " и защищай сетевые подключения." },
            ],
          },
          {
            title: "ЦИФРОВОЙ СЛЕД",
            icon: "privacy",
            chips: ["Фото / документы", "Геолокация", "Доксинг"],
            subtitle: [
              { text: "Публикуй минимум личного: " },
              { text: "цифровой след", emphasis: true },
              { text: " сохраняется надолго." },
            ],
          },
          {
            title: "РЕАГИРОВАНИЕ",
            icon: "response",
            chips: ["Сменить пароль", "Завершить сеансы", "Поддержка"],
            subtitle: [
              { text: "При взломе смени пароль, " },
              { text: "заверши сеансы", emphasis: true },
              { text: ", обратись в поддержку." },
            ],
          },
          {
            title: "ПРОВЕРКА ИСТОЧНИКА",
            icon: "verify",
            chips: ["Аудио / видео", "Проверка источника", "Резервная копия"],
            subtitle: [
              { text: "Проверяй аудио и видео " },
              { text: "по другому каналу", emphasis: true },
              { text: "; храни резервные копии." },
            ],
          },
        ];

        const state = {
          mode: "AUTO",
          isPlaying: false,
          started: false,
          currentStep: 0,
          speed: 1,
          videoMode: false,
          elapsed: 0,
          progress: 0,
          transitioning: true,
          controlsHidden: false,
        };

        const el = {};
        let ctx = null;
        let sceneWidth = 0;
        let sceneHeight = 0;
        let resizeObserver = null;
        let settingsModal = null;
        let lastFrameTime = 0;
        let rafId = 0;

        function init() {
          el.workspace = document.getElementById("workspace");
          el.stage = document.getElementById("stage");
          el.canvas = document.getElementById("scene");
          el.subtitle = document.getElementById("subtitle");
          el.subtitleText = document.getElementById("subtitleText");
          el.sidebar = document.getElementById("sidebar");
          el.controls = document.getElementById("controls");
          el.frameOverlay = document.getElementById("frameOverlay");
          el.playButton = document.getElementById("playButton");
          el.playIcon = document.getElementById("playIcon");
          el.playLabel = document.getElementById("playLabel");
          el.modalWrap = document.getElementById("modalWrap");

          if (
            !el.canvas ||
            !el.stage ||
            !el.subtitle ||
            !el.subtitleText ||
            !el.playButton
          ) {
            console.error(
              "Не удалось инициализировать интерфейс кибербезопасности: отсутствуют обязательные элементы.",
            );
            return;
          }
          ctx = el.canvas.getContext("2d");
          if (!ctx) {
            console.error("Браузер не предоставил Canvas 2D.");
            return;
          }

          renderSubtitle(state.currentStep);
          el.playButton.addEventListener("click", togglePlay);
          el.modalWrap.addEventListener("settings:mode", (event) =>
            setMode(event.detail.mode),
          );
          el.modalWrap.addEventListener("settings:next-step", onStep);
          el.modalWrap.addEventListener("settings:speed", (event) =>
            setSpeed(event.detail.value),
          );
          el.modalWrap.addEventListener("settings:video-mode", (event) =>
            applyVideoMode(event.detail.enabled),
          );
          el.modalWrap.addEventListener("settings:reset", reset);

          try {
            if (
              !window.SettingsModal ||
              typeof window.SettingsModal.init !== "function"
            ) {
              throw new Error("Контроллер окна настроек недоступен.");
            }
            settingsModal = window.SettingsModal.init();
          } catch (error) {
            console.error(error);
          }

          if ("ResizeObserver" in window) {
            resizeObserver = new ResizeObserver(resize);
            resizeObserver.observe(el.stage);
          }
          window.addEventListener("resize", resize, { passive: true });
          document.addEventListener("keydown", handleInput);
          document.addEventListener("visibilitychange", () => {
            lastFrameTime = 0;
          });
          resize();
          renderControls();
          updateSettingsStep();
          rafId = requestAnimationFrame(frame);
          window.setTimeout(startAuto, PARAMS.autoStartDelay);
        }

        function startAuto() {
          state.started = true;
          state.isPlaying = true;
          renderControls();
        }

        function frame(timestamp) {
          const dt = lastFrameTime
            ? Math.min(timestamp - lastFrameTime, 100)
            : 0;
          lastFrameTime = timestamp;
          update(dt);
          draw();
          rafId = requestAnimationFrame(frame);
        }

        function update(dt) {
          if (
            !state.started ||
            !state.isPlaying ||
            (state.mode !== "AUTO" && !state.transitioning)
          )
            return;
          state.elapsed += dt * state.speed;
          state.progress = Math.min(1, state.elapsed / PARAMS.stepDuration);
          if (state.elapsed >= PARAMS.stepDuration) {
            if (state.mode === "AUTO") {
              state.currentStep = (state.currentStep + 1) % STEPS.length;
              state.elapsed = 0;
              state.progress = 0;
              state.transitioning = true;
              renderSubtitle(state.currentStep);
              updateSettingsStep();
            } else {
              state.elapsed = PARAMS.stepDuration;
              state.progress = 1;
              state.transitioning = false;
              state.isPlaying = false;
              renderControls();
            }
          }
        }

        function onStep() {
          if (
            state.mode !== "STEP" ||
            state.transitioning ||
            state.currentStep >= STEPS.length - 1
          )
            return;
          state.currentStep += 1;
          state.elapsed = 0;
          state.progress = 0;
          state.transitioning = true;
          state.started = true;
          state.isPlaying = true;
          renderSubtitle(state.currentStep);
          updateSettingsStep();
          renderControls();
        }

        function setMode(modeValue) {
          const nextMode = String(modeValue).toUpperCase();
          if (nextMode !== "AUTO" && nextMode !== "STEP") return;
          if (nextMode === state.mode) {
            renderControls();
            return;
          }
          if (nextMode === "STEP") {
            state.mode = "STEP";
            state.elapsed = PARAMS.stepDuration;
            state.progress = 1;
            state.transitioning = false;
            state.isPlaying = false;
          } else {
            state.mode = "AUTO";
            if (!state.transitioning) {
              state.elapsed = 0;
              state.progress = 0;
              state.transitioning = true;
            }
            state.started = true;
            state.isPlaying = true;
          }
          renderControls();
        }

        function togglePlay() {
          state.started = true;
          if (state.mode === "STEP" && !state.transitioning) return;
          state.isPlaying = !state.isPlaying;
          renderControls();
        }

        function setSpeed(value) {
          const allowed = [0.5, 1, 2];
          const requested = Number(value);
          if (!allowed.includes(requested)) return;
          state.speed = requested;
          const output = document.getElementById("mSpeedVal");
          if (output)
            output.textContent = `${requested.toString().replace(".", ",")}×`;
        }

        function reset() {
          state.mode = "AUTO";
          state.currentStep = 0;
          state.elapsed = 0;
          state.progress = 0;
          state.transitioning = true;
          state.started = true;
          state.isPlaying = true;
          if (settingsModal) settingsModal.setMode("auto");
          renderSubtitle(state.currentStep);
          updateSettingsStep();
          renderControls();
        }

        function applyVideoMode(enabled) {
          const next = Boolean(enabled);
          if (next === state.videoMode) return;
          state.videoMode = next;
          document.body.classList.toggle("v916", next);
          el.workspace.classList.toggle("video-mode", next);
          if (next) {
            el.frameOverlay.append(el.subtitle, el.controls);
            el.sidebar.hidden = true;
          } else {
            el.sidebar.hidden = false;
            el.sidebar.append(el.subtitle, el.controls);
            el.stage.style.width = "";
            el.stage.style.height = "";
          }
          requestAnimationFrame(resize);
        }

        function renderSubtitle(stepIndex) {
          const item = STEPS[stepIndex];
          if (!item || !el.subtitle) return;
          const fragment = document.createDocumentFragment();
          for (const segment of item.subtitle) {
            if (segment.emphasis) {
              const span = document.createElement("span");
              span.className = "subtitle__keyword";
              span.textContent = segment.text;
              fragment.appendChild(span);
            } else {
              fragment.appendChild(document.createTextNode(segment.text));
            }
          }
          el.subtitleText.replaceChildren(fragment);
          el.subtitle.style.animation = "none";
          void el.subtitle.offsetWidth;
          el.subtitle.style.animation = "";
          el.canvas.setAttribute(
            "aria-label",
            `Шаг ${stepIndex + 1}: ${item.title.toLocaleLowerCase("ru-RU")}`,
          );
        }

        function updateSettingsStep() {
          if (settingsModal)
            settingsModal.setStepText(
              `Шаг ${state.currentStep + 1} / ${STEPS.length}`,
            );
          const stepText = document.getElementById("mStepTxt");
          if (stepText)
            stepText.textContent = `Шаг ${state.currentStep + 1} / ${STEPS.length}`;
        }

        function renderControls() {
          const paused = !state.isPlaying;
          const label =
            state.mode === "STEP" && !state.transitioning
              ? "Ожидание шага"
              : paused
                ? "Продолжить"
                : "Пауза";
          const iconPath = paused
            ? '<path d="m9 5 10 7-10 7V5Z" fill="currentColor"/>'
            : '<path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>';
          el.playIcon.innerHTML = iconPath;
          el.playLabel.textContent = label;
          el.playButton.setAttribute("aria-label", label);
          el.playButton.disabled =
            state.mode === "STEP" && !state.transitioning;
          el.playButton.setAttribute("aria-pressed", String(state.isPlaying));
          const next = document.getElementById("mNext");
          if (next)
            next.disabled =
              state.mode !== "STEP" ||
              state.transitioning ||
              state.currentStep >= STEPS.length - 1;
          const autoButton = document.getElementById("mAuto");
          const stepButton = document.getElementById("mStepBtn");
          if (autoButton && stepButton) {
            autoButton.classList.toggle("active", state.mode === "AUTO");
            stepButton.classList.toggle("active", state.mode === "STEP");
            autoButton.setAttribute(
              "aria-pressed",
              String(state.mode === "AUTO"),
            );
            stepButton.setAttribute(
              "aria-pressed",
              String(state.mode === "STEP"),
            );
          }
          updateSettingsStep();
        }

        function handleInput(event) {
          if (
            window.matchMedia &&
            !window.matchMedia("(min-width: 768px)").matches
          )
            return;
          const target = event.target;
          if (
            target &&
            (target.isContentEditable ||
              /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName) ||
              target.closest('button, [role="button"]'))
          )
            return;
          if (event.key === "Escape") return;
          if (event.code === "Space") {
            event.preventDefault();
            state.controlsHidden = !state.controlsHidden;
            document.body.classList.toggle(
              "controls-hidden",
              state.controlsHidden,
            );
            return;
          }
          const key = event.key.toLowerCase();
          if (event.key === "ArrowRight" && state.mode === "STEP") {
            event.preventDefault();
            onStep();
          } else if (key === "r") {
            event.preventDefault();
            reset();
          } else if (key === "s") {
            event.preventDefault();
            if (settingsModal)
              settingsModal.setMode(state.mode === "AUTO" ? "step" : "auto");
          } else if (key === "v") {
            event.preventDefault();
            if (settingsModal) settingsModal.setVideoMode(!state.videoMode);
          }
        }

        function resize() {
          if (!ctx || !el.stage) return;
          if (state.videoMode) {
            const available = el.workspace.getBoundingClientRect();
            const frameHeight = Math.max(
              0,
              Math.min(available.height, (available.width * 16) / 9),
            );
            const frameWidth = (frameHeight * 9) / 16;
            el.stage.style.width = `${frameWidth}px`;
            el.stage.style.height = `${frameHeight}px`;
          }
          const rect = el.stage.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;
          const dpr = window.devicePixelRatio || 1;
          sceneWidth = rect.width;
          sceneHeight = rect.height;
          const backingWidth = Math.round(rect.width * dpr);
          const backingHeight = Math.round(rect.height * dpr);
          if (
            el.canvas.width !== backingWidth ||
            el.canvas.height !== backingHeight
          ) {
            el.canvas.width = backingWidth;
            el.canvas.height = backingHeight;
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          draw();
        }

        function draw() {
          if (!ctx || !sceneWidth || !sceneHeight) return;
          const w = sceneWidth;
          const h = sceneHeight;
          const item = STEPS[state.currentStep];
          const p = easeOutCubic(state.progress);
          const vertical = h > w * 1.08;
          const unit = Math.min(w, h);
          const cx = w * 0.5;
          const cy = vertical ? h * (state.videoMode ? 0.37 : 0.46) : h * 0.52;

          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = "#0F0F13";
          ctx.fillRect(0, 0, w, h);

          const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, unit * 0.66);
          glow.addColorStop(0, "rgba(46,172,101,.11)");
          glow.addColorStop(1, "rgba(46,172,101,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, w, h);

          ctx.save();
          ctx.strokeStyle = "rgba(255,255,255,.035)";
          ctx.lineWidth = 1;
          const grid = Math.max(28, Math.round(unit / 9));
          for (let x = grid; x < w; x += grid) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
          }
          for (let y = grid; y < h; y += grid) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }
          ctx.restore();

          ctx.save();
          ctx.fillStyle = "rgba(160,160,160,.82)";
          ctx.font = `700 ${Math.max(9, Math.min(12, unit * 0.035))}px system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(
            `ШАГ ${String(state.currentStep + 1).padStart(2, "0")}  /  ${String(STEPS.length).padStart(2, "0")}`,
            cx,
            h * (vertical ? 0.075 : 0.085),
          );
          ctx.fillStyle = "#FFFFFF";
          ctx.font = `800 ${Math.max(14, Math.min(vertical ? 18 : 24, w * 0.036))}px system-ui, sans-serif`;
          ctx.fillText(item.title, cx, h * (vertical ? 0.13 : 0.16));
          ctx.restore();

          const iconScale =
            (0.76 + 0.24 * p) * (1 + Math.sin(state.elapsed * 0.003) * 0.012);
          const iconSize =
            unit *
            (vertical ? (state.videoMode ? 0.27 : 0.34) : 0.39) *
            iconScale;
          drawOrbit(cx, cy, iconSize * 0.76, p, state.elapsed);
          ctx.save();
          ctx.globalAlpha = 0.58 + 0.42 * p;
          ctx.translate(cx, cy);
          ctx.scale(iconSize / 180, iconSize / 180);
          drawIcon(item.icon, ctx);
          ctx.restore();

          const chipsY = vertical
            ? h * (state.videoMode ? 0.48 : 0.72)
            : h * 0.82;
          drawChips(item.chips, cx, chipsY, w, vertical);
          if (!vertical && w > 700) drawSideNotes(item, cx, cy, unit, p);

          ctx.save();
          ctx.strokeStyle = "rgba(46,172,101,.28)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(
            cx,
            cy,
            iconSize * 0.58,
            -Math.PI / 2,
            -Math.PI / 2 + Math.PI * 2 * p,
          );
          ctx.stroke();
          ctx.restore();
        }

        function easeOutCubic(value) {
          return 1 - Math.pow(1 - value, 3);
        }

        function roundedRect(context, x, y, width, height, radius) {
          const r = Math.min(radius, width / 2, height / 2);
          context.beginPath();
          context.moveTo(x + r, y);
          context.arcTo(x + width, y, x + width, y + height, r);
          context.arcTo(x + width, y + height, x, y + height, r);
          context.arcTo(x, y + height, x, y, r);
          context.arcTo(x, y, x + width, y, r);
          context.closePath();
        }

        function drawOrbit(x, y, radius, progress, elapsed) {
          ctx.save();
          ctx.strokeStyle = "rgba(46,172,101,.15)";
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 8]);
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          const angle = progress * Math.PI * 1.45 - Math.PI * 0.72;
          const dotX = x + Math.cos(angle) * radius;
          const dotY = y + Math.sin(angle) * radius;
          ctx.fillStyle = "#2EAC65";
          ctx.shadowColor = "#1E7A47";
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(
            dotX,
            dotY,
            4 + Math.sin(elapsed * 0.004) * 0.5,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.restore();
        }

        function drawIcon(type, context) {
          const c = context;
          c.lineCap = "round";
          c.lineJoin = "round";
          c.strokeStyle = "#2EAC65";
          c.fillStyle = "rgba(46,172,101,.12)";
          c.lineWidth = 5;
          if (type === "shield") {
            c.beginPath();
            c.moveTo(0, -78);
            c.lineTo(65, -52);
            c.lineTo(58, 18);
            c.quadraticCurveTo(48, 58, 0, 82);
            c.quadraticCurveTo(-48, 58, -58, 18);
            c.lineTo(-65, -52);
            c.closePath();
            c.fill();
            c.stroke();
            drawLock(c, 0, 3, 0.8);
            c.strokeStyle = "rgba(255,255,255,.7)";
            c.lineWidth = 4;
            c.beginPath();
            c.moveTo(-25, 39);
            c.lineTo(-8, 54);
            c.lineTo(30, 17);
            c.stroke();
          } else if (type === "mail") {
            c.fillStyle = "rgba(46,172,101,.09)";
            roundedRect(c, -82, -56, 164, 112, 15);
            c.fill();
            c.stroke();
            c.strokeStyle = "rgba(255,255,255,.8)";
            c.lineWidth = 5;
            c.beginPath();
            c.moveTo(-75, -45);
            c.lineTo(0, 13);
            c.lineTo(75, -45);
            c.stroke();
            c.beginPath();
            c.moveTo(-74, 47);
            c.lineTo(-20, 0);
            c.moveTo(74, 47);
            c.lineTo(20, 0);
            c.stroke();
            c.fillStyle = "#2EAC65";
            c.beginPath();
            c.arc(65, -60, 15, 0, Math.PI * 2);
            c.fill();
            c.strokeStyle = "#0F0F13";
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(65, -68);
            c.lineTo(65, -57);
            c.stroke();
            c.fillStyle = "#0F0F13";
            c.beginPath();
            c.arc(65, -51, 1.8, 0, Math.PI * 2);
            c.fill();
          } else if (type === "file") {
            c.fillStyle = "rgba(46,172,101,.09)";
            c.beginPath();
            c.moveTo(-58, -76);
            c.lineTo(24, -76);
            c.lineTo(64, -36);
            c.lineTo(64, 76);
            c.quadraticCurveTo(64, 84, 54, 84);
            c.lineTo(-54, 84);
            c.quadraticCurveTo(-64, 84, -64, 74);
            c.lineTo(-64, -66);
            c.quadraticCurveTo(-64, -76, -58, -76);
            c.closePath();
            c.fill();
            c.stroke();
            c.strokeStyle = "rgba(255,255,255,.55)";
            c.lineWidth = 4;
            c.beginPath();
            c.moveTo(24, -74);
            c.lineTo(24, -36);
            c.lineTo(62, -36);
            c.stroke();
            c.strokeStyle = "#2EAC65";
            c.lineWidth = 6;
            c.beginPath();
            c.moveTo(0, -4);
            c.lineTo(0, 31);
            c.stroke();
            c.fillStyle = "#2EAC65";
            c.beginPath();
            c.arc(0, 52, 4, 0, Math.PI * 2);
            c.fill();
          } else if (type === "key") {
            c.fillStyle = "rgba(46,172,101,.1)";
            c.beginPath();
            c.arc(-34, -12, 42, 0, Math.PI * 2);
            c.fill();
            c.stroke();
            c.strokeStyle = "rgba(255,255,255,.8)";
            c.lineWidth = 5;
            c.beginPath();
            c.arc(-34, -12, 19, 0, Math.PI * 2);
            c.stroke();
            c.strokeStyle = "#2EAC65";
            c.lineWidth = 12;
            c.beginPath();
            c.moveTo(0, 18);
            c.lineTo(76, 94);
            c.stroke();
            c.lineWidth = 8;
            c.beginPath();
            c.moveTo(46, 64);
            c.lineTo(62, 48);
            c.moveTo(64, 82);
            c.lineTo(80, 66);
            c.stroke();
            c.fillStyle = "#2EAC65";
            c.beginPath();
            c.arc(0, 18, 8, 0, Math.PI * 2);
            c.fill();
          } else if (type === "device") {
            c.fillStyle = "rgba(46,172,101,.09)";
            roundedRect(c, -82, -64, 164, 112, 12);
            c.fill();
            c.stroke();
            c.strokeStyle = "rgba(255,255,255,.72)";
            c.lineWidth = 5;
            c.beginPath();
            c.moveTo(-98, 65);
            c.lineTo(98, 65);
            c.lineTo(77, 48);
            c.lineTo(-77, 48);
            c.closePath();
            c.stroke();
            c.strokeStyle = "#2EAC65";
            c.lineWidth = 6;
            c.beginPath();
            c.arc(0, -7, 29, -Math.PI * 0.8, Math.PI * 0.65);
            c.stroke();
            c.beginPath();
            c.moveTo(22, -29);
            c.lineTo(30, -4);
            c.lineTo(6, -11);
            c.stroke();
          } else if (type === "privacy") {
            c.strokeStyle = "rgba(255,255,255,.76)";
            c.lineWidth = 4;
            c.beginPath();
            c.moveTo(-56, -34);
            c.lineTo(42, -38);
            c.lineTo(48, 48);
            c.lineTo(-50, 50);
            c.closePath();
            c.stroke();
            c.fillStyle = "rgba(46,172,101,.16)";
            c.beginPath();
            c.arc(0, 0, 43, 0, Math.PI * 2);
            c.fill();
            c.strokeStyle = "#2EAC65";
            c.lineWidth = 5;
            c.stroke();
            c.beginPath();
            c.moveTo(0, -26);
            c.bezierCurveTo(-48, 16, -26, 45, 0, 58);
            c.bezierCurveTo(28, 40, 48, 10, 0, -26);
            c.stroke();
            c.fillStyle = "#2EAC65";
            c.beginPath();
            c.arc(0, 4, 8, 0, Math.PI * 2);
            c.fill();
          } else if (type === "response") {
            c.beginPath();
            c.moveTo(0, -82);
            c.lineTo(65, -56);
            c.lineTo(58, 18);
            c.quadraticCurveTo(48, 58, 0, 82);
            c.quadraticCurveTo(-48, 58, -58, 18);
            c.lineTo(-65, -56);
            c.closePath();
            c.fill();
            c.stroke();
            c.strokeStyle = "rgba(255,255,255,.8)";
            c.lineWidth = 8;
            c.beginPath();
            c.moveTo(-30, 2);
            c.lineTo(-8, 25);
            c.lineTo(34, -24);
            c.stroke();
          } else if (type === "verify") {
            c.fillStyle = "rgba(46,172,101,.09)";
            roundedRect(c, -62, -82, 124, 164, 16);
            c.fill();
            c.stroke();
            c.strokeStyle = "rgba(255,255,255,.65)";
            c.lineWidth = 4;
            c.beginPath();
            c.moveTo(-28, -55);
            c.lineTo(28, -55);
            c.moveTo(-15, 56);
            c.lineTo(15, 56);
            c.stroke();
            c.strokeStyle = "#2EAC65";
            c.lineWidth = 5;
            c.beginPath();
            c.moveTo(-38, 3);
            c.lineTo(-26, 3);
            c.lineTo(-15, -18);
            c.lineTo(-2, 25);
            c.lineTo(10, -9);
            c.lineTo(21, 5);
            c.lineTo(37, 5);
            c.stroke();
            c.fillStyle = "#2EAC65";
            c.beginPath();
            c.arc(0, -36, 6, 0, Math.PI * 2);
            c.fill();
          }
        }

        function drawLock(c, x, y, scale) {
          c.save();
          c.translate(x, y);
          c.scale(scale, scale);
          c.strokeStyle = "rgba(255,255,255,.82)";
          c.lineWidth = 6;
          c.beginPath();
          c.arc(0, -10, 24, Math.PI, 0);
          c.stroke();
          c.fillStyle = "#2EAC65";
          roundedRect(c, -31, -7, 62, 48, 9);
          c.fill();
          c.fillStyle = "#0F0F13";
          c.beginPath();
          c.arc(0, 12, 5, 0, Math.PI * 2);
          c.fill();
          c.fillRect(-2, 12, 4, 13);
          c.restore();
        }

        function drawChips(chips, centerX, y, width, vertical) {
          const narrow = width < 520;
          const fontSize = Math.max(9, Math.min(12, width * 0.028));
          const gap = narrow ? 8 : 12;
          const h = narrow ? 27 : 32;
          ctx.save();
          ctx.font = `700 ${fontSize}px system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          if (narrow) {
            const columns = width < 285 ? 1 : 2;
            const boxWidth =
              columns === 1 ? Math.min(width - 36, 210) : (width - 42) / 2;
            const rows = Math.ceil(chips.length / columns);
            chips.forEach((label, index) => {
              const row = Math.floor(index / columns);
              const col = index % columns;
              const rowCount = Math.min(columns, chips.length - row * columns);
              const x =
                columns === 1
                  ? centerX
                  : centerX + (col - (rowCount - 1) / 2) * (boxWidth + gap);
              drawChip(x, y + row * (h + 8), boxWidth, h, label, fontSize);
            });
          } else {
            const boxWidth = Math.min(
              190,
              (width - 80 - gap * (chips.length - 1)) / chips.length,
            );
            const total = boxWidth * chips.length + gap * (chips.length - 1);
            chips.forEach((label, index) => {
              const x =
                centerX - total / 2 + boxWidth / 2 + index * (boxWidth + gap);
              drawChip(x, y, boxWidth, h, label, fontSize);
            });
          }
          ctx.restore();
        }

        function drawChip(x, y, width, height, label, fontSize) {
          ctx.save();
          roundedRect(
            ctx,
            x - width / 2,
            y - height / 2,
            width,
            height,
            height / 2,
          );
          ctx.fillStyle = "rgba(46,172,101,.11)";
          ctx.fill();
          ctx.strokeStyle = "rgba(46,172,101,.32)";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = "#FFFFFF";
          ctx.font = `700 ${fontSize}px system-ui, sans-serif`;
          let display = label;
          while (
            ctx.measureText(display).width > width - 14 &&
            display.length > 5
          )
            display = display.slice(0, -2) + "…";
          ctx.fillText(display, x, y + 0.5);
          ctx.restore();
        }

        function drawSideNotes(item, cx, cy, unit, progress) {
          const labels = item.chips;
          const leftX = cx - unit * 0.39;
          const rightX = cx + unit * 0.39;
          const y1 = cy - unit * 0.13;
          const y2 = cy + unit * 0.16;
          ctx.save();
          ctx.font = "700 12px system-ui, sans-serif";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "rgba(255,255,255,.66)";
          ctx.textAlign = "right";
          ctx.fillText(labels[0].toLocaleUpperCase("ru-RU"), leftX, y1);
          ctx.textAlign = "left";
          ctx.fillText(labels[1].toLocaleUpperCase("ru-RU"), rightX, y2);
          ctx.strokeStyle = "rgba(46,172,101,.36)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(leftX + 10, y1);
          ctx.lineTo(cx - unit * 0.2, y1);
          ctx.moveTo(cx + unit * 0.2, y2);
          ctx.lineTo(rightX - 10, y2);
          ctx.stroke();
          ctx.fillStyle = "#2EAC65";
          ctx.globalAlpha = 0.45 + 0.55 * progress;
          ctx.beginPath();
          ctx.arc(leftX + 10, y1, 3, 0, Math.PI * 2);
          ctx.arc(rightX - 10, y2, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        init();
      })();
    </script>
