<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F0F13">
  <meta name="description" content="Проектирование, программирование, тестирование и выпуск приложений для Android, iOS и других мобильных устройств.">
  <meta name="color-scheme" content="dark">
  <title>Мобильная разработка</title>
  <style>
:root {
  --app-bg: #0F0F13;
  --app-panel: #1A1A20;
  --app-accent: #2EAC65;
  --app-accent-dark: #1E7A47;
  --app-text: #FFFFFF;
  --app-muted: #A0A0A0;
  --app-subtitle-bg: #00000080;
  --app-modal-scrim: rgba(0, 0, 0, .62);
  --app-border: rgba(255, 255, 255, .12);
  --app-control-bg: rgba(255, 255, 255, .07);
  --app-danger: #E5484D;
  --app-accent-soft: rgba(46, 172, 101, .15);
  --app-accent-glow: rgba(46, 172, 101, .055);
  --app-control-hover: rgba(255, 255, 255, .13);
  --app-dialog-shadow: rgba(0, 0, 0, .4);
  --app-keyboard-bg: rgba(255, 255, 255, .06);
  --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --subtitle-size: clamp(16px, 4.5vw, 22px);
  --heading-weight: 800;
  --body-weight: 400;
  --subtitle-controls-gap: 24px;
  --portrait-aspect-ratio: 9 / 16;
  --right-reserved: 80px;
  --left-padding: 16px;
  --header-top-padding: 16px;
  --bottom-reserved: 25vh;
  --sidebar-width: clamp(320px, 30vw, 380px);
  --touch-target: 48px;
  --modal-max-height: 90dvh;
  --subtitle-blur: 8px;
  --settings-scale: 0.95;
  --subtitle-duration: 300ms;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: var(--app-bg);
}

body {
  color: var(--app-text);
  font-family: var(--font-family);
  font-weight: var(--body-weight);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

button,
select,
input {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 2px solid var(--app-text);
  outline-offset: 3px;
}

.app-root {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding:
    calc(var(--header-top-padding) + env(safe-area-inset-top, 0px))
    calc(var(--right-reserved) + env(safe-area-inset-right, 0px))
    calc(var(--bottom-reserved) + env(safe-area-inset-bottom, 0px))
    calc(var(--left-padding) + env(safe-area-inset-left, 0px));
  background: var(--app-bg);
}

.app-header {
  min-width: 0;
}

.app-header h1 {
  max-width: 100%;
  margin: 0;
  overflow-wrap: anywhere;
  font-size: clamp(18px, 2.2vw, 28px);
  font-weight: var(--heading-weight);
  line-height: 1.2;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-width: 0;
  min-height: 0;
}

.stage {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 0;
  place-items: stretch;
}

.visual-frame {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--app-border);
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 50% 45%, var(--app-accent-glow), transparent 65%),
    var(--app-bg);
}

#sceneCanvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.subtitle {
  z-index: 2;
  max-width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--app-border);
  border-radius: 12px;
  color: var(--app-text);
  background: var(--app-subtitle-bg);
  -webkit-backdrop-filter: blur(var(--subtitle-blur));
  backdrop-filter: blur(var(--subtitle-blur));
  font-size: var(--subtitle-size);
  font-weight: 700;
  line-height: 1.35;
  text-wrap: pretty;
  overflow-wrap: anywhere;
  opacity: 1;
  transform: translateY(0);
  transition:
    opacity var(--subtitle-duration) ease,
    transform var(--subtitle-duration) ease;
}

.subtitle.updating {
  opacity: 0;
  transform: translateY(8px);
}

.subtitle-mobile {
  position: absolute;
  right: 12px;
  bottom: calc(var(--touch-target) + 12px + var(--subtitle-controls-gap));
  left: 12px;
  display: block;
}

.subtitle-desktop {
  display: none;
}

.control-bar {
  position: absolute;
  z-index: 3;
  right: 12px;
  bottom: 12px;
  left: 12px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  transition: opacity .2s ease, visibility .2s ease;
}

.app-root.controls-hidden .control-bar {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.icon-button {
  display: grid;
  flex: 0 0 var(--touch-target);
  width: var(--touch-target);
  height: var(--touch-target);
  padding: 12px;
  place-items: center;
  border: 1px solid var(--app-border);
  border-radius: 14px;
  background: var(--app-control-bg);
  transition: background .18s ease, border-color .18s ease;
}

.icon-button:hover {
  background: var(--app-control-hover);
}

.icon-button svg,
.dialog-close svg {
  display: block;
  width: 100%;
  height: 100%;
}

.details-panel {
  display: none;
}

.step-indicator {
  color: var(--app-muted);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
}

.modal-backdrop {
  position: fixed;
  z-index: 20;
  inset: 0;
  right: calc(var(--right-reserved) + env(safe-area-inset-right, 0px));
  display: none;
  align-items: center;
  justify-content: center;
  padding:
    max(16px, env(safe-area-inset-top, 0px))
    16px
    max(16px, env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
  background: var(--app-modal-scrim);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.modal-backdrop.open {
  display: flex;
}

.settings-dialog {
  width: min(100%, 380px);
  max-height: 90vh;
  max-height: var(--modal-max-height);
  overflow: auto;
  padding: 20px;
  border: 1px solid var(--app-border);
  border-radius: 20px;
  background: var(--app-panel);
  box-shadow: 0 20px 80px var(--app-dialog-shadow);
  animation: settings-enter .22s ease both;
  outline: none;
}

@keyframes settings-enter {
  from { opacity: 0; transform: scale(var(--settings-scale)); }
  to { opacity: 1; transform: scale(1); }
}

.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.dialog-header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
}

.dialog-close {
  display: grid;
  flex: 0 0 var(--touch-target);
  width: var(--touch-target);
  height: var(--touch-target);
  padding: 14px;
  place-items: center;
  border: 1px solid var(--app-border);
  border-radius: 12px;
  background: var(--app-control-bg);
}

.segmented-control {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 16px 0 10px;
}

.segmented-control button,
.dialog-action {
  min-height: var(--touch-target);
  border: 1px solid var(--app-border);
  border-radius: 12px;
  color: var(--app-text);
  background: var(--app-control-bg);
  font-weight: 800;
}

.segmented-control button[aria-pressed="true"] {
  border-color: transparent;
  background: linear-gradient(135deg, var(--app-accent), var(--app-accent-dark));
}

.dialog-action {
  width: 100%;
  margin-bottom: 14px;
  background: var(--app-accent-soft);
}

.dialog-action:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: var(--touch-target);
  margin: 8px 0;
  color: var(--app-muted);
  font-size: 14px;
  font-weight: 700;
}

.setting-row select {
  min-width: 100px;
  min-height: var(--touch-target);
  padding: 0 12px;
  border: 1px solid var(--app-border);
  border-radius: 10px;
  color: var(--app-text);
  background: var(--app-panel);
}

.setting-row input[type="checkbox"] {
  width: 24px;
  height: 24px;
  accent-color: var(--app-accent);
}

.secondary-action {
  margin-top: 12px;
  background: var(--app-control-bg);
}

.keyboard-help {
  display: grid;
  gap: 8px;
  margin-top: 8px;
  color: var(--app-muted);
  font-size: 12px;
}

.keyboard-help span {
  display: flex;
  align-items: center;
  gap: 10px;
}

kbd {
  min-width: 42px;
  padding: 3px 6px;
  border: 1px solid var(--app-border);
  border-radius: 6px;
  color: var(--app-text);
  background: var(--app-keyboard-bg);
  font: inherit;
  font-weight: 800;
  text-align: center;
}

@media (min-width: 768px) {
  .app-root {
    padding: 20px;
  }

  .workspace {
    grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
    gap: 20px;
  }

  .details-panel {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 20px;
    padding: 16px 4px;
  }

  .subtitle-mobile {
    display: none;
  }

  .subtitle-desktop {
    display: block;
  }

  .modal-backdrop {
    right: 0;
    padding: 20px;
  }
}

.app-root.is-portrait .workspace {
  grid-template-columns: minmax(0, 1fr);
}

.app-root.is-portrait .stage {
  place-items: center;
}

.app-root.is-portrait .visual-frame {
  width: auto;
  height: 100%;
  max-width: 100%;
  aspect-ratio: var(--portrait-aspect-ratio);
}

.app-root.is-portrait .details-panel {
  display: none;
}

.app-root.is-portrait .subtitle-mobile {
  display: block;
}

@media (max-width: 768px) {
  .app-root.is-portrait .visual-frame {
    max-height: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
  </style>
</head>
<body>
  <div class="app-root" id="appRoot">
    <header class="app-header">
      <h1 id="appTitle">Мобильная разработка</h1>
    </header>

    <main class="workspace">
      <section class="stage" id="stage" aria-label="Область визуализации">
        <div class="visual-frame" id="visualFrame">
          <canvas id="sceneCanvas" aria-label="Анимированная визуализация"></canvas>

          <div class="subtitle subtitle-mobile" id="mobileSubtitle" aria-live="polite"></div>

          <div class="control-bar" id="controlBar">
            <button class="icon-button" id="playButton" type="button" aria-label="Пауза">
              <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM15 5h4v14h-4z" fill="currentColor"/></svg>
            </button>
            <button class="icon-button" id="settingsButton" type="button" aria-label="Открыть настройки" aria-haspopup="dialog" aria-controls="settingsDialog">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm9 4.9v-2.2l-2.1-.5a7.2 7.2 0 0 0-.7-1.7l1.1-1.8-1.6-1.6-1.8 1.1a7.2 7.2 0 0 0-1.7-.7L13.7 3h-2.2L11 5.1a7.2 7.2 0 0 0-1.7.7L7.5 4.7 5.9 6.3 7 8.1a7.2 7.2 0 0 0-.7 1.7l-2.1.5v2.2l2.1.5a7.2 7.2 0 0 0 .7 1.7l-1.1 1.8 1.6 1.6 1.8-1.1a7.2 7.2 0 0 0 1.7.7l.5 2.1h2.2l.5-2.1a7.2 7.2 0 0 0 1.7-.7l1.8 1.1 1.6-1.6-1.1-1.8a7.2 7.2 0 0 0 .7-1.7l2.1-.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </section>

      <aside class="details-panel" id="detailsPanel">
        <div class="subtitle subtitle-desktop" id="desktopSubtitle" aria-live="polite"></div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="settingsBackdrop" aria-hidden="true">
    <section class="settings-dialog" id="settingsDialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
      <header class="dialog-header">
        <h2 id="settingsTitle">Настройки</h2>
        <button class="dialog-close" id="closeSettingsButton" type="button" aria-label="Закрыть настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="step-indicator" id="modalStepIndicator">Шаг 1 / 6</div>

      <div class="segmented-control" role="group" aria-label="Режим воспроизведения">
        <button id="autoModeButton" type="button" aria-pressed="true">AUTO</button>
        <button id="stepModeButton" type="button" aria-pressed="false">STEP</button>
      </div>

      <button class="dialog-action" id="nextStepButton" type="button" disabled>Следующий шаг →</button>

      <div class="setting-row">
        <label for="speedSelect">Скорость</label>
        <select id="speedSelect" aria-label="Скорость воспроизведения"></select>
      </div>

      <div class="setting-row">
        <label for="portraitToggle">Вертикальная рамка 9:16</label>
        <input id="portraitToggle" type="checkbox">
      </div>

      <button class="dialog-action secondary-action" id="resetButton" type="button">Сбросить</button>

      <div class="keyboard-help" aria-label="Горячие клавиши">
        <span><kbd>Space</kbd> Показать или скрыть контролы</span>
        <span><kbd>→</kbd> Следующий шаг в STEP</span>
        <span><kbd>R</kbd> Сброс</span>
        <span><kbd>S</kbd> AUTO / STEP</span>
        <span><kbd>V</kbd> Рамка 9:16</span>
        <span><kbd>Esc</kbd> Закрыть настройки</span>
      </div>
    </section>
  </div>

  "use strict";
  function roundedRect(ctx,x,y,w,h,r) {
