<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Мобильная разработка</title>
    <style>
      :root {
        --bg: #0f0f13;
        --panel: #1a1a20;
        --accent: #2eac65;
        --glow: #1e7a47;
        --text: #ffffff;
        --sub: #a0a0a0;
        --sub-bg: #00000080;
        --border-soft: rgba(255, 255, 255, 0.12);
        --border-faint: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .app {
        position: fixed;
        inset: 0;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-left: calc(16px + env(safe-area-inset-left));
        padding-right: calc(80px + env(safe-area-inset-right));
        padding-bottom: calc(25vh + env(safe-area-inset-bottom));
      }
      .stage {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .title {
        padding: calc(16px + env(safe-area-inset-top)) 6px 10px;
      }
      .title h1 {
        margin: 0;
        font-size: clamp(20px, 5.4vw, 30px);
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.15;
      }
      .title h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .canvas-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .ambient {
        position: absolute;
        display: none;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
      }
      .app.frame-mode .ambient {
        display: block;
      }
      .ambient-1 {
        width: 55%;
        height: 34%;
        left: -8%;
        top: 6%;
        background: #2eac65;
        opacity: 0.28;
      }
      .ambient-2 {
        width: 46%;
        height: 30%;
        right: -4%;
        bottom: 4%;
        background: #1e7a47;
        opacity: 0.32;
      }
      .ambient-3 {
        width: 30%;
        height: 22%;
        left: 22%;
        bottom: 20%;
        background: #2eac65;
        opacity: 0.12;
      }
      .frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .app.frame-mode .frame {
        border-radius: 24px;
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.4);
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .init-error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 15px;
        padding: 20px;
        text-align: center;
      }
      .subtitles {
        margin: 12px 2px 0;
        flex: none;
      }
      .subtitles__text {
        display: block;
        background: var(--sub-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 14px;
        padding: 10px 16px;
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.35;
        font-weight: 600;
        min-height: 3.4em;
        color: var(--text);
        animation: subIn 0.38s ease-out;
      }
      .subtitle__keyword {
        color: var(--accent);
        font-weight: 800;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .panel {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
        flex: none;
        transition: opacity 0.3s;
      }
      .frame-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14px;
        height: 48px;
        display: none;
        justify-content: center;
        align-items: center;
        gap: 14px;
        z-index: 4;
        transition: opacity 0.3s;
      }
      .btn {
        min-width: 48px;
        min-height: 48px;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        border: 1px solid var(--border-soft);
        background: var(--panel);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.1s,
          opacity 0.2s;
      }
      .btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
        pointer-events: none;
      }
      .btn:active {
        transform: scale(0.94);
      }
      .btn-accent {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0);
        color: #0f0f13;
      }
      .btn-ghost {
        background: transparent;
        border-color: transparent;
        color: var(--sub);
      }
      .btn-ghost:hover {
        color: var(--text);
      }
      @media (hover: hover) {
        .btn:hover {
          border-color: rgba(255, 255, 255, 0.32);
        }
        .btn-accent:hover {
          border-color: rgba(255, 255, 255, 0);
          filter: brightness(1.07);
        }
        .btn-ghost:hover {
          border-color: transparent;
        }
      }
      .app.frame-mode .panel {
        display: none;
      }
      .app.frame-mode .frame-controls {
        display: flex;
      }
      .app.frame-mode .frame .subtitles {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 86px;
        margin: 0;
        z-index: 3;
      }
      .app.frame-mode .sidebar {
        display: none;
      }
      .app.controls-hidden .panel,
      .app.controls-hidden .frame-controls {
        opacity: 0;
        pointer-events: none;
      }
      .sidebar {
        display: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .backdrop.open {
        opacity: 1;
      }
      .backdrop[hidden] {
        display: none;
      }
      .modal {
        width: min(430px, 100%);
        max-height: 90vh;
        max-height: 90dvh;
        background: rgba(26, 26, 32, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-soft);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: scale(0.95);
        opacity: 0;
        transition:
          transform 0.25s ease,
          opacity 0.25s ease;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .backdrop.open .modal {
        transform: scale(1);
        opacity: 1;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 10px;
      }
      .modal-head h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
      }
      .modal-body {
        overflow-y: auto;
        padding: 2px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
      }
      .row-label {
        color: var(--sub);
        font-size: 14px;
        font-weight: 600;
      }
      .value {
        font-weight: 800;
        font-size: 15px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        padding: 7px 14px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .seg {
        display: flex;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-faint);
        border-radius: 12px;
        padding: 3px;
        gap: 3px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--sub);
        font-weight: 700;
        font-size: 14px;
        font-family: inherit;
        padding: 6px 14px;
        border-radius: 9px;
        cursor: pointer;
        min-height: 48px;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: #0f0f13;
      }
      .btn-wide {
        width: 100%;
        height: 48px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        font-family: inherit;
        background: var(--panel);
        border: 1px solid var(--border-soft);
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s,
          opacity 0.2s;
      }
      .btn-wide:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .btn-wide:not(:disabled):active {
        transform: scale(0.98);
      }
      @media (hover: hover) {
        .btn-wide:not(:disabled):hover {
          border-color: rgba(255, 255, 255, 0.32);
        }
      }
      .switch {
        position: relative;
        width: 56px;
        height: 48px;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
        flex: none;
      }
      .switch::before {
        content: "";
        position: absolute;
        left: 0;
        top: 9px;
        width: 56px;
        height: 30px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border-soft);
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .switch::after {
        content: "";
        position: absolute;
        left: 5px;
        top: 14px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--sub);
        transition:
          left 0.2s ease,
          background 0.2s;
      }
      .switch[aria-checked="true"]::before {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0);
      }
      .switch[aria-checked="true"]::after {
        left: 31px;
        background: var(--text);
      }
      .hotkeys {
        border-top: 1px solid var(--border-faint);
        padding-top: 12px;
      }
      .hotkeys h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .hotkeys ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .hotkeys li {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
        color: var(--text);
      }
      kbd {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-soft);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 12px;
        font-family: inherit;
        font-weight: 700;
        color: var(--text);
        min-width: 36px;
        text-align: center;
        flex: none;
      }
      @media (min-width: 768px) {
        .app {
          flex-direction: row;
          padding-left: 24px;
          padding-right: 0;
          padding-bottom: 20px;
        }
        .title {
          padding-top: 22px;
          padding-bottom: 14px;
        }
        .title h1 {
          font-size: clamp(24px, 2.4vw, 32px);
        }
        .panel {
          margin-top: 16px;
        }
        .sidebar {
          display: flex;
          align-items: center;
          justify-content: center;
          width: clamp(320px, 30vw, 380px);
          flex: none;
          margin: 14px 14px 14px 22px;
          border: 1px solid var(--border-faint);
          border-radius: 20px;
          background: rgba(26, 26, 32, 0.4);
          padding: 24px;
        }
        .sidebar .subtitles {
          margin: 0;
          width: 100%;
        }
        .app.frame-mode .sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <main class="stage" id="stage">
        <header class="title">
          <h1>Мобильная <em>разработка</em></h1>
        </header>
        <div class="canvas-wrap" id="canvasWrap">
          <div class="ambient ambient-1"></div>
          <div class="ambient ambient-2"></div>
          <div class="ambient ambient-3"></div>
          <div class="frame" id="frame">
            <canvas id="scene"></canvas>
            <div class="frame-controls" id="frameControls"></div>
          </div>
        </div>
        <div class="subtitles" id="subtitles" aria-live="polite"></div>
        <div class="panel" id="panel">
          <button
            class="btn btn-accent"
            id="playBtn"
            type="button"
            aria-label="Пауза"
          >
            <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1.2" />
              <rect x="14" y="5" width="4" height="14" rx="1.2" />
            </svg>
            <svg
              id="iconPlay"
              viewBox="0 0 24 24"
              aria-hidden="true"
              style="display: none"
            >
              <path
                d="M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z"
              />
            </svg>
          </button>
          <button
            class="btn"
            id="settingsBtn"
            type="button"
            aria-label="Настройки"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.48-.41h-3.84a.5.5 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87a.5.5 0 0 0 .12.61l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.13.23.39.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.23.24.41.48.41h3.84c.24 0 .44-.18.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
              />
            </svg>
          </button>
        </div>
      </main>
      <aside class="sidebar" id="sidebar"></aside>
    </div>
    <div class="backdrop" id="backdrop" hidden>
      <div
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
        tabindex="-1"
      >
        <div class="modal-head">
          <h2 id="settingsTitle">Настройки</h2>
          <button
            class="btn btn-ghost"
            id="closeBtn"
            type="button"
            aria-label="Закрыть"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="row">
            <span class="row-label">Прогресс</span
            ><span class="value" id="stepIndicator">Шаг 1 / 6</span>
          </div>
          <div class="row">
            <span class="row-label">Режим</span>
            <div class="seg" id="modeSeg">
              <button type="button" data-mode="AUTO" aria-pressed="true">
                AUTO
              </button>
              <button type="button" data-mode="STEP" aria-pressed="false">
                STEP
              </button>
            </div>
          </div>
          <div class="row">
            <button type="button" class="btn-wide" id="nextBtn">
              Следующий шаг &#9654;&#65038;
            </button>
          </div>
          <div class="row">
            <span class="row-label">Скорость</span>
            <div class="seg" id="speedSeg">
              <button type="button" data-speed="0.5" aria-pressed="false">
                0.5&times;
              </button>
              <button type="button" data-speed="1" aria-pressed="true">
                1&times;
              </button>
              <button type="button" data-speed="2" aria-pressed="false">
                2&times;
              </button>
            </div>
          </div>
          <div class="row">
            <span class="row-label">Вертикальная рамка 9:16</span>
            <button
              type="button"
              class="switch"
              id="frameToggle"
              role="switch"
              aria-checked="false"
              aria-label="Вертикальная рамка"
            ></button>
          </div>
          <div class="row">
            <button type="button" class="btn-wide" id="resetBtn">Reset</button>
          </div>
          <div class="hotkeys">
            <h3>Горячие клавиши</h3>
            <ul>
              <li><kbd>Space</kbd><span>Скрыть или показать контролы</span></li>
              <li>
                <kbd>&rarr;</kbd><span>Следующий шаг, только в STEP</span>
              </li>
              <li><kbd>R</kbd><span>Reset</span></li>
              <li><kbd>S</kbd><span>Переключить AUTO / STEP</span></li>
              <li><kbd>V</kbd><span>Вертикальная рамка</span></li>
              <li><kbd>Esc</kbd><span>Закрыть настройки</span></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <script>
      "use strict";

      const SUBTITLES = [
        {
          step: 1,
          segments: [
            { text: "Приложения для " },
            { text: "смартфонов и планшетов", emphasis: true },
            { text: " подстраиваются под экран и жесты" },
          ],
        },
        {
          step: 2,
          segments: [
            { text: "Выбирайте между " },
            { text: "нативной", emphasis: true },
            { text: ", " },
            { text: "кроссплатформенной", emphasis: true },
            { text: " и " },
            { text: "веб-разработкой", emphasis: true },
            { text: " под задачу и бюджет" },
          ],
        },
        {
          step: 3,
          segments: [
            { text: "Две главные платформы — " },
            { text: "Android", emphasis: true },
            { text: " и " },
            { text: "iOS", emphasis: true },
            { text: ", у каждой свой магазин приложений" },
          ],
        },
        {
          step: 4,
          segments: [
            { text: "От идеи до релиза: " },
            { text: "инструменты", emphasis: true },
            { text: ", " },
            { text: "интерфейс", emphasis: true },
            { text: " и " },
            { text: "датчики", emphasis: true },
            { text: " устройства" },
          ],
        },
        {
          step: 5,
          segments: [
            { text: "Приложения " },
            { text: "тестируют", emphasis: true },
            { text: ", " },
            { text: "публикуют", emphasis: true },
            { text: " в магазинах и регулярно " },
            { text: "обновляют", emphasis: true },
          ],
        },
        {
          step: 6,
          segments: [
            { text: "Разрешения на " },
            { text: "геолокацию", emphasis: true },
            { text: ", " },
            { text: "камеру", emphasis: true },
            { text: " и " },
            { text: "микрофон", emphasis: true },
            { text: " защищают персональные данные" },
          ],
        },
      ];

      const TOTAL = SUBTITLES.length;
      const STEP_DURATION = 4.4;
      const TRANSITION_DURATION = 0.85;
      const AUTO_START_DELAY = 500;
      const SPEEDS = [0.5, 1, 2];
      const C = {
        bg: "#0F0F13",
        panel: "#1A1A20",
        accent: "#2EAC65",
        glow: "#1E7A47",
        text: "#FFFFFF",
        sub: "#A0A0A0",
      };
      const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

      const state = {
        mode: "AUTO",
        isPlaying: false,
        currentStep: 1,
        speed: 1,
        videoMode: false,
        stepTime: 0,
        transitionT: -1,
        transitionFrom: 0,
        sceneTime: 0,
        controlsVisible: true,
        settingsOpen: false,
      };

      let app,
        stage,
        canvasWrap,
        frame,
        canvas,
        subtitlesEl,
        panel,
        playBtn,
        settingsBtn,
        frameControls,
        sidebar;
      let backdrop,
        modal,
        closeBtn,
        stepIndicator,
        modeSeg,
        nextBtn,
        speedSeg,
        frameToggle,
        resetBtn,
        iconPlay,
        iconPause;
      let ctx = null;
      let canvasWidth = 0,
        canvasHeight = 0;
      let closeTimer = 0;
      let resizeObserver = null;
      const desktopMQ = window.matchMedia("(min-width: 768px)");
      const particles = [];

      function alphaHex(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        return (
          "rgba(" +
          ((n >> 16) & 255) +
          "," +
          ((n >> 8) & 255) +
          "," +
          (n & 255) +
          "," +
          a +
          ")"
        );
      }
      function clamp01(v) {
        return v < 0 ? 0 : v > 1 ? 1 : v;
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function fontStr(px, weight) {
        return weight + " " + px + "px " + FONT;
      }

      function rr(x, y, w, h, r) {
        r = Math.max(0, Math.min(r, w / 2, h / 2));
        ctx.beginPath();
        if (typeof ctx.roundRect === "function") {
          ctx.roundRect(x, y, w, h, r);
          return;
        }
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }
      function fitFont(text, maxW, maxPx, weight) {
        let size = Math.max(1, maxPx);
        ctx.font = fontStr(size, weight);
        const wd = ctx.measureText(text).width;
        if (wd > maxW && wd > 0) {
          size = Math.max(8, (size * maxW) / wd);
          ctx.font = fontStr(size, weight);
        }
        return size;
      }

      function buildParticles() {
        particles.length = 0;
        for (let i = 0; i < 38; i++) {
          particles.push({
            x: Math.random(),
            y: Math.random(),
            r: 0.8 + Math.random() * 1.8,
            v: 0.01 + Math.random() * 0.022,
            w: Math.random() * Math.PI * 2,
            a: 0.1 + Math.random() * 0.22,
            c: Math.random() < 0.7 ? C.accent : C.glow,
          });
        }
      }

      function init() {
        const ids = [
          "app",
          "stage",
          "canvasWrap",
          "frame",
          "scene",
          "subtitles",
          "panel",
          "playBtn",
          "settingsBtn",
          "frameControls",
          "sidebar",
          "backdrop",
          "modal",
          "closeBtn",
          "stepIndicator",
          "modeSeg",
          "nextBtn",
          "speedSeg",
          "frameToggle",
          "resetBtn",
          "iconPlay",
          "iconPause",
        ];
        const refs = {};
        for (const id of ids) {
          const el = document.getElementById(id);
          if (!el) throw new Error("missing element: " + id);
          refs[id] = el;
        }
        app = refs.app;
        stage = refs.stage;
        canvasWrap = refs.canvasWrap;
        frame = refs.frame;
        canvas = refs.scene;
        subtitlesEl = refs.subtitles;
        panel = refs.panel;
        playBtn = refs.playBtn;
        settingsBtn = refs.settingsBtn;
        frameControls = refs.frameControls;
        sidebar = refs.sidebar;
        backdrop = refs.backdrop;
        modal = refs.modal;
        closeBtn = refs.closeBtn;
        stepIndicator = refs.stepIndicator;
        modeSeg = refs.modeSeg;
        nextBtn = refs.nextBtn;
        speedSeg = refs.speedSeg;
        frameToggle = refs.frameToggle;
        resetBtn = refs.resetBtn;
        iconPlay = refs.iconPlay;
        iconPause = refs.iconPause;

        ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("canvas context unavailable");

        buildParticles();
        bindEvents();
        placeSubtitles();
        placeControls();
        resize();
        updateSubtitles(state.currentStep);
        renderControls();
        window.setTimeout(startAuto, AUTO_START_DELAY);
        requestAnimationFrame(loop);
      }

      function bindEvents() {
        playBtn.addEventListener("click", togglePlay);
        settingsBtn.addEventListener("click", () => {
          if (state.settingsOpen) closeSettings();
          else openSettings();
        });
        closeBtn.addEventListener("click", closeSettings);
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeSettings();
        });
        modeSeg.addEventListener("click", (e) => {
          const b = e.target.closest("button[data-mode]");
          if (b) setMode(b.dataset.mode);
        });
        speedSeg.addEventListener("click", (e) => {
          const b = e.target.closest("button[data-speed]");
          if (b) setSpeed(parseFloat(b.dataset.speed));
        });
        nextBtn.addEventListener("click", onStep);
        frameToggle.addEventListener("click", toggleVideoMode);
        resetBtn.addEventListener("click", reset);
        document.addEventListener("keydown", handleInput);

        if ("ResizeObserver" in window) {
          resizeObserver = new ResizeObserver(() => resize());
          resizeObserver.observe(canvasWrap);
        }
        window.addEventListener("resize", resize);
        if (desktopMQ.addEventListener)
          desktopMQ.addEventListener("change", onBreakpoint);
        else if (desktopMQ.addListener) desktopMQ.addListener(onBreakpoint);
      }
      function onBreakpoint() {
        placeSubtitles();
        resize();
      }

      function placeSubtitles() {
        if (!subtitlesEl) return;
        let target;
        if (state.videoMode) target = frame;
        else if (desktopMQ.matches) target = sidebar;
        else target = stage;
        if (subtitlesEl.parentElement !== target) {
          if (target === stage) stage.insertBefore(subtitlesEl, panel);
          else target.appendChild(subtitlesEl);
        }
      }
      function placeControls() {
        if (!playBtn || !settingsBtn) return;
        const target = state.videoMode ? frameControls : panel;
        if (playBtn.parentElement !== target) target.appendChild(playBtn);
        if (settingsBtn.parentElement !== target)
          target.appendChild(settingsBtn);
      }

      function resize() {
        if (!canvas || !canvasWrap || !frame || !ctx) return;
        const rect = canvasWrap.getBoundingClientRect();
        let w = Math.max(1, rect.width),
          h = Math.max(1, rect.height);
        if (state.videoMode) {
          const targetH = Math.min(h, (w * 16) / 9);
          const targetW = (targetH * 9) / 16;
          frame.style.left = (w - targetW) / 2 + "px";
          frame.style.top = (h - targetH) / 2 + "px";
          frame.style.width = targetW + "px";
          frame.style.height = targetH + "px";
          w = targetW;
          h = targetH;
        } else {
          frame.style.left = "0px";
          frame.style.top = "0px";
          frame.style.width = "100%";
          frame.style.height = "100%";
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.max(1, Math.round(w * dpr));
        canvas.height = Math.max(1, Math.round(h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasWidth = w;
        canvasHeight = h;
      }

      function updateSubtitles(step) {
        if (!subtitlesEl) return;
        const data = SUBTITLES.find((s) => s.step === step);
        if (!data) return;
        while (subtitlesEl.firstChild)
          subtitlesEl.removeChild(subtitlesEl.firstChild);
        const box = document.createElement("div");
        box.className = "subtitles__text";
        for (const seg of data.segments) {
          const span = document.createElement("span");
          if (seg.emphasis) span.className = "subtitle__keyword";
          span.textContent = seg.text;
          box.appendChild(span);
        }
        subtitlesEl.appendChild(box);
      }

      function renderControls() {
        if (playBtn && iconPlay && iconPause) {
          const playing = state.isPlaying;
          iconPlay.style.display = playing ? "none" : "block";
          iconPause.style.display = playing ? "block" : "none";
          playBtn.setAttribute(
            "aria-label",
            playing ? "Пауза" : "Воспроизвести",
          );
        }
        if (stepIndicator)
          stepIndicator.textContent =
            "Шаг " + state.currentStep + " / " + TOTAL;
        if (modeSeg) {
          for (const b of modeSeg.querySelectorAll("button")) {
            b.setAttribute(
              "aria-pressed",
              String(b.dataset.mode === state.mode),
            );
          }
        }
        if (speedSeg) {
          for (const b of speedSeg.querySelectorAll("button")) {
            b.setAttribute(
              "aria-pressed",
              String(parseFloat(b.dataset.speed) === state.speed),
            );
          }
        }
        if (frameToggle)
          frameToggle.setAttribute("aria-checked", String(state.videoMode));
        if (settingsBtn)
          settingsBtn.setAttribute("aria-expanded", String(state.settingsOpen));
        if (nextBtn)
          nextBtn.disabled = !(
            state.mode === "STEP" &&
            state.transitionT < 0 &&
            state.currentStep < TOTAL
          );
      }

      function startAuto() {
        state.isPlaying = true;
        renderControls();
      }
      function setPlaying() {
        state.isPlaying = !state.isPlaying;
        renderControls();
      }
      function togglePlay() {
        setPlaying();
      }

      function beginTransition(next) {
        if (state.transitionT >= 0) return;
        state.transitionFrom = state.currentStep;
        state.currentStep = next;
        state.stepTime = 0;
        state.transitionT = 0;
        updateSubtitles(next);
        renderControls();
      }
      function onStep() {
        if (state.mode !== "STEP") return;
        if (state.transitionT >= 0) return;
        if (state.currentStep >= TOTAL) return;
        beginTransition(state.currentStep + 1);
      }
      function setMode(mode) {
        if (mode !== "AUTO" && mode !== "STEP") return;
        if (state.mode === mode) return;
        state.mode = mode;
        if (mode === "AUTO" && !state.isPlaying) state.isPlaying = true;
        renderControls();
      }
      function setSpeed(v) {
        if (SPEEDS.indexOf(v) === -1) return;
        state.speed = v;
        renderControls();
      }
      function reset() {
        state.mode = "AUTO";
        state.currentStep = 1;
        state.stepTime = 0;
        state.transitionT = -1;
        state.transitionFrom = 0;
        state.isPlaying = true;
        updateSubtitles(1);
        renderControls();
      }
      function toggleVideoMode() {
        state.videoMode = !state.videoMode;
        app.classList.toggle("frame-mode", state.videoMode);
        placeSubtitles();
        placeControls();
        resize();
        renderControls();
      }
      function toggleControlsVisibility() {
        state.controlsVisible = !state.controlsVisible;
        app.classList.toggle("controls-hidden", !state.controlsVisible);
      }

      function openSettings() {
        if (state.settingsOpen) return;
        state.settingsOpen = true;
        window.clearTimeout(closeTimer);
        backdrop.hidden = false;
        void backdrop.offsetWidth;
        backdrop.classList.add("open");
        renderControls();
        modal.focus({ preventScroll: true });
      }
      function closeSettings() {
        if (!state.settingsOpen) return;
        state.settingsOpen = false;
        backdrop.classList.remove("open");
        closeTimer = window.setTimeout(() => {
          backdrop.hidden = true;
        }, 260);
        renderControls();
        settingsBtn.focus({ preventScroll: true });
      }

      function handleInput(e) {
        if (state.settingsOpen) {
          if (e.key === "Escape") {
            e.preventDefault();
            closeSettings();
          }
          return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target;
        if (
          t &&
          (t.isContentEditable ||
            /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ""))
        )
          return;
        if (e.key === " " || e.code === "Space") {
          if (
            t &&
            typeof t.closest === "function" &&
            t.closest("button, .switch")
          )
            return;
          e.preventDefault();
          toggleControlsVisibility();
          return;
        }
        if (e.key === "ArrowRight") {
          if (state.mode === "STEP") {
            e.preventDefault();
            onStep();
          }
          return;
        }
        const k = typeof e.key === "string" ? e.key.toLowerCase() : "";
        if (k === "r" || k === "к") {
          e.preventDefault();
          reset();
          return;
        }
        if (k === "s" || k === "ы") {
          e.preventDefault();
          setMode(state.mode === "AUTO" ? "STEP" : "AUTO");
          return;
        }
        if (k === "v" || k === "м") {
          e.preventDefault();
          toggleVideoMode();
          return;
        }
      }

      function update(dt) {
        state.sceneTime += dt;
        for (const p of particles) {
          p.y -= p.v * dt;
          if (p.y < -0.02) {
            p.y = 1.02;
            p.x = Math.random();
          }
        }
        if (state.transitionT >= 0) {
          state.transitionT += dt / TRANSITION_DURATION;
          if (state.transitionT >= 1) {
            state.transitionT = -1;
            state.transitionFrom = 0;
            renderControls();
          }
        } else {
          state.stepTime += dt;
          if (state.mode === "AUTO" && state.stepTime >= STEP_DURATION) {
            const next = state.currentStep >= TOTAL ? 1 : state.currentStep + 1;
            beginTransition(next);
          }
        }
      }

      let lastFrame = 0;
      function loop(now) {
        if (!lastFrame) lastFrame = now;
        const raw = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        update(state.isPlaying ? raw * state.speed : 0);
        draw();
        requestAnimationFrame(loop);
      }

      function screenRect(g) {
        const bezel = g.phoneW * 0.045;
        return {
          x: g.px + bezel,
          y: g.py + bezel,
          w: g.phoneW - 2 * bezel,
          h: g.phoneH - 2 * bezel,
        };
      }

      function drawParticles(w, h) {
        for (const p of particles) {
          const px = (p.x + Math.sin(state.sceneTime * 0.35 + p.w) * 0.012) * w;
          const py = p.y * h;
          ctx.globalAlpha = p.a;
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(px, py, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawFrameBackdrop(w, h) {
        ctx.save();
        rr(0, 0, w, h, 24);
        ctx.fillStyle = alphaHex(C.bg, 0.92);
        ctx.fill();
        ctx.shadowColor = alphaHex(C.accent, 0.4);
        ctx.shadowBlur = 26;
        ctx.strokeStyle = alphaHex(C.accent, 0.4);
        ctx.lineWidth = 1.5;
        rr(1, 1, w - 2, h - 2, 23);
        ctx.stroke();
        ctx.restore();
      }

      function drawPhone(g) {
        const { px, py, phoneW, phoneH, u } = g;
        ctx.save();
        ctx.shadowColor = alphaHex(C.glow, 0.55);
        ctx.shadowBlur = u * 0.05;
        ctx.shadowOffsetY = u * 0.015;
        rr(px, py, phoneW, phoneH, phoneW * 0.16);
        ctx.fillStyle = alphaHex("#000000", 0.92);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = alphaHex(C.text, 0.14);
        ctx.lineWidth = Math.max(1, u * 0.0035);
        rr(px + 0.75, py + 0.75, phoneW - 1.5, phoneH - 1.5, phoneW * 0.16 - 1);
        ctx.stroke();

        const s = screenRect(g);
        ctx.save();
        rr(s.x, s.y, s.w, s.h, phoneW * 0.13);
        ctx.clip();
        ctx.fillStyle = C.panel;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        if (state.mode === "AUTO" && state.transitionT < 0) {
          const pr = clamp01(state.stepTime / STEP_DURATION);
          ctx.fillStyle = alphaHex(C.accent, 0.75);
          ctx.fillRect(
            s.x,
            s.y + s.h * 0.015,
            s.w * pr,
            Math.max(2, u * 0.005),
          );
        }
        ctx.beginPath();
        ctx.arc(g.cx, s.y + s.h * 0.05, phoneW * 0.03, 0, Math.PI * 2);
        ctx.fillStyle = alphaHex("#000000", 0.92);
        ctx.fill();
        ctx.strokeStyle = alphaHex(C.text, 0.12);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }

      function drawSensorIcon(i, r) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (i === 0) {
          ctx.beginPath();
          ctx.moveTo(-r * 0.34, -r * 0.08);
          ctx.lineTo(0, r * 0.52);
          ctx.lineTo(r * 0.34, -r * 0.08);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, -r * 0.22, r * 0.44, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, -r * 0.22, r * 0.13, 0, Math.PI * 2);
          ctx.fill();
        } else if (i === 1) {
          rr(-r * 0.56, -r * 0.28, r * 1.12, r * 0.72, r * 0.14);
          ctx.stroke();
          rr(-r * 0.16, -r * 0.46, r * 0.32, r * 0.18, r * 0.05);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, r * 0.08, r * 0.2, 0, Math.PI * 2);
          ctx.stroke();
        } else if (i === 2) {
          rr(-r * 0.2, -r * 0.52, r * 0.4, r * 0.62, r * 0.2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, -r * 0.05, r * 0.34, Math.PI * 0.15, Math.PI * 0.85);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, r * 0.3);
          ctx.lineTo(0, r * 0.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-r * 0.22, r * 0.5);
          ctx.lineTo(r * 0.22, r * 0.5);
          ctx.stroke();
        } else if (i === 3) {
          rr(-r * 0.42, -r * 0.42, r * 0.84, r * 0.84, r * 0.12);
          ctx.stroke();
          rr(-r * 0.2, -r * 0.2, r * 0.4, r * 0.4, r * 0.06);
          ctx.stroke();
          for (const d of [-0.22, 0.22]) {
            ctx.beginPath();
            ctx.moveTo(d * 1.9, -r * 0.42);
            ctx.lineTo(d * 1.9, -r * 0.6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(d * 1.9, r * 0.42);
            ctx.lineTo(d * 1.9, r * 0.6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-r * 0.42, d * 1.9);
            ctx.lineTo(-r * 0.6, d * 1.9);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.42, d * 1.9);
            ctx.lineTo(r * 0.6, d * 1.9);
            ctx.stroke();
          }
        } else {
          ctx.beginPath();
          ctx.arc(0, r * 0.36, r * 0.1, 0, Math.PI * 2);
          ctx.fill();
          for (const rad of [r * 0.32, r * 0.58, r * 0.84]) {
            ctx.beginPath();
            ctx.arc(0, r * 0.36, rad, Math.PI * 1.22, Math.PI * 1.78);
            ctx.stroke();
          }
        }
      }

      function tabletGeom(g) {
        const u = g.u;
        return {
          w: u * 0.4,
          h: u * 0.285,
          cx: g.cx + g.phoneW * 0.62,
          cy: g.cy - u * 0.03,
          r: u * 0.022,
        };
      }

      function scene1Back(g) {
        const t = tabletGeom(g);
        const u = g.u;
        rr(t.cx - t.w / 2, t.cy - t.h / 2, t.w, t.h, t.r);
        ctx.fillStyle = alphaHex(C.bg, 0.6);
        ctx.fill();
        ctx.strokeStyle = alphaHex(C.text, 0.22);
        ctx.lineWidth = Math.max(1, u * 0.003);
        ctx.stroke();
        const pad = t.w * 0.1,
          gap = t.w * 0.05;
        const cw = (t.w - 2 * pad - gap) / 2,
          ch = (t.h - 2 * pad - gap) / 2;
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 2; j++) {
            rr(
              t.cx - t.w / 2 + pad + j * (cw + gap),
              t.cy - t.h / 2 + pad + i * (ch + gap),
              cw,
              ch,
              t.r * 0.5,
            );
            ctx.fillStyle =
              i + j === 1 ? alphaHex(C.accent, 0.28) : alphaHex(C.text, 0.1);
            ctx.fill();
          }
        }
      }

      function scene1Front(s, g) {
        const u = g.u;
        const p = s.w * 0.085;
        const top = s.y + s.h * 0.1;
        const usable = s.h * 0.8;
        const gap = s.h * 0.024;
        const fr = [0.28, 0.18, 0.32, 0.22];
        const blocks = [];
        let y = top;
        for (let i = 0; i < 4; i++) {
          const bh = (usable - 3 * gap) * fr[i];
          blocks.push({ x: s.x + p, y: y, w: s.w - 2 * p, h: bh, i: i });
          y += bh + gap;
        }
        const pulseIdx = Math.floor(state.sceneTime * 1.1) % 4;
        for (const b of blocks) {
          const active = b.i === pulseIdx;
          rr(b.x, b.y, b.w, b.h, s.w * 0.035);
          ctx.fillStyle = active
            ? alphaHex(C.accent, 0.2)
            : alphaHex(C.text, 0.055);
          ctx.fill();
          ctx.strokeStyle = active
            ? alphaHex(C.accent, 0.6)
            : alphaHex(C.text, 0.1);
          ctx.lineWidth = Math.max(1, u * 0.0035);
          ctx.stroke();
          if (b.h > s.h * 0.1) {
            rr(
              b.x + b.w * 0.08,
              b.y + b.h * 0.22,
              b.w * 0.5,
              b.h * 0.14,
              b.h * 0.07,
            );
            ctx.fillStyle = active
              ? alphaHex(C.accent, 0.5)
              : alphaHex(C.text, 0.16);
            ctx.fill();
          }
        }
        const targets = blocks.map((b) => ({
          x: b.x + b.w / 2,
          y: b.y + b.h / 2,
        }));
        const tg = tabletGeom(g);
        targets.push({ x: tg.cx, y: tg.cy });
        const cyc = state.sceneTime % 1.6;
        const ti = Math.floor(state.sceneTime / 1.6) % targets.length;
        if (cyc < 1.0) {
          const q = cyc / 1.0;
          const r = easeOutCubic(q) * u * 0.05;
          ctx.beginPath();
          ctx.arc(targets[ti].x, targets[ti].y, r, 0, Math.PI * 2);
          ctx.strokeStyle = alphaHex(C.accent, 0.55 * (1 - q));
          ctx.lineWidth = Math.max(1.5, u * 0.007);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(targets[ti].x, targets[ti].y, u * 0.008, 0, Math.PI * 2);
          ctx.fillStyle = alphaHex(C.accent, 0.5 * (1 - q));
          ctx.fill();
        }
      }

      function scene2Front(s, g) {
        const u = g.u;
        const p = s.w * 0.085;
        const chipW = s.w * 0.36,
          chipH = s.h * 0.085;
        const chipX = g.cx - chipW / 2,
          chipY = s.y + s.h * 0.1;
        const rowY0 = s.y + s.h * 0.26;
        const rowH = s.h * 0.135,
          rowGap = s.h * 0.028;
        const rowX = s.x + p,
          rowW = s.w - 2 * p;
        const labels = ["Нативная", "Кроссплатформа", "Веб"];
        const dotCols = [C.accent, C.glow, C.sub];
        const ph = (state.sceneTime * 0.5) % 3;
        const k = Math.floor(ph),
          f = ph - k;

        for (let i = 0; i < 3; i++) {
          const ry = rowY0 + i * (rowH + rowGap);
          const active = i === k && f > 0.6;
          rr(rowX, ry, rowW, rowH, s.w * 0.03);
          ctx.fillStyle = active
            ? alphaHex(C.accent, 0.1)
            : alphaHex(C.text, 0.05);
          ctx.fill();
          ctx.strokeStyle = active
            ? alphaHex(C.accent, 0.6)
            : alphaHex(C.text, 0.1);
          ctx.lineWidth = Math.max(1, u * 0.0035);
          ctx.stroke();
        }
        const dots = [];
        for (let i = 0; i < 3; i++) {
          const ry = rowY0 + i * (rowH + rowGap);
          const dx = rowX + s.w * 0.05,
            dy = ry + rowH / 2;
          dots.push({ x: dx, y: dy });
          const p0x = g.cx,
            p0y = chipY + chipH;
          const cpx = g.cx,
            cpy = (p0y + dy) / 2;
          ctx.beginPath();
          ctx.moveTo(p0x, p0y);
          ctx.quadraticCurveTo(cpx, cpy, dx, dy);
          ctx.strokeStyle = alphaHex(C.accent, 0.28);
          ctx.lineWidth = Math.max(1, u * 0.004);
          ctx.stroke();
        }
        for (let i = 0; i < 3; i++) {
          const ry = rowY0 + i * (rowH + rowGap);
          const active = i === k && f > 0.6;
          const d = dots[i];
          ctx.beginPath();
          ctx.arc(d.x, d.y, s.w * 0.02, 0, Math.PI * 2);
          ctx.fillStyle = dotCols[i];
          ctx.fill();
          const size = fitFont(
            labels[i],
            rowW - (d.x - rowX) - s.w * 0.14,
            u * 0.05,
            "700",
          );
          ctx.fillStyle = active ? C.text : alphaHex(C.text, 0.85);
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(labels[i], d.x + s.w * 0.045, ry + rowH / 2 + 0.5);
        }
        rr(chipX, chipY, chipW, chipH, chipH / 2);
        ctx.save();
        ctx.shadowColor = alphaHex(C.accent, 0.5);
        ctx.shadowBlur = u * 0.03;
        ctx.fillStyle = alphaHex(C.text, 0.06);
        ctx.fill();
        ctx.strokeStyle = alphaHex(C.accent, 0.7);
        ctx.lineWidth = Math.max(1, u * 0.004);
        ctx.stroke();
        ctx.restore();
        ctx.font = fontStr(chipH * 0.55, "800");
        ctx.fillStyle = C.accent;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("{ }", g.cx, chipY + chipH / 2 + 0.5);
        if (k < 3) {
          const t = easeInOutCubic(f);
          const d = dots[k];
          const bx =
            2 * (1 - t) * t * g.cx + t * t * d.x + (1 - t) * (1 - t) * g.cx;
          const by =
            2 * (1 - t) * t * ((chipY + chipH + d.y) / 2) +
            t * t * d.y +
            (1 - t) * (1 - t) * (chipY + chipH);
          ctx.save();
          ctx.shadowColor = alphaHex(C.accent, 0.9);
          ctx.shadowBlur = u * 0.03;
          ctx.beginPath();
          ctx.arc(bx, by, u * 0.014, 0, Math.PI * 2);
          ctx.fillStyle = C.accent;
          ctx.fill();
          ctx.restore();
        }
      }

      function scene3Front(s, g) {
        const u = g.u;
        const p = s.w * 0.085;
        const gap = s.w * 0.04;
        const cardW = (s.w - 2 * p - gap) / 2,
          cardH = s.h * 0.34;
        const cy0 = s.y + s.h * 0.1;
        const defs = [
          { x: s.x + p, col: C.accent, label: "Android" },
          { x: s.x + p + cardW + gap, col: C.text, label: "iOS" },
        ];
        for (let ci = 0; ci < 2; ci++) {
          const d = defs[ci];
          rr(d.x, cy0, cardW, cardH, s.w * 0.04);
          ctx.fillStyle = alphaHex(C.text, 0.05);
          ctx.fill();
          ctx.strokeStyle =
            ci === 0 ? alphaHex(C.accent, 0.55) : alphaHex(C.text, 0.28);
          ctx.lineWidth = Math.max(1, u * 0.004);
          ctx.stroke();
          const icx = d.x + cardW / 2,
            icy = cy0 + cardH * 0.34,
            icr = cardW * 0.2;
          ctx.beginPath();
          ctx.arc(icx, icy, icr, 0, Math.PI * 2);
          ctx.fillStyle =
            ci === 0 ? alphaHex(C.accent, 0.14) : alphaHex(C.text, 0.07);
          ctx.fill();
          ctx.strokeStyle =
            ci === 0 ? alphaHex(C.accent, 0.6) : alphaHex(C.text, 0.3);
          ctx.stroke();
          const ic = icr * 0.9;
          ctx.save();
          ctx.translate(icx, icy);
          if (ci === 0) {
            ctx.fillStyle = C.accent;
            rr(-ic * 0.5, -ic * 0.16, ic, ic * 0.62, ic * 0.31);
            ctx.fill();
            ctx.fillStyle = alphaHex(C.panel, 0.95);
            ctx.beginPath();
            ctx.arc(-ic * 0.18, ic * 0.1, ic * 0.09, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ic * 0.18, ic * 0.1, ic * 0.09, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = C.accent;
            ctx.lineWidth = ic * 0.07;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-ic * 0.24, -ic * 0.2);
            ctx.lineTo(-ic * 0.36, -ic * 0.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ic * 0.24, -ic * 0.2);
            ctx.lineTo(ic * 0.36, -ic * 0.5);
            ctx.stroke();
            ctx.fillStyle = C.accent;
            ctx.beginPath();
            ctx.arc(-ic * 0.36, -ic * 0.5, ic * 0.07, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ic * 0.36, -ic * 0.5, ic * 0.07, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = C.text;
            ctx.beginPath();
            ctx.arc(0, ic * 0.08, ic * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = alphaHex(C.panel, 1);
            ctx.beginPath();
            ctx.arc(ic * 0.27, -ic * 0.05, ic * 0.14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = C.text;
            ctx.beginPath();
            ctx.ellipse(
              ic * 0.1,
              -ic * 0.32,
              ic * 0.15,
              ic * 0.06,
              -0.6,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
          ctx.restore();
          const size = fitFont(d.label, cardW - 8, u * 0.045, "800");
          ctx.fillStyle = C.text;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(d.label, d.x + cardW / 2, cy0 + cardH * 0.74);
        }
        const barY = s.y + s.h * 0.58;
        const bh = s.h * 0.075,
          bgap = s.h * 0.03;
        const bw = s.w - 2 * p;
        for (let i = 0; i < 2; i++) {
          const yy = barY + i * (bh + bgap);
          rr(s.x + p, yy, bw, bh, bh / 2);
          ctx.fillStyle = alphaHex(C.text, 0.08);
          ctx.fill();
          const prog = (state.sceneTime * 0.4 + i * 0.5) % 1;
          const fw = bw * prog;
          if (fw > 1) {
            rr(s.x + p, yy, fw, bh, bh / 2);
            ctx.fillStyle =
              i === 0 ? alphaHex(C.accent, 0.85) : alphaHex(C.glow, 0.95);
            ctx.fill();
          }
        }
      }

      function scene4Front(s, g) {
        const u = g.u;
        const p = s.w * 0.085;
        const ex = s.x + p,
          ey = s.y + s.h * 0.08,
          ew = s.w - 2 * p,
          eh = s.h * 0.3;
        rr(ex, ey, ew, eh, s.w * 0.03);
        ctx.fillStyle = alphaHex(C.text, 0.055);
        ctx.fill();
        ctx.strokeStyle = alphaHex(C.text, 0.12);
        ctx.lineWidth = Math.max(1, u * 0.0035);
        ctx.stroke();
        const dotCols = [
          alphaHex(C.sub, 0.8),
          alphaHex(C.accent, 0.8),
          alphaHex(C.glow, 0.9),
        ];
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(
            ex + ew * 0.09 + i * ew * 0.055,
            ey + eh * 0.1,
            Math.max(1.5, s.h * 0.011),
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = dotCols[i];
          ctx.fill();
        }
        ctx.strokeStyle = alphaHex(C.text, 0.08);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ex, ey + eh * 0.2);
        ctx.lineTo(ex + ew, ey + eh * 0.2);
        ctx.stroke();
        const widths = [0.52, 0.74, 0.4, 0.6];
        const indents = [0.04, 0.12, 0.2, 0.12];
        const lineCols = [
          alphaHex(C.accent, 0.8),
          alphaHex(C.text, 0.4),
          alphaHex(C.sub, 0.55),
          alphaHex(C.glow, 0.9),
        ];
        const lh = eh * 0.16,
          lhh = lh * 0.5;
        for (let i = 0; i < 4; i++) {
          rr(
            ex + ew * 0.08 + ew * indents[i],
            ey + eh * 0.3 + i * lh,
            ew * widths[i],
            lhh,
            lhh / 2,
          );
          ctx.fillStyle = lineCols[i];
          ctx.fill();
        }
        const ty = (state.sceneTime * 0.4) % 1;
        const tw = ew * 0.5 * ty;
        const ly = ey + eh * 0.3 + 4 * lh;
        rr(ex + ew * 0.08 + ew * 0.04, ly, Math.max(lhh, tw), lhh, lhh / 2);
        ctx.fillStyle = alphaHex(C.accent, 0.8);
        ctx.fill();
        const blink = (Math.sin(state.sceneTime * 7) + 1) / 2;
        ctx.fillStyle = alphaHex(C.accent, 0.4 + 0.6 * blink);
        ctx.fillRect(
          ex + ew * 0.12 + tw,
          ly - lhh * 0.25,
          Math.max(1.5, u * 0.004),
          lhh * 1.5,
        );

        const wy = s.y + s.h * 0.44,
          wh = s.h * 0.38;
        const wg = s.w * 0.03;
        const cw2 = (ew - wg) / 2;
        const cells = [
          { x: ex, y: wy, w: cw2, h: wh * 0.28 },
          { x: ex + cw2 + wg, y: wy, w: cw2, h: wh * 0.28 },
          { x: ex, y: wy + wh * 0.28 + wg, w: cw2, h: wh * 0.28 },
          { x: ex + cw2 + wg, y: wy + wh * 0.28 + wg, w: cw2, h: wh * 0.28 },
          { x: ex, y: wy + wh * 0.56 + wg, w: ew, h: wh * 0.24 },
        ];
        for (let i = 0; i < cells.length; i++) {
          const c = cells[i];
          const ai =
            0.45 +
            0.55 * Math.max(0, Math.sin(state.sceneTime * 1.4 - i * 0.9));
          rr(c.x, c.y, c.w, c.h, s.w * 0.02);
          ctx.fillStyle = alphaHex(C.text, 0.05);
          ctx.fill();
          ctx.strokeStyle =
            i === 0
              ? alphaHex(C.accent, 0.55 * ai)
              : alphaHex(C.text, 0.14 * ai);
          ctx.lineWidth = Math.max(1, u * 0.0035);
          ctx.stroke();
        }
      }

      function scene4Extras(g) {
        const u = g.u;
        const rx = g.phoneW * 0.98,
          ry = g.phoneH * 0.58;
        ctx.save();
        ctx.strokeStyle = alphaHex(C.text, 0.1);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(g.cx, g.cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        const r = u * 0.031;
        for (let i = 0; i < 5; i++) {
          const ang = state.sceneTime * 0.5 + i * ((Math.PI * 2) / 5);
          const x = g.cx + Math.cos(ang) * rx;
          const y = g.cy + Math.sin(ang) * ry;
          ctx.save();
          ctx.translate(x, y);
          ctx.strokeStyle = alphaHex(C.accent, 0.9);
          ctx.fillStyle = alphaHex(C.accent, 0.9);
          ctx.lineWidth = Math.max(1.4, u * 0.006);
          drawSensorIcon(i, r);
          ctx.restore();
        }
      }

      function scene5Front(s, g) {
        const u = g.u;
        const x = g.cx;
        const y0 = s.y + s.h * 0.16,
          y1 = s.y + s.h * 0.84;
        ctx.strokeStyle = alphaHex(C.text, 0.14);
        ctx.lineWidth = Math.max(1, u * 0.005);
        ctx.beginPath();
        ctx.moveTo(x, y0);
        ctx.lineTo(x, y1);
        ctx.stroke();
        const nodeYs = [y0, (y0 + y1) / 2, y1];
        const r = s.w * 0.095;
        const P = 3.4;
        const ph = (state.sceneTime % P) / P;
        const pos = ph * 2;
        const labels = ["Тесты", "Публикация", "Обновления"];
        for (let i = 0; i < 3; i++) {
          const ny = nodeYs[i];
          const d = Math.abs(pos - i);
          const act = Math.max(0, 1 - d / 0.5);
          const rad = r * (1 + 0.1 * act);
          ctx.save();
          if (act > 0.2) {
            ctx.shadowColor = alphaHex(C.accent, 0.7 * act);
            ctx.shadowBlur = u * 0.04;
          }
          ctx.beginPath();
          ctx.arc(x, ny, rad, 0, Math.PI * 2);
          ctx.fillStyle = alphaHex(C.accent, 0.04 + 0.18 * act);
          ctx.fill();
          ctx.strokeStyle =
            act > 0.05
              ? alphaHex(C.accent, 0.5 + 0.4 * act)
              : alphaHex(C.text, 0.22);
          ctx.lineWidth = Math.max(1.2, u * 0.005);
          ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.translate(x, ny);
          ctx.strokeStyle = act > 0.3 ? C.accent : alphaHex(C.text, 0.65);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.lineWidth = Math.max(2, r * 0.14);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          if (i === 0) {
            ctx.beginPath();
            ctx.moveTo(-r * 0.32, 0);
            ctx.lineTo(-r * 0.08, r * 0.26);
            ctx.lineTo(r * 0.36, -r * 0.26);
            ctx.stroke();
          } else if (i === 1) {
            ctx.beginPath();
            ctx.moveTo(-r * 0.38, r * 0.3);
            ctx.lineTo(r * 0.38, r * 0.3);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.36);
            ctx.lineTo(0, r * 0.1);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-r * 0.18, -r * 0.16);
            ctx.lineTo(0, -r * 0.36);
            ctx.lineTo(r * 0.18, -r * 0.16);
            ctx.stroke();
          } else {
            const rad2 = r * 0.3;
            ctx.beginPath();
            ctx.arc(0, 0, rad2, -0.35, Math.PI * 1.15);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, rad2, Math.PI - 0.35, Math.PI * 2.15);
            ctx.stroke();
            const a1 = Math.PI * 1.15;
            ctx.beginPath();
            ctx.moveTo(
              Math.cos(a1) * rad2 - Math.sin(a1) * rad2 * 0.3,
              Math.sin(a1) * rad2 + Math.cos(a1) * rad2 * 0.3,
            );
            ctx.lineTo(Math.cos(a1) * rad2 * 1.25, Math.sin(a1) * rad2 * 1.25);
            ctx.lineTo(
              Math.cos(a1) * rad2 + Math.sin(a1) * rad2 * 0.3,
              Math.sin(a1) * rad2 - Math.cos(a1) * rad2 * 0.3,
            );
            ctx.stroke();
            const a2 = Math.PI * 2.15;
            ctx.beginPath();
            ctx.moveTo(
              Math.cos(a2) * rad2 - Math.sin(a2) * rad2 * 0.3,
              Math.sin(a2) * rad2 + Math.cos(a2) * rad2 * 0.3,
            );
            ctx.lineTo(Math.cos(a2) * rad2 * 1.25, Math.sin(a2) * rad2 * 1.25);
            ctx.lineTo(
              Math.cos(a2) * rad2 + Math.sin(a2) * rad2 * 0.3,
              Math.sin(a2) * rad2 - Math.cos(a2) * rad2 * 0.3,
            );
            ctx.stroke();
          }
          ctx.restore();
          const size = fitFont(labels[i], s.w * 0.62, u * 0.05, "700");
          const tw2 = ctx.measureText(labels[i]).width;
          const lyy = ny + rad + u * 0.024;
          ctx.fillStyle = alphaHex(C.bg, 0.75);
          rr(
            x - tw2 / 2 - 8,
            lyy - size * 0.72,
            tw2 + 16,
            size * 1.44,
            size * 0.72,
          );
          ctx.fill();
          ctx.fillStyle = act > 0.3 ? C.text : alphaHex(C.sub, 1);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(labels[i], x, lyy);
        }
        ctx.save();
        ctx.shadowColor = alphaHex(C.accent, 0.9);
        ctx.shadowBlur = u * 0.03;
        ctx.beginPath();
        ctx.arc(x, lerp(y0, y1, ph), u * 0.014, 0, Math.PI * 2);
        ctx.fillStyle = C.accent;
        ctx.fill();
        ctx.restore();
      }

      function scene6Front(s, g) {
        const u = g.u;
        const p = s.w * 0.085;
        const scx = g.cx,
          scy = s.y + s.h * 0.22;
        const sw2 = s.w * 0.26,
          sh2 = s.h * 0.19;
        const pulse = 1 + 0.03 * Math.sin(state.sceneTime * 2.1);
        ctx.save();
        ctx.translate(scx, scy);
        ctx.scale(pulse, pulse);
        ctx.shadowColor = alphaHex(C.accent, 0.6);
        ctx.shadowBlur = u * 0.04;
        ctx.beginPath();
        ctx.moveTo(0, -sh2 * 0.5);
        ctx.quadraticCurveTo(sw2 * 0.52, -sh2 * 0.44, sw2 * 0.5, -sh2 * 0.1);
        ctx.quadraticCurveTo(sw2 * 0.48, sh2 * 0.3, 0, sh2 * 0.5);
        ctx.quadraticCurveTo(-sw2 * 0.48, sh2 * 0.3, -sw2 * 0.5, -sh2 * 0.1);
        ctx.quadraticCurveTo(-sw2 * 0.52, -sh2 * 0.44, 0, -sh2 * 0.5);
        ctx.closePath();
        ctx.fillStyle = alphaHex(C.accent, 0.13);
        ctx.fill();
        ctx.strokeStyle = alphaHex(C.accent, 0.85);
        ctx.lineWidth = Math.max(1.4, u * 0.006);
        ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.translate(scx, scy);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = alphaHex(C.bg, 0.95);
        ctx.beginPath();
        ctx.arc(0, -sh2 * 0.05, sw2 * 0.16, 0, Math.PI * 2);
        ctx.fill();
        rr(-sw2 * 0.055, -sh2 * 0.02, sw2 * 0.11, sh2 * 0.22, sw2 * 0.04);
        ctx.fill();
        ctx.restore();

        const rows = [
          { label: "Геолокация", icon: 0 },
          { label: "Камера", icon: 1 },
          { label: "Микрофон", icon: 2 },
        ];
        const y0 = s.y + s.h * 0.4;
        const rh = s.h * 0.115,
          rgap = s.h * 0.028;
        const w = s.w - 2 * p;
        const P = 5.4;
        const cyc = state.sceneTime % P;
        const onTimes = [0.6, 1.5, 2.4];
        for (let i = 0; i < 3; i++) {
          const yy = y0 + i * (rh + rgap);
          const k = easeInOutCubic(clamp01((cyc - onTimes[i]) / 0.35));
          rr(s.x + p, yy, w, rh, s.w * 0.03);
          ctx.fillStyle = alphaHex(C.text, 0.05 + 0.03 * k);
          ctx.fill();
          ctx.strokeStyle = alphaHex(C.accent, 0.1 + 0.45 * k);
          ctx.lineWidth = Math.max(1, u * 0.0035);
          ctx.stroke();
          ctx.save();
          ctx.translate(s.x + p + s.w * 0.075, yy + rh / 2);
          ctx.strokeStyle = alphaHex(C.accent, 0.9);
          ctx.fillStyle = alphaHex(C.accent, 0.9);
          ctx.lineWidth = Math.max(1.2, u * 0.005);
          drawSensorIcon(rows[i].icon, u * 0.024);
          ctx.restore();
          const size = fitFont(rows[i].label, w - s.w * 0.32, u * 0.048, "700");
          ctx.fillStyle = alphaHex(C.text, 0.9);
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(rows[i].label, s.x + p + s.w * 0.14, yy + rh / 2 + 0.5);
          const pillW = s.w * 0.13,
            pillH = rh * 0.44;
          const px2 = s.x + p + w - pillW - s.w * 0.06;
          const py2 = yy + rh / 2 - pillH / 2;
          rr(px2, py2, pillW, pillH, pillH / 2);
          ctx.fillStyle = alphaHex(C.text, 0.14);
          ctx.fill();
          if (k > 0) {
            rr(px2, py2, pillW, pillH, pillH / 2);
            ctx.fillStyle = alphaHex(C.accent, 0.85 * k);
            ctx.fill();
          }
          const kr = pillH * 0.36;
          const kx = lerp(px2 + pillH * 0.28, px2 + pillW - pillH * 0.28, k);
          ctx.beginPath();
          ctx.arc(kx, py2 + pillH / 2, kr, 0, Math.PI * 2);
          ctx.fillStyle = C.text;
          ctx.fill();
        }
      }

      const SCENE_FRONT = {
        1: scene1Front,
        2: scene2Front,
        3: scene3Front,
        4: scene4Front,
        5: scene5Front,
        6: scene6Front,
      };
      const SCENE_BACK = { 1: scene1Back };

      function drawStepBack(step, a, dy, g) {
        if (a <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(0, dy);
        if (SCENE_BACK[step]) SCENE_BACK[step](g);
        ctx.restore();
      }
      function drawStepFront(step, a, dy, g) {
        if (a <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(0, dy);
        const s = screenRect(g);
        ctx.save();
        rr(s.x, s.y, s.w, s.h, g.phoneW * 0.13);
        ctx.clip();
        if (SCENE_FRONT[step]) SCENE_FRONT[step](s, g);
        ctx.restore();
        if (step === 4) scene4Extras(g);
        ctx.restore();
      }

      function drawScene(w, h, u, cx, cy) {
        const phoneW = u * 0.42,
          phoneH = u * 0.74;
        const g = {
          u,
          cx,
          cy,
          phoneW,
          phoneH,
          px: cx - phoneW / 2,
          py: cy - phoneH / 2 - u * 0.01,
        };
        const breathe = 0.12 + 0.03 * Math.sin(state.sceneTime * 1.25);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, u * 0.55);
        grad.addColorStop(0, alphaHex(C.accent, breathe));
        grad.addColorStop(1, alphaHex(C.accent, 0));
        ctx.fillStyle = grad;
        ctx.fillRect(cx - u * 0.55, cy - u * 0.55, u * 1.1, u * 1.1);

        const shift = u * 0.05;
        if (state.transitionT >= 0) {
          const tq = easeInOutCubic(clamp01(state.transitionT));
          drawStepBack(state.transitionFrom, 1 - tq, -shift * tq, g);
          drawStepBack(state.currentStep, tq, shift * (1 - tq), g);
          drawPhone(g);
          drawStepFront(state.transitionFrom, 1 - tq, -shift * tq, g);
          drawStepFront(state.currentStep, tq, shift * (1 - tq), g);
        } else {
          drawStepBack(state.currentStep, 1, 0, g);
          drawPhone(g);
          drawStepFront(state.currentStep, 1, 0, g);
        }
      }

      function draw() {
        if (!ctx) return;
        const w = canvasWidth,
          h = canvasHeight;
        if (w < 2 || h < 2) return;
        ctx.clearRect(0, 0, w, h);
        const u = Math.min(w, h);
        const cx = w / 2,
          cy = h / 2;
        drawParticles(w, h);
        if (state.videoMode) {
          drawFrameBackdrop(w, h);
          ctx.save();
          rr(0, 0, w, h, 24);
          ctx.clip();
          drawScene(w, h, u, cx, cy);
          ctx.restore();
        } else {
          drawScene(w, h, u, cx, cy);
        }
      }

      try {
        init();
      } catch (err) {
        console.error(err);
        const wrap = document.getElementById("canvasWrap");
        if (wrap) {
          const msg = document.createElement("div");
          msg.className = "init-error";
          msg.textContent =
            "Не удалось запустить визуализацию. Обновите страницу.";
          wrap.appendChild(msg);
        }
      }
    </script>
  </body>
</html>
