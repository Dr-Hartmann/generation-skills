<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Робототехника и IoT</title>
    <style>
      :root {
        --ui-bg: #0f0f13;
        --ui-bg-gradient: #111118;
        --ui-panel: #1a1a20;
        --ui-panel-glass: rgba(26, 26, 32, 0.55);
        --ui-modal-bg: rgba(26, 26, 32, 0.94);
        --ui-modal-scrim: rgba(0, 0, 0, 0.55);
        --ui-text: #ffffff;
        --ui-muted: #a0a0a0;
        --ui-label: #cfcfcf;
        --ui-accent: #2eac65;
        --ui-accent-dark: #1e7a47;
        --ui-accent-soft: rgba(46, 172, 101, 0.14);
        --ui-accent-soft-hover: rgba(46, 172, 101, 0.26);
        --ui-accent-border: rgba(46, 172, 101, 0.5);
        --ui-accent-shadow: rgba(46, 172, 101, 0.3);
        --ui-accent-shadow-strong: rgba(46, 172, 101, 0.35);
        --ui-accent-ambient-1: rgba(46, 172, 101, 0.34);
        --ui-accent-ambient-2: rgba(30, 122, 71, 0.3);
        --ui-accent-ambient-3: rgba(20, 80, 45, 0.38);
        --ui-accent-halo: rgba(46, 172, 101, 0.14);
        --ui-danger: #e5484d;
        --ui-danger-hover-border: rgba(229, 72, 77, 0.6);
        --ui-white-06: rgba(255, 255, 255, 0.06);
        --ui-white-08: rgba(255, 255, 255, 0.08);
        --ui-white-10: rgba(255, 255, 255, 0.1);
        --ui-white-12: rgba(255, 255, 255, 0.12);
        --ui-white-14: rgba(255, 255, 255, 0.14);
        --ui-border-soft: rgba(255, 255, 255, 0.12);
        --ui-border-faint: rgba(255, 255, 255, 0.08);
        --ui-scrim-strong: rgba(0, 0, 0, 0.65);
        --ui-surface-inset: rgba(0, 0, 0, 0.35);
        --ui-shadow-text: rgba(0, 0, 0, 0.8);
        --ui-ambient-blur: 90px;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--ui-text);
        background: var(--ui-bg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }
      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }
      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }
      body.v916 #ambient {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #ambient .b1,
        #ambient .b2,
        #ambient .b3 {
          animation: none;
        }
      }
      #modalWrap {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: var(--ui-modal-scrim);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      #modalWrap.open {
        display: flex;
      }
      #modal {
        width: min(92vw, 380px);
        max-height: 82vh;
        max-height: 82dvh;
        overflow: auto;
        color: var(--ui-text);
        background: var(--ui-modal-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--ui-border-soft);
        border-radius: 20px;
        padding: 20px;
        animation: pop 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        outline: none;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }
      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }
      .mstep {
        color: var(--ui-muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }
      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 30px;
      }
      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }
      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }
      .sw input:checked + span {
        background: var(--ui-accent);
      }
      .sw input:checked + span::before {
        transform: translateX(22px);
      }
      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }
      #mReset {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;
      }
      #mReset:hover {
        border-color: var(--ui-danger-hover-border);
      }
      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 10px;
        align-items: center;
        color: var(--ui-muted);
        font-size: 12px;
      }
      .keys span {
        justify-self: start;
        padding: 2px 7px;
        color: var(--ui-text);
        background: var(--ui-white-08);
        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }
      .keys i {
        font-style: normal;
      }
      body.modal-open {
        overflow: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        #modal {
          animation: none;
        }
      }
      #app {
        position: relative;
        z-index: 1;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        grid-template-areas: "title" "stage" "subs" "panel";
        padding-right: calc(80px + env(safe-area-inset-right, 0px));
        padding-bottom: calc(25vh + env(safe-area-inset-bottom, 0px));
        padding-left: calc(16px + env(safe-area-inset-left, 0px));
      }
      #titleBox {
        grid-area: title;
        padding-top: calc(16px + env(safe-area-inset-top, 0px));
        padding-right: 6px;
        padding-bottom: 10px;
      }
      #titleBox h1 {
        margin: 0;
        font-size: clamp(20px, 3.2vw, 30px);
        font-weight: 800;
        color: var(--ui-text);
        letter-spacing: 0.01em;
      }
      #stage {
        grid-area: stage;
        position: relative;
        min-height: 0;
      }
      #cv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #frameWrap {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 12px;
        pointer-events: none;
      }
      body.v916 #frameWrap {
        display: flex;
      }
      body.v916 #frame {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      #frame {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        pointer-events: auto;
        background: rgba(15, 15, 19, 0.45);
        border: 1px solid var(--ui-accent-border);
        border-radius: 22px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 0 70px var(--ui-accent-halo);
        overflow: hidden;
      }
      #fsSlot {
        margin: 0 16px 24px;
      }
      #fcSlot {
        display: flex;
        justify-content: center;
        padding: 0 16px 18px;
      }
      #subtitleBox {
        grid-area: subs;
        align-self: end;
        margin: 0 2px 24px 0;
        min-height: calc(3.7em + 22px);
        padding: 12px 14px;
        font-size: clamp(16px, 4.5vw, 22px);
        line-height: 1.35;
        color: var(--ui-text);
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--ui-border-faint);
        border-radius: 14px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      body.v916 #subtitleBox {
        margin: 0;
      }
      .subtitle__text {
        animation: subIn 0.45s ease both;
      }
      .subtitle__keyword {
        color: var(--ui-accent);
        font-weight: 800;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #controlBar {
        grid-area: panel;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-top: 10px;
        transition: opacity 0.25s;
      }
      #controlBar.controls-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #controlBar button {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        color: var(--ui-text);
        background: var(--ui-panel-glass);
        border: 1px solid var(--ui-border-soft);
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.08s;
        -webkit-tap-highlight-color: transparent;
      }
      #controlBar button:hover {
        background: var(--ui-accent-soft-hover);
        border-color: var(--ui-accent-border);
      }
      #controlBar button:active {
        transform: scale(0.96);
      }
      #btnPlay {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 6px 18px var(--ui-accent-shadow);
      }
      #btnPlay:hover {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        filter: brightness(1.08);
      }
      button:focus-visible {
        outline: 2px solid var(--ui-accent);
        outline-offset: 2px;
      }
      @media (min-width: 768px) {
        #app {
          grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
          grid-template-rows: auto minmax(0, 1fr) auto;
          grid-template-areas: "stage title" "stage subs" "stage panel";
          padding: 0;
        }
        #titleBox {
          padding: 24px 24px 12px;
        }
        #subtitleBox {
          margin: 0 24px 24px;
        }
        #controlBar {
          justify-content: flex-start;
          padding: 0 24px calc(16px + env(safe-area-inset-bottom, 0px));
        }
      }
      @media (max-width: 767.98px) {
        #ambient {
          clip-path: inset(
            0 calc(8.3333% + 80px + env(safe-area-inset-right, 0px))
              calc(29.1667% + env(safe-area-inset-bottom, 0px)) 0
          );
        }
      }
      #modal {
        max-height: 90vh;
        max-height: 90dvh;
      }
      .modal-close {
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
      }
      .seg button {
        min-height: 48px;
      }
      #mReset {
        min-height: 48px;
      }
      .speedseg {
        display: flex;
        gap: 8px;
        flex: 1.4;
      }
      .spd {
        flex: 1;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .spd:hover {
        background: var(--ui-accent-soft-hover);
      }
      .spd.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }
      .fatal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ui-muted);
        font-size: 15px;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .subtitle__text {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i>
    </div>
    <div id="app">
      <header id="titleBox"><h1>Робототехника и IoT</h1></header>
      <main id="stage">
        <canvas
          id="cv"
          role="img"
          aria-label="Анимированная схема: данные от датчика через контроллер и шлюз попадают в облако и на смартфон"
        ></canvas>
        <div id="frameWrap">
          <div id="frame">
            <div id="fsSlot"></div>
            <div id="fcSlot"></div>
          </div>
        </div>
      </main>
      <div id="subtitleBox" aria-live="polite"></div>
      <div id="controlBar">
        <button id="btnPlay" type="button" aria-label="Пауза">
          <svg
            id="icPause"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" />
          </svg>
          <svg
            id="icPlay"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            aria-hidden="true"
            style="display: none"
          >
            <path d="M8 5v14l11-7z" fill="currentColor" />
          </svg>
        </button>
        <button id="btnGear" type="button" aria-label="Настройки">
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3.2" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"
            />
          </svg>
        </button>
      </div>
    </div>
    <div id="modalWrap" aria-hidden="true">
      <section
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <header class="mhead">
          <h2 id="modalTitle">Настройки</h2>
          <button
            class="modal-close"
            id="mClose"
            type="button"
            data-modal-close
            aria-label="Закрыть"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="mstep" id="mStepTxt">Шаг 1 / 9</div>
        <div class="seg" role="group" aria-label="Режим воспроизведения">
          <button
            id="mAuto"
            class="active"
            type="button"
            data-mode="auto"
            aria-pressed="true"
          >
            AUTO
          </button>
          <button
            id="mStepBtn"
            type="button"
            data-mode="step"
            aria-pressed="false"
          >
            STEP
          </button>
        </div>
        <button id="mNext" type="button" data-modal-action="next-step" disabled>
          Следующий шаг ▶
        </button>
        <div class="mrow">
          <span class="mlabel" id="mSpeedLabel">Скорость</span>
          <div class="speedseg" role="group" aria-labelledby="mSpeedLabel">
            <button
              type="button"
              class="spd"
              data-speed="0.5"
              aria-pressed="false"
            >
              0.5×
            </button>
            <button
              type="button"
              class="spd active"
              data-speed="1"
              aria-pressed="true"
            >
              1×
            </button>
            <button
              type="button"
              class="spd"
              data-speed="2"
              aria-pressed="false"
            >
              2×
            </button>
          </div>
        </div>
        <div class="mrow">
          <span class="mlabel" id="mNineLabel">Режим 9:16</span>
          <label class="sw" aria-labelledby="mNineLabel">
            <input type="checkbox" id="mNine" data-modal-toggle="video-mode" />
            <span aria-hidden="true"></span>
          </label>
        </div>
        <button id="mReset" type="button" data-modal-action="reset">
          Reset
        </button>
        <div class="keys" aria-label="Горячие клавиши">
          <span>Space</span><i>скрыть панель</i> <span>→</span
          ><i>следующий шаг</i> <span>R</span><i>reset</i> <span>S</span
          ><i>AUTO/STEP</i> <span>V</span><i>режим 9:16</i> <span>Esc</span
          ><i>закрыть</i>
        </div>
      </section>
    </div>
    <script>
      (function (global) {
        "use strict";
        function initSettingsModal(options) {
          const config = Object.assign(
            {
              overlaySelector: "#modalWrap",
              dialogSelector: "#modal",
              openSelector: ".js-gear",
              closeSelector: "[data-modal-close]",
            },
            options || {},
          );
          const overlay = document.querySelector(config.overlaySelector);
          if (!overlay)
            throw new Error(
              "Settings modal overlay not found: " + config.overlaySelector,
            );
          const dialog =
            overlay.querySelector(config.dialogSelector) ||
