      :root {

  --subtitle-controls-gap: 24px;
  --portrait-aspect-ratio: 9 / 16;
  --right-reserved: 80px;
  --left-padding: 16px;
  --header-top-padding: 16px;
  --bottom-reserved: 25vh;
  --sidebar-width: clamp(320px, 30vw, 380px);
  --touch-target: 48px;
  --modal-max-height: 90dvh;
  --subtitle-blur: 8px;
  --settings-scale: 0.95;

}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: var(--app-bg);
}

body {
  color: var(--app-text);
  font-family: var(--font-family);
  font-weight: var(--body-weight);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

button,
select,
input {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 2px solid var(--app-text);
  outline-offset: 3px;
}

.app-root {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding:
    calc(var(--header-top-padding) + env(safe-area-inset-top, 0px))
    calc(var(--right-reserved) + env(safe-area-inset-right, 0px))
    calc(var(--bottom-reserved) + env(safe-area-inset-bottom, 0px))
    calc(var(--left-padding) + env(safe-area-inset-left, 0px));
  background: var(--app-bg);
}

.app-header {
  min-width: 0;
}

.app-header h1 {
  max-width: 100%;
  margin: 0;
  overflow-wrap: anywhere;
  font-size: clamp(18px, 2.2vw, 28px);
  font-weight: var(--heading-weight);
  line-height: 1.2;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  min-width: 0;
  min-height: 0;
}

.stage {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 0;
  place-items: stretch;
}

.visual-frame {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--app-border);
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 50% 45%, var(--app-accent-glow), transparent 65%),
    var(--app-bg);
}

#sceneCanvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.subtitle {

  max-width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--app-border);
  border-radius: 12px;
  color: var(--app-text);
  background: var(--app-subtitle-bg);
  -webkit-backdrop-filter: blur(var(--subtitle-blur));
  backdrop-filter: blur(var(--subtitle-blur));
  font-size: var(--subtitle-size);
  font-weight: 700;
  line-height: 1.35;
  text-wrap: pretty;
  overflow-wrap: anywhere;
  opacity: 1;
  transform: translateY(0);
  transition:
    opacity var(--subtitle-duration) ease,
    transform var(--subtitle-duration) ease;
}

.subtitle.updating {
  opacity: 0;
  transform: translateY(8px);
}

.subtitle-mobile {
  position: absolute;
  right: 12px;
  bottom: calc(var(--touch-target) + 12px + var(--subtitle-controls-gap));
  left: 12px;
  display: block;
}

.subtitle-desktop {
  display: none;
}

.control-bar {
  position: absolute;
  z-index: 3;
  right: 12px;
  bottom: 12px;
  left: 12px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  transition: opacity .2s ease, visibility .2s ease;
}

.app-root.controls-hidden .control-bar {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.icon-button {
  display: grid;
  flex: 0 0 var(--touch-target);
  width: var(--touch-target);
  height: var(--touch-target);
  padding: 12px;
  place-items: center;
  border: 1px solid var(--app-border);
  border-radius: 14px;
  background: var(--app-control-bg);
  transition: background .18s ease, border-color .18s ease;
}

.icon-button:hover {
  background: var(--app-control-hover);
}

.icon-button svg,
.dialog-close svg {
  display: block;
  width: 100%;
  height: 100%;
}

.details-panel {
  display: none;
}

.step-indicator {
  color: var(--app-muted);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
}

.modal-backdrop {
  position: fixed;
  z-index: 20;
  inset: 0;
  right: calc(var(--right-reserved) + env(safe-area-inset-right, 0px));
  bottom: calc(var(--bottom-reserved) + env(safe-area-inset-bottom, 0px));
  display: none;
  align-items: center;
  justify-content: center;
  padding:
    max(16px, env(safe-area-inset-top, 0px))
    16px
    max(16px, env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
  background: var(--app-modal-scrim);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.modal-backdrop.open {
  display: flex;
}

.settings-dialog {
  width: min(100%, 380px);
  max-height: 90vh;
  max-height: var(--modal-max-height);
  overflow: auto;
  padding: 20px;
  border: 1px solid var(--app-border);
  border-radius: 20px;
  background: var(--app-panel);
  box-shadow: 0 20px 80px var(--app-dialog-shadow);
  animation: settings-enter .22s ease both;
  outline: none;
}

@keyframes settings-enter {
  from { opacity: 0; transform: scale(var(--settings-scale)); }
  to { opacity: 1; transform: scale(1); }
}

.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.dialog-header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
}

.dialog-close {
  display: grid;
  flex: 0 0 var(--touch-target);
  width: var(--touch-target);
  height: var(--touch-target);
  padding: 14px;
  place-items: center;
  border: 1px solid var(--app-border);
  border-radius: 12px;
  background: var(--app-control-bg);
}

.segmented-control {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 16px 0 10px;
}

.segmented-control button,
.dialog-action {
  min-height: var(--touch-target);
  border: 1px solid var(--app-border);
  border-radius: 12px;
  color: var(--app-text);
  background: var(--app-control-bg);
  font-weight: 800;
}

.segmented-control button[aria-pressed="true"] {
  border-color: transparent;
  background: linear-gradient(135deg, var(--app-accent), var(--app-accent-dark));
}

.dialog-action {
  width: 100%;
  margin-bottom: 14px;
  background: var(--app-accent-soft);
}

.dialog-action:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: var(--touch-target);
  margin: 8px 0;
  color: var(--app-muted);
  font-size: 14px;
  font-weight: 700;
}

.setting-row select {
  min-width: 100px;
  min-height: var(--touch-target);
  padding: 0 12px;
  border: 1px solid var(--app-border);
  border-radius: 10px;
  color: var(--app-text);
  background: var(--app-panel);
}

.setting-row input[type="checkbox"] {
  width: 24px;
  height: 24px;
  accent-color: var(--app-accent);
}

.secondary-action {
  margin-top: 12px;
  background: var(--app-control-bg);
}

.keyboard-help {
  display: grid;
  gap: 8px;
  margin-top: 8px;
  color: var(--app-muted);
  font-size: 12px;
}

.keyboard-help span {
  display: flex;
  align-items: center;
  gap: 10px;
}

kbd {
  min-width: 42px;
  padding: 3px 6px;
  border: 1px solid var(--app-border);
  border-radius: 6px;
  color: var(--app-text);
  background: var(--app-keyboard-bg);
  font: inherit;
  font-weight: 800;
  text-align: center;
}

@media (min-width: 768px) {
  .app-root {
    padding: 20px;
  }

  .workspace {
    grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
    gap: 20px;
  }

  .details-panel {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 20px;
    padding: 16px 4px;
  }

  .subtitle-mobile {
    display: none;
  }

  .subtitle-desktop {
    display: block;
  }

  .modal-backdrop {
    right: 0;
    bottom: 0;
    padding: 20px;
  }
}

.app-root.is-portrait .workspace {
  grid-template-columns: minmax(0, 1fr);
}

.app-root.is-portrait .stage {
  place-items: center;
}

.app-root.is-portrait .visual-frame {
  width: auto;
  height: 100%;
  max-width: 100%;
  aspect-ratio: var(--portrait-aspect-ratio);
}

.app-root.is-portrait .details-panel {
  display: none;
}

.app-root.is-portrait .subtitle-mobile {
  display: block;
}

@media (max-width: 768px) {
  .app-root.is-portrait .visual-frame {
    max-height: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

    if (event.key === "ArrowRight") {
      if (
        state.mode === "step" &&
        !state.transition &&
        state.currentStep < steps.length - 1
      ) {
        event.preventDefault();
        nextStep();
      }
      return;
    }

    const key = event.key.toLowerCase();
    if (key === "r") reset();
    else if (key === "s") setMode(state.mode === "auto" ? "step" : "auto");
    else if (key === "v") setVideoMode(!state.videoMode);
  }

  function populateSpeedOptions() {
    for (const value of timing.speeds) {
      const option = document.createElement("option");
      option.value = String(value);
      option.textContent = value + "×";
      elements.speed.appendChild(option);
    }
  }

  elements.playButton.addEventListener("click", () => {
    setPlaying(!state.isPlaying);
  });
  elements.settingsButton.addEventListener("click", toggleSettings);
  elements.closeSettings.addEventListener("click", closeSettings);
  elements.backdrop.addEventListener("click", (event) => {
    if (event.target === elements.backdrop) closeSettings();
  });
  elements.autoMode.addEventListener("click", () => setMode("auto"));
  elements.stepMode.addEventListener("click", () => setMode("step"));
  elements.nextStep.addEventListener("click", nextStep);
  elements.speed.addEventListener("change", (event) =>
    setSpeed(event.target.value),
  );
  elements.portrait.addEventListener("change", (event) =>
    setVideoMode(event.target.checked),
  );
  elements.reset.addEventListener("click", reset);
  window.addEventListener("keydown", handleKeyboard);
  window.addEventListener("resize", resizeCanvas);
  document.addEventListener("visibilitychange", () => {
    lastTimestamp = 0;
  });

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(resizeCanvas);
    observer.observe(elements.visualFrame);
  }

  populateSpeedOptions();
  updateIndicators(false);
  resizeCanvas();

  try {
    if (typeof scene.init === "function") {
      scene.init({
        width: cssWidth,
        height: cssHeight,
        steps,
        setMode,
        setPlaying,
        setSpeed,
        setVideoMode,
        nextStep,
        reset,
      });
    }
    sceneInitialized = true;
    resizeCanvas();
  } catch (error) {
    console.error("[app-generator] Scene initialization failed:", error);
    showFatalError(
      "Не удалось инициализировать визуализацию. Проверьте консоль браузера.",
    );
    return;
  }

  animationFrameId = requestAnimationFrame(animationLoop);
  window.setTimeout(() => {
    if (!state.isPlaying && state.mode === timing.defaultMode) setPlaying(true);
  }, timing.autoStartDelayMs);

  window.addEventListener(
    "pagehide",
    () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    },
    { once: true },
  );
})();
    </script>
  </body>
</html>
