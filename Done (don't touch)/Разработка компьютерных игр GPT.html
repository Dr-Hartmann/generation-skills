<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Разработка компьютерных игр — интерактивная схема</title>
  <style>
    :root {
      --app-bg: #0F0F13;
      --panel-bg: #1A1A20;
      --accent: #2EAC65;
      --glow: #1E7A47;
      --text: #FFFFFF;
      --muted: #A0A0A0;
      --font: system-ui, sans-serif;
      --mobile-right-reserve: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--text);
      font-family: var(--font);
    }

    body { touch-action: manipulation; }

    button { font: inherit; }

    .app-shell {
      width: 100%;
      height: 100%;
      padding: 24px 32px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
    }

    .app-layout {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 380px);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "header header"
        "visual subtitle"
        "controls controls";
      column-gap: 22px;
      row-gap: 18px;
      position: relative;
    }

    .header {
      grid-area: header;
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 2px 0 4px;
    }

    h1 {
      margin: 0;
      font-size: clamp(19px, 2.1vw, 29px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .visualization {
      grid-area: visual;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 18px;
      background: var(--app-bg);
    }

    #processCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .subtitle-panel {
      grid-area: subtitle;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      border-radius: 18px;
      background: var(--panel-bg);
    }

    .subtitle {
      width: 100%;
      min-height: 104px;
      display: flex;
      align-items: center;
      padding: 18px;
      border-radius: 14px;
      background: #00000080;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: clamp(16px, 4.5vw, 22px);
      line-height: 1.38;
      font-weight: 600;
      overflow-wrap: anywhere;
      animation: subtitle-in 300ms ease both;
    }

    .subtitle__keyword { color: var(--accent); }

    @keyframes subtitle-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 64px;
      padding: 8px;
      border: 1px solid rgba(160, 160, 160, 0.13);
      border-radius: 18px;
      background: var(--panel-bg);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .icon-button {
      width: 52px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(160, 160, 160, 0.22);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      font-size: 21px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .icon-button:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(46, 172, 101, 0.12);
      box-shadow: 0 0 18px rgba(30, 122, 71, 0.25);
    }

    .icon-button:active:not(:disabled) { transform: scale(0.96); }
    .icon-button:focus-visible, .setting-button:focus-visible, .segment:focus-visible, .text-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .controls-hidden .controls {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 15, 19, 0.76);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .modal-backdrop[hidden] { display: none; }
    .modal-backdrop.is-open { opacity: 1; }

    .settings-dialog {
      width: min(440px, 100%);
      max-height: 90dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 24px;
      border: 1px solid rgba(160, 160, 160, 0.18);
      border-radius: 22px;
      background: var(--panel-bg);
      box-shadow: 0 24px 80px rgba(30, 122, 71, 0.20), 0 0 32px rgba(30, 122, 71, 0.1);
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .modal-backdrop.is-open .settings-dialog {
      opacity: 1;
      transform: scale(1);
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .settings-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .step-indicator {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .setting-group { margin-top: 20px; }
    .setting-label {
      display: block;
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
      padding: 5px;
      border-radius: 13px;
      background: var(--app-bg);
    }

    .segment, .setting-button, .text-button {
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .segment {
      background: transparent;
      font-weight: 700;
    }

    .segment[aria-pressed="true"] {
      border-color: rgba(46, 172, 101, 0.55);
      background: rgba(46, 172, 101, 0.16);
      color: var(--text);
      box-shadow: inset 0 0 16px rgba(30, 122, 71, 0.12);
    }

    .setting-button {
      width: 100%;
      padding: 10px 14px;
      background: rgba(46, 172, 101, 0.13);
      border-color: rgba(46, 172, 101, 0.34);
      text-align: center;
      font-weight: 700;
    }

    .setting-button:hover:not(:disabled), .text-button:hover {
      background: rgba(46, 172, 101, 0.22);
      border-color: var(--accent);
    }

    .text-button {
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(160, 160, 160, 0.2);
    }

    .toggle-row {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--text);
      font-size: 14px;
    }

    .switch {
      appearance: none;
      width: 48px;
      height: 28px;
      flex: 0 0 48px;
      margin: 0;
      border: 1px solid rgba(160, 160, 160, 0.35);
      border-radius: 20px;
      background: rgba(160, 160, 160, 0.18);
      cursor: pointer;
      position: relative;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text);
      transition: transform 160ms ease;
    }

    .switch:checked { background: var(--accent); border-color: var(--accent); }
    .switch:checked::after { transform: translateX(20px); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(160, 160, 160, 0.14);
    }

    .shortcuts {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 8px 12px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .shortcuts dt {
      color: var(--text);
      font-weight: 700;
    }

    .shortcuts dd { margin: 0; }

    @media (max-width: 767.98px) {
      :root { --mobile-right-reserve: 80px; }

      .app-shell {
        width: calc(100% - 80px - env(safe-area-inset-right));
        height: calc(100vh - 25vh - env(safe-area-inset-bottom));
        height: calc(100dvh - 25vh - env(safe-area-inset-bottom));
        padding: calc(16px + env(safe-area-inset-top)) 0 0 calc(16px + env(safe-area-inset-left));
        justify-content: flex-start;
      }

      .app-layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        grid-template-areas:
          "header"
          "visual"
          "subtitle"
          "controls";
        row-gap: 0;
        column-gap: 0;
      }

      .header { padding: 0 0 9px; }
      h1 { font-size: clamp(17px, 5vw, 22px); }
      .visualization { border-radius: 13px; margin-bottom: 10px; }

      .subtitle-panel {
        padding: 0;
        border-radius: 0;
        background: transparent;
        margin-bottom: 24px;
      }

      .subtitle {
        min-height: 58px;
        padding: 10px 13px;
        border-radius: 12px;
      }

      .controls {
        min-height: 62px;
        padding: 6px;
        border-radius: 15px;
        gap: 10px;
      }

      .icon-button { width: 54px; height: 48px; }

      .app-layout.video-mode {
        width: min(100%, calc((75dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 9 / 16));
        height: auto;
        aspect-ratio: 9 / 16;
        align-self: center;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        border-radius: 20px;
        padding: 11px;
        border: 1px solid rgba(46, 172, 101, 0.45);
        background: var(--app-bg);
        box-shadow: 0 0 28px rgba(30, 122, 71, 0.18);
      }

      .video-mode .header { padding-bottom: 6px; }
      .video-mode .visualization { margin-bottom: 6px; }
      .video-mode .subtitle-panel { margin-bottom: 12px; }
      .video-mode .subtitle { font-size: clamp(16px, 4.5vw, 22px); }
      .video-mode .controls { min-height: 58px; }
    }

    @media (min-width: 768px) {
      .app-layout.video-mode {
        width: min(100%, calc((100dvh - 48px) * 9 / 16));
        height: auto;
        max-height: 100%;
        aspect-ratio: 9 / 16;
        align-self: center;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        border: 1px solid rgba(46, 172, 101, 0.45);
        border-radius: 22px;
        padding: 16px;
        background: var(--app-bg);
        box-shadow: 0 0 32px rgba(30, 122, 71, 0.18);
      }

      .video-mode .subtitle-panel {
        padding: 0;
        border-radius: 0;
        background: transparent;
      }

      .video-mode .subtitle { min-height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="app-layout" id="appLayout">
      <header class="header">
        <h1>Разработка компьютерных игр</h1>
      </header>

      <section class="visualization" id="visualization" aria-label="Этапы разработки игры">
        <canvas id="processCanvas" role="img" aria-label="Интерактивная схема из восьми этапов разработки компьютерной игры"></canvas>
      </section>

      <aside class="subtitle-panel">
        <div class="subtitle" id="subtitle" aria-live="polite" aria-atomic="true"></div>
      </aside>

      <nav class="controls" aria-label="Основное управление">
        <button class="icon-button" id="playButton" type="button" aria-label="Пауза" title="Пауза">
          <span id="playIcon" aria-hidden="true">Ⅱ</span>
        </button>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Открыть настройки" title="Настройки">
          <span aria-hidden="true">⚙</span>
        </button>
      </nav>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="settings-dialog" id="settingsDialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">Настройки</h2>
        <button class="text-button" id="closeSettingsButton" type="button" aria-label="Закрыть настройки">Закрыть</button>
      </div>

      <p class="step-indicator" id="stepIndicator">Шаг 1 / 8</p>

      <div class="setting-group">
        <span class="setting-label">Режим просмотра</span>
        <div class="segmented" role="group" aria-label="Режим просмотра">
          <button class="segment" id="autoModeButton" type="button" aria-pressed="true">AUTO</button>
          <button class="segment" id="stepModeButton" type="button" aria-pressed="false">STEP</button>
        </div>
      </div>

      <div class="setting-group">
        <button class="setting-button" id="nextStepButton" type="button" disabled>Следующий шаг ▶</button>
      </div>

      <div class="setting-group">
        <span class="setting-label">Скорость анимации</span>
        <div class="segmented" role="group" aria-label="Скорость анимации">
          <button class="segment" data-speed="0.5" type="button" aria-pressed="false">0.5×</button>
          <button class="segment" data-speed="1" type="button" aria-pressed="true">1×</button>
          <button class="segment" data-speed="2" type="button" aria-pressed="false">2×</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="toggle-row" for="videoModeSwitch">
          <span>Режим вертикальной рамки 9:16</span>
          <input class="switch" id="videoModeSwitch" type="checkbox">
        </label>
      </div>

      <div class="setting-group">
        <button class="setting-button" id="resetButton" type="button">Сбросить просмотр</button>
      </div>

      <div class="setting-group">
        <span class="setting-label">Горячие клавиши на ПК</span>
        <dl class="shortcuts">
          <dt>Space</dt><dd>Скрыть или показать панель управления</dd>
          <dt>→</dt><dd>Следующий шаг в режиме STEP</dd>
          <dt>R</dt><dd>Сбросить просмотр</dd>
          <dt>S</dt><dd>Переключить AUTO / STEP</dd>
          <dt>V</dt><dd>Включить вертикальную рамку</dd>
          <dt>Esc</dt><dd>Закрыть настройки</dd>
        </dl>
      </div>

      <div class="settings-footer">
        <button class="text-button" id="doneButton" type="button">Готово</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      const STEPS = [
        {
          step: 1,
          title: 'Концепция',
          detail: 'Цель · жанр · аудитория',
          segments: [
            { text: 'Сначала определяем ' },
            { text: 'аудиторию и игровой опыт', emphasis: true }
          ]
        },
        {
          step: 2,
          title: 'Геймдизайн',
          detail: 'Правила · цикл · уровни',
          segments: [
            { text: 'Геймдизайн связывает ' },
            { text: 'правила, уровни и прогрессию', emphasis: true }
          ]
        },
        {
          step: 3,
          title: 'Прототип',
          detail: 'Проверка основной петли',
          segments: [
            { text: 'Прототип проверяет ' },
            { text: 'основную игровую петлю', emphasis: true },
            { text: ' без лишнего контента.' }
          ]
        },
        {
          step: 4,
          title: 'Код и системы',
          detail: 'Ввод · состояния · ИИ',
          segments: [
            { text: 'Код объединяет управление, состояния, ' },
            { text: 'физику и поведение NPC', emphasis: true },
            { text: '.' }
          ]
        },
        {
          step: 5,
          title: 'Игровой контент',
          detail: 'Графика · анимация · звук',
          segments: [
            { text: 'Графика, анимация и звук создают ' },
            { text: 'атмосферу игрового мира', emphasis: true },
            { text: '.' }
          ]
        },
        {
          step: 6,
          title: 'Интеграция',
          detail: 'Физика · UI · ресурсы',
          segments: [
            { text: 'Интеграция соединяет ' },
            { text: 'системы, ресурсы и интерфейс', emphasis: true },
            { text: '.' }
          ]
        },
        {
          step: 7,
          title: 'Тестирование',
          detail: 'Баланс · ошибки · FPS',
          segments: [
            { text: 'Тестирование выявляет ' },
            { text: 'ошибки, дисбаланс и узкие места', emphasis: true },
            { text: ' производительности.' }
          ]
        },
        {
          step: 8,
          title: 'Релиз',
          detail: 'Публикация · обновления',
          segments: [
            { text: 'После релиза игру ' },
            { text: 'поддерживают, обновляют и развивают', emphasis: true },
            { text: '.' }
          ]
        }
      ];

      const DURATION = 900;
      const AUTO_INTERVAL = 5000;
      const AUTO_START_DELAY = 500;
      const rootStyles = getComputedStyle(document.documentElement);
      const theme = {
        background: rootStyles.getPropertyValue('--app-bg').trim(),
        panel: rootStyles.getPropertyValue('--panel-bg').trim(),
        accent: rootStyles.getPropertyValue('--accent').trim(),
        glow: rootStyles.getPropertyValue('--glow').trim(),
        text: rootStyles.getPropertyValue('--text').trim(),
        muted: rootStyles.getPropertyValue('--muted').trim()
      };

      function alphaColor(hex, alpha) {
        const value = hex.replace('#', '');
        const normalized = value.length === 3
          ? value.split('').map(character => character + character).join('')
          : value;
        const red = parseInt(normalized.slice(0, 2), 16);
        const green = parseInt(normalized.slice(2, 4), 16);
        const blue = parseInt(normalized.slice(4, 6), 16);
        return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      }

      const canvas = document.getElementById('processCanvas');
      const visual = document.getElementById('visualization');
      const ctx = canvas.getContext('2d');
      const appLayout = document.getElementById('appLayout');
      const subtitle = document.getElementById('subtitle');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const settingsButton = document.getElementById('settingsButton');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const settingsDialog = document.getElementById('settingsDialog');
      const stepIndicator = document.getElementById('stepIndicator');
      const autoModeButton = document.getElementById('autoModeButton');
      const stepModeButton = document.getElementById('stepModeButton');
      const nextStepButton = document.getElementById('nextStepButton');
      const videoModeSwitch = document.getElementById('videoModeSwitch');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const closeSettingsButton = document.getElementById('closeSettingsButton');
      const doneButton = document.getElementById('doneButton');
      const resetButton = document.getElementById('resetButton');

      const state = {
        mode: 'AUTO',
        isPlaying: false,
        currentStep: 0,
        speed: 1,
        videoMode: false,
        transition: null,
        phaseElapsed: 0,
        controlsHidden: false,
        userInteracted: false
      };

      let canvasWidth = 0;
      let canvasHeight = 0;
      let lastTimestamp = 0;
      let animationFrame = 0;
      let resizeObserver = null;
      let closeTimer = 0;

      function updateSubtitles(stepIndex) {
        const item = STEPS[stepIndex];
        subtitle.replaceChildren();
        for (const segment of item.segments) {
          if (segment.emphasis) {
            const span = document.createElement('span');
            span.className = 'subtitle__keyword';
            span.appendChild(document.createTextNode(segment.text));
            subtitle.appendChild(span);
          } else {
            subtitle.appendChild(document.createTextNode(segment.text));
          }
        }
        subtitle.style.animation = 'none';
        void subtitle.offsetWidth;
        subtitle.style.animation = '';
        canvas.setAttribute('aria-label', `Этап ${item.step}: ${item.title}. ${item.detail}. Всего этапов: ${STEPS.length}.`);
      }

      function updateSettingsUI() {
        stepIndicator.textContent = `Шаг ${state.currentStep + 1} / ${STEPS.length}`;
        autoModeButton.setAttribute('aria-pressed', String(state.mode === 'AUTO'));
        stepModeButton.setAttribute('aria-pressed', String(state.mode === 'STEP'));
        nextStepButton.disabled = state.mode !== 'STEP' || Boolean(state.transition) || state.currentStep >= STEPS.length - 1;
        videoModeSwitch.checked = state.videoMode;
        for (const button of speedButtons) {
          button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === state.speed));
        }
        playButton.disabled = state.mode === 'STEP' && !state.transition;
        playIcon.textContent = state.isPlaying ? 'Ⅱ' : '▶';
        playButton.setAttribute('aria-label', state.isPlaying ? 'Пауза' : 'Продолжить');
        playButton.title = state.isPlaying ? 'Пауза' : 'Продолжить';
      }

      function startAuto() {
        state.mode = 'AUTO';
        state.isPlaying = true;
        state.transition = null;
        state.phaseElapsed = 0;
        updateSettingsUI();
      }

      function onStep() {
        if (state.transition) return;
        let nextIndex;
        if (state.mode === 'AUTO') {
          nextIndex = (state.currentStep + 1) % STEPS.length;
        } else {
          if (state.currentStep >= STEPS.length - 1) return;
          nextIndex = state.currentStep + 1;
        }
        const previousIndex = state.currentStep;
        state.currentStep = nextIndex;
        state.transition = { from: previousIndex, to: nextIndex, elapsed: 0, progress: 0 };
        state.phaseElapsed = 0;
        state.isPlaying = true;
        state.userInteracted = true;
        updateSubtitles(state.currentStep);
        updateSettingsUI();
      }

      function update(dt) {
        if (!state.isPlaying) return;
        const scaledDt = dt * state.speed;
        if (state.transition) {
          state.transition.elapsed += scaledDt;
          state.transition.progress = Math.min(1, state.transition.elapsed / DURATION);
          if (state.transition.progress >= 1) {
            state.transition = null;
            if (state.mode === 'AUTO') {
              state.phaseElapsed = 0;
            } else {
              state.isPlaying = false;
            }
            updateSettingsUI();
          }
          return;
        }
        if (state.mode === 'AUTO') {
          state.phaseElapsed += scaledDt;
          if (state.phaseElapsed >= AUTO_INTERVAL) onStep();
        }
      }

      function drawRoundedRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
      }

      function drawIcon(context, type, x, y, size, color, alpha) {
        context.save();
        context.translate(x, y);
        context.scale(size / 24, size / 24);
        context.strokeStyle = color;
        context.globalAlpha = alpha;
        context.lineWidth = 1.7;
        context.lineCap = 'round';
        context.lineJoin = 'round';
        context.beginPath();
        if (type === 0) {
          context.arc(12, 9, 5.5, Math.PI, 0);
          context.lineTo(16, 17);
          context.lineTo(8, 17);
          context.closePath();
          context.moveTo(9, 20); context.lineTo(15, 20);
          context.moveTo(10, 22); context.lineTo(14, 22);
        } else if (type === 1) {
          context.moveTo(4, 6); context.lineTo(20, 6);
          context.moveTo(4, 12); context.lineTo(20, 12);
          context.moveTo(4, 18); context.lineTo(20, 18);
          context.moveTo(9, 3); context.arc(9, 6, 2, -Math.PI / 2, Math.PI / 2);
          context.moveTo(16, 9); context.arc(16, 12, 2, -Math.PI / 2, Math.PI / 2);
          context.moveTo(7, 15); context.arc(7, 18, 2, -Math.PI / 2, Math.PI / 2);
        } else if (type === 2) {
          context.moveTo(8, 5); context.lineTo(18, 12); context.lineTo(8, 19); context.closePath();
        } else if (type === 3) {
          context.moveTo(9, 5); context.lineTo(4, 12); context.lineTo(9, 19);
          context.moveTo(15, 5); context.lineTo(20, 12); context.lineTo(15, 19);
        } else if (type === 4) {
          context.moveTo(12, 3); context.lineTo(21, 8); context.lineTo(12, 13); context.lineTo(3, 8); context.closePath();
          context.moveTo(3, 8); context.lineTo(3, 18); context.lineTo(12, 23); context.lineTo(21, 18); context.lineTo(21, 8);
          context.moveTo(12, 13); context.lineTo(12, 23);
        } else if (type === 5) {
          context.moveTo(4, 12); context.lineTo(9, 12);
          context.moveTo(15, 12); context.lineTo(20, 12);
          context.arc(12, 12, 3, 0, Math.PI * 2);
          context.moveTo(12, 2); context.lineTo(12, 5);
          context.moveTo(12, 19); context.lineTo(12, 22);
        } else if (type === 6) {
          context.arc(10, 10, 6, 0, Math.PI * 2);
          context.moveTo(14.5, 14.5); context.lineTo(21, 21);
        } else {
          context.moveTo(4, 17); context.lineTo(20, 4); context.lineTo(17, 20); context.lineTo(12, 13); context.closePath();
        }
        context.stroke();
        context.restore();
      }

      function getNodePositions(width, height) {
        const landscape = width / Math.max(1, height) > 1.2;
        const columns = landscape ? 4 : 2;
        const rows = STEPS.length / columns;
        const marginX = Math.max(9, Math.min(30, width * 0.035));
        const headerHeight = Math.max(25, Math.min(42, height * 0.09));
        const footerHeight = Math.max(20, Math.min(34, height * 0.07));
        const gapX = Math.max(8, Math.min(20, width * 0.025));
        const gapY = Math.max(7, Math.min(18, height * 0.035));
        const cardWidth = (width - marginX * 2 - gapX * (columns - 1)) / columns;
        const usableHeight = height - headerHeight - footerHeight - gapY * (rows - 1) - 8;
        const cardHeight = usableHeight / rows;
        const top = headerHeight + 4;
        const positions = [];
        for (let index = 0; index < STEPS.length; index++) {
          const row = Math.floor(index / columns);
          const slot = index % columns;
          const column = row % 2 === 0 ? slot : columns - 1 - slot;
          const x = marginX + column * (cardWidth + gapX);
          const y = top + row * (cardHeight + gapY);
          positions.push({ x, y, width: cardWidth, height: cardHeight, cx: x + cardWidth / 2, cy: y + cardHeight / 2 });
        }
        return { positions, headerHeight, footerHeight, landscape };
      }

      function drawConnector(context, a, b, complete, pulse) {
        context.save();
        context.lineWidth = 2;
        context.strokeStyle = complete ? alphaColor(theme.accent, 0.52) : alphaColor(theme.muted, 0.22);
        context.setLineDash([4, 6]);
        context.beginPath();
        context.moveTo(a.cx, a.cy);
        context.lineTo(b.cx, b.cy);
        context.stroke();
        context.setLineDash([]);
        if (pulse > 0 && pulse < 1) {
          const x = a.cx + (b.cx - a.cx) * pulse;
          const y = a.cy + (b.cy - a.cy) * pulse;
          context.shadowColor = theme.glow;
          context.shadowBlur = 12;
          context.fillStyle = theme.accent;
          context.beginPath();
          context.arc(x, y, 4, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }

      function drawCard(context, node, index, currentBlend, done) {
        const x = node.x;
        const y = node.y;
        const w = node.width;
        const h = node.height;
        const blend = Math.max(currentBlend, done ? 0.32 : 0);
        const active = currentBlend > 0.15;
        const borderColor = active ? theme.accent : (done ? alphaColor(theme.accent, 0.42) : alphaColor(theme.muted, 0.20));
        const titleSize = Math.max(10, Math.min(18, w * 0.092));
        const detailSize = Math.max(8.5, Math.min(12, w * 0.061));
        const compact = h < 82;
        const iconSize = compact ? Math.max(14, Math.min(19, h * 0.38)) : Math.max(22, Math.min(34, h * 0.25));
        const iconX = x + (compact ? 19 : 30);
        const iconY = y + h / 2;

        context.save();
        if (active) {
          context.shadowColor = theme.glow;
          context.shadowBlur = 19;
        }
        drawRoundedRect(context, x, y, w, h, compact ? 10 : 16);
        context.fillStyle = alphaColor(theme.panel, 0.94 + blend * 0.06);
        context.fill();
        context.shadowBlur = 0;
        context.lineWidth = active ? 1.7 : 1;
        context.strokeStyle = borderColor;
        context.stroke();

        const iconAlpha = active ? 1 : (done ? 0.8 : 0.48);
        drawIcon(context, index, iconX, iconY, iconSize, active || done ? theme.accent : theme.muted, iconAlpha);

        const textX = x + (compact ? 34 : 56);
        const textWidth = w - (compact ? 42 : 68);
        context.textAlign = 'left';
        context.textBaseline = 'middle';
        context.fillStyle = active ? theme.text : (done ? alphaColor(theme.text, 0.9) : theme.muted);
        context.font = `700 ${titleSize}px system-ui, sans-serif`;
        const title = STEPS[index].title;
        const titleY = compact ? y + h * 0.40 : y + h * 0.43;
        drawWrappedText(context, title, textX, titleY, textWidth, titleSize * 1.15, compact ? 2 : 2);

        context.fillStyle = active ? theme.muted : alphaColor(theme.muted, 0.72);
        context.font = `500 ${detailSize}px system-ui, sans-serif`;
        const detailY = compact ? y + h * 0.75 : y + h * 0.66;
        drawWrappedText(context, STEPS[index].detail, textX, detailY, textWidth, detailSize * 1.22, compact ? 2 : 2);

        if (active) {
          context.fillStyle = theme.accent;
          context.beginPath();
          context.arc(x + w - 10, y + 10, 3, 0, Math.PI * 2);
          context.fill();
        } else if (done) {
          context.fillStyle = alphaColor(theme.accent, 0.85);
          context.beginPath();
          context.arc(x + w - 10, y + 10, 2.5, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }

      function drawWrappedText(context, value, x, y, maxWidth, lineHeight, maxLines) {
        const words = value.split(' ');
        const lines = [];
        let line = '';
        for (const word of words) {
          const test = line ? `${line} ${word}` : word;
          if (line && context.measureText(test).width > maxWidth) {
            lines.push(line);
            line = word;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        const shown = lines.slice(0, maxLines);
        if (lines.length > maxLines && shown.length) {
          let last = shown[shown.length - 1];
          while (last.length && context.measureText(`${last}…`).width > maxWidth) last = last.slice(0, -1);
          shown[shown.length - 1] = `${last}…`;
        }
        const startY = y - ((shown.length - 1) * lineHeight) / 2;
        shown.forEach((part, i) => context.fillText(part, x, startY + i * lineHeight));
      }

      function draw() {
        if (!ctx || !canvasWidth || !canvasHeight) return;
        const width = canvasWidth;
        const height = canvasHeight;
        ctx.clearRect(0, 0, width, height);

        const background = ctx.createLinearGradient(0, 0, width, height);
        background.addColorStop(0, alphaColor(theme.accent, 0.035));
        background.addColorStop(0.55, alphaColor(theme.background, 0));
        background.addColorStop(1, alphaColor(theme.glow, 0.045));
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.strokeStyle = alphaColor(theme.muted, 0.07);
        ctx.lineWidth = 1;
        const grid = Math.max(24, Math.min(42, width * 0.04));
        for (let x = 0; x <= width; x += grid) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y <= height; y += grid) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }
        ctx.restore();

        const layout = getNodePositions(width, height);
        const positions = layout.positions;
        const activeTransition = state.transition;
        let activeFrom = state.currentStep;
        let activeTo = state.currentStep;
        let transitionProgress = 1;
        if (activeTransition) {
          activeFrom = activeTransition.from;
          activeTo = activeTransition.to;
          transitionProgress = activeTransition.progress;
        }

        for (let i = 0; i < positions.length - 1; i++) {
          let pulse = 0;
          if (state.mode === 'AUTO' && state.isPlaying && !activeTransition && i === state.currentStep) {
            pulse = Math.min(0.94, state.phaseElapsed / AUTO_INTERVAL);
          } else if (activeTransition && i === activeFrom) {
            pulse = transitionProgress;
          }
          const completed = i < state.currentStep && !(activeTransition && i === activeFrom);
          drawConnector(ctx, positions[i], positions[i + 1], completed, pulse);
        }

        for (let i = 0; i < positions.length; i++) {
          let blend = i === state.currentStep ? 1 : 0;
          if (activeTransition && i === activeFrom) blend = 1 - transitionProgress;
          if (activeTransition && i === activeTo) blend = transitionProgress;
          drawCard(ctx, positions[i], i, blend, i < state.currentStep && i !== activeFrom);
        }

        const activeNode = positions[state.currentStep];
        if (activeNode) {
          const pulse = 0.5 + Math.sin(performance.now() / 420) * 0.5;
          ctx.save();
          ctx.globalAlpha = 0.28 + pulse * 0.25;
          ctx.strokeStyle = theme.accent;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(activeNode.cx, activeNode.cy, Math.min(activeNode.width, activeNode.height) * (0.42 + pulse * 0.025), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        const progressWidth = width * 0.42;
        const progressX = (width - progressWidth) / 2;
        const progressY = height - Math.max(12, layout.footerHeight * 0.55);
        drawRoundedRect(ctx, progressX, progressY, progressWidth, 4, 2);
        ctx.fillStyle = alphaColor(theme.muted, 0.18); ctx.fill();
        const progress = (state.currentStep + (activeTransition ? transitionProgress : 0)) / STEPS.length;
        drawRoundedRect(ctx, progressX, progressY, progressWidth * Math.min(1, progress), 4, 2);
        ctx.fillStyle = theme.accent; ctx.fill();

        ctx.save();
        ctx.font = `600 ${Math.max(9, Math.min(12, width * 0.014))}px system-ui, sans-serif`;
        ctx.fillStyle = theme.muted;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('ПРОИЗВОДСТВЕННЫЙ ЦИКЛ', 10, 7);
        ctx.textAlign = 'right';
        ctx.fillText(`${state.currentStep + 1} / ${STEPS.length}`, width - 10, 7);
        ctx.restore();
      }

      function resize() {
        const rect = visual.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        canvasWidth = rect.width;
        canvasHeight = rect.height;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function openSettings() {
        window.clearTimeout(closeTimer);
        modalBackdrop.hidden = false;
        updateSettingsUI();
        requestAnimationFrame(() => modalBackdrop.classList.add('is-open'));
        closeSettingsButton.focus();
      }

      function closeSettings() {
        if (modalBackdrop.hidden) return;
        modalBackdrop.classList.remove('is-open');
        window.clearTimeout(closeTimer);
        closeTimer = window.setTimeout(() => {
          modalBackdrop.hidden = true;
          settingsButton.focus();
        }, 190);
      }

      function setMode(mode) {
        if (mode === state.mode) return;
        state.userInteracted = true;
        if (mode === 'STEP') {
          if (state.transition) state.transition = null;
          state.mode = 'STEP';
          state.isPlaying = false;
          state.phaseElapsed = 0;
        } else {
          startAuto();
        }
        updateSettingsUI();
        draw();
      }

      function setSpeed(speed) {
        if (![0.5, 1, 2].includes(speed)) return;
        state.speed = speed;
        updateSettingsUI();
      }

      function toggleVideoMode() {
        state.videoMode = !state.videoMode;
        appLayout.classList.toggle('video-mode', state.videoMode);
        videoModeSwitch.checked = state.videoMode;
        requestAnimationFrame(resize);
      }

      function reset() {
        state.userInteracted = true;
        state.mode = 'AUTO';
        state.currentStep = 0;
        state.transition = null;
        state.phaseElapsed = 0;
        state.isPlaying = true;
        updateSubtitles(0);
        updateSettingsUI();
        draw();
      }

      function togglePlay() {
        if (state.mode === 'STEP' && !state.transition) return;
        state.userInteracted = true;
        state.isPlaying = !state.isPlaying;
        updateSettingsUI();
      }

      function handleInput(event) {
        const target = event.target;
        const editing = target instanceof HTMLElement && (
          target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)
        );
        if (editing) return;
        if (!window.matchMedia('(min-width: 768px)').matches) return;

        const key = event.key;
        if (key === 'Escape') {
          if (!modalBackdrop.hidden) {
            event.preventDefault();
            closeSettings();
          }
          return;
        }
        if (!modalBackdrop.hidden) return;

        if (key === ' ') {
          event.preventDefault();
          state.controlsHidden = !state.controlsHidden;
          appLayout.classList.toggle('controls-hidden', state.controlsHidden);
        } else if (key === 'ArrowRight') {
          if (state.mode === 'STEP') {
            event.preventDefault();
            onStep();
          }
        } else if (key.toLowerCase() === 'r') {
          reset();
        } else if (key.toLowerCase() === 's') {
          setMode(state.mode === 'AUTO' ? 'STEP' : 'AUTO');
        } else if (key.toLowerCase() === 'v') {
          toggleVideoMode();
        }
      }

      function bindEvents() {
        playButton.addEventListener('click', togglePlay);
        settingsButton.addEventListener('click', () => {
          if (modalBackdrop.hidden) openSettings();
          else closeSettings();
        });
        closeSettingsButton.addEventListener('click', closeSettings);
        doneButton.addEventListener('click', closeSettings);
        modalBackdrop.addEventListener('click', event => {
          if (event.target === modalBackdrop) closeSettings();
        });
        settingsDialog.addEventListener('click', event => event.stopPropagation());
        autoModeButton.addEventListener('click', () => setMode('AUTO'));
        stepModeButton.addEventListener('click', () => setMode('STEP'));
        nextStepButton.addEventListener('click', onStep);
        resetButton.addEventListener('click', reset);
        videoModeSwitch.addEventListener('change', () => {
          if (videoModeSwitch.checked !== state.videoMode) toggleVideoMode();
        });
        for (const button of speedButtons) {
          button.addEventListener('click', () => setSpeed(Number(button.dataset.speed)));
        }
        window.addEventListener('keydown', handleInput);
        window.addEventListener('resize', resize, { passive: true });
        if ('ResizeObserver' in window) {
          resizeObserver = new ResizeObserver(resize);
          resizeObserver.observe(visual);
        }
      }

      function init() {
        if (!ctx) {
          subtitle.textContent = 'Не удалось инициализировать визуализацию в этом браузере.';
          playButton.disabled = true;
          return;
        }
        bindEvents();
        resize();
        updateSubtitles(0);
        state.mode = 'AUTO';
        state.currentStep = 0;
        state.isPlaying = false;
        updateSettingsUI();
        animationFrame = window.requestAnimationFrame(loop);
        window.setTimeout(() => {
          if (!state.userInteracted) {
            state.isPlaying = true;
            updateSettingsUI();
          }
        }, AUTO_START_DELAY);
      }

      function loop(timestamp) {
        const dt = lastTimestamp ? Math.min(100, timestamp - lastTimestamp) : 0;
        lastTimestamp = timestamp;
        update(dt);
        draw();
        animationFrame = window.requestAnimationFrame(loop);
      }

      window.addEventListener('pagehide', () => {
        if (animationFrame) window.cancelAnimationFrame(animationFrame);
        if (resizeObserver) resizeObserver.disconnect();
      }, { once: true });

      init();
    })();
  </script>
</body>
</html>
