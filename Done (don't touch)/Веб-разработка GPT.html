      }

      /* Requires theme.css generated from config/palette.json. */
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        color: var(--ui-text);
        background: var(--ui-bg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      #ambient {
        position: fixed;
        inset: -10%;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }

      #ambient i {
        position: absolute;
        border-radius: 50%;
        filter: blur(var(--ui-ambient-blur));
      }

      #ambient .b1 {
        width: 46vmin;
        height: 46vmin;
        left: -6%;
        top: 8%;
        background: var(--ui-accent-ambient-1);
        animation: drift 9s ease-in-out infinite alternate;
      }

      #ambient .b2 {
        width: 40vmin;
        height: 40vmin;
        right: -4%;
        top: 38%;
        background: var(--ui-accent-ambient-2);
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }

      #ambient .b3 {
        width: 52vmin;
        height: 52vmin;
        left: 16%;
        bottom: -8%;
        background: var(--ui-accent-ambient-3);
        animation: drift 13s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vmin, -5vmin) scale(1.12);
        }
      }

      body.v916 #ambient {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #ambient .b1,
        #ambient .b2,

          animation: none;

        padding: max(16px, env(safe-area-inset-top, 0px)) 16px

        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);

      #modalWrap.open {
        display: flex;
      }

        width: min(92vw, 380px);

        max-height: 82dvh;

        color: var(--ui-text);

        outline: none;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      #modal button {
        font-family: inherit;
        color: var(--ui-text);
        cursor: pointer;
      }

      .modal-close {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
      }

      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .mhead h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }

      .mstep {
        color: var(--ui-muted);

        font-weight: 700;
        margin-bottom: 12px;
      }

      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      .seg button {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-border-soft);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }

      .seg button.active {
        background: linear-gradient(
          135deg,
          var(--ui-accent),
          var(--ui-accent-dark)
        );
        border-color: transparent;
        box-shadow: 0 4px 14px var(--ui-accent-shadow);
      }

      #mNext {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-accent-soft);
        border: 1px solid var(--ui-accent-border);
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
        transition:
          background 0.2s,
          opacity 0.2s;
      }

      #mNext:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      #mNext:not(:disabled):hover {
        background: var(--ui-accent-soft-hover);
      }

      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .mlabel {
        flex: 1;
        color: var(--ui-label);
        font-size: 14px;
        font-weight: 700;
      }

      #mSpeed {
        flex: 1.4;
        accent-color: var(--ui-accent);
        min-width: 80px;
      }

      #mSpeedVal {
        min-width: 34px;
        color: var(--ui-text);
        text-align: right;
        font-size: 14px;
        font-weight: 800;
      }

      .sw {
        position: relative;
        display: inline-block;
        flex: 0 0 52px;
        width: 52px;
        height: 30px;
      }

      .sw input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .sw span {
        position: absolute;
        inset: 0;
        background: var(--ui-white-12);
        border-radius: 999px;
        transition: background 0.25s;
        pointer-events: none;
      }

      .sw span::before {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        left: 3px;
        top: 3px;
        background: var(--ui-text);
        border-radius: 50%;
        transition: transform 0.25s;
      }

      .sw input:checked + span {
        background: var(--ui-accent);
      }

      .sw input:checked + span::before {
        transform: translateX(22px);
      }

      .sw input:focus-visible + span {
        outline: 2px solid var(--ui-text);
        outline-offset: 3px;
      }

      #mReset {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        color: var(--ui-text);
        background: var(--ui-white-06);
        border: 1px solid var(--ui-white-14);

        font-size: 14px;
        font-weight: 800;
        margin-bottom: 14px;
        transition: border-color 0.2s;

      #mReset:hover {
        border-color: var(--ui-danger-hover-border);
      }

      .keys {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;

      .keys span {

        border: 1px solid var(--ui-border-soft);
        border-radius: 6px;
        font-weight: 800;
      }

      .keys i {
        font-style: normal;
      }

      body.modal-open {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        #modal {
          animation: none;
        }
      }

      /* Layout, accessibility and the Web Development visualization. */

        z-index: 1;

        grid-template-rows: auto minmax(0, 1fr);

      }

        min-height: 0;

        grid-column: 2;
        grid-row: 2;
        align-self: end;
        display: flex;
        justify-content: flex-start;

        min-height: 56px;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .control-button {
        display: inline-grid;
        place-items: center;
        flex: 0 0 56px;
        width: 56px;
        height: 56px;

        background: var(--ui-panel);
        box-shadow: 0 8px 24px var(--ui-surface-inset);

      .control-button:disabled {
        opacity: 0.38;
        cursor: not-allowed;
        box-shadow: none;
      }
      .control-button:not(:disabled):active {
        transform: scale(0.96);
      }
      .control-button svg {
        width: 23px;
        height: 23px;

      #modal button:focus-visible,

      }

        opacity: 0;
        pointer-events: none;

      }
      #modal {
        max-height: 90dvh;
      }
      #modal .seg button {

      #modal .modal-close {

      }
      #modal #mReset {

      #modal #mSpeed {
        flex: 1.4;
        min-width: 90px;

        padding: 0 10px;

        background: var(--ui-panel);
        border: 1px solid var(--ui-border-soft);

      #modal .sw span {

      #modalWrap.closing {

      @keyframes scrimOut {
        to {
          opacity: 0;
        }
      }
      @keyframes popOut {
        to {
          opacity: 0;

      #workspace.video-mode {

        justify-content: center;
        margin: 0;

  <body>
    <!-- Ambient background component -->
    <div id="ambient" aria-hidden="true">
      <i class="b1"></i>
      <i class="b2"></i>
      <i class="b3"></i>
    </div>

    <div class="app-shell">
      <header>
        <h1 class="topic-title">Веб-разработка</h1>
      </header>
      <main
        id="workspace"
        aria-label="Интерактивная визуализация веб-разработки"
      >
        <section
          id="visualizer"
          aria-label="Анимированная схема работы веб-технологий"
        >
          <canvas
            id="sceneCanvas"
            role="img"
            aria-label="Схема взаимодействия браузера, веб-технологий и сервера"
          ></canvas>
        </section>
        <div id="subtitle" aria-live="polite" aria-atomic="true">
          <span class="subtitle__text" id="subtitleText"
            >Браузер запрашивает сайт, используя DNS и HTTP.</span
          >
        </div>
        <div id="controls" aria-label="Управление воспроизведением">
          <button
            id="playPause"
            class="control-button primary"
            type="button"
            aria-label="Пауза"
            title="Воспроизведение или пауза"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 5v14M17 5v14"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            class="control-button js-gear"
            type="button"
            aria-label="Открыть настройки"
            title="Настройки"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 8.1a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Zm0-5.1 1.1 1.8 2.1.5 1.8-1 1.6 1.6-1 1.8.5 2.1L20 11v2l-1.9 1.1-.5 2.1 1 1.8-1.6 1.6-1.8-1-2.1.5L12 21h-2l-1.1-1.9-2.1-.5-1.8 1-1.6-1.6 1-1.8-.5-2.1L2 13v-2l1.9-1.1.5-2.1-1-1.8L5 4.4l1.8 1 2.1-.5L10 3h2Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </main>
    </div>
    <!-- Settings modal component. The content is the settings layout from the source UI. -->
    <div id="modalWrap" aria-hidden="true">
      <section
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <header class="mhead">
          <h2 id="modalTitle">Настройки</h2>
          <button
            class="modal-close"
            id="mClose"
            type="button"
            data-modal-close
            aria-label="Закрыть"
          >

    <script>
      /*
       * Small interaction controller for the generated settings modal.
       * Emits document events so application-specific behavior stays outside this template.
       * Events: settings:mode, settings:next-step, settings:speed,
       *         settings:video-mode, settings:reset.
       */
      (function (global) {
        "use strict";

        function initSettingsModal(options) {
          const config = Object.assign(
            {
              overlaySelector: "#modalWrap",
              dialogSelector: "#modal",
              openSelector: ".js-gear",
              closeSelector: "[data-modal-close]",
            },
            options || {},
          );

          const overlay = document.querySelector(config.overlaySelector);
          if (!overlay)
            throw new Error(
              "Settings modal overlay not found: " + config.overlaySelector,
            );

          const dialog =
            overlay.querySelector(config.dialogSelector) ||
            overlay.querySelector('[role="dialog"]');
          if (!dialog) throw new Error("Settings modal dialog not found.");

          const openers = Array.from(
            document.querySelectorAll(config.openSelector),
          );
          const closers = Array.from(
            overlay.querySelectorAll(config.closeSelector),
          );
          let previouslyFocused = null;
          let closeTimer = null;

          function open() {
            if (closeTimer) {
              clearTimeout(closeTimer);
              closeTimer = null;
            }
            if (
              overlay.classList.contains("open") &&
              !overlay.classList.contains("closing")
            )
              return;
            previouslyFocused = document.activeElement;
            overlay.classList.remove("closing");
            overlay.classList.add("open");
            overlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("modal-open");
            dialog.focus();
          }

          function close() {
            if (
              !overlay.classList.contains("open") ||
              overlay.classList.contains("closing")
            )
              return;
            overlay.classList.add("closing");
            document.body.classList.remove("modal-open");
            closeTimer = setTimeout(() => {
              overlay.classList.remove("open", "closing");
              overlay.setAttribute("aria-hidden", "true");
              closeTimer = null;
              if (
                previouslyFocused &&
                typeof previouslyFocused.focus === "function"
              ) {
                previouslyFocused.focus();
              }
            }, 180);
          }

          function toggle() {
            overlay.classList.contains("open") &&
            !overlay.classList.contains("closing")
              ? close()
              : open();
          }

          openers.forEach((button) => button.addEventListener("click", toggle));
          closers.forEach((button) => button.addEventListener("click", close));

          overlay.addEventListener("click", (event) => {
            if (event.target === overlay) close();
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && overlay.classList.contains("open")) {
              close();
            }
          });

          overlay.querySelectorAll("[data-mode]").forEach((button) => {
            button.addEventListener("click", () => {
              const mode = button.dataset.mode;
              overlay.querySelectorAll("[data-mode]").forEach((item) => {
                const active = item === button;
                item.classList.toggle("active", active);
                item.setAttribute("aria-pressed", String(active));
              });
              const next = overlay.querySelector(
                '[data-modal-action="next-step"]',
              );
              if (next) next.disabled = mode !== "step";
              overlay.dispatchEvent(
                new CustomEvent("settings:mode", { detail: { mode } }),
              );
            });
          });

          overlay
            .querySelectorAll('[data-modal-action="next-step"]')
            .forEach((button) => {
              button.addEventListener("click", () => {
                overlay.dispatchEvent(new CustomEvent("settings:next-step"));
              });
            });

          const speed = overlay.querySelector("#mSpeed");
          const speedValue = overlay.querySelector("#mSpeedVal");
          if (speed) {
            speed.addEventListener("input", () => {
              if (speedValue) speedValue.textContent = speed.value + "x";
              overlay.dispatchEvent(
                new CustomEvent("settings:speed", {
                  detail: { value: Number(speed.value) },
                }),
              );
            });
          }

          const videoMode = overlay.querySelector(
            '[data-modal-toggle="video-mode"]',
          );
          if (videoMode) {
            videoMode.addEventListener("change", () => {
              overlay.dispatchEvent(
                new CustomEvent("settings:video-mode", {
                  detail: { enabled: videoMode.checked },
                }),
              );
            });
          }

          overlay
            .querySelectorAll('[data-modal-action="reset"]')
            .forEach((button) => {
              button.addEventListener("click", () => {
                overlay.dispatchEvent(new CustomEvent("settings:reset"));
              });
            });

          return {
            open,
            close,
            toggle,
            setStepText(text) {
              const target = overlay.querySelector("#mStepTxt");
              if (target) target.textContent = text;
            },
            setMode(mode) {
              const target = overlay.querySelector(
                '[data-mode="' + mode + '"]',
              );
              if (target) target.click();
            },
            setSpeed(value) {
              if (!speed) return;
              speed.value = String(value);
              speed.dispatchEvent(new Event("input", { bubbles: true }));
            },
            setVideoMode(enabled) {
              if (!videoMode) return;
              videoMode.checked = Boolean(enabled);
              videoMode.dispatchEvent(new Event("change", { bubbles: true }));
            },
          };
        }

        global.SettingsModal = { init: initSettingsModal };
      })(window);
    </script>

        function updateSubtitles(stepIndex) {
          const data = steps[stepIndex];
          const fragment = document.createDocumentFragment();
          data.segments.forEach((segment) => {
            if (segment.emphasis) {
              const span = document.createElement("span");
              span.className = "subtitle__keyword";
              span.textContent = segment.text;
              fragment.appendChild(span);
            } else {
              fragment.appendChild(document.createTextNode(segment.text));
            }
          });
          els.subtitleText.replaceChildren(fragment);
          els.subtitle.setAttribute(
            "aria-label",
            data.segments.map((s) => s.text).join(""),
          );
          if (settingsModal)
            settingsModal.setStepText(`Шаг ${data.step} / ${steps.length}`);
        }

        function syncModalState() {
          document.querySelectorAll("#modal [data-mode]").forEach((button) => {
            const active = button.dataset.mode === state.mode;
            button.classList.toggle("active", active);
            button.setAttribute("aria-pressed", String(active));
          });
          els.modalNext.disabled =
            state.mode !== "step" ||
            state.isTransitioning ||
            state.currentStep >= steps.length - 1;
          els.modalStep.textContent = `Шаг ${state.currentStep + 1} / ${steps.length}`;
          els.modalSpeed.value = String(state.speed);
          els.modalNine.checked = state.videoMode;
        }

        function renderControls() {
          const playing = state.isPlaying;
          els.play.innerHTML = playing
            ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M17 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" fill="currentColor"/></svg>';
          els.play.setAttribute(
            "aria-label",
            playing ? "Пауза" : "Воспроизвести",
          );
          els.play.disabled = state.mode === "step" && !state.isTransitioning;
          els.controls.classList.toggle(
            "controls-hidden",
            !state.controlsVisible,
          );
          syncModalState();
        }

        function updateInterface() {
          updateSubtitles(state.currentStep);
          renderControls();
          els.workspace.classList.toggle("video-mode", state.videoMode);
          document.body.classList.toggle("v916", state.videoMode);
          requestAnimationFrame(syncVideoOverlay);
        }

        function applyMode(mode) {
          if (mode !== "auto" && mode !== "step") return;
          if (mode === state.mode) {
            syncModalState();
            return;
          }
          if (state.mode === "auto" && mode === "step") {
            state.elapsed = STEP_DURATION_MS;
            state.isPlaying = false;
            state.isTransitioning = false;
          } else if (state.mode === "step" && mode === "auto") {
            state.elapsed = 0;
            state.isPlaying = true;
            state.isTransitioning = true;
          }
          state.mode = mode;
          updateInterface();
        }

        function nextStep() {
          if (
            state.mode !== "step" ||
            state.isTransitioning ||
            state.currentStep >= steps.length - 1
          )
            return;
          state.currentStep += 1;
          state.elapsed = 0;
          state.isTransitioning = true;
          state.isPlaying = true;
          updateInterface();
        }

        function setSpeed(value) {
          const allowed = [0.5, 1, 2];
          state.speed = allowed.includes(value) ? value : 1;
          syncModalState();
        }

        function toggleVideoMode() {
          state.videoMode = !state.videoMode;
          updateInterface();
          resize();
        }

        function reset() {
          state.mode = "auto";
          state.currentStep = 0;
          state.elapsed = 0;
          state.isTransitioning = true;
          state.isPlaying = true;
          updateInterface();
        }

        function setPlaying() {
          if (state.mode === "step" && !state.isTransitioning) return;
          state.isPlaying = !state.isPlaying;
          renderControls();
        }

        function update(dt) {
          if (!state.isPlaying) return;
          state.elapsed += dt * 1000 * state.speed;
          if (state.elapsed < STEP_DURATION_MS) return;
          if (state.mode === "auto") {
            const passed = Math.floor(state.elapsed / STEP_DURATION_MS);
            state.currentStep = (state.currentStep + passed) % steps.length;
            state.elapsed %= STEP_DURATION_MS;
            state.isTransitioning = true;
            updateSubtitles(state.currentStep);
            syncModalState();
          } else {
            state.elapsed = STEP_DURATION_MS;
            state.isPlaying = false;
            state.isTransitioning = false;
            renderControls();
          }
        }

        function drawBackground(worldWidth, worldHeight) {
          ctx.fillStyle = colors.bg;
          ctx.fillRect(0, 0, worldWidth, worldHeight);
          ctx.save();
          ctx.globalAlpha = 0.22;
          ctx.strokeStyle = colors.faint;
          ctx.lineWidth = 1;
          for (let x = 40; x < worldWidth; x += 60) {
            for (let y = 40; y < worldHeight; y += 60) {
              ctx.beginPath();
              ctx.arc(x, y, 1.5, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function draw() {
          if (!cssWidth || !cssHeight) return;
          ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          ctx.clearRect(0, 0, cssWidth, cssHeight);
          const portraitLayout = cssHeight > cssWidth * 1.05;
          const worldWidth = portraitLayout ? PORTRAIT_W : SCENE_W;
          const worldHeight = portraitLayout ? PORTRAIT_H : SCENE_H;
          const scale = Math.min(
            cssWidth / worldWidth,
            cssHeight / worldHeight,
          );
          const x = (cssWidth - worldWidth * scale) / 2;
          const y = (cssHeight - worldHeight * scale) / 2;
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);
          drawBackground(worldWidth, worldHeight);
          const rawProgress = Math.max(
            0,
            Math.min(1, state.elapsed / STEP_DURATION_MS),
          );
          const progress = window.matchMedia("(prefers-reduced-motion: reduce)")
            .matches
            ? 1
            : 1 - Math.pow(1 - rawProgress, 3);
          (portraitLayout ? portraitSceneDrawers : sceneDrawers)[
            state.currentStep
          ](progress);
          ctx.restore();
        }

        function syncVideoOverlay() {
          if (!state.videoMode) return;
          const stageRect = els.stage.getBoundingClientRect();
          const workRect = els.workspace.getBoundingClientRect();
          els.workspace.style.setProperty(
            "--frame-left",
            `${stageRect.left - workRect.left}px`,
          );
          els.workspace.style.setProperty(
            "--frame-width",
            `${stageRect.width}px`,
          );
          els.workspace.style.setProperty(
            "--frame-bottom-gap",
            `${workRect.bottom - stageRect.bottom}px`,
          );
        }

        function resize() {
          if (state.videoMode) {
            const workRect = els.workspace.getBoundingClientRect();
            const frameWidth = Math.min(
              workRect.width,
              (workRect.height * 9) / 16,
            );
            const frameHeight = (frameWidth * 16) / 9;
            els.stage.style.width = `${frameWidth}px`;
            els.stage.style.height = `${frameHeight}px`;
          } else {
            els.stage.style.width = "";
            els.stage.style.height = "";
          }
          const rect = els.stage.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          cssWidth = rect.width;
          cssHeight = rect.height;
          pixelRatio = Math.max(1, window.devicePixelRatio || 1);
          els.canvas.width = Math.round(cssWidth * pixelRatio);
          els.canvas.height = Math.round(cssHeight * pixelRatio);
          els.canvas.style.width = `${cssWidth}px`;
          els.canvas.style.height = `${cssHeight}px`;
          draw();
          syncVideoOverlay();
        }

        function openSettings() {
          if (settingsModal) settingsModal.open();
        }
        function closeSettings() {
          if (settingsModal) settingsModal.close();
        }

        function handleInput(event) {
          const target = event.target;
          const editable =
            target instanceof HTMLElement &&
            (target.isContentEditable ||
              target.matches("input, textarea, select") ||
              target.closest('[contenteditable="true"]'));
          if (editable || event.altKey || event.ctrlKey || event.metaKey)
            return;

          if (event.key === "Escape") {
            if (els.modalWrap.classList.contains("open")) {
              event.preventDefault();
              closeSettings();
            }
            return;
          }
          if (
            window.matchMedia("(max-width: 767px)").matches ||
            els.modalWrap.classList.contains("open")
          )
            return;
          if (target instanceof HTMLElement && target.closest("button, a"))
            return;

          switch (event.key) {
            case " ":
              event.preventDefault();
              state.controlsVisible = !state.controlsVisible;
              renderControls();
              break;
            case "ArrowRight":
              if (state.mode === "step") {
                event.preventDefault();
                nextStep();
              }
              break;
            case "r":
            case "R":
              event.preventDefault();
              reset();
              break;
            case "s":
            case "S":
              event.preventDefault();
              applyMode(state.mode === "auto" ? "step" : "auto");
              break;
            case "v":
            case "V":
              event.preventDefault();
              toggleVideoMode();
              break;
          }
        }

        function init() {
          if (!els.stage || !els.canvas || !els.subtitle || !els.controls)
            throw new Error("Не найдены обязательные элементы интерфейса.");
          settingsModal = window.SettingsModal.init();
          els.modalWrap.addEventListener("settings:mode", (event) =>
            applyMode(event.detail.mode),
          );
          els.modalWrap.addEventListener("settings:next-step", nextStep);
          els.modalWrap.addEventListener("settings:speed", (event) =>
            setSpeed(Number(event.detail.value)),
          );
          els.modalWrap.addEventListener("settings:video-mode", (event) => {
            if (state.videoMode !== Boolean(event.detail.enabled))
              toggleVideoMode();
          });
          els.modalWrap.addEventListener("settings:reset", reset);
          els.play.addEventListener("click", setPlaying);
          document.addEventListener("keydown", handleInput);
          window.addEventListener("resize", resize, { passive: true });
          if ("ResizeObserver" in window) {
            resizeObserver = new ResizeObserver(resize);
            resizeObserver.observe(els.stage);
            resizeObserver.observe(els.workspace);
          }
          updateSubtitles(state.currentStep);
          renderControls();
          resize();
          requestAnimationFrame(syncVideoOverlay);
          window.setTimeout(() => {
            state.isPlaying = true;
            state.isTransitioning = true;
            renderControls();
          }, 500);
          requestAnimationFrame(loop);
        }

        function loop(timestamp) {
          if (!lastFrame) lastFrame = timestamp;
          const dt = (timestamp - lastFrame) / 1000;
          lastFrame = timestamp;
          update(dt);
          draw();
          requestAnimationFrame(loop);
        }

        try {
          init();
        } catch (error) {
          console.error("Ошибка инициализации интерактива:", error);
          els.subtitleText.textContent =
            "Не удалось запустить визуализацию. Обновите страницу или откройте её в современном браузере.";
        }
      })();
    </script>
  </body>
</html>
