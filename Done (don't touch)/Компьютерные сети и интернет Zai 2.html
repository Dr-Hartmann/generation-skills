<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Компьютерные сети и интернет</title>
    <style>
      :root {
        --bg: #0f0f13;
        --panel: #1a1a20;
        --accent: #2eac65;
        --accent-deep: #1e7a47;
        --text: #ffffff;
        --muted: #a0a0a0;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        height: 100vh;
        height: 100dvh;
      }
      body {
        margin: 0;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 12px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.38;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: calc(16px + env(safe-area-inset-top))
          calc(80px + env(safe-area-inset-right))
          calc(25vh + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
      }
      .stage {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .topic h1 {
        margin: 0;
        font-size: clamp(19px, 1.4vw + 13px, 27px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: 0.01em;
      }
      .viz {
        position: relative;
        flex: 1;
        min-height: 0;
        margin-top: 12px;
        border-radius: 18px;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .slot:empty {
        display: none !important;
      }
      .sidebar {
        display: none;
      }
      .subSlotMobile {
        margin-top: 14px;
      }
      .panelSlotMobile {
        margin-top: 24px;
      }
      .panelSlotStage {
        display: none;
      }
      .subtitle {
        background: rgba(0, 0, 0, 0.5);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border-radius: 14px;
        padding: 12px 16px;
        font-size: clamp(16px, 4.5vw, 22px);
        font-weight: 700;
        line-height: 1.35;
        color: var(--text);
        text-align: center;
        min-height: 5.1em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .subtitle__text {
        display: block;
        min-width: 0;
      }
      .subtitle__keyword {
        color: var(--accent);
      }
      .subtitle--enter {
        animation: subIn 0.32s ease;
      }
      @keyframes subIn {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .panel {
        display: flex;
        gap: 14px;
        justify-content: center;
        transition: opacity 0.25s ease;
      }
      .ctlBtn {
        width: 56px;
        height: 56px;
        min-width: 48px;
        min-height: 48px;
        border-radius: 16px;
        background: rgba(26, 26, 32, 0.85);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(160, 160, 160, 0.18);
        display: grid;
        place-items: center;
        transition:
          border-color 0.2s ease,
          transform 0.15s ease,
          background 0.2s ease;
      }
      .ctlBtn:hover {
        border-color: rgba(46, 172, 101, 0.65);
      }
      .ctlBtn:active {
        transform: scale(0.94);
      }
      .ctlBtn svg {
        width: 26px;
        height: 26px;
        fill: var(--text);
      }
      .ctlBtn.small {
        width: 48px;
        height: 48px;
        border-radius: 14px;
      }
      .ctlBtn.small svg {
        width: 22px;
        height: 22px;
      }
      .icoPause {
        display: none;
      }
      .panel.is-playing .icoPlay {
        display: none;
      }
      .panel.is-playing .icoPause {
        display: block;
      }
      body.ui-hidden .panel {
        opacity: 0;
        pointer-events: none;
      }
      .frameWrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frameWrap[hidden] {
        display: none;
      }
      .frameGlow {
        position: absolute;
        width: 52%;
        height: 52%;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
      }
      .frameGlowA {
        left: 6%;
        top: 8%;
        background: var(--accent);
        opacity: 0.14;
      }
      .frameGlowB {
        right: 4%;
        bottom: 6%;
        background: var(--accent-deep);
        opacity: 0.18;
      }
      .frame {
        position: relative;
        background: rgba(26, 26, 32, 0.55);
        border: 1px solid rgba(46, 172, 101, 0.4);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 0 44px rgba(30, 122, 71, 0.35);
      }
      .frameCanvas {
        position: absolute;
        inset: 0;
      }
      .frameSub {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 88px;
      }
      .frameSub .subtitle {
        min-height: 4.2em;
      }
      .frameCtrl {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(15, 15, 19, 0.66);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
      }
      .backdrop--open {
        opacity: 1;
        pointer-events: auto;
      }
      .settings {
        position: fixed;
        z-index: 50;
        display: flex;
        flex-direction: column;
        left: calc(16px + env(safe-area-inset-left));
        right: calc(80px + env(safe-area-inset-right));
        top: 50%;
        transform: translateY(-50%) scale(0.95);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          transform 0.22s ease,
          visibility 0s linear 0.22s;
        background: rgba(26, 26, 32, 0.97);
        border: 1px solid rgba(160, 160, 160, 0.16);
        border-radius: 20px;
        max-height: min(90dvh, 660px);
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      .settings--open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(-50%) scale(1);
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }
      .settingsHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px 12px;
        border-bottom: 1px solid rgba(160, 160, 160, 0.14);
      }
      .settingsHead h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
      }
      .settingsBody {
        padding: 12px 18px 18px;
        overflow: auto;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
      }
      .rowLabel {
        color: var(--muted);
        font-weight: 700;
        font-size: 15px;
      }
      .stepValue {
        font-weight: 800;
      }
      .seg {
        display: flex;
        background: rgba(15, 15, 19, 0.7);
        border: 1px solid rgba(160, 160, 160, 0.16);
        border-radius: 12px;
        padding: 3px;
        gap: 3px;
      }
      .seg button {
        min-width: 48px;
        min-height: 48px;
        padding: 0 14px;
        border-radius: 9px;
        font-weight: 800;
        color: var(--muted);
        transition:
          background 0.18s ease,
          color 0.18s ease;
      }
      .seg button.is-active {
        background: rgba(46, 172, 101, 0.22);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(46, 172, 101, 0.6);
      }
      .accentBtn,
      .ghostBtn {
        min-height: 48px;
        width: 100%;
        border-radius: 12px;
        font-weight: 800;
        transition: background 0.18s ease;
      }
      .accentBtn {
        background: rgba(46, 172, 101, 0.2);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(46, 172, 101, 0.65);
      }
      .accentBtn:not(:disabled):hover {
        background: rgba(46, 172, 101, 0.3);
      }
      .ghostBtn {
        background: rgba(160, 160, 160, 0.1);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(160, 160, 160, 0.2);
      }
      .ghostBtn:hover {
        background: rgba(160, 160, 160, 0.16);
      }
      .switch {
        display: grid;
        place-items: center;
        width: 64px;
        height: 48px;
        border-radius: 12px;
      }
      .switchTrack {
        width: 52px;
        height: 30px;
        border-radius: 15px;
        background: rgba(160, 160, 160, 0.25);
        position: relative;
        transition: background 0.2s ease;
      }
      .switchThumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--text);
        transition: left 0.2s ease;
      }
      .switch[aria-checked="true"] .switchTrack {
        background: rgba(46, 172, 101, 0.5);
      }
      .switch[aria-checked="true"] .switchThumb {
        left: 25px;
      }
      .keys {
        margin-top: 10px;
        padding-top: 12px;
        border-top: 1px solid rgba(160, 160, 160, 0.14);
      }
      .keys h3 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 800;
        color: var(--muted);
      }
      .keyRow {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 5px 0;
        color: var(--muted);
        font-size: 14px;
      }
      .keyRow kbd {
        min-width: 56px;
        text-align: center;
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(15, 15, 19, 0.8);
        box-shadow: inset 0 0 0 1px rgba(160, 160, 160, 0.25);
        font-family: inherit;
        font-weight: 800;
        color: var(--text);
        font-size: 13px;
      }
      .fatal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--bg);
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
      }
      .fatal[hidden] {
        display: none;
      }
      @media (min-width: 768px) {
        .app {
          flex-direction: row;
          gap: 20px;
          padding: calc(20px + env(safe-area-inset-top))
            calc(24px + env(safe-area-inset-right))
            calc(20px + env(safe-area-inset-bottom))
            calc(24px + env(safe-area-inset-left));
        }
        .viz {
          margin-top: 16px;
        }
        .sidebar {
          display: flex;
          flex-direction: column;
          flex: 0 0 auto;
          width: clamp(320px, 30vw, 380px);
          background: rgba(26, 26, 32, 0.5);
          border: 1px solid rgba(160, 160, 160, 0.12);
          border-radius: 18px;
          padding: clamp(18px, 2vw, 26px);
        }
        .sidebarSub {
          flex: 1;
          display: flex;
          align-items: center;
        }
        .sidebarSub .subtitle {
          width: 100%;
        }
        .subSlotMobile,
        .panelSlotMobile {
          display: none;
        }
        .panelSlotStage {
          display: flex;
          justify-content: center;
          padding-top: 16px;
        }
        .settings {
          left: 50%;
          right: auto;
          width: min(430px, calc(100vw - 48px));
          transform: translate(-50%, -50%) scale(0.95);
        }
        .settings--open {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      body.videomode .sidebar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="stage">
        <header class="topic"><h1>Компьютерные сети и интернет</h1></header>
        <div class="viz" id="vizArea">
          <canvas
            id="scene"
            role="img"
            aria-label="Анимация: путь данных от устройства пользователя к веб-серверу и обратно"
          ></canvas>
          <div class="frameWrap" id="frameWrap" hidden>
            <div class="frameGlow frameGlowA" aria-hidden="true"></div>
            <div class="frameGlow frameGlowB" aria-hidden="true"></div>
            <div class="frame" id="frame">
              <div class="frameCanvas" id="frameCanvasSlot"></div>
              <div class="frameSub" id="frameSubtitleSlot"></div>
              <div class="frameCtrl" id="frameControlsSlot"></div>
            </div>
          </div>
        </div>
        <div class="slot panelSlotStage" id="panelSlotStage"></div>
      </div>
      <aside class="sidebar" id="sidebar" aria-label="Пояснение">
        <div class="slot sidebarSub" id="subtitleSlotSidebar"></div>
      </aside>
      <div class="slot subSlotMobile" id="subtitleSlotMobile"></div>
      <div class="slot panelSlotMobile" id="panelSlotMobile"></div>
    </div>
    <div class="subtitle" id="subtitle" aria-live="polite"></div>
    <div class="panel is-playing" id="panel">
      <button class="ctlBtn" id="btnPlay" aria-label="Пауза">
        <svg class="icoPlay" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg class="icoPause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      </button>
      <button
        class="ctlBtn"
        id="btnSettings"
        aria-label="Настройки"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"
          />
        </svg>
      </button>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <section
      class="settings"
      id="settings"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <header class="settingsHead">
        <h2 id="settingsTitle">Настройки</h2>
        <button
          class="ctlBtn small"
          id="btnClose"
          aria-label="Закрыть настройки"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
            />
          </svg>
        </button>
      </header>
      <div class="settingsBody">
        <div class="row">
          <span class="rowLabel">Прогресс</span
          ><span class="stepValue" id="stepIndicator">Шаг 1 / 9</span>
        </div>
        <div class="row">
          <span class="rowLabel">Режим</span>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="AUTO" aria-pressed="true">
              AUTO
            </button>
            <button type="button" data-mode="STEP" aria-pressed="false">
              STEP
            </button>
          </div>
        </div>
        <div class="row">
          <button type="button" class="accentBtn" id="btnNext">
            Следующий шаг ▶
          </button>
        </div>
        <div class="row">
          <span class="rowLabel">Скорость</span>
          <div class="seg" id="speedSeg">
            <button type="button" data-speed="0.5" aria-pressed="false">
              0.5×
            </button>
            <button type="button" data-speed="1" aria-pressed="true">1×</button>
            <button type="button" data-speed="2" aria-pressed="false">
              2×
            </button>
          </div>
        </div>
        <div class="row">
          <span class="rowLabel">Вертикальная рамка</span>
          <button
            type="button"
            class="switch"
            id="btnFrame"
            role="switch"
            aria-checked="false"
            aria-label="Вертикальная рамка"
          >
            <span class="switchTrack"><span class="switchThumb"></span></span>
          </button>
        </div>
        <div class="row">
          <button type="button" class="ghostBtn" id="btnReset">Reset</button>
        </div>
        <div class="keys">
          <h3>Горячие клавиши</h3>
          <div class="keyRow">
            <kbd>Space</kbd><span>скрыть или показать контролы</span>
          </div>
          <div class="keyRow">
            <kbd>→</kbd><span>следующий шаг, только в режиме STEP</span>
          </div>
          <div class="keyRow">
            <kbd>R</kbd><span>сброс воспроизведения</span>
          </div>
          <div class="keyRow">
            <kbd>S</kbd><span>переключить AUTO и STEP</span>
          </div>
          <div class="keyRow"><kbd>V</kbd><span>вертикальная рамка</span></div>
          <div class="keyRow"><kbd>Esc</kbd><span>закрыть настройки</span></div>
        </div>
      </div>
    </section>
    <div class="fatal" id="fatal" hidden></div>
    <script>
      "use strict";
      const COLORS = {
        bg: "#0F0F13",
        panel: "#1A1A20",
        accent: "#2EAC65",
        deep: "#1E7A47",
        text: "#FFFFFF",
        muted: "#A0A0A0",
      };
      const SUBTITLES = [
        {
          step: 1,
          segments: [
            { text: "Ваше устройство подключается к " },
            { text: "домашней сети", emphasis: true },
            { text: " через Wi-Fi роутер." },
          ],
        },
        {
          step: 2,
          segments: [
            { text: "Роутер передаёт запрос " },
            { text: "провайдеру", emphasis: true },
            { text: ", а тот — в глобальную сеть." },
          ],
        },
        {
          step: 3,
          segments: [
            { text: "Браузер спрашивает у " },
            { text: "DNS-сервера", emphasis: true },
            { text: " " },
            { text: "IP-адрес", emphasis: true },
            { text: " сайта example.ru." },
          ],
        },
        {
          step: 4,
          segments: [
            { text: "DNS отвечает: веб-сервер находится по адресу " },
            { text: "203.0.113.10", emphasis: true },
            { text: "." },
          ],
        },
        {
          step: 5,
          segments: [
            { text: "Устройство и сервер устанавливают " },
            { text: "TCP-соединение", emphasis: true },
            { text: ": три проверочных пакета." },
          ],
        },
        {
          step: 6,
          segments: [
            {
              text: "Протокол TLS шифрует канал, превращая HTTP в безопасный ",
            },
            { text: "HTTPS", emphasis: true },
            { text: "." },
          ],
        },
        {
          step: 7,
          segments: [
            { text: "HTTP-запрос летит " },
            { text: "пакетами", emphasis: true },
            { text: " через маршрутизаторы по выбранному маршруту." },
          ],
        },
        {
          step: 8,
          segments: [
            { text: "Сервер обрабатывает запрос и отправляет " },
            { text: "ответ", emphasis: true },
            { text: " обратно устройству." },
          ],
        },
        {
          step: 9,
          segments: [
            { text: "Браузер собирает страницу из полученных данных — " },
            { text: "сайт открыт", emphasis: true },
            { text: "." },
          ],
        },
      ];
      const NODE_META = {
        device: { label: "Ваше устройство", sub: "браузер", icon: "laptop" },
        router: { label: "Роутер", sub: "домашняя сеть", icon: "router" },
        isp: { label: "Провайдер", sub: "оператор связи", icon: "building" },
        dns: { label: "DNS-сервер", sub: "доменные имена", icon: "db" },
        r1: { label: "Маршрутизатор", sub: "выбор маршрута", icon: "swap" },
        r2: { label: "Маршрутизатор", sub: "выбор маршрута", icon: "swap" },
        server: { label: "Веб-сервер", sub: "сайт", icon: "server" },
      };
      const EDGES = [
        ["device", "router"],
        ["router", "isp"],
        ["isp", "dns"],
        ["isp", "r1"],
        ["isp", "r2"],
        ["r1", "r2"],
        ["r1", "server"],
        ["r2", "server"],

        placeNodes();
        renderControls();
        updateSubtitles(0);
        window.setTimeout(() => {
          state.started = true;
        }, 500);
        requestAnimationFrame(loop);
      }
      try {
        init();
      } catch (err) {
        el.fatal.hidden = false;
        el.fatal.textContent =
          "Не удалось запустить визуализацию. Обновите страницу и попробуйте снова.";
        if (window.console && console.error) console.error(err);
      }
    </script>
  </body>
</html>
