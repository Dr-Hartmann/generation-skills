# Keep this key synchronized with the project created in SonarQube.
sonar.projectKey=Dr-Hartmann_generation-skills
sonar.projectName=Generation Skills

# Analyze maintained generator code; generated archive examples are intentionally excluded.
sonar.sources=app-generator
sonar.tests=app-generator/tests
sonar.test.inclusions=app-generator/tests/**/*.py
sonar.exclusions=app-generator/tests/**,**/__pycache__/**,**/*.pyc
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Make the analysis result a CI quality gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
