name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SonarQube Cloud: define SONAR_ORGANIZATION as a repository variable.
      - name: Scan with SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_HOST_URL == '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # SonarQube Server: define SONAR_HOST_URL as a repository variable.
      - name: Scan with SonarQube Server
        if: ${{ env.SONAR_TOKEN != '' && vars.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Explain why scanning was skipped
        if: ${{ env.SONAR_TOKEN == '' || (vars.SONAR_ORGANIZATION == '' && vars.SONAR_HOST_URL == '') }}
        run: |
          echo "::notice::SonarQube scan skipped. Configure the SONAR_TOKEN secret and either SONAR_ORGANIZATION (Cloud) or SONAR_HOST_URL (Server)."
